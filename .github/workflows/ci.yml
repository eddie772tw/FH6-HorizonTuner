name: FH6 HorizonTuner CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  # 任務 1：Ruff 靜態代碼與格式檢查
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format=github ."

    - name: Run Ruff Format Verification
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."

  # 任務 2：後端跨平台測試與覆蓋率驗證
  backend-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Upgrade pip and install core requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx pytest-asyncio

    - name: Execute backend automated tests with coverage
      run: |
        python -m pytest tests/ --cov=backend --cov-fail-under=80 -v

  # 任務 3：前端單元測試與生產建置驗證
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        npm --prefix frontend ci

    - name: Execute Frontend Tests (Vitest & Coverage)
      run: |
        npm --prefix frontend run test:cov

    - name: Run Frontend Production Build (Tsc + Vite)
      run: |
        npm --prefix frontend run build
