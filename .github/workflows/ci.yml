name: FH6 HorizonTuner CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

env:
  # Keep the interpreter selected by setup-uv aligned with its managed-Python cache.
  UV_PYTHON_PREFERENCE: only-managed
  TAURI_RUST_CACHE_STATUS: miss

jobs:
  # ============================================================================
  # 階段 1：同步進行前後端 Lint、靜態檢查與 Build 測試 (Gatekeeping Stage)
  # 允許 fail-fast：若語法檢查或編譯失敗即立刻終止，節省 CI 資源。
  # ============================================================================

  backend-static-check:
    name: Backend Lint & Static Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install Ruff through uv
      run: uv pip install ruff

    - name: Run Ruff Check
      id: ruff_check
      run: uv run --no-project --active ruff check .

    - name: Run Ruff Format Verification
      id: ruff_format
      run: uv run --no-project --active ruff format --check .

    - name: Generate Backend Static Check Summary
      if: always()
      shell: bash
      run: |
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        ## 🐍 Backend Static Code Analysis Summary

        | Check Type | Status | Result |
        | :--- | :---: | :--- |
        | **Ruff Linter** | ${{ steps.ruff_check.outcome }} | `ruff check .` |
        | **Ruff Formatter** | ${{ steps.ruff_format.outcome }} | `ruff format --check .` |

        > Run `uv run --no-project --python .venv\\Scripts\\python.exe ruff check .` and `uv run --no-project --python .venv\\Scripts\\python.exe ruff format .` locally to verify Python code prior to pushing.
        EOF

  frontend-build-test:
    name: Frontend Build Test & Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install Frontend Dependencies
      run: pnpm --prefix frontend install --frozen-lockfile

    - name: Run Frontend Build Verification (Build Test)
      run: pnpm --prefix frontend run build

    - name: Publish verified frontend distribution
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist
        if-no-files-found: error
        retention-days: 1

    - name: Check Frontend Security Audit
      shell: bash
      run: |
        cd frontend
        if ! pnpm audit; then
          echo "::warning::pnpm audit found vulnerabilities in frontend dependencies!"
        fi

    - name: Generate Frontend Build Test Summary
      if: always()
      shell: bash
      run: |
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        ## ⚡ Frontend Build Verification & Security Audit Summary

        | Task | Status | Details |
        | :--- | :---: | :--- |
        | **TypeScript Compilation (`tsc`)** | ✅ | Type checking passed with 0 errors |
        | **Vite Production Bundle** | ✅ | Production bundle built cleanly into `dist/` |
        | **Pnpm Dependency Audit** | 🔍 | Audited dependencies in `frontend/package.json` |

        > 🚀 Run `pnpm --prefix frontend run build` locally to verify production build capability.
        EOF

  # ============================================================================
  # 階段 2：前後端單元測試 (Unit Testing Stage)
  # 僅在階段 1 (Lint、靜態檢查與 Build Test) 全數通過後才平行啟動。
  # ============================================================================

  backend-unit-test:
    name: Backend Pytest Unit Tests
    needs: [backend-static-check, frontend-build-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv and managed Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install dependencies
      run: uv pip install --requirement requirements.txt

    - name: Execute Pytest Test Suite
      # The Windows-only portable process contract runs in build-portable-sidecar
      # before any executable compilation, so do not run it twice here.
      run: uv run --no-project --active python -m pytest tests/ -v --ignore=tests/test_sidecar_process_contract.py --ignore=tests/test_portable_host_diagnostics.py

    - name: Generate Backend Pytest Summary
      if: always()
      shell: bash
      run: |
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ## 🧪 Backend Pytest Unit Tests Summary

        - **Target OS**: \`${{ matrix.os }}\`
        - **Python Version**: \`${{ matrix.python-version }}\`
        - **Test Framework**: Pytest

        | Suite | Status | Execution Details |
        | :--- | :---: | :--- |
        | **Backend Core Suite** | ✅ | All telemetry, listener, drag recorder & API tests passed |

        > Run \`uv run --no-project --python .venv\\Scripts\\python.exe python -m pytest tests/\` locally to execute backend test suite.
        EOF

  frontend-unit-test:
    name: Frontend Vitest Unit Tests
    needs: [backend-static-check, frontend-build-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ["22"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install Frontend Dependencies
      run: pnpm --prefix frontend install --frozen-lockfile

    - name: Run Frontend Vitest Unit Tests
      run: pnpm --prefix frontend run test

    - name: Generate Frontend Vitest Summary
      if: always()
      shell: bash
      run: |
        cat << EOF >> $GITHUB_STEP_SUMMARY
        ## 🧪 Frontend Vitest Unit Tests Summary

        - **Target OS**: \`${{ matrix.os }}\`
        - **Node.js Version**: \`${{ matrix.node-version }}\`
        - **Package Manager**: pnpm (v9)
        - **Test Runner**: Vitest

        | Suite | Status | Execution Details |
        | :--- | :---: | :--- |
        | **Physics & Math Suite** | ✅ | \`tuningMath.test.ts\` passed |
        | **Diagnosis Suite** | ✅ | \`tuningDiagnosis.test.ts\` passed |
        | **HUD Telemetry Cards Suite** | ✅ | \`telemetryCards.test.ts\` passed |

        > 🛠 Run \`pnpm --prefix frontend run test\` locally to execute Vitest unit tests.
        EOF

  # ============================================================================
  # 階段 3：可執行檔發行與周邊組態互動斷言測試 (Executable Integration Stage)
  # 僅在前後端單元測試全數通過後，於 Windows 環境編譯並驗證 Sidecar / Executable。
  # ============================================================================

  build-portable-sidecar:
    name: Verify & Build Portable Sidecar
    needs: [backend-static-check]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install backend test dependencies
      run: uv pip install --requirement requirements.txt

    - name: Verify modular WinRT media import
      run: >
        uv run --no-project --active python -c
        "import winrt.windows.media.control as wmc; print(wmc.GlobalSystemMediaTransportControlsSessionManager)"

    - name: Verify source sidecar lifecycle contract
      run: uv run --no-project --active python -m pytest tests/test_sidecar_process_contract.py -v

    - name: Install PyInstaller through uv
      run: uv pip install "pyinstaller>=6.10,<7.0"

    - name: Build Python sidecar executable
      run: >
        python scripts/release_metrics.py
        --label "PyInstaller sidecar"
        --artifact dist/server-sidecar-x86_64-pc-windows-msvc.exe
        --metrics-file metrics/sidecar-build.json
        -- uv run --no-project --active python -m PyInstaller server-sidecar.spec --clean

    - name: Publish sidecar build metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-metrics-sidecar-${{ github.sha }}
        path: metrics/sidecar-build.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Publish sidecar executable
      uses: actions/upload-artifact@v4
      with:
        name: portable-sidecar-${{ github.sha }}
        path: dist/server-sidecar-x86_64-pc-windows-msvc.exe
        if-no-files-found: error
        retention-days: 1

  ci-performance-dashboard:
    name: CI Performance Dashboard
    needs: [backend-static-check, frontend-build-test, backend-unit-test, frontend-unit-test, build-portable-sidecar, verify-executable-bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download release build metrics
      uses: actions/download-artifact@v4
      with:
        pattern: ci-metrics-*
        path: metrics
        merge-multiple: true

    - name: Build performance dashboard
      run: python scripts/ci_performance_dashboard.py --metrics-dir metrics --output metrics/dashboard.json

    - name: Publish performance dashboard data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-performance-dashboard-${{ github.sha }}
        path: metrics/dashboard.json
        if-no-files-found: ignore
        retention-days: 14

  verify-executable-bundle:
    name: Build & Verify Executable Bundle
    needs: [backend-unit-test, frontend-unit-test, build-portable-sidecar]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore Tauri Rust build cache
      id: tauri-rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./frontend/src-tauri -> target"
        # Share the Windows release cache with diagnostics while retaining the
        # action's Cargo.lock/rustc environment hash for correctness.
        shared-key: "tauri-windows-release"
        add-job-id-key: false
        cache-workspace-crates: true

    - name: Record Tauri Rust cache state
      shell: bash
      run: |
        cache_state="${{ steps.tauri-rust-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
        echo "TAURI_RUST_CACHE_STATUS=$cache_state" >> "$GITHUB_ENV"
        echo "Tauri Rust cache: **$cache_state**" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install Python & Frontend Dependencies
      run: |
        uv pip install --requirement requirements.txt
        pnpm --prefix frontend install --frozen-lockfile

    - name: Download verified sidecar executable
      uses: actions/download-artifact@v4
      with:
        name: portable-sidecar-${{ github.sha }}
        path: dist

    - name: Download verified frontend distribution
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist

    - name: Stage Embedded Sidecar
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force frontend/src-tauri/bin | Out-Null
        Copy-Item dist/server-sidecar-x86_64-pc-windows-msvc.exe `
          frontend/src-tauri/bin/server-sidecar-x86_64-pc-windows-msvc.exe -Force

    - name: Build Portable Tauri Executable
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
      run: >
        python scripts/release_metrics.py
        --label "Tauri portable executable"
        --artifact frontend/src-tauri/target/release/FH6-HorizonTuner.exe
        --metrics-file metrics/tauri-build.json
        --cache-status ${{ env.TAURI_RUST_CACHE_STATUS }}
        -- pnpm.cmd --prefix frontend run tauri build --no-bundle --config src-tauri/tauri.ci.conf.json

    - name: Publish Tauri build metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-metrics-tauri-${{ github.sha }}
        path: metrics/tauri-build.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Verify Executable Metadata and Existence
      run: uv run --no-project --active python -m pytest tests/test_executable_bundle.py -v

    - name: Generate Executable Bundle Verification Summary
      if: always()
      shell: bash
      run: |
        cat << 'EOF' >> $GITHUB_STEP_SUMMARY
        ## 📦 Executable Bundle & Sidecar Verification Summary

        | Check Type | Status | Result |
        | :--- | :---: | :--- |
        | **Sidecar Executable Build** | ✅ | `server-sidecar-x86_64-pc-windows-msvc.exe` compiled cleanly |
        | **PE Version Metadata** | ✅ | `CompanyName=eddie772tw` & `FileVersion=11.4.5.14` verified |
        | **Diagnostics** | ℹ️ | Flaky headless host diagnostics moved to non-blocking workflow |

        > 🚀 Executable bundle verification passed on Windows runner.
        EOF
