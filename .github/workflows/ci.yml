name: FH6 HorizonTuner CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # 階段 1：同步進行前後端 Lint、靜態檢查與 Build 測試 (Gatekeeping Stage)
  # 允許 fail-fast：若語法檢查或編譯失敗即立刻終止，節省 CI 資源。
  # ============================================================================

  backend-static-check:
    name: Backend Lint & Static Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff Check
      run: ruff check .

    - name: Run Ruff Format Verification
      run: ruff format --check .

  frontend-build-test:
    name: Frontend Build Test & Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Install Frontend Dependencies
      run: pnpm --prefix frontend install

    - name: Run Frontend Build Verification (Build Test)
      run: pnpm --prefix frontend run build

    - name: Check Frontend Security Audit
      shell: bash
      run: |
        cd frontend
        if ! pnpm audit; then
          echo "::warning::pnpm audit found vulnerabilities in frontend dependencies!"
        fi

  # ============================================================================
  # 階段 2：前後端單元測試 (Unit Testing Stage)
  # 僅在階段 1 (Lint、靜態檢查與 Build Test) 全數通過後才平行啟動。
  # ============================================================================

  backend-unit-test:
    name: Backend Pytest Unit Tests
    needs: [backend-static-check, frontend-build-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest python-multipart

    - name: Execute Pytest Test Suite
      run: python -m pytest -v

  frontend-unit-test:
    name: Frontend Vitest Unit Tests
    needs: [backend-static-check, frontend-build-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: ["20"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Install Frontend Dependencies
      run: pnpm --prefix frontend install

    - name: Run Frontend Vitest Unit Tests
      run: pnpm --prefix frontend run test
