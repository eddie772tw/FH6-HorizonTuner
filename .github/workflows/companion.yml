name: Android Companion CI

on:
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: read

jobs:
  companion:
    name: Android Companion tests, lint, and assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run protocol tests, Android lint, and debug assemble
        run: bash ./gradlew --no-daemon --stacktrace :protocol-core:test :app:lintDebug :app:assembleDebug
