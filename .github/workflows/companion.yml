name: Android Companion CI

on:
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: read

jobs:
  companion:
    name: Android Companion tests, lint, and assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run protocol, theme and app tests, Android lint, and debug assemble
        run: bash ./gradlew --no-daemon --stacktrace :protocol-core:test :theme:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Measure stacked native-font APK increment against actual parent
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feature/issue-485-typography-fidelity'
        env:
          FONT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$FONT_BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/companion-font-baseline" "$FONT_BASE_SHA"
          (cd "$RUNNER_TEMP/companion-font-baseline/companion" && bash ./gradlew --no-daemon :app:assembleDebug)
          mkdir -p build/verification
          cp "$RUNNER_TEMP/companion-font-baseline/companion/app/build/outputs/apk/debug/app-debug.apk" build/verification/baseline-debug.apk
          printf '%s\n' "$FONT_BASE_SHA" > build/verification/font-baseline-sha.txt

      - name: Verify APK gate rejects a missing-font fixture
        run: |
          mkdir -p build/verification
          bash scripts/TestFontApkGate.sh app/build/outputs/apk/debug/app-debug.apk | tee build/verification/font-negative-control.txt

      - name: Verify unmodified fonts and accessible notice assets in APK
        run: |
          mkdir -p build/verification
          if test -f build/verification/baseline-debug.apk; then
            java scripts/VerifyFontApk.java app/build/outputs/apk/debug/app-debug.apk build/verification/baseline-debug.apk | tee build/verification/font-apk.txt
          else
            java scripts/VerifyFontApk.java app/build/outputs/apk/debug/app-debug.apk | tee build/verification/font-apk.txt
          fi

      - name: Record Android verification evidence
        env:
          COMPANION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/verification
          printf '%s\n' "$COMPANION_HEAD_SHA" > build/verification/head-sha.txt
          git rev-parse HEAD > build/verification/checkout-sha.txt
          git rev-parse 'HEAD^{tree}' > build/verification/checkout-tree.txt
          git ls-files -z '*.kt' '*.kts' 'gradle/wrapper/gradle-wrapper.properties' 'scripts/*.java' 'scripts/*.sh' 'theme/src/main/res/font/*' 'theme/src/main/assets/font_notices/*' '../.github/workflows/companion.yml' | xargs -0 sha256sum > build/verification/source-sha256.txt
          java -version 2> build/verification/java-version.txt
          for report_dir in protocol-core/build/test-results/test theme/build/test-results/testDebugUnitTest app/build/test-results/testDebugUnitTest; do
            test -n "$(find "$report_dir" -maxdepth 1 -name 'TEST-*.xml' -print -quit)"
            for report in "$report_dir"/TEST-*.xml; do
              sed -n '1,2p' "$report"
            done
          done
          test -s app/build/reports/lint-results-debug.xml
          test -s app/build/outputs/apk/debug/app-debug.apk
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk) | tee build/verification/APK-SHA256.txt
          cat build/verification/head-sha.txt build/verification/checkout-sha.txt build/verification/source-sha256.txt build/verification/java-version.txt

      - name: Upload Android test, lint, and APK evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: companion-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            companion/protocol-core/build/test-results/test/TEST-*.xml
            companion/theme/build/test-results/testDebugUnitTest/TEST-*.xml
            companion/app/build/test-results/testDebugUnitTest/TEST-*.xml
            companion/app/build/reports/lint-results-debug.*
            companion/app/build/outputs/apk/debug/app-debug.apk
            companion/build/verification/*.txt
            companion/build/verification/baseline-debug.apk
          if-no-files-found: error
          retention-days: 14
