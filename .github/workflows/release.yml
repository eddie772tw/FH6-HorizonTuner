name: Release & OTA Packaging

on:
  release:
    types: [ published ]  # 唯一發布途徑：在 GitHub 網頁手動發布 Release 時自動觸發
  workflow_dispatch:     # 支援手動觸發測試與補發
    inputs:
      tag_name:
        description: 'Target Release Tag name (e.g. v1.5.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  UV_PYTHON_PREFERENCE: only-managed
  TAG: ""

jobs:
  build-and-publish-release:
    name: Build, Sign & Attach Release Assets
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - name: Determine Release Tag
      id: release_meta
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ github.event.inputs.tag_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$EVENT_NAME" = "release" ]; then
          TAG="$EVENT_TAG"
        else
          TAG="${INPUT_TAG:-$REF_NAME}"
        fi
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_OUTPUT"
        echo "Tag identified for release: **$TAG**" >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Restore Tauri Rust build cache
      id: tauri-rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./frontend/src-tauri -> target"
        shared-key: "tauri-windows-release"
        add-job-id-key: false
        cache-workspace-crates: true

    - name: Install Dependencies
      run: |
        uv pip install --requirement requirements.txt
        uv pip install "pyinstaller>=6.10,<7.0"
        pnpm --prefix frontend install --frozen-lockfile

    - name: Run Backend Unit Tests (Pre-Release Gate)
      run: uv run --no-project --active python -m pytest tests/ -v -m "not host_diagnostics and not executable_bundle"

    - name: Run Frontend Unit Tests (Pre-Release Gate)
      run: pnpm --prefix frontend run test

    - name: Build Frontend Production Bundle
      env:
        VITE_GIT_COMMIT: ${{ env.TAG }}
        VITE_GIT_BRANCH: "main"
      run: pnpm --prefix frontend run build

    - name: Build Python Backend Sidecar Executable
      run: >
        uv run --no-project --active python -m PyInstaller server-sidecar.spec --clean

    - name: Stage Embedded Sidecar for Tauri Host
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force frontend/src-tauri/bin | Out-Null
        Copy-Item dist/server-sidecar-x86_64-pc-windows-msvc.exe `
          frontend/src-tauri/bin/server-sidecar-x86_64-pc-windows-msvc.exe -Force

    - name: Validate Tauri updater signing credentials
      shell: pwsh
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
          throw 'TAURI_SIGNING_PRIVATE_KEY is empty or unavailable.'
        }
        if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
          throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty or unavailable.'
        }

        $payloadPath = Join-Path $env:RUNNER_TEMP 'fh6-tauri-signing-preflight.bin'
        $signaturePath = "$payloadPath.sig"
        [IO.File]::WriteAllBytes(
          $payloadPath,
          [Text.Encoding]::ASCII.GetBytes('FH6-HorizonTuner Tauri signing preflight')
        )

        pnpm.cmd --prefix frontend exec tauri signer sign $payloadPath | Out-Null
        if ($LASTEXITCODE -ne 0) {
          throw 'Tauri updater signing preflight failed. Verify the complete minisign private key and its password in GitHub Secrets.'
        }
        if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
          throw "Tauri updater signing preflight did not create $signaturePath."
        }

        Remove-Item -LiteralPath $payloadPath, $signaturePath -Force -ErrorAction SilentlyContinue

    - name: Build and Sign Tauri Release Executable
      env:
        VITE_GIT_COMMIT: ${{ env.TAG }}
        VITE_GIT_BRANCH: "main"
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
      run: |
        pnpm.cmd --prefix frontend run tauri build --config src-tauri/tauri.ci.conf.json

    - name: Locate signed Tauri updater artifacts
      id: updater_artifacts
      shell: pwsh
      run: |
        $bundleRoot = Join-Path $PWD 'frontend/src-tauri/target/release/bundle/nsis'
        $bundles = @(Get-ChildItem -LiteralPath $bundleRoot -Filter '*-setup.exe' -File)
        if ($bundles.Count -ne 1) {
          throw "Expected exactly one Tauri updater bundle in $bundleRoot, found $($bundles.Count)."
        }
        $bundle = $bundles[0]
        $signature = Get-Item -LiteralPath ($bundle.FullName + '.sig') -ErrorAction Stop
        $config = Get-Content -Raw 'frontend/src-tauri/tauri.conf.json' | ConvertFrom-Json
        if ([string]::IsNullOrWhiteSpace($config.version)) {
          throw 'Tauri runtime version is missing from tauri.conf.json.'
        }
        "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
        "signature=$($signature.FullName)" >> $env:GITHUB_OUTPUT
        "version=$($config.version)" >> $env:GITHUB_OUTPUT
        "Resolved updater bundle: $($bundle.Name)" >> $env:GITHUB_STEP_SUMMARY
        "Runtime version: $($config.version)" >> $env:GITHUB_STEP_SUMMARY

    - name: Prepare Release Package & Generate latest.json Manifest
      shell: pwsh
      run: |
        uv run --no-project --active python scripts/prepare_release_assets.py `
          --exe frontend/src-tauri/target/release/FH6-HorizonTuner.exe `
          --updater-bundle "${{ steps.updater_artifacts.outputs.bundle }}" `
          --updater-signature "${{ steps.updater_artifacts.outputs.signature }}" `
          --output-dir dist/release `
          --tag "${{ env.TAG }}" `
          --version "${{ steps.updater_artifacts.outputs.version }}" `
          --repo "${{ github.repository }}"

    - name: Upload and Attach Assets to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        fail_on_unmatched_files: true
        files: |
          dist/release/FH6-HorizonTuner.exe
          dist/release/*-setup.exe
          dist/release/*-setup.exe.sig
          dist/release/latest.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
