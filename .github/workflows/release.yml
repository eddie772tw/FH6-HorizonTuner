name: Release & OTA Packaging

on:
  release:
    types: [ published ]  # 唯一發布途徑：在 GitHub 網頁手動發布 Release 時自動觸發
  workflow_dispatch:     # 支援手動觸發測試與補發
    inputs:
      tag_name:
        description: 'Target Release Tag name (e.g. v1.5.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  UV_PYTHON_PREFERENCE: only-managed
  TAG: ""

jobs:
  build-and-publish-release:
    name: Build, Sign & Attach Release Assets
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - name: Determine Release Tag
      id: release_meta
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ github.event.inputs.tag_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$EVENT_NAME" = "release" ]; then
          TAG="$EVENT_TAG"
        else
          TAG="${INPUT_TAG:-$REF_NAME}"
        fi
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=$TAG" >> "$GITHUB_OUTPUT"
        echo "Tag identified for release: **$TAG**" >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Restore Tauri Rust build cache
      id: tauri-rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./frontend/src-tauri -> target"
        shared-key: "tauri-windows-release"
        add-job-id-key: false
        cache-workspace-crates: true

    - name: Install Dependencies
      run: |
        uv pip install --requirement requirements.txt
        uv pip install "pyinstaller>=6.10,<7.0"
        pnpm --prefix frontend install --frozen-lockfile

    - name: Run Rust Format Verification (Pre-Release Gate)
      run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml -- --check

    - name: Run Backend Unit Tests (Pre-Release Gate)
      run: uv run --no-project --active python -m pytest tests/ -v -m "not host_diagnostics and not executable_bundle"

    - name: Run Frontend Unit Tests (Pre-Release Gate)
      run: pnpm --prefix frontend run test

    - name: Build Frontend Production Bundle
      env:
        VITE_GIT_COMMIT: ${{ env.TAG }}
        VITE_GIT_BRANCH: "main"
      run: pnpm --prefix frontend run build

    - name: Build Python Backend Sidecar Executable
      shell: pwsh
      env:
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:DISCORD_APPLICATION_ID)) {
          throw 'DISCORD_APPLICATION_ID is empty or unavailable.'
        }
        if ($env:DISCORD_APPLICATION_ID -notmatch '^[0-9]{17,20}$') {
          throw 'DISCORD_APPLICATION_ID must be a 17-20 digit Discord Application ID.'
        }

        $generatedPath = Join-Path $PWD 'backend/discord_application_id.json'
        try {
          @{ discord_application_id = $env:DISCORD_APPLICATION_ID } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath $generatedPath -Encoding UTF8
          uv run --no-project --active python -m PyInstaller server-sidecar.spec --clean
        }
        finally {
          Remove-Item -LiteralPath $generatedPath -Force -ErrorAction SilentlyContinue
        }

    - name: Stage Embedded Sidecar for Tauri Host
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force frontend/src-tauri/bin | Out-Null
        Copy-Item dist/server-sidecar-x86_64-pc-windows-msvc.exe `
          frontend/src-tauri/bin/server-sidecar-x86_64-pc-windows-msvc.exe -Force

    - name: Validate Tauri updater signing credentials
      shell: pwsh
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
          throw 'TAURI_SIGNING_PRIVATE_KEY is empty or unavailable.'
        }
        if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
          throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty or unavailable.'
        }

        $payloadPath = Join-Path $env:RUNNER_TEMP 'fh6-tauri-signing-preflight.bin'
        $signaturePath = "$payloadPath.sig"
        [IO.File]::WriteAllBytes(
          $payloadPath,
          [Text.Encoding]::ASCII.GetBytes('FH6-HorizonTuner Tauri signing preflight')
        )

        pnpm.cmd --prefix frontend exec tauri signer sign $payloadPath | Out-Null
        if ($LASTEXITCODE -ne 0) {
          throw 'Tauri updater signing preflight failed. Verify the complete minisign private key and its password in GitHub Secrets.'
        }
        if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
          throw "Tauri updater signing preflight did not create $signaturePath."
        }

        uv run --no-project --active python scripts/validate_tauri_updater_keypair.py `
          --config frontend/src-tauri/tauri.conf.json `
          --signature $signaturePath

        Remove-Item -LiteralPath $payloadPath, $signaturePath -Force -ErrorAction SilentlyContinue

    - name: Build and Sign Tauri Release Executable
      env:
        VITE_GIT_COMMIT: ${{ env.TAG }}
        VITE_GIT_BRANCH: "main"
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
      run: |
        pnpm.cmd --prefix frontend run tauri build --config src-tauri/tauri.ci.conf.json
        Copy-Item frontend/src-tauri/target/release/FH6-HorizonTuner.exe dist/FH6-HorizonTuner.exe -Force
        $bundleRoot = Join-Path $PWD 'frontend/src-tauri/target/release/bundle/nsis'
        $fullBundle = Get-ChildItem -LiteralPath $bundleRoot -File | Where-Object { $_.Name -match '^FH6-HorizonTuner_\d.*-setup\.exe$' }
        if ($fullBundle.Count -ne 1) {
          throw "Expected exactly one Full Tauri updater bundle, found $($fullBundle.Count)."
        }
        $fullUpdaterDir = Join-Path $PWD 'dist/updater/full'
        New-Item -ItemType Directory -Force $fullUpdaterDir | Out-Null
        Copy-Item $fullBundle.FullName $fullUpdaterDir -Force
        Copy-Item "$($fullBundle.FullName).sig" $fullUpdaterDir -Force

        pnpm.cmd --prefix frontend run tauri build --config src-tauri/tauri.lite.conf.json
        Copy-Item frontend/src-tauri/target/release/FH6-HorizonTuner.exe dist/FH6-HorizonTuner_lite.exe -Force

        $liteBundle = Get-ChildItem -LiteralPath $bundleRoot -File | Where-Object { $_.Name -match '^FH6-HorizonTuner_lite_\d.*-setup\.exe$' }
        if ($liteBundle.Count -ne 1) {
          throw "Expected exactly one Lite Tauri updater bundle, found $($liteBundle.Count)."
        }
        $liteUpdaterDir = Join-Path $PWD 'dist/updater/lite'
        New-Item -ItemType Directory -Force $liteUpdaterDir | Out-Null
        Copy-Item $liteBundle.FullName $liteUpdaterDir -Force
        Copy-Item "$($liteBundle.FullName).sig" $liteUpdaterDir -Force

    - name: Verify Full and Lite Portable Executables
      shell: pwsh
      run: |
        $full = 'dist/FH6-HorizonTuner.exe'
        $lite = 'dist/FH6-HorizonTuner_lite.exe'
        foreach ($path in @($full, $lite)) {
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Expected portable executable was not produced: $path"
          }
        }

    - name: Locate signed Full and Lite Tauri updater artifacts
      id: updater_artifacts
      shell: pwsh
      run: |
        $bundle = @(Get-ChildItem -LiteralPath 'dist/updater/full' -Filter '*-setup.exe' -File)
        $liteBundle = @(Get-ChildItem -LiteralPath 'dist/updater/lite' -Filter '*-setup.exe' -File)
        if ($bundle.Count -ne 1 -or $liteBundle.Count -ne 1) {
          throw "Expected one staged Full and Lite updater bundle; found Full=$($bundle.Count), Lite=$($liteBundle.Count)."
        }
        $bundle = $bundle[0]
        $liteBundle = $liteBundle[0]
        $signature = Get-Item -LiteralPath ($bundle.FullName + '.sig') -ErrorAction Stop
        $liteSignature = Get-Item -LiteralPath ($liteBundle.FullName + '.sig') -ErrorAction Stop
        $config = Get-Content -Raw 'frontend/src-tauri/tauri.conf.json' | ConvertFrom-Json
        if ([string]::IsNullOrWhiteSpace($config.version)) {
          throw 'Tauri runtime version is missing from tauri.conf.json.'
        }
        "bundle=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
        "signature=$($signature.FullName)" >> $env:GITHUB_OUTPUT
        "lite_bundle=$($liteBundle.FullName)" >> $env:GITHUB_OUTPUT
        "lite_signature=$($liteSignature.FullName)" >> $env:GITHUB_OUTPUT
        "version=$($config.version)" >> $env:GITHUB_OUTPUT
        "Resolved Full updater bundle: $($bundle.Name)" >> $env:GITHUB_STEP_SUMMARY
        "Resolved Lite updater bundle: $($liteBundle.Name)" >> $env:GITHUB_STEP_SUMMARY
        "Runtime version: $($config.version)" >> $env:GITHUB_STEP_SUMMARY

    - name: Prepare Release Package & Generate latest.json Manifest
      shell: pwsh
      run: |
        uv run --no-project --active python scripts/prepare_release_assets.py `
          --exe dist/FH6-HorizonTuner.exe `
          --lite-exe dist/FH6-HorizonTuner_lite.exe `
          --updater-bundle "${{ steps.updater_artifacts.outputs.bundle }}" `
          --updater-signature "${{ steps.updater_artifacts.outputs.signature }}" `
          --lite-updater-bundle "${{ steps.updater_artifacts.outputs.lite_bundle }}" `
          --lite-updater-signature "${{ steps.updater_artifacts.outputs.lite_signature }}" `
          --output-dir dist/release `
          --tag "${{ env.TAG }}" `
          --version "${{ steps.updater_artifacts.outputs.version }}" `
          --repo "${{ github.repository }}"

    - name: Upload and Attach Assets to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG }}
        fail_on_unmatched_files: true
        files: |
          dist/release/FH6-HorizonTuner-Full-Installer.exe
          dist/release/FH6-HorizonTuner-Full-Portable.exe
          dist/release/FH6-HorizonTuner-Lite-Installer.exe
          dist/release/FH6-HorizonTuner-Lite-Portable.exe
          dist/release/FH6-HorizonTuner-Full-Lite-Portable.zip
          dist/release/FH6-HorizonTuner-Full-Installer.exe.sig
          dist/release/FH6-HorizonTuner-Lite-Installer.exe.sig
          dist/release/latest.json
          dist/release/latest-lite.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
