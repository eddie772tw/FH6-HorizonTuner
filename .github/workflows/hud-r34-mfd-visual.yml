name: HUD R34 MFD Visual Review
on:
  pull_request:
    branches: [main]
    paths:
      - 'hud_overlay/r34_mfd/**'
      - 'docs/assets/r34-mfd/**'
      - 'docs/hud/r34-mfd.md'
      - 'hud_overlay/shared/**'
      - 'frontend/src/features/overlay_control/**'
      - 'lang/**'
      - 'backend-rust/src/config.rs'
      - 'backend-rust/resources/defaults.json'
      - 'backend-rust/tests/config_contract.rs'
      - '.github/workflows/hud-r34-mfd-visual.yml'
permissions:
  contents: read
jobs:
  render-fixtures:
    name: R34 MFD sandboxed Chrome fixture render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install existing frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile
      - name: Install isolated visual-test tooling
        run: npm install --prefix "$RUNNER_TEMP/hud-browser" --ignore-scripts --no-save --package-lock=false playwright@1.63.0
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - name: Install CJK fonts for localized settings review
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK TC'
          fc-match 'Noto Sans CJK JP'
      - name: Render actual R34 HUD states
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-r34-mfd-preview" node hud_overlay/r34_mfd/tests/visual/render.mjs
      - name: Verify real Launcher and Coordinator
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-r34-mfd-preview" node hud_overlay/r34_mfd/tests/visual/launcher.mjs
      - name: Verify real GUI controls and persistence
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-r34-mfd-preview" node frontend/src/features/overlay_control/r34_mfd/tests/browser/verify.cjs
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hud-r34-mfd-visual-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hud-r34-mfd-preview
          if-no-files-found: error
          retention-days: 14
