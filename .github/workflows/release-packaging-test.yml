name: Release Packaging Test

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-packaging-test.yml"
      - "frontend/src-tauri/tauri.conf.json"
      - "frontend/src-tauri/tauri.lite.conf.json"
      - "scripts/prepare_release_assets.py"
      - "tests/test_release_workflow_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-validate:
    name: Package test assets without publishing a Release
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Set up uv and managed Python 3.13
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          activate-environment: true
          no-project: true
          cache-python: true
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install test dependencies
        run: uv pip install --requirement requirements.txt

      - name: Run release contract tests
        run: uv run --no-project --active python -m pytest tests/test_release_workflow_contract.py -q

      - name: Verify Tauri signer with ephemeral key
        shell: pwsh
        run: |
          $signerRoot = Join-Path $env:RUNNER_TEMP 'fh6-tauri-signer-fixture'
          New-Item -ItemType Directory -Force $signerRoot | Out-Null

          $keyPath = Join-Path $signerRoot 'ci-test.key'
          $payloadPath = Join-Path $signerRoot 'payload.bin'
          $signaturePath = "$payloadPath.sig"
          $password = 'fh6-ci-signer-password'
          [IO.File]::WriteAllBytes(
            $payloadPath,
            [Text.Encoding]::ASCII.GetBytes('FH6-HorizonTuner Tauri signer contract test')
          )

          pnpm.cmd --prefix frontend exec tauri signer generate --ci -p $password -w $keyPath | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $keyPath -PathType Leaf)) {
            throw 'Tauri signer could not generate the ephemeral test key.'
          }

          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -LiteralPath $keyPath -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $password
          pnpm.cmd --prefix frontend exec tauri signer sign $payloadPath | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Tauri signer could not parse and use the generated private key.'
          }
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Tauri signer did not create $signaturePath."
          }

          Remove-Item -LiteralPath $keyPath, $payloadPath, $signaturePath -Force -ErrorAction SilentlyContinue

      - name: Create synthetic Tauri release inputs
        id: fixtures
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'fh6-release-packaging-fixtures'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'fh6-release-packaging-output'
          New-Item -ItemType Directory -Force $fixtureRoot, $outputRoot | Out-Null

          $exePath = Join-Path $fixtureRoot 'FH6-HorizonTuner.exe'
          [IO.File]::WriteAllBytes($exePath, [Text.Encoding]::ASCII.GetBytes('TEST_PORTABLE_EXE'))

          $liteExePath = Join-Path $fixtureRoot 'FH6-HorizonTuner_lite.exe'
          [IO.File]::WriteAllBytes($liteExePath, [Text.Encoding]::ASCII.GetBytes('TEST_LITE_PORTABLE_EXE'))

          $bundlePath = Join-Path $fixtureRoot 'FH6-HorizonTuner_11.45.15_x64-setup.exe'
          [IO.File]::WriteAllBytes($bundlePath, [Text.Encoding]::ASCII.GetBytes('TEST_NSIS_INSTALLER'))

          $signaturePath = $bundlePath + '.sig'
          Set-Content -LiteralPath $signaturePath -Value 'TEST_ED25519_SIGNATURE' -NoNewline -Encoding utf8

          $liteBundlePath = Join-Path $fixtureRoot 'FH6-HorizonTuner_lite_11.45.15_x64-setup.exe'
          [IO.File]::WriteAllBytes($liteBundlePath, [Text.Encoding]::ASCII.GetBytes('TEST_LITE_NSIS_INSTALLER'))
          $liteSignaturePath = $liteBundlePath + '.sig'
          Set-Content -LiteralPath $liteSignaturePath -Value 'TEST_LITE_ED25519_SIGNATURE' -NoNewline -Encoding utf8

          "exe=$exePath" >> $env:GITHUB_OUTPUT
          "lite_exe=$liteExePath" >> $env:GITHUB_OUTPUT
          "bundle=$bundlePath" >> $env:GITHUB_OUTPUT
          "signature=$signaturePath" >> $env:GITHUB_OUTPUT
          "lite_bundle=$liteBundlePath" >> $env:GITHUB_OUTPUT
          "lite_signature=$liteSignaturePath" >> $env:GITHUB_OUTPUT
          "output=$outputRoot" >> $env:GITHUB_OUTPUT

      - name: Run release asset preparation locally
        shell: pwsh
        env:
          EXE_PATH: ${{ steps.fixtures.outputs.exe }}
          LITE_EXE_PATH: ${{ steps.fixtures.outputs.lite_exe }}
          BUNDLE_PATH: ${{ steps.fixtures.outputs.bundle }}
          SIGNATURE_PATH: ${{ steps.fixtures.outputs.signature }}
          LITE_BUNDLE_PATH: ${{ steps.fixtures.outputs.lite_bundle }}
          LITE_SIGNATURE_PATH: ${{ steps.fixtures.outputs.lite_signature }}
          OUTPUT_DIR: ${{ steps.fixtures.outputs.output }}
        run: |
          uv run --no-project --active python scripts/prepare_release_assets.py --exe "$env:EXE_PATH" --lite-exe "$env:LITE_EXE_PATH" --updater-bundle "$env:BUNDLE_PATH" --updater-signature "$env:SIGNATURE_PATH" --lite-updater-bundle "$env:LITE_BUNDLE_PATH" --lite-updater-signature "$env:LITE_SIGNATURE_PATH" --output-dir "$env:OUTPUT_DIR" --tag "test-v0.0.0" --version "11.45.15" --repo "eddie772tw/FH6-HorizonTuner"

      - name: Validate generated manifest and asset set
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ steps.fixtures.outputs.output }}
        run: |
          $validator = @'
          import json
          import os
          from pathlib import Path
          import zipfile

          output = Path(os.environ["OUTPUT_DIR"])
          files = {path.name for path in output.iterdir() if path.is_file()}
          full_installer = "FH6-HorizonTuner-Full-Installer.exe"
          full_portable = "FH6-HorizonTuner-Full-Portable.exe"
          lite_installer = "FH6-HorizonTuner-Lite-Installer.exe"
          lite_portable = "FH6-HorizonTuner-Lite-Portable.exe"
          portable_archive = "FH6-HorizonTuner-Full-Lite-Portable.zip"
          full_signature = "FH6-HorizonTuner-Full-Installer.exe.sig"
          lite_signature = "FH6-HorizonTuner-Lite-Installer.exe.sig"
          expected = {
              full_installer,
              full_portable,
              lite_installer,
              lite_portable,
              portable_archive,
              full_signature,
              lite_signature,
              "latest.json",
              "latest-lite.json",
          }
          assert files == expected, files

          manifest = json.loads((output / "latest.json").read_text(encoding="utf-8"))
          platform = manifest["platforms"]["windows-x86_64"]
          assert manifest["version"] == "11.45.15"
          assert platform["signature"] == "TEST_ED25519_SIGNATURE"
          assert platform["url"].endswith(f"/test-v0.0.0/{full_installer}")
          lite_manifest = json.loads((output / "latest-lite.json").read_text(encoding="utf-8"))
          lite_platform = lite_manifest["platforms"]["windows-x86_64"]
          assert lite_platform["signature"] == "TEST_LITE_ED25519_SIGNATURE"
          assert lite_platform["url"].endswith(f"/test-v0.0.0/{lite_installer}")
          assert lite_platform["url"] != platform["url"]
          assert lite_platform["signature"] != platform["signature"]
          with zipfile.ZipFile(output / portable_archive) as archive:
              assert set(archive.namelist()) == {full_portable, lite_portable}
          '@
          $validator | uv run --no-project --active python -

      - name: Upload test release assets for inspection
        uses: actions/upload-artifact@v7
        with:
          name: fh6-release-packaging-test-assets
          path: ${{ steps.fixtures.outputs.output }}/*
          if-no-files-found: error
