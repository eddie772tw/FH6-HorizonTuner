name: FH6 HorizonTuner Host Diagnostics

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      repeat_count:
        description: 'Number of times to probe host launch per workflow run (1-10)'
        required: false
        default: '1'
        type: string
      timeout:
        description: 'Readiness timeout in seconds (15-120)'
        required: false
        default: '120'
        type: string

permissions:
  contents: read

jobs:
  run-host-diagnostics:
    name: Run Portable Host Diagnostics
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set configuration from input
      shell: bash
      run: |
        count="${{ github.event.inputs.repeat_count }}"
        if [ -z "$count" ]; then
          count=1
        fi
        echo "DIAGNOSTICS_REPEAT_COUNT=$count" >> $GITHUB_ENV

        timeout="${{ github.event.inputs.timeout }}"
        if [ -z "$timeout" ]; then
          timeout=120
        fi
        echo "DIAGNOSTICS_TIMEOUT=$timeout" >> $GITHUB_ENV

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'frontend/pnpm-lock.yaml'

    - name: Install Python & Frontend Dependencies
      run: |
        uv pip install --requirement requirements.txt
        uv pip install "pyinstaller>=6.10,<7.0"
        pnpm --prefix frontend install

    - name: Build Python sidecar executable
      run: >
        python scripts/release_metrics.py
        --label "PyInstaller sidecar"
        --artifact dist/server-sidecar-x86_64-pc-windows-msvc.exe
        -- uv run --no-project --active python -m PyInstaller server-sidecar.spec --clean

    - name: Stage Embedded Sidecar
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force frontend/src-tauri/bin | Out-Null
        Copy-Item dist/server-sidecar-x86_64-pc-windows-msvc.exe `
          frontend/src-tauri/bin/server-sidecar-x86_64-pc-windows-msvc.exe -Force

    - name: Build Portable Tauri Executable
      run: >
        python scripts/release_metrics.py
        --label "Tauri portable executable"
        --artifact frontend/src-tauri/target/release/FH6-HorizonTuner.exe
        -- pnpm --prefix frontend run tauri build --no-bundle

    - name: Run Diagnostics Probes
      run: uv run --no-project --active python -m pytest tests/test_portable_host_diagnostics.py -v

    - name: Upload Diagnostic Output on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: portable-host-diagnostics-${{ github.sha }}
        path: diagnostics_output/
        if-no-files-found: ignore
        retention-days: 7
