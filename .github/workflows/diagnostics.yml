name: Host Diagnostics

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      repeat_count:
        description: 'Number of times to probe host launch per workflow run (1-10)'
        required: false
        default: '1'
        type: string
      timeout:
        description: 'Readiness timeout in seconds (15-120)'
        required: false
        default: '120'
        type: string

permissions:
  contents: read

env:
  # Keep the interpreter selected by setup-uv aligned with its managed-Python cache.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  run-host-diagnostics:
    name: Run Portable Host Diagnostics
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Restore Tauri Rust build cache
      id: tauri-rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./frontend/src-tauri -> target"
        shared-key: "tauri-windows-release"
        add-job-id-key: false
        cache-workspace-crates: true

    - name: Record Tauri Rust cache state
      shell: bash
      run: |
        cache_state="${{ steps.tauri-rust-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
        echo "TAURI_RUST_CACHE_STATUS=$cache_state" >> "$GITHUB_ENV"
        echo "Tauri Rust cache: **$cache_state**" >> "$GITHUB_STEP_SUMMARY"

    - name: Set configuration from input
      shell: bash
      env:
        INPUT_REPEAT_COUNT: ${{ github.event.inputs.repeat_count }}
        INPUT_TIMEOUT: ${{ github.event.inputs.timeout }}
      run: |
        count="${INPUT_REPEAT_COUNT:-1}"
        echo "DIAGNOSTICS_REPEAT_COUNT=$count" >> "$GITHUB_ENV"

        timeout="${INPUT_TIMEOUT:-120}"
        echo "DIAGNOSTICS_TIMEOUT=$timeout" >> "$GITHUB_ENV"

    - name: Set up uv and managed Python 3.13
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.13"
        activate-environment: true
        no-project: true
        cache-python: true
        enable-cache: true
        cache-dependency-glob: requirements.txt

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: 'pnpm'
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install Python & Frontend Dependencies
      run: |
        uv pip install --requirement requirements.txt
        uv pip install "pyinstaller>=6.10,<7.0"
        pnpm --prefix frontend install --frozen-lockfile

    - name: Build Python sidecar executable
      run: >
        python scripts/release_metrics.py
        --label "PyInstaller sidecar"
        --artifact dist/server-sidecar-x86_64-pc-windows-msvc.exe
        --metrics-file metrics/sidecar-build.json
        -- uv run --no-project --active python -m PyInstaller server-sidecar.spec --clean

    - name: Stage Embedded Sidecar
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force frontend/src-tauri/bin | Out-Null
        Copy-Item dist/server-sidecar-x86_64-pc-windows-msvc.exe `
          frontend/src-tauri/bin/server-sidecar-x86_64-pc-windows-msvc.exe -Force

    - name: Build Portable Tauri Executable
      run: >
        python scripts/release_metrics.py
        --label "Tauri portable executable"
        --artifact frontend/src-tauri/target/release/FH6-HorizonTuner.exe
        --metrics-file metrics/tauri-build.json
        --cache-status ${{ env.TAURI_RUST_CACHE_STATUS }}
        -- pnpm.cmd --prefix frontend run tauri build --no-bundle

    - name: Run Diagnostics Probes
      run: uv run --no-project --active python -m pytest tests/test_portable_host_diagnostics.py -v

    - name: Upload Diagnostic Output on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: portable-host-diagnostics-${{ github.sha }}
        path: diagnostics_output/
        if-no-files-found: ignore
        retention-days: 7
