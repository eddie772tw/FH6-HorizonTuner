name: HUD Stack ST8100 Visual Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'hud_overlay/stack_st8100/**'
      - 'hud_overlay/shared/**'
      - 'frontend/src/features/overlay_control/**'
      - 'lang/**'
      - 'backend-rust/src/config.rs'
      - 'backend-rust/resources/defaults.json'
      - 'backend-rust/tests/stack_st8100_config_contract.rs'
      - '.github/workflows/hud-stack-st8100-visual.yml'

permissions:
  contents: read

jobs:
  render-fixtures:
    name: Stack ST8100 sandboxed Chrome visual and settings review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install existing frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile
      - name: Install isolated visual-test tooling
        run: npm install --prefix "$RUNNER_TEMP/hud-browser" --ignore-scripts --no-save --package-lock=false playwright@1.63.0
      - name: Verify preinstalled Google Chrome
        run: google-chrome --version
      - name: Install CJK fonts for localized settings visual review
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK TC'
          fc-match 'Noto Sans CJK JP'
      - name: Render actual HUD fixture states
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-stack-st8100-preview" node hud_overlay/stack_st8100/tests/visual/render.mjs
      - name: Verify real launcher and Coordinator integration
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-stack-st8100-preview" node hud_overlay/stack_st8100/tests/visual/launcher.cjs
      - name: Verify actual GUI threshold editing, units and persistence
        run: PLAYWRIGHT_CHANNEL=chrome PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/hud-browser/node_modules/playwright" OUTPUT_DIR="$RUNNER_TEMP/hud-stack-st8100-preview" node frontend/src/features/overlay_control/stack_st8100/tests/browser/verify.cjs
      - name: Upload visual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hud-stack-st8100-visual-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hud-stack-st8100-preview
          if-no-files-found: error
          retention-days: 14
