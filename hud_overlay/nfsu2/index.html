<!DOCTYPE html>
<!--
  [設計決策紀錄 / Design Decision Note]
  1. 水溫 (Water Temp) 數據來源：Forza Horizon UDP 遙測協定未提供原生引擎水溫欄位，故統一取四輪胎溫平均值 (temp_fl, temp_fr, temp_rl, temp_rr) 並自動將華氏 (°F) 轉換為攝氏 (°C) 作為溫度輸入。
  2. 油溫與油壓 (Oil Temp & Oil Pressure) 數據來源：統一採用基於轉速比 (rpmRatio) 與油門開度 (throttle) 的確定性熱力學與油壓代理模型 (Deterministic Thermodynamic & Oil Pressure Proxy Model) 進行即時模擬。
  3. 錶頭固定單位 (Hardcoded Dial Units)：NFS Underground 2 左側增壓錶面刻度固定標示為 -30 至 +30 PSI，故此指針始終綁定 data.boost_psi，忽略外部傳遞之壓力單位設定；右下角數位時速則支援動態 KM/H 與 MPH 切換。
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFS Underground 2 HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .nfsu2-container {
            width: 562px;
            height: 363px;
            position: relative;
            pointer-events: none;
        }
        #nfsu2Canvas {
            display: block;
            width: 562px;
            height: 363px;
            filter: none;
        }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>

    <div class="hud-root-wrapper">
        <div class="hud-gauge-container nfsu2-container" id="nfsu2Container">
            <canvas id="nfsu2Canvas" width="562" height="363"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>

    <script>
        (function() {
            var canvas = document.getElementById('nfsu2Canvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('nfsu2Container');

            var activeFace = 3; // Default: Tabby Cat (0..10)
            var faceImgs = [];
            for (var i = 0; i <= 10; i++) {
                // Prepared from the original material alpha: artwork stays solid,
                // only the backing plate uses 15% alpha. Do not key dark artwork by RGB.
                var img = new Image();
                img.src = 'assets/nfsu2_face_' + i + '.png';
                faceImgs.push(img);
            }

            // Per-faceplate ASM needle pivot offsets x3[face_idx] from res_125.asm lines 6092-6102
            var FACE_PIVOT_OFFSETS = [
                [0, 0],   // 0: Stock
                [0, 0],   // 1: Flames
                [0, 0],   // 2: Tribal
                [0, 4],   // 3: Tabby Cat
                [-1, 2],  // 4: Skull
                [0, -3],  // 5: Rose
                [-4, 2],  // 6: Dragon
                [3, -4],  // 7: Techno
                [0, 0],   // 8: Speed
                [0, 0],   // 9: Circuit
                [0, 0]    // 10: Bling
            ];

            var vis = {
                showGauge: true,
                showRPM: true,
                showSpeed: true,
                showGear: true,
                showBoost: true
            };

            var telemetry = {
                speed: 0,
                speedUnit: 'KM/H',
                rpm: 0,
                maxRpm: 8000,
                gear: 1,
                boostPsi: -12.0,
                drift: 0,
                tempC: 85
            };

            function formatGear(g) {
                if (g === 0) return 'R';
                if (g === 11 || g < 0) return 'N';
                return String(g);
            }

            function drawHollowDiamondPointer(cx, cy, angleRad, innerR, outerR) {
                var midR = (innerR + outerR) * 0.5;
                var halfW = (outerR - innerR) * 0.42;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleRad);
                ctx.strokeStyle = '#e63232';
                ctx.fillStyle = 'rgba(230, 50, 50, 0.25)';
                ctx.lineWidth = 3.0;
                ctx.shadowColor = 'rgba(255, 40, 60, 0.85)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(outerR, 0);
                ctx.lineTo(midR, -halfW);
                ctx.lineTo(innerR, 0);
                ctx.lineTo(midR, halfW);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function drawTaperedNeedle(cx, cy, angleRad, tailLen, tipLen, width) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleRad);

                ctx.shadowColor = 'rgba(255, 35, 50, 0.85)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#e82c38';
                ctx.beginPath();
                ctx.moveTo(-tailLen, -width * 0.45);
                ctx.lineTo(tipLen, -1.2);
                ctx.lineTo(tipLen, 1.2);
                ctx.lineTo(-tailLen, width * 0.45);
                ctx.closePath();
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff9aa2';
                ctx.beginPath();
                ctx.moveTo(-tailLen * 0.4, -0.8);
                ctx.lineTo(tipLen * 0.94, -0.5);
                ctx.lineTo(tipLen * 0.94, 0.5);
                ctx.lineTo(-tailLen * 0.4, 0.8);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, width * 1.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function render() {
                var w = 562;
                var h = 363;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean D3D11 NFSU2 faceplate cluster (zero baked needles, zero baked digits)
                var activeImg = faceImgs[activeFace] || faceImgs[3];
                if (activeImg && activeImg.complete && activeImg.naturalWidth > 0) {
                    ctx.drawImage(activeImg, 0, 0, 562, 363);
                }

                // 2. Left Turbo Boost Needle (-30 to +30 PSI across 225 deg clockwise from 6 o'clock)
                // Pivot in 562x363 canvas from res_125.asm line 6164: (201.5, 266.0)
                if (vis.showBoost) {
                    var boostRatio = Math.min(1.0, Math.max(0.0, (telemetry.boostPsi + 30.0) / 60.0));
                    var boostRad = (90.0 + boostRatio * 225.0) * (Math.PI / 180.0);
                    if (activeFace === 3) {
                        drawHollowDiamondPointer(201.5, 266.0, boostRad, 41.0, 62.0);
                    } else {
                        drawTaperedNeedle(201.5, 266.0, boostRad, 11.0, 54.0, 5.0);
                    }
                }

                // 3. Main RPM Tachometer Needle (0 to maxRpm across 225 deg clockwise from 6 o'clock to 1:30)
                // Pivot in 562x363 canvas from res_125.asm line 6123: (392.0 + dx, 198.0 + dy)
                if (vis.showRPM) {
                    var maxR = telemetry.maxRpm > 1000 ? telemetry.maxRpm : 8000;
                    var rpmRatio = Math.min(1.04, Math.max(0.0, telemetry.rpm / maxR));
                    var rpmRad = (90.0 + rpmRatio * 225.0) * (Math.PI / 180.0);
                    var off = FACE_PIVOT_OFFSETS[activeFace] || [0, 0];
                    var mainCx = 392.0 + off[0];
                    var mainCy = 198.0 + off[1];

                    if (activeFace === 3) {
                        drawHollowDiamondPointer(mainCx, mainCy, rpmRad, 96.0, 124.0);
                    } else {
                        drawTaperedNeedle(mainCx, mainCy, rpmRad, 20.0, 114.0, 7.5);
                    }

                    // Shift indicator icon when near redline (res_125.asm lines 6299-6317)
                    if (telemetry.rpm >= maxR * 0.88) {
                        ctx.save();
                        ctx.fillStyle = '#00f0ff';
                        ctx.shadowColor = '#00f0ff';
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.moveTo(442, 166);
                        ctx.lineTo(432, 180);
                        ctx.lineTo(452, 180);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // 4. Digital Overlays (Gear, Speed, Drift Angle)
                ctx.save();
                ctx.textAlign = 'right';

                if (vis.showGear) {
                    ctx.font = 'italic 900 36px "Arial Black", Impact, sans-serif';
                    ctx.fillStyle = '#d4d8e2';
                    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
                    ctx.shadowBlur = 6;
                    ctx.fillText(formatGear(telemetry.gear), 482, 182);
                }

                if (vis.showSpeed) {
                    ctx.font = 'italic 900 44px "Arial Black", Impact, sans-serif';
                    ctx.fillStyle = '#cbd5e1';
                    ctx.shadowColor = 'rgba(0, 240, 255, 0.55)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(String(Math.round(telemetry.speed)), 488, 244);

                    ctx.font = '700 17px Arial, sans-serif';
                    ctx.fillStyle = '#94a3b8';
                    ctx.shadowBlur = 0;
                    ctx.fillText(telemetry.speedUnit, 480, 268);
                }

                // Left Wing Drift Angle Readout (res_125.asm lines 6318-6360)
                ctx.font = 'italic 900 34px "Arial Black", Impact, sans-serif';
                ctx.fillStyle = '#cbd5e1';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0, 240, 255, 0.45)';
                ctx.shadowBlur = 6;
                ctx.fillText(Math.round(Math.abs(telemetry.drift)) + '°', 106, 308);

                ctx.restore();
            }

            function setFace(idx) {
                var parsed = Number(idx);
                if (!isNaN(parsed) && parsed >= 0 && parsed <= 10) {
                    activeFace = Math.round(parsed);
                    render();
                }
            }
            window.setFace = setFace;

            faceImgs.forEach(function(img) {
                img.onload = render;
            });

            HUDCore.registerStyle('nfsu2', {
                containerId: 'nfsu2Container',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onInit: function(cfg) {
                    if (cfg && cfg.nfsu2Face !== undefined) {
                        setFace(cfg.nfsu2Face);
                    }
                },

                onConfigChange: function(cfg) {
                    if (cfg && cfg.nfsu2Face !== undefined) {
                        setFace(cfg.nfsu2Face);
                    }
                },

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                    vis.showGauge = elements.showGauge !== false;
                    vis.showRPM = elements.showRPM !== false;
                    vis.showSpeed = elements.showSpeed !== false;
                    vis.showGear = elements.showGear !== false;
                    vis.showBoost = elements.showBoost !== false;
                    render();
                },

                onFrame: function(data, payload) {
                    if (payload && payload.nfsu2Face !== undefined && Number(payload.nfsu2Face) !== activeFace) {
                        setFace(payload.nfsu2Face);
                    }
                    var speedUnit = data.displayUnits && data.displayUnits.speed;
                    var useMph = speedUnit ? speedUnit === 'mph' : Boolean(payload && payload.isMetric === false);
                    telemetry.speedUnit = useMph ? 'MPH' : 'KM/H';
                    if (useMph && data.speed_mph !== undefined) {
                        telemetry.speed = Number(data.speed_mph);
                    } else if (!useMph && data.speed_kmh !== undefined) {
                        telemetry.speed = Number(data.speed_kmh);
                    } else if (data.speed !== undefined) {
                        telemetry.speed = Number(data.speed);
                    }

                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.max_rpm !== undefined && Number(data.max_rpm) > 1000) {
                        telemetry.maxRpm = Number(data.max_rpm);
                    }
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);

                    // Left Turbo Boost dial is visually calibrated in PSI (-30 to +30)
                    if (data.boost_psi !== undefined) {
                        telemetry.boostPsi = Number(data.boost_psi);
                    } else if (data.boost_bar !== undefined) {
                        telemetry.boostPsi = Number(data.boost_bar) * 14.5038;
                    } else if (data.boost !== undefined) {
                        telemetry.boostPsi = Number(data.boost) * 14.5038;
                    }

                    // Body-velocity angle matches the existing Drift HUD convention.
                    // Per-wheel slip_angle_* values describe tires, not vehicle drift.
                    var vx = Number(data.vel_x) || 0;
                    var vz = Number(data.vel_z) || 0;
                    telemetry.drift = Math.hypot(vx, vz) > 0.5
                        ? Math.max(-90, Math.min(90, Math.atan2(vx, vz) * 180 / Math.PI))
                        : 0;

                    // Water temp from 4-wheel average tire temperature (Forza UDP native °F -> °C)
                    if (data.temp_fl !== undefined) {
                        var avgT = (Number(data.temp_fl || 0) + Number(data.temp_fr || 0) + Number(data.temp_rl || 0) + Number(data.temp_rr || 0)) * 0.25;
                        telemetry.tempC = avgT > 125 ? (avgT - 32) * 5 / 9 : avgT;
                    }
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 7800;
                        telemetry.maxRpm = 8000;
                        telemetry.speed = wave * 215;
                        telemetry.boostPsi = -20 + wave * 45;
                        telemetry.gear = wave > 0.5 ? 4 : 2;
                        telemetry.drift = wave * 32;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('nfsu2');
            render();
        })();
    </script>
</body>
</html>
