<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Supra MK4 TRD Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .supra-container {
            width: 800px;
            height: 334px;
            position: relative;
            pointer-events: none;
        }
        #supraCanvas {
            display: block;
            width: 800px;
            height: 334px;
            filter: drop-shadow(0 0 16px rgba(255, 120, 0, calc(var(--hud-glow-intensity, 1.0) * 0.35)));
        }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>

    <div class="hud-root-wrapper">
        <div class="hud-gauge-container supra-container" id="supraContainer">
            <canvas id="supraCanvas" width="800" height="334"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>

    <script>
        (function() {
            var canvas = document.getElementById('supraCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('supraContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/supra_clean_base.png';

            var telemetry = {
                speed: 180,
                rpm: 7200,
                maxRpm: 10000,
                gear: 4,
                temp: 90
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6'];

            function drawNeedle(cx, cy, length, angleDeg, color, width) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * length;
                var ny = cy + Math.sin(rad) * length;

                ctx.save();
                ctx.strokeStyle = color || '#ff5500';
                ctx.lineWidth = width || 2.5;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'rgba(255, 80, 0, 0.8)';
                ctx.shadowBlur = 6;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                // Hub
                ctx.fillStyle = '#0f141d';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Draw Clean TRD Dial Plates (100% transparent background)
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 800, 334);
                }

                // 2. Center Tachometer Needle (Center: 399, 161)
                // 0 RPM = 135 deg (pointing down-left), 10,000 RPM = 45 deg (pointing down-right) -> 270 deg sweep
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                var tachAngle = 135.0 + rpmRatio * 270.0;
                var isRedline = rpmRatio > 0.88;
                drawNeedle(399, 161, 95, tachAngle, isRedline ? '#ff1133' : '#ff5500', 3.0);

                // 3. Right Speedometer Needle (Center: 622, 172)
                // 0 km/h = 135 deg, 340 km/h = 45 deg -> 270 deg sweep
                var speedRatio = Math.min(1.0, Math.max(0.0, telemetry.speed / 340.0));
                var speedAngle = 135.0 + speedRatio * 270.0;
                drawNeedle(622, 172, 85, speedAngle, '#ff5500', 2.5);

                // 4. Left Subdial Needles:
                // Water Temp (Pivot: 84, 248), sweep from 210 deg (50C/cold) to 325 deg (130C hot)
                var tempRatio = Math.min(1.0, Math.max(0.0, (telemetry.temp - 50.0) / 80.0));
                var tempAngle = 210.0 + tempRatio * 115.0;
                drawNeedle(84, 248, 42, tempAngle, '#ff5500', 2.0);

                // Fuel Level (Pivot: 172, 174), sweep from 315 deg (E) to 225 deg (F)
                var fuelRatio = 0.78;
                var fuelAngle = 315.0 - fuelRatio * 90.0;
                drawNeedle(172, 174, 48, fuelAngle, '#ff5500', 2.0);

                // 5. Digital Gear Indicator in Tachometer Box (400, 222)
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowBlur = 8;
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 400, 222);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('supra_trd', {
                containerId: 'supraContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (data.coolant_temp !== undefined) telemetry.temp = Number(data.coolant_temp);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 9200;
                        telemetry.speed = wave * 280;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('supra_trd');
            render();
        })();
    </script>
</body>
</html>
