<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Retro VFD Gauge & Radio HUD Suite</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        @font-face {
            font-family: 'VFDDigits';
            src: url('./assets/fonts/DSEG7Modern-Bold.ttf') format('truetype');
        }

        @font-face {
            font-family: 'VFDAlpha';
            src: url('./assets/fonts/DSEG14Modern-Regular.ttf') format('truetype');
        }

        .vfd-container {
            width: 1120px;
            height: 520px;
            pointer-events: none;
            will-change: transform, filter;
        }

        canvas {
            display: block;
            width: 1120px;
            height: 520px;
        }
    </style>
</head>

<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container vfd-container" id="vfdContainer">
            <canvas id="vfdCanvas" width="1120" height="520"></canvas>
        </div>
    </div>

    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var canvas = document.getElementById('vfdCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var staticLayerCanvas = document.createElement('canvas');
            staticLayerCanvas.width = 1120;
            staticLayerCanvas.height = 520;
            var staticLayerCtx = staticLayerCanvas.getContext('2d');
            var skipPanelFrames = false;
            var staticLayerDirty = true;
            var optimizedGaugeDirty = true;
            var optimizedRadioDirty = true;
            var optimizedRenderPending = false;
            var optimizedAnimationTimer = null;

            // ── VFD Phosphor Palette & Constant Glow ────────────────────────────────
            var VFD_CLASSIC_GLOW = "#8ffff0";
            var VFD_GLOW_RADIUS = 9;

            var defaultPalette = {
                primary: "#8ffff0",
                accent: "#d2fff9",
                dim: "rgba(24, 59, 56, 0.22)",
                hot: "#ff584d",
                amber: "#ffb732",
                glow: VFD_CLASSIC_GLOW
            };

            var currentPalette = Object.assign({}, defaultPalette);
            var isMetricUnit = true;
            var vfdRenderMode = 'legacy';

            function syncVFDRenderMode() {
                var configuredMode = window._currentFullConfig && window._currentFullConfig.vfdRenderMode;
                var nextMode = configuredMode === 'optimized' ? 'optimized' : 'legacy';
                if (nextMode !== vfdRenderMode) {
                    vfdRenderMode = nextMode;
                    staticLayerDirty = true;
                    optimizedGaugeDirty = true;
                    optimizedRadioDirty = true;
                }
            }

            // ── Motion Effect Smooth Lerp State ─────────────────────────────────────
            var motionState = {
                currentOffsetX: 0,
                currentOffsetY: 0,
                currentBlurPx: 0,
                lastAppliedOffsetX: 0,
                lastAppliedOffsetY: 0,
                lastAppliedBlurPx: 0
            };

            // ── Audio System & Media State ──────────────────────────────────────────
            var spectrumBands = new Array(32).fill(0);
            var peakHoldVals = new Array(32).fill(0);
            var peakHoldTicks = new Array(32).fill(0);

            var backendVuL = 0;
            var backendVuR = 0;
            var hasBackendAudio = false;

            var DEFAULT_MARQUEE = "TANTRON - TURBO FIRE /// MADE BY CROSXOVER";

            var systemMediaInfo = {
                title: "Turbo Fire",
                artist: "TANTRON",
                status: "none",
                has_media: false
            };

            var marqueeText = DEFAULT_MARQUEE;
            var marqueeScrollPos = 0;

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function updateDynamicColors() {
                var previousPaletteKey = currentPalette.primary + '|' + currentPalette.accent + '|' + currentPalette.dim + '|' + currentPalette.glow;
                var customColor = window._currentCustomColor;
                var useDefault = window._currentUseDefaultColors !== false;

                if (!useDefault && customColor) {
                    currentPalette.primary = customColor;
                    currentPalette.accent = customColor;
                    currentPalette.dim = "rgba(40, 55, 60, 0.28)";
                    currentPalette.glow = customColor;
                } else {
                    currentPalette.primary = defaultPalette.primary;
                    currentPalette.accent = defaultPalette.accent;
                    currentPalette.dim = defaultPalette.dim;
                    currentPalette.glow = VFD_CLASSIC_GLOW;
                }

                var nextPaletteKey = currentPalette.primary + '|' + currentPalette.accent + '|' + currentPalette.dim + '|' + currentPalette.glow;
                return previousPaletteKey !== nextPaletteKey;
            }


            // Sanitize text for 14-Segment VFD font compatibility
            function sanitizeVFDText(text) {
                if (text === null || text === undefined) return "";
                var str = typeof text === "string" ? text : String(text);
                if (!str.trim()) return "";

                str = str
                    .replace(/[éèêë]/gi, "E")
                    .replace(/[áàâäã]/gi, "A")
                    .replace(/[óòôöõ]/gi, "O")
                    .replace(/[úùûü]/gi, "U")
                    .replace(/[íìîï]/gi, "I")
                    .replace(/ñ/gi, "N")
                    .replace(/ç/gi, "C")
                    .replace(/[’‘]/g, "'")
                    .replace(/[“”]/g, '"')
                    .replace(/[–—]/g, "-")
                    .replace(/…/g, "...");

                str = str.replace(/&/g, "AND").replace(/!/g, "");
                str = str.replace(/[^\x20-\x7E]/g, " ");

                return str
                    .replace(/[@#$%\^*()_+=[\]{}|\\;:'",.<>?]/g, " ")
                    .replace(/\s+/g, " ")
                    .toUpperCase()
                    .trim();
            }

            // ── VFD Drawing Primitives ──────────────────────────────────────────────
            function drawVFDPanelFrame(x, y, w, h, title) {
                if (skipPanelFrames) return;
                ctx.save();
                ctx.fillStyle = '#040d0c';
                ctx.fillRect(x, y, w, h);

                ctx.strokeStyle = 'rgba(15, 45, 40, 0.25)';
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                for (var gx = x + 8; gx < x + w; gx += 12) {
                    ctx.moveTo(gx, y);
                    ctx.lineTo(gx, y + h);
                }
                for (var gy = y + 8; gy < y + h; gy += 12) {
                    ctx.moveTo(x, gy);
                    ctx.lineTo(x + w, gy);
                }
                ctx.stroke();

                ctx.strokeStyle = currentPalette.primary;
                ctx.globalAlpha = 0.35;
                ctx.lineWidth = 1.4;
                ctx.strokeRect(x, y, w, h);

                if (title) {
                    ctx.save();
                    ctx.font = 'bold 22px "Trebuchet MS", "Arial Black", sans-serif';
                    ctx.fillStyle = currentPalette.primary;
                    ctx.globalAlpha = 0.20;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText(title.toUpperCase(), x + 14, y + 10);
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawCellBar(x, y, w, h, count, value, color, dimColor, isVertical) {
                var gap = 3;
                var lit = Math.floor(clamp(value, 0, 1) * count + 0.5);

                for (var i = 1; i <= count; i++) {
                    var cellX = isVertical ? x : x + (i - 1) * ((w - gap * (count - 1)) / count + gap);
                    var cellY = isVertical ? y + h - i * ((h - gap * (count - 1)) / count + gap) : y;
                    var cellW = isVertical ? w : (w - gap * (count - 1)) / count;
                    var cellH = isVertical ? (h - gap * (count - 1)) / count : h;

                    ctx.fillStyle = dimColor;
                    ctx.globalAlpha = 0.42;
                    ctx.fillRect(cellX, cellY, cellW, cellH);

                    if (i <= lit) {
                        ctx.save();
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.95;
                        ctx.shadowColor = currentPalette.glow;
                        ctx.shadowBlur = VFD_GLOW_RADIUS;
                        ctx.fillRect(cellX, cellY, cellW, cellH);
                        ctx.restore();
                    }
                }
            }

            // ── Upper Section: Gauge Instrument Cluster ─────────────────────────────
            var peakRpmVal = 0;
            var peakRpmHoldTicks = 0;
            var peakSessionHp = 100;
            var peakSessionTq = 100;
            var peakSessionBoostBar = 1.0;

            function renderVFDGaugeCluster(data, payload) {
                updateDynamicColors();

                var maxRpm = Math.max(1000, data.maxRpm || data.max_rpm || 8500);
                var rpm = Math.max(0, data.rpm || 0);
                var mps = data.SpeedMetersPerSecond || 0;
                var speed = Math.floor(clamp(isMetricUnit ? (data.speed_kmh || data.speed || mps * 3.6) : (data.speed_mph || mps * 2.23694), 0, 999) + 0.5);
                var gearVal = data.gear;
                var gearLabel = gearVal === 0 ? 'R' : (gearVal === 11 ? 'N' : (gearVal !== undefined ? String(gearVal) : '1'));
                var throttleVal = data.throttle !== undefined ? data.throttle : ((data.Accel || data.AccelInput || 0) / 255);

                // Redline calculation matches Advanced HUD; Yellowline is 1000 RPM before Redline
                var payloadRedline = (payload && payload.redlineRpm) || (data && (data.redlineRpm || data.redline));
                var redlineRpm = payloadRedline && payloadRedline > 0 ? payloadRedline : maxRpm * 0.92;
                var warnRpm = Math.max(0, redlineRpm - 1000);

                // Redline flashing & SHIFT indicator ONLY active when Throttle input > 50% (0.5)
                var isHighThrottle = throttleVal > 0.5;
                var isRedlineAlert = (rpm >= redlineRpm) && isHighThrottle;
                var isFlashOff = isRedlineAlert && (Math.floor(Date.now() / 65) % 2 === 0);

                if (rpm >= peakRpmVal) {
                    peakRpmVal = rpm;
                    peakRpmHoldTicks = 25;
                } else {
                    if (peakRpmHoldTicks > 0) {
                        peakRpmHoldTicks--;
                    } else {
                        peakRpmVal = Math.max(rpm, peakRpmVal - 150);
                    }
                }

                // Tachometer Panel
                drawVFDPanelFrame(0, 0, 1120, 115, "RPM x1000");
                ctx.save();
                var count = 54, startX = 25, startY = 97, cellW = 16, cellH = 34, gap = 4;
                var rpmRatio = clamp(rpm / maxRpm, 0, 1);
                var litCount = Math.floor(rpmRatio * count + 0.5);
                var peakCell = Math.floor(clamp(peakRpmVal / maxRpm, 0, 1) * count + 0.5);

                // Dynamic RPM label step calculation: 2000 RPM step for maxRpm > 12000, 1000 RPM step otherwise
                var stepRpm = maxRpm > 12000 ? 2000 : 1000;
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.textAlign = 'center';
                for (var targetRpm = 0; targetRpm <= maxRpm; targetRpm += stepRpm) {
                    var labelRatio = targetRpm / maxRpm;
                    var targetCell = labelRatio * count;
                    var nx = startX + targetCell * (cellW + gap);
                    var labelText = String(Math.round(targetRpm / 1000));
                    var nColor = targetRpm >= redlineRpm ? currentPalette.hot : (targetRpm >= warnRpm ? currentPalette.amber : currentPalette.primary);

                    ctx.fillStyle = currentPalette.dim;
                    ctx.fillText(labelText, nx, startY - cellH - 8);

                    if (rpmRatio >= labelRatio) {
                        ctx.save();
                        ctx.fillStyle = nColor;
                        ctx.shadowColor = currentPalette.glow;
                        ctx.shadowBlur = VFD_GLOW_RADIUS;
                        ctx.fillText(labelText, nx, startY - cellH - 8);
                        ctx.restore();
                    }
                }

                for (var i = 1; i <= count; i++) {
                    var cx = startX + (i - 1) * (cellW + gap);
                    var cy = startY - cellH;
                    var cellRpm = (i / count) * maxRpm;
                    var isRedline = cellRpm >= redlineRpm;
                    var isWarn = cellRpm >= warnRpm && !isRedline;
                    var activeColor = isRedline ? currentPalette.hot : (isWarn ? currentPalette.amber : currentPalette.primary);

                    ctx.fillStyle = isRedline ? "rgba(80, 20, 20, 0.3)" : (isWarn ? "rgba(70, 50, 10, 0.25)" : currentPalette.dim);
                    ctx.globalAlpha = 0.42;
                    ctx.fillRect(cx, cy, cellW, cellH);

                    if (i <= litCount) {
                        ctx.save();
                        ctx.fillStyle = activeColor;
                        ctx.globalAlpha = isFlashOff ? 0.15 : 0.95;
                        if (!isFlashOff) {
                            ctx.shadowColor = isRedline ? currentPalette.hot : currentPalette.glow;
                            ctx.shadowBlur = isRedline ? VFD_GLOW_RADIUS + 4 : VFD_GLOW_RADIUS;
                        }
                        ctx.fillRect(cx, cy, cellW, cellH);
                        ctx.restore();
                    }

                    if (i === peakCell && peakCell > litCount) {
                        ctx.save();
                        ctx.fillStyle = activeColor;
                        ctx.globalAlpha = isFlashOff ? 0.2 : 1.0;
                        ctx.shadowColor = isRedline ? currentPalette.hot : currentPalette.glow;
                        ctx.shadowBlur = VFD_GLOW_RADIUS + 4;
                        ctx.fillRect(cx, cy - 3, cellW, cellH + 6);
                        ctx.restore();
                    }
                }
                ctx.restore();

                // Speedometer Panel
                drawVFDPanelFrame(0, 123, 420, 145, "SPEED");
                ctx.save();
                ctx.font = 'bold 96px VFDDigits, monospace, sans-serif';
                ctx.textAlign = 'right';

                ctx.fillStyle = currentPalette.dim;
                ctx.globalAlpha = 0.22;
                ctx.fillText("888", 320, 243);

                ctx.fillStyle = currentPalette.primary;
                ctx.globalAlpha = 1.0;
                ctx.shadowColor = currentPalette.glow;
                ctx.shadowBlur = VFD_GLOW_RADIUS;
                ctx.fillText(speed.toString(), 320, 243);

                ctx.font = 'bold 18px VFDAlpha, sans-serif';
                ctx.shadowBlur = 0;
                ctx.fillText(isMetricUnit ? "KM/H" : "MPH", 395, 238);
                ctx.restore();

                // Gear & Shift Lamp Bezel
                drawVFDPanelFrame(430, 123, 210, 145, "GEAR");
                ctx.save();
                ctx.font = 'bold 90px VFDDigits, monospace, sans-serif';
                ctx.textAlign = 'center';

                ctx.fillStyle = currentPalette.dim;
                ctx.globalAlpha = 0.22;
                ctx.fillText("8", 535, 243);

                ctx.fillStyle = currentPalette.accent;
                ctx.globalAlpha = 1.0;
                ctx.shadowColor = currentPalette.glow;
                ctx.shadowBlur = VFD_GLOW_RADIUS;
                ctx.fillText(gearLabel, 535, 243);

                // SHIFT prompt ONLY displayed when RPM >= redline AND Throttle > 50%
                if (isRedlineAlert) {
                    ctx.font = 'bold 11px VFDAlpha, sans-serif';
                    ctx.fillStyle = currentPalette.hot;
                    ctx.globalAlpha = isFlashOff ? 0.15 : 1.0;
                    if (!isFlashOff) {
                        ctx.shadowColor = currentPalette.hot;
                        ctx.shadowBlur = 14;
                    }
                    ctx.fillText("SHIFT", 535, 156);
                }
                ctx.restore();

                // Auxiliary Telemetry Gauges (POW, TOR, BST with Dynamic Upper Bound Range Scaling)
                drawVFDPanelFrame(650, 123, 470, 145, "TELEMETRY");
                ctx.save();
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';

                // Extract Power, Torque & Boost telemetry values
                var sessionMaxima = (payload && payload.sessionMaxima) || (data && data.sessionMaxima) || {};
                var idleRpm = data.EngineIdleRpm !== undefined ? data.EngineIdleRpm : (data.engine_idle_rpm !== undefined ? data.engine_idle_rpm : null);
                var isEV = idleRpm === 0;

                var curHp = Math.max(0, data.power_hp !== undefined ? data.power_hp : (data.PowerWatts ? data.PowerWatts / 745.7 : (data.power ? (data.power < 50 ? data.power * 1.341 : data.power) : 0)));
                var rawTq = data.torque_ftlbs !== undefined ? data.torque_ftlbs : (data.TorqueNewtons ? data.TorqueNewtons * 0.737562 : (data.torque || 0));
                var curTq = Math.max(0, rawTq);
                var curBoostBar = Math.max(0, data.boost_bar !== undefined ? data.boost_bar : (data.boost_psi ? data.boost_psi / 14.5038 : (data.boost ? (data.boost > 5 ? data.boost / 14.5038 : data.boost) : 0)));

                if (curHp > peakSessionHp) peakSessionHp = curHp;
                if (curTq > peakSessionTq) peakSessionTq = curTq;
                if (curBoostBar > peakSessionBoostBar) peakSessionBoostBar = curBoostBar;

                var maxHpBound = Math.max(100, sessionMaxima.maxHP || sessionMaxima.power || 100, peakSessionHp);
                var maxTqBound = Math.max(100, sessionMaxima.maxTQ || sessionMaxima.torque || 100, peakSessionTq);
                var maxBoostBound = Math.max(1.0, sessionMaxima.maxBoost || sessionMaxima.boost || 1.0, peakSessionBoostBar);

                var powNorm = clamp(curHp / maxHpBound, 0, 1);
                var torNorm = clamp(curTq / maxTqBound, 0, 1);

                // For EV, RGN bar is based on negative torque normalized against maxTqBound
                var evBlueColor = "#009ADA";
                var boostNorm = isEV ? clamp((-rawTq) / maxTqBound, 0, 1) : clamp(curBoostBar / maxBoostBound, 0, 1);
                var boostLabel = isEV ? "RGN" : "BST";
                var boostColor = isEV ? evBlueColor : currentPalette.amber;

                // --- Left Column: Throttle, Brake, Boost / RGN ---
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.globalAlpha = 1.0;
                ctx.fillText("THR", 665, 175);
                drawCellBar(708, 166, 195, 18, 14, throttleVal || 0, currentPalette.primary, currentPalette.dim, false);

                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.hot;
                ctx.globalAlpha = 1.0;
                ctx.fillText("BRK", 665, 209);
                drawCellBar(708, 200, 195, 18, 14, data.brake || 0, currentPalette.hot, currentPalette.dim, false);

                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.fillStyle = boostColor;
                ctx.globalAlpha = 1.0;
                ctx.fillText(boostLabel, 665, 243);
                drawCellBar(708, 234, 195, 18, 14, boostNorm, boostColor, currentPalette.dim, false);

                // --- Right Column: POW (Power), TOR (Torque) & Status Lamp Indicators ---
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.globalAlpha = 1.0;
                ctx.fillText("POW", 918, 175);
                drawCellBar(965, 166, 135, 18, 10, powNorm, currentPalette.primary, currentPalette.dim, false);

                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.globalAlpha = 1.0;
                ctx.fillText("TOR", 918, 209);
                drawCellBar(965, 200, 135, 18, 10, torNorm, currentPalette.accent, currentPalette.dim, false);

                var isAbs = (data.brake || 0) > 0.85 && (data.speed_kmh || 0) > 30;
                var isTcs = throttleVal > 0.85;
                var isTurboOrRgn = isEV ? (rawTq < -5) : (curBoostBar > 0.05);

                // ABS Lamp
                ctx.save();
                ctx.fillStyle = isAbs ? currentPalette.hot : currentPalette.dim;
                ctx.globalAlpha = isAbs ? 0.95 : 0.25;
                ctx.fillRect(918, 234, 54, 26);
                ctx.strokeStyle = isAbs ? currentPalette.hot : "rgba(255, 88, 77, 0.3)";
                ctx.lineWidth = 1.2;
                ctx.strokeRect(918, 234, 54, 26);
                if (isAbs) {
                    ctx.shadowColor = currentPalette.hot;
                    ctx.shadowBlur = 10;
                }
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = isAbs ? "#ffffff" : currentPalette.dim;
                ctx.globalAlpha = isAbs ? 1.0 : 0.35;
                ctx.fillText("ABS", 945, 247);
                ctx.restore();

                // TCS Lamp
                ctx.save();
                ctx.fillStyle = isTcs ? currentPalette.amber : currentPalette.dim;
                ctx.globalAlpha = isTcs ? 0.95 : 0.25;
                ctx.fillRect(978, 234, 54, 26);
                ctx.strokeStyle = isTcs ? currentPalette.amber : "rgba(255, 183, 50, 0.3)";
                ctx.lineWidth = 1.2;
                ctx.strokeRect(978, 234, 54, 26);
                if (isTcs) {
                    ctx.shadowColor = currentPalette.amber;
                    ctx.shadowBlur = 10;
                }
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = isTcs ? "#ffffff" : currentPalette.dim;
                ctx.globalAlpha = isTcs ? 1.0 : 0.35;
                ctx.fillText("TCS", 1005, 247);
                ctx.restore();

                // TUR / RGN Lamp
                ctx.save();
                var lampActiveColor = isEV ? evBlueColor : currentPalette.primary;
                ctx.fillStyle = isTurboOrRgn ? lampActiveColor : currentPalette.dim;
                ctx.globalAlpha = isTurboOrRgn ? 0.95 : 0.25;
                ctx.fillRect(1038, 234, 55, 26);
                ctx.strokeStyle = isTurboOrRgn ? lampActiveColor : (isEV ? "rgba(0, 154, 218, 0.3)" : "rgba(143, 255, 240, 0.3)");
                ctx.lineWidth = 1.2;
                ctx.strokeRect(1038, 234, 55, 26);
                if (isTurboOrRgn) {
                    ctx.shadowColor = isEV ? evBlueColor : currentPalette.glow;
                    ctx.shadowBlur = 10;
                }
                ctx.font = 'bold 12px VFDAlpha, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = isTurboOrRgn ? "#040d0c" : currentPalette.dim;
                ctx.globalAlpha = isTurboOrRgn ? 1.0 : 0.35;
                ctx.fillText(isEV ? "RGN" : "TUR", 1065, 247);
                ctx.restore();

                ctx.restore();
            }

            // ── Stereo L/R Volume Level VU Meters & Audio Equalizer Spectrum Updates ─────
            function updateAudioSpectrum() {
                var bandCount = 32;

                if (!hasBackendAudio) {
                    for (var b = 0; b < bandCount; b++) {
                        spectrumBands[b] = Math.max(0, spectrumBands[b] * 0.85 - 0.02);
                    }
                }

                // Peak Hold Gravitational Physics Update
                for (var i = 0; i < bandCount; i++) {
                    var cur = spectrumBands[i];
                    if (cur >= peakHoldVals[i]) {
                        peakHoldVals[i] = cur;
                        peakHoldTicks[i] = 12;
                    } else {
                        if (peakHoldTicks[i] > 0) {
                            peakHoldTicks[i]--;
                        } else {
                            peakHoldVals[i] = Math.max(cur, peakHoldVals[i] - 0.038);
                        }
                    }
                }
            }

            function renderVFDRadioSection() {
                updateAudioSpectrum();

                var panelY = 278;
                drawVFDPanelFrame(0, panelY, 1120, 235, "AUDIO EQUALIZER");

                ctx.save();

                // 1. Extended 14-Segment VFD Marquee Display
                var maxFitCells = 48;
                var startX = 22;
                var cellStep = 18.5;
                var cellY = panelY + 54;

                var safeText = marqueeText || DEFAULT_MARQUEE;
                var textLen = safeText.length;
                var needScroll = textLen > maxFitCells;

                if (needScroll) {
                    marqueeScrollPos += 0.04;
                } else {
                    marqueeScrollPos = 0;
                }

                var subStr = "";
                if (needScroll) {
                    var padText = safeText + "         ";
                    var padLen = padText.length;
                    var startIdx = (padLen > 0) ? (Math.floor(marqueeScrollPos) % padLen) : 0;
                    if (isNaN(startIdx) || startIdx < 0) startIdx = 0;
                    var textWindow = padText + padText + padText + padText;
                    subStr = textWindow.substring(startIdx, startIdx + maxFitCells);
                } else {
                    subStr = safeText;
                }

                ctx.font = 'bold 22px VFDAlpha, sans-serif';
                for (var ci = 0; ci < maxFitCells; ci++) {
                    var cx = startX + ci * cellStep;
                    var ch = subStr[ci] || ' ';

                    ctx.save();
                    ctx.fillStyle = currentPalette.dim;
                    ctx.globalAlpha = 0.42;
                    ctx.shadowBlur = 0;
                    ctx.fillText("8", cx, cellY);
                    ctx.restore();

                    if (ch !== ' ') {
                        ctx.save();
                        ctx.fillStyle = currentPalette.accent;
                        ctx.shadowColor = currentPalette.glow;
                        ctx.shadowBlur = VFD_GLOW_RADIUS;
                        ctx.fillText(ch, cx, cellY);
                        ctx.restore();
                    }
                }

                // 2. SYS MEDIA Indicator Lamp
                var hasMedia = systemMediaInfo.has_media;
                ctx.font = 'bold 11px VFDAlpha, sans-serif';
                ctx.fillStyle = hasMedia ? currentPalette.primary : currentPalette.dim;
                ctx.globalAlpha = hasMedia ? 0.95 : 0.28;
                ctx.fillRect(940, panelY + 30, 150, 26);

                if (hasMedia) {
                    ctx.save();
                    ctx.shadowColor = currentPalette.glow;
                    ctx.shadowBlur = VFD_GLOW_RADIUS + 4;
                    ctx.fillRect(940, panelY + 30, 150, 26);
                    ctx.restore();
                }

                ctx.fillStyle = hasMedia ? "#000000" : currentPalette.dim;
                ctx.globalAlpha = hasMedia ? 1.0 : 0.6;
                ctx.textAlign = 'center';
                ctx.fillText(hasMedia ? "MEDIA: ON" : "MEDIA: OFF", 1015, panelY + 47);
                ctx.textAlign = 'left';

                // 3. 32-Band VFD Equalizer Bargraphs
                var left = 20, top = panelY + 80, width = 1010, height = 135;
                var bandCount = 32;
                var bandGap = 5;
                var bandW = (width - bandGap * (bandCount - 1)) / bandCount;
                var segments = 12, segGap = 3;
                var segH = (height - segGap * (segments - 1)) / segments;

                for (var b = 0; b < bandCount; b++) {
                    var val = spectrumBands[b];
                    var litSegs = Math.floor(val * segments + 0.5);
                    var peakSeg = Math.floor(peakHoldVals[b] * segments + 0.5);
                    var bx = left + b * (bandW + bandGap);

                    for (var s = 1; s <= segments; s++) {
                        var sy = top + height - s * segH - (s - 1) * segGap;
                        var isHigh = s >= 10;
                        var isMid = s >= 7 && !isHigh;
                        var segColor = isHigh ? currentPalette.hot : (isMid ? currentPalette.amber : currentPalette.primary);

                        ctx.fillStyle = isHigh ? "rgba(70, 20, 20, 0.35)" : "rgba(18, 55, 48, 0.42)";
                        ctx.globalAlpha = 0.85;
                        ctx.fillRect(bx, sy, bandW, segH);

                        if (s <= litSegs) {
                            ctx.save();
                            ctx.fillStyle = segColor;
                            ctx.globalAlpha = 0.95;
                            ctx.shadowColor = currentPalette.glow;
                            ctx.shadowBlur = VFD_GLOW_RADIUS;
                            ctx.fillRect(bx, sy, bandW, segH);
                            ctx.restore();
                        }

                        if (s === peakSeg && peakSeg > 0) {
                            ctx.save();
                            ctx.fillStyle = currentPalette.accent;
                            ctx.globalAlpha = 1.0;
                            ctx.shadowColor = currentPalette.glow;
                            ctx.shadowBlur = VFD_GLOW_RADIUS + 4;
                            ctx.fillRect(bx, sy, bandW, segH);
                            ctx.restore();
                        }
                    }
                }

                // 4. Stereo L/R Volume Level VU Meters
                var rawVuOffset = (window._currentFullConfig && window._currentFullConfig.vfdVuOffset !== undefined) ? window._currentFullConfig.vfdVuOffset : 0;
                var vuMult = 1.0 + (rawVuOffset * 0.12); // Each step adds/subtracts 12% span (about 10~15% requested)

                var vuX = 1045, vuY = panelY + 80, vuW = 20, vuH = 135;

                var vuL = 0;
                var vuR = 0;

                if (hasBackendAudio) {
                    vuL = clamp(backendVuL * vuMult, 0, 1);
                    vuR = clamp(backendVuR * vuMult, 0, 1);
                } else {
                    var maxOverall = 0;
                    for (var i_spec = 0; i_spec < 32; i_spec++) {
                        if (spectrumBands[i_spec] > maxOverall) {
                            maxOverall = spectrumBands[i_spec];
                        }
                    }
                    var fbVu = clamp(maxOverall * 0.95 * vuMult, 0, 1);
                    vuL = fbVu;
                    vuR = fbVu;
                }

                drawCellBar(vuX, vuY, vuW, vuH, 12, vuL, currentPalette.primary, currentPalette.dim, true);
                drawCellBar(vuX + 28, vuY, vuW, vuH, 12, vuR, currentPalette.primary, currentPalette.dim, true);

                ctx.font = 'bold 9px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.fillText("L", vuX + 7, vuY + vuH + 12);
                ctx.fillText("R", vuX + 35, vuY + vuH + 12);

                ctx.restore();
            }

            var latestTelemetryData = {};
            var latestTelemetryPayload = {};

            function rebuildStaticLayer() {
                if (!staticLayerCtx) return;

                var displayContext = ctx;
                ctx = staticLayerCtx;
                skipPanelFrames = false;
                ctx.clearRect(0, 0, 1120, 520);
                drawVFDPanelFrame(0, 0, 1120, 115, "RPM x1000");
                drawVFDPanelFrame(0, 123, 420, 145, "SPEED");
                drawVFDPanelFrame(430, 123, 210, 145, "GEAR");
                drawVFDPanelFrame(650, 123, 470, 145, "TELEMETRY");
                drawVFDPanelFrame(0, 278, 1120, 235, "AUDIO EQUALIZER");
                ctx = displayContext;
                skipPanelFrames = true;
                staticLayerDirty = false;
            }

            function hasActiveOptimizedAnimation() {
                if (marqueeText.length > 48) return true;
                for (var i = 0; i < 32; i++) {
                    if (spectrumBands[i] > 0.01 || peakHoldVals[i] > 0.01 || peakHoldTicks[i] > 0) {
                        return true;
                    }
                }
                return false;
            }

            function scheduleOptimizedAnimation() {
                if (vfdRenderMode !== 'optimized' || sweepActive || optimizedAnimationTimer || !hasActiveOptimizedAnimation()) {
                    return;
                }

                optimizedAnimationTimer = setTimeout(function () {
                    optimizedAnimationTimer = null;
                    optimizedRadioDirty = true;
                    requestOptimizedRender();
                }, 100);
            }

            function requestOptimizedRender() {
                if (vfdRenderMode !== 'optimized' || optimizedRenderPending || sweepActive) return;
                optimizedRenderPending = true;
                requestAnimationFrame(function () {
                    optimizedRenderPending = false;
                    if (optimizedGaugeDirty || optimizedRadioDirty || staticLayerDirty) {
                        renderVFDSuite(latestTelemetryData, latestTelemetryPayload);
                    }
                });
            }

            function renderVFDSuite(data, payload) {
                if (!ctx) return;

                syncVFDRenderMode();
                if (updateDynamicColors()) staticLayerDirty = true;

                // ── Glow Intensity & Dynamic Waveform Modulated Radius ─────────────────────
                var baseGlowFactor = (window._currentFullConfig && window._currentFullConfig.glowIntensity !== undefined) ? window._currentFullConfig.glowIntensity : 1.0;
                var rpmRatio = (data && data.maxRpm) ? clamp((data.rpm || 0) / data.maxRpm, 0, 1) : 0;
                var spectrumTotal = 0;
                for (var spectrumIndex = 0; spectrumIndex < spectrumBands.length; spectrumIndex++) {
                    spectrumTotal += spectrumBands[spectrumIndex];
                }
                var avgSpectrum = spectrumBands.length ? spectrumTotal / spectrumBands.length : 0;
                var dynamicWaveBoost = Math.max(rpmRatio, avgSpectrum) * 0.5;
                VFD_GLOW_RADIUS = Math.round(9 * baseGlowFactor * (1.0 + dynamicWaveBoost));

                // ── Motion Effect (G-Force Acceleration Shake & Motion Blur) ───────────────
                var currentElements = (window._currentHudElements || (window._currentFullConfig && window._currentFullConfig.elements)) || {};
                var showMotion = currentElements.showMotionEffect !== false;
                var vfdContainer = document.getElementById('vfdContainer');
                if (vfdContainer) {
                    if (showMotion && data) {
                        var rawAccX = data.accel_x !== undefined ? data.accel_x : (data.AccelerationX || 0);
                        var rawAccY = data.accel_y !== undefined ? data.accel_y : (data.AccelerationY || 0);
                        var gX = clamp(-rawAccX / 9.81, -2.5, 2.5);
                        var gY = clamp(rawAccY / 9.81, -2.5, 2.5);

                        // Deadzone filtering: lower than 0.1G produces 0 shift
                        if (Math.abs(gX) < 0.1) gX = 0;
                        if (Math.abs(gY) < 0.1) gY = 0;

                        var targetOffsetX = gX * 12; // 12px shift per G
                        var targetOffsetY = gY * 12;
                        var gMag = Math.sqrt(gX * gX + gY * gY);
                        var targetBlurPx = gMag > 0.8 ? Math.min(3.5, (gMag - 0.8) * 2.0) : 0;

                        // Lerp smooth calculation
                        motionState.currentOffsetX += (targetOffsetX - motionState.currentOffsetX) * 0.2;
                        motionState.currentOffsetY += (targetOffsetY - motionState.currentOffsetY) * 0.2;
                        motionState.currentBlurPx += (targetBlurPx - motionState.currentBlurPx) * 0.2;

                        // Threshold check to avoid ineffective DOM updates
                        var isTransformChanged = Math.abs(motionState.currentOffsetX - motionState.lastAppliedOffsetX) > 0.05 ||
                            Math.abs(motionState.currentOffsetY - motionState.lastAppliedOffsetY) > 0.05;
                        var isFilterChanged = Math.abs(motionState.currentBlurPx - motionState.lastAppliedBlurPx) > 0.05;

                        if (isTransformChanged) {
                            vfdContainer.style.transform = 'translate3d(' + motionState.currentOffsetX.toFixed(2) + 'px, ' + motionState.currentOffsetY.toFixed(2) + 'px, 0px)';
                            motionState.lastAppliedOffsetX = motionState.currentOffsetX;
                            motionState.lastAppliedOffsetY = motionState.currentOffsetY;
                        }

                        if (isFilterChanged) {
                            vfdContainer.style.filter = motionState.currentBlurPx > 0.1 ? 'blur(' + motionState.currentBlurPx.toFixed(2) + 'px)' : 'none';
                            motionState.lastAppliedBlurPx = motionState.currentBlurPx;
                        }
                    } else {
                        vfdContainer.style.transform = 'none';
                        vfdContainer.style.filter = 'none';
                        motionState.currentOffsetX = 0;
                        motionState.currentOffsetY = 0;
                        motionState.lastAppliedOffsetX = 0;
                        motionState.lastAppliedOffsetY = 0;
                        motionState.currentBlurPx = 0;
                        motionState.lastAppliedBlurPx = 0;
                    }
                }

                if (vfdRenderMode === 'optimized' && staticLayerDirty) {
                    rebuildStaticLayer();
                }

                skipPanelFrames = vfdRenderMode === 'optimized';
                ctx.clearRect(0, 0, 1120, 520);
                if (skipPanelFrames) {
                    ctx.drawImage(staticLayerCanvas, 0, 0);
                }
                renderVFDGaugeCluster(data || {}, payload || latestTelemetryPayload || {});
                renderVFDRadioSection();
                skipPanelFrames = false;
                optimizedGaugeDirty = false;
                optimizedRadioDirty = false;
                scheduleOptimizedAnimation();
            }


            // Sweep Animation for Cluster Launch
            var sweepActive = false;
            function triggerSweep() {
                if (sweepActive) return;
                sweepActive = true;
                var startTime = performance.now();
                var duration = 1200;
                var maxRpm = 8000;

                function animate(now) {
                    var elapsed = now - startTime;
                    var progress = Math.min(1.0, elapsed / duration);
                    var mockRpm = 0;
                    if (progress < 0.5) {
                        var p = progress / 0.5;
                        mockRpm = maxRpm * Math.sin(p * Math.PI / 2);
                    } else {
                        var p = (progress - 0.5) / 0.5;
                        mockRpm = maxRpm * (1 - Math.sin(p * Math.PI / 2)) + 1000 * Math.sin(p * Math.PI / 2);
                    }

                    renderVFDSuite({
                        rpm: mockRpm,
                        maxRpm: maxRpm,
                        speed: (mockRpm / maxRpm) * 240,
                        gear: 4,
                        throttle: progress < 0.5 ? progress * 2 : 0,
                        brake: progress >= 0.5 ? (progress - 0.5) * 2 : 0,
                        boost: (mockRpm / maxRpm) * 18
                    }, { redlineRpm: 7200 });

                    if (progress < 1.0) {
                        requestAnimationFrame(animate);
                    } else {
                        sweepActive = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            // ── Continuous 60FPS UI Render Loop & HUDCore Registration ─────────────
            function startContinuousRenderLoop() {
                function renderLoop() {
                    try {
                        if (!sweepActive && vfdRenderMode === 'legacy') {
                            renderVFDSuite(latestTelemetryData, latestTelemetryPayload);
                        }
                    } catch (err) {
                        console.error("VFD Render loop notice:", err);
                    } finally {
                        if (vfdRenderMode === 'legacy') {
                            requestAnimationFrame(renderLoop);
                        } else {
                            setTimeout(renderLoop, 250);
                        }
                    }
                }
                requestAnimationFrame(renderLoop);
            }


            HUDCore.registerStyle('vfd', {
                containerId: 'vfdContainer',
                scaleMultiplier: 0.75,
                onInit: function (payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    if (payload) latestTelemetryPayload = payload;
                    syncVFDRenderMode();
                    optimizedGaugeDirty = true;
                    optimizedRadioDirty = true;
                    requestOptimizedRender();
                },
                onElementsChange: function (elements) {
                    var c = document.getElementById('vfdContainer');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function (data, payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    latestTelemetryData = data || {};
                    latestTelemetryPayload = payload || {};
                    optimizedGaugeDirty = true;
                    requestOptimizedRender();
                },
                onAudio: function (data) {
                    if (data && data.success && Array.isArray(data.spectrum)) {
                        var audioState = data.state || 'live';
                        var isLiveAudio = audioState === 'live' || audioState === 'silence';
                        hasBackendAudio = isLiveAudio && !!data.has_audio;
                        backendVuL = clamp(data.vu_left || 0, 0, 1);
                        backendVuR = clamp(data.vu_right || 0, 0, 1);

                        if (data.spectrum.length === 32) {
                            for (var b = 0; b < 32; b++) {
                                if (isLiveAudio) {
                                    var raw = clamp(data.spectrum[b] || 0, 0, 1);
                                    spectrumBands[b] = spectrumBands[b] * 0.3 + raw * 0.7;
                                } else {
                                    spectrumBands[b] = 0;
                                    peakHoldVals[b] = 0;
                                    peakHoldTicks[b] = 0;
                                }
                            }
                        }
                    } else {
                        hasBackendAudio = false;
                        backendVuL = 0;
                        backendVuR = 0;
                    }
                    optimizedRadioDirty = true;
                    requestOptimizedRender();
                },
                onMedia: function (data) {
                    if (data && data.success) {
                        systemMediaInfo = data;
                        var t = (data.title || "").trim();
                        var a = (data.artist || "").trim();

                        // Filter out our own app title and default placeholders
                        var ownAppTitles = ["fh6-horizon tuner", "horizon tuner", "fh6-horizontuner"];
                        var tLower = t.toLowerCase();
                        var aLower = a.toLowerCase();
                        var isSelfTitle = ownAppTitles.some(function (k) { return tLower.indexOf(k) >= 0 || aLower.indexOf(k) >= 0; });
                        var isPlaying = data.status === "playing";
                        var hasMedia = !isSelfTitle && isPlaying && (t.length > 0 || a.length > 0);

                        systemMediaInfo.has_media = hasMedia;

                        var newMarquee = DEFAULT_MARQUEE;
                        if (hasMedia && (t || a)) {
                            var trackStr = (t && a) ? (a + " - " + t) : (t || a);
                            var cleanStr = sanitizeVFDText(trackStr);
                            newMarquee = cleanStr ? cleanStr : DEFAULT_MARQUEE;
                        }

                        if (newMarquee !== marqueeText) {
                            marqueeText = newMarquee;
                            marqueeScrollPos = 0; // Reset scroll position when track changes
                        }

                        if (!systemMediaInfo.has_media) {
                            if (marqueeText !== DEFAULT_MARQUEE) {
                                marqueeText = DEFAULT_MARQUEE;
                                marqueeScrollPos = 0;
                            }
                        }
                    } else {
                        systemMediaInfo = { has_media: false, title: "", artist: "", status: "idle" };
                        if (marqueeText !== DEFAULT_MARQUEE) {
                            marqueeText = DEFAULT_MARQUEE;
                            marqueeScrollPos = 0;
                        }
                    }
                    optimizedRadioDirty = true;
                    requestOptimizedRender();
                },
                onAnimate: function () {
                    triggerSweep();
                }
            });

            HUDCore.init('vfd');
            startContinuousRenderLoop();

        })();
    </script>
</body>

</html>
