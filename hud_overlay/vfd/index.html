<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>VFD Gauge & Radio HUD Suite</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        @font-face {
            font-family: 'VFDDigits';
            src: url('./assets/fonts/DSEG7Modern-Bold.ttf') format('truetype');
        }
        @font-face {
            font-family: 'VFDAlpha';
            src: url('./assets/fonts/DSEG14Modern-Regular.ttf') format('truetype');
        }
        .vfd-container {
            width: 1120px;
            height: 480px;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 1120px;
            height: 480px;
        }
    </style>
</head>

<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container vfd-container" id="vfdContainer">
            <canvas id="vfdCanvas" width="1120" height="480"></canvas>
        </div>
    </div>

    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var canvas = document.getElementById('vfdCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;

            // ── VFD Phosphor Glow Tuning Config ─────────────────────────────────────
            var VFD_GLOW_CONFIG = {
                bloom: 1.0,
                glowRadius: 8,
                palette: {
                    Aqua: { primary: "#8ffff0", accent: "#d2fff9", dim: "#183b38", hot: "#ff584d" },
                    Amber: { primary: "#ffc15a", accent: "#ffe5ad", dim: "#493719", hot: "#ff4b3f" },
                    Green: { primary: "#78ff91", accent: "#d4ffdc", dim: "#193f21", hot: "#ff5548" },
                    Ice: { primary: "#b9e8ff", accent: "#f3fbff", dim: "#203744", hot: "#ff6170" }
                }
            };

            var isMetricUnit = true;
            var currentPalette = VFD_GLOW_CONFIG.palette.Aqua;

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function drawPanel(x, y, w, h) {
                ctx.save();
                ctx.fillStyle = '#081411';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = currentPalette.primary;
                ctx.globalAlpha = 0.3;
                ctx.lineWidth = 1.2;
                ctx.strokeRect(x, y, w, h);
                ctx.restore();
            }

            function drawCellBar(x, y, w, h, count, value, color, dimColor) {
                var gap = 3;
                var cellW = (w - gap * (count - 1)) / count;
                var lit = Math.floor(clamp(value, 0, 1) * count + 0.5);

                for (var i = 1; i <= count; i++) {
                    var cellX = x + (i - 1) * (cellW + gap);
                    ctx.fillStyle = dimColor;
                    ctx.globalAlpha = 0.42;
                    ctx.fillRect(cellX, y, cellW, h);

                    if (i <= lit) {
                        ctx.save();
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.9;
                        ctx.shadowColor = color;
                        ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                        ctx.fillRect(cellX, y, cellW, h);
                        ctx.restore();
                    }
                }
            }

            function renderVFDGauge(data) {
                var maxRpm = Math.max(1000, data.maxRpm || data.max_rpm || 8500);
                var rpm = Math.max(0, data.rpm || 0);
                var mps = data.SpeedMetersPerSecond || 0;
                var speed = Math.floor(clamp(isMetricUnit ? (data.speed_kmh || data.speed || mps * 3.6) : (data.speed_mph || mps * 2.23694), 0, 999) + 0.5);
                var gearVal = data.gear;
                var gearLabel = gearVal === 0 ? 'R' : (gearVal === 11 ? 'N' : (gearVal !== undefined ? String(gearVal) : '1'));

                // 1. Top RPM Bar Panel
                drawPanel(0, 0, 1120, 82);

                ctx.save();
                ctx.font = 'bold 14px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.fillText("RPM x1000", 18, 28);

                // RPM Ticks
                var x = 170, y = 37, w = 930, count = 64, gap = 2;
                var cellW = (w - gap * (count - 1)) / count;
                var rpmRatio = clamp(rpm / maxRpm, 0, 1);
                var lit = Math.floor(rpmRatio * count + 0.5);
                var redlineCell = Math.floor(0.9 * count + 0.5);

                for (var i = 1; i <= count; i++) {
                    var cellX = x + (i - 1) * (cellW + gap);
                    var isHot = i >= redlineCell;
                    var activeColor = isHot ? currentPalette.hot : currentPalette.primary;

                    ctx.fillStyle = isHot ? "#4b1917" : currentPalette.dim;
                    ctx.globalAlpha = 0.48;
                    ctx.fillRect(cellX, y, cellW, 24);

                    if (i <= lit) {
                        ctx.save();
                        ctx.fillStyle = activeColor;
                        ctx.shadowColor = activeColor;
                        ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                        ctx.fillRect(cellX, y, cellW, 24);
                        ctx.restore();
                    }
                }
                ctx.restore();

                // 2. Gear Panel
                drawPanel(0, 94, 170, 164);
                ctx.save();
                ctx.font = 'bold 13px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.textAlign = 'center';
                ctx.fillText("GEAR", 85, 115);

                ctx.font = 'bold 92px VFDDigits, monospace, sans-serif';
                ctx.fillStyle = currentPalette.dim;
                ctx.globalAlpha = 0.17;
                ctx.fillText("8", 85, 205);

                ctx.fillStyle = currentPalette.accent;
                ctx.globalAlpha = 1.0;
                ctx.shadowColor = currentPalette.accent;
                ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                ctx.fillText(gearLabel, 85, 205);
                ctx.restore();

                // 3. Velocity / Speed Panel
                drawPanel(184, 94, 440, 164);
                ctx.save();
                ctx.font = 'bold 13px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.fillText("VELOCITY", 204, 115);

                ctx.font = 'bold 98px VFDDigits, monospace, sans-serif';
                ctx.fillStyle = currentPalette.dim;
                ctx.globalAlpha = 0.14;
                ctx.textAlign = 'right';
                ctx.fillText("888", 520, 200);

                ctx.fillStyle = currentPalette.accent;
                ctx.globalAlpha = 1.0;
                ctx.shadowColor = currentPalette.accent;
                ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                ctx.fillText(speed.toString(), 520, 200);

                ctx.font = 'bold 17px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.shadowBlur = 0;
                ctx.fillText(isMetricUnit ? "KM/H" : "MPH", 542, 195);

                // Throttle & Brake Bars
                ctx.font = 'bold 11px VFDAlpha, sans-serif';
                ctx.fillText("THR", 204, 245);
                drawCellBar(244, 238, 150, 10, 10, data.throttle || 0, currentPalette.primary, currentPalette.dim);

                ctx.fillText("BRK", 408, 245);
                drawCellBar(450, 238, 150, 10, 10, data.brake || 0, currentPalette.hot, currentPalette.dim);
                ctx.restore();

                // 4. Engine RPM & Fuel Panel
                drawPanel(638, 94, 482, 164);
                ctx.save();
                ctx.font = 'bold 13px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.fillText("ENGINE RPM", 658, 115);

                ctx.font = 'bold 43px VFDDigits, monospace, sans-serif';
                ctx.fillStyle = currentPalette.dim;
                ctx.globalAlpha = 0.14;
                ctx.textAlign = 'right';
                ctx.fillText("88888", 1098, 155);

                ctx.fillStyle = currentPalette.primary;
                ctx.globalAlpha = 1.0;
                ctx.shadowColor = currentPalette.primary;
                ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                ctx.fillText(('00000' + Math.round(rpm)).slice(-5), 1098, 155);
                ctx.restore();
            }

            function renderVFDRadioSpectrum(time) {
                var now = time || (performance.now() / 1000);
                var panelY = 275;
                drawPanel(0, panelY, 1120, 185);

                ctx.save();

                // Radio Header & Track Marquee
                ctx.font = 'bold 14px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.primary;
                ctx.shadowColor = currentPalette.primary;
                ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                ctx.fillText("VFD AUDIO MONITOR / RADIO SPECTRUM", 18, panelY + 25);

                ctx.font = 'bold 26px VFDAlpha, sans-serif';
                ctx.fillStyle = currentPalette.accent;
                ctx.shadowColor = currentPalette.accent;
                ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                ctx.fillText("FORZA HORIZON 6 SOUNDTRACK  /  RADIO ETIENNE", 18, panelY + 60);

                // 28 Bands Audio Spectrum Bar
                var left = 18, top = panelY + 80, width = 1084, height = 75;
                var bandCount = 36;
                var bandGap = 4;
                var bandW = (width - bandGap * (bandCount - 1)) / bandCount;
                var segments = 7, segGap = 2;
                var segH = (height - segGap * (segments - 1)) / segments;

                for (var b = 0; b < bandCount; b++) {
                    var wave = 0.5 + 0.5 * Math.sin(now * 3.2 + b * 0.55);
                    var shape = 0.45 + 0.55 * Math.sin((b + 1) / bandCount * Math.PI);
                    var val = clamp(0.16 + wave * shape * 0.77, 0, 1);
                    var lit = Math.floor(val * segments + 0.5);
                    var bx = left + b * (bandW + bandGap);

                    for (var s = 1; s <= segments; s++) {
                        var sy = top + height - s * segH - (s - 1) * segGap;
                        ctx.fillStyle = currentPalette.dim;
                        ctx.globalAlpha = 0.35;
                        ctx.fillRect(bx, sy, bandW, segH);

                        if (s <= lit) {
                            ctx.save();
                            ctx.fillStyle = currentPalette.primary;
                            ctx.globalAlpha = 0.9;
                            ctx.shadowColor = currentPalette.primary;
                            ctx.shadowBlur = VFD_GLOW_CONFIG.glowRadius;
                            ctx.fillRect(bx, sy, bandW, segH);
                            ctx.restore();
                        }
                    }
                }

                ctx.restore();
            }

            function renderVFDSuite(data, time) {
                if (!ctx) return;
                ctx.clearRect(0, 0, 1120, 480);
                renderVFDGauge(data);
                renderVFDRadioSpectrum(time);
            }

            var sweepActive = false;
            function triggerSweep() {
                if (sweepActive) return;
                sweepActive = true;
                var startTime = performance.now();
                var duration = 1200;
                var maxRpm = 8000;

                function animate(now) {
                    var elapsed = now - startTime;
                    var progress = Math.min(1.0, elapsed / duration);
                    var mockRpm = 0;
                    if (progress < 0.5) {
                        var p = progress / 0.5;
                        mockRpm = maxRpm * Math.sin(p * Math.PI / 2);
                    } else {
                        var p = (progress - 0.5) / 0.5;
                        mockRpm = maxRpm * (1 - Math.sin(p * Math.PI / 2)) + 1000 * Math.sin(p * Math.PI / 2);
                    }

                    renderVFDSuite({
                        rpm: mockRpm,
                        maxRpm: maxRpm,
                        speed: (mockRpm / maxRpm) * 220,
                        gear: 4,
                        throttle: progress < 0.5 ? progress * 2 : 0,
                        brake: progress >= 0.5 ? (progress - 0.5) * 2 : 0
                    }, elapsed / 1000);

                    if (progress < 1.0) {
                        requestAnimationFrame(animate);
                    } else {
                        sweepActive = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            HUDCore.registerStyle('vfd', {
                containerId: 'vfdContainer',
                scaleMultiplier: 0.75,
                onInit: function (payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                },
                onElementsChange: function (elements) {
                    var c = document.getElementById('vfdContainer');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function (data, payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    if (!sweepActive) renderVFDSuite(data);
                },
                onAnimate: function () {
                    triggerSweep();
                }
            });

            HUDCore.init('vfd');
            setTimeout(triggerSweep, 100);
        })();
    </script>
</body>

</html>
