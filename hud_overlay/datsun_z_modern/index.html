<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedhut Datsun 240Z Modern LED Gauge</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .datsun-modern-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 299px;
            height: 300px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container datsun-modern-container" id="datsunModernContainer">
            <canvas id="datsunModernCanvas" width="299" height="300"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('datsunModernCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('datsunModernContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/clean_base.png';

            var telemetry = {
                speed: 142,
                rpm: 6200,
                maxRpm: 10000,
                redline: 7500,
                gear: 4,
                fuel: 0.75
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function drawNeedle(cx, cy, len, angleDeg, color, width, hubR) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;

                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 6;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                if (hubR) {
                    ctx.fillStyle = '#1c1c1e';
                    ctx.beginPath();
                    ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean base
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 299, 300);
                }

                var cx = 150;
                var cy = 150;

                // 2. Main Tachometer Needle (150, 150), radius 110 (135..405 deg)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                var tachAngle = 135.0 + rpmRatio * 270.0;
                drawNeedle(cx, cy, 105, tachAngle, '#ff3322', 3.2, 18);

                // 3. Shift Warning LED (Top Right: 255, 52)
                var isShift = telemetry.rpm >= telemetry.redline;
                if (isShift) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(255, 52, 14, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff2211';
                    ctx.shadowColor = '#ff1100';
                    ctx.shadowBlur = 18;
                    ctx.fill();
                    ctx.restore();
                }

                // 4. Fuel Subdial on Right (235, 148), radius 24 (E..F, 225..315 deg)
                var fuelRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                var fuelAngle = 225.0 + fuelRatio * 90.0;
                drawNeedle(235, 148, 22, fuelAngle, '#ff3322', 2.0, 10);

                // 5. Digital Speedometer LCD (152, 222)
                ctx.save();
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 36px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowBlur = 6;
                ctx.fillText(String(Math.round(telemetry.speed)), 152, 230);

                // 6. Digital Gear LCD (242, 240)
                ctx.font = 'bold 34px "Consolas", monospace';
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 242, 252);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('datsun_z_modern', {
                containerId: 'datsunModernContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (data.fuel_level !== undefined) telemetry.fuel = Number(data.fuel_level);
                    if (payload && payload.redlineRpm !== undefined) telemetry.redline = Number(payload.redlineRpm);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 9400;
                        telemetry.speed = wave * 220;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('datsun_z_modern');
            render();
        })();
    </script>
</body>
</html>
