<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedhut Datsun 240Z Modern LED Gauge</title>
    <!--
      [設計決策紀錄 / Design Decision Note]
      1. 視覺固定單位 (Hardcoded km/h): 錶面中央 LCD 下方已原生刻印 "km/h"，故數位車速讀數強制綁定 data.speed_kmh（忽視外部英里單位設定）。
      2. 底圖去針與雙軸幾何校準: 底圖透過 7 幀全狀態中位數去針完全消除 3/4 油量針殘影；
         主轉速錶 (0..10k RPM) 為 125°..310°，右側油量小錶 (E..F) 為 90°..270°。
      3. 水溫/油溫/油壓: 此錶頭僅含轉速、數位時速、檔位與油量；同系列若涉及水溫統一取自四輪平均胎溫 (TireTemp)，油溫與油壓則採確定性代理模型。
    -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .datsun-modern-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 299px;
            height: 300px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container datsun-modern-container" id="datsunModernContainer">
            <canvas id="datsunModernCanvas" width="299" height="300"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('datsunModernCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('datsunModernContainer');

            var baseImg = HUDArtwork.loadImage('assets/clean_base.png');

            var telemetry = {
                speedKmh: 0,
                rpm: 0,
                maxRpm: 10000,
                redline: 7500,
                gear: 'N',
                fuel: 0.75
            };

            function formatGear(g) {
                if (g === 0 || g === 'R') return 'R';
                if (g === 11 || g === 'N') return 'N';
                var n = Number(g);
                if (Number.isInteger(n) && n >= 1 && n <= 10) return String(n);
                return 'N';
            }

            function drawNeedle(cx, cy, len, angleDeg, color, width, hubR) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;
                var tx = cx - Math.cos(rad) * (hubR ? hubR * 0.7 : 10);
                var ty = cy - Math.sin(rad) * (hubR ? hubR * 0.7 : 10);

                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 5;

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                if (hubR) {
                    ctx.fillStyle = '#1c1d22';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function render() {
                var w = 299;
                var h = 300;
                ctx.clearRect(0, 0, w, h);

                if (baseImg.complete && baseImg.naturalWidth > 0) {
                    ctx.drawImage(baseImg, 0, 0, 299, 300);
                }

                var cx = 148;
                var cy = 150;

                // 1. Main Tachometer Needle: hub (148, 150), 0..10k RPM -> 125..310 deg
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / 10000.0));
                var tachAngle = 125.0 + rpmRatio * 185.0;
                drawNeedle(cx, cy, 114, tachAngle, '#ff3322', 3.4, 21);

                // 2. Shift Warning LED (Top Right: 277, 29)
                var isShift = telemetry.rpm >= telemetry.redline;
                if (isShift) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(277, 29, 12, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff2211';
                    ctx.shadowColor = '#ff1100';
                    ctx.shadowBlur = 16;
                    ctx.fill();
                    ctx.restore();
                }

                // 3. Fuel Subdial on Right: hub (250, 150), E..F -> 90..270 deg
                var fuelRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                var fuelAngle = 90.0 + fuelRatio * 180.0;
                drawNeedle(250, 150, 34, fuelAngle, '#ff3322', 2.4, 14);

                // 4. Digital Speedometer LCD (Center box above 'km/h': 150, 240)
                ctx.save();
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 36px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.65)';
                ctx.shadowBlur = 5;
                ctx.fillText(String(Math.round(telemetry.speedKmh)), 150, 240);

                // 5. Digital Gear LCD (Bottom-right box: 251, 267)
                ctx.font = 'bold 36px "Consolas", monospace';
                ctx.fillText(telemetry.gear, 251, 267);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('datsun_z_modern', {
                containerId: 'datsunModernContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed_kmh !== undefined) {
                        telemetry.speedKmh = Math.abs(Number(data.speed_kmh)) || 0;
                    } else if (data.speed !== undefined) {
                        telemetry.speedKmh = Math.abs(Number(data.speed)) || 0;
                    }
                    if (data.rpm !== undefined) telemetry.rpm = Math.max(0, Number(data.rpm) || 0);
                    if (data.gear !== undefined) telemetry.gear = formatGear(data.gear);
                    if (data.fuel_ratio !== undefined) {
                        telemetry.fuel = Number(data.fuel_ratio);
                    } else if (data.fuel_level !== undefined) {
                        telemetry.fuel = Number(data.fuel_level);
                    }
                    if (payload && payload.redlineRpm !== undefined && payload.redlineRpm > 0) {
                        telemetry.redline = Number(payload.redlineRpm);
                    } else if (data.redlineRpm !== undefined && data.redlineRpm > 0) {
                        telemetry.redline = Number(data.redlineRpm);
                    }
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 9600;
                        telemetry.speedKmh = wave * 250;
                        telemetry.fuel = wave;
                        telemetry.gear = wave > 0.5 ? '4' : '1';
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('datsun_z_modern');
            render();
        })();
    </script>
</body>
</html>
