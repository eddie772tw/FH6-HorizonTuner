<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>S650 HMI</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        @font-face {
            font-family: 'MustangModernDigits';
            src: url('../shared/assets/fonts/HelveticaNowDisplay-CnMedIt.otf') format('opentype');
        }
        @font-face {
            font-family: 'FoxBodyRetro';
            src: url('../shared/assets/fonts/VT323-Regular.otf') format('opentype');
        }
        @font-face {
            font-family: 'MustangHeritage1967';
            src: url('../shared/assets/fonts/HelveticaNowDisplay-CnIta.otf') format('opentype');
        }
        @font-face {
            font-family: 'SVTCobraBold';
            src: url('../shared/assets/fonts/HelveticaNowDisplay-CnMedIt.otf') format('opentype');
        }

        .s650-container {
            align-self: center;
            transform-origin: bottom center;
            width: 1260px;
            height: 240px;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 1260px;
            height: 240px;
        }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container s650-container" id="s650Container">
            <canvas id="s650Canvas" width="1260" height="240"></canvas>
        </div>
    </div>
    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script src="./assets/s650_renderer.js"></script>
    <script>
        window.registerS650Style('s650_hmi');
    </script>
</body>
</html>
