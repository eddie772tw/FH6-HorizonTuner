<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline R34 MFD HUD</title>
  <link rel="stylesheet" href="../shared/hud-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-root-wrapper"><div id="r34Container" class="hud-gauge-container r34-cockpit" data-lighting="night">
    <svg id="r34Paints" class="r34-paint-defs" width="0" height="0" aria-hidden="true"></svg>
    <section class="r34-mfd" id="r34Mfd" aria-label="R34 expansion MFD">
      <div class="r34-screen" id="r34Screen">
        <span id="r34ModeTitle" class="r34-a11y">SINGLE</span>
        <div class="r34-page" data-mode="single">
          <div class="r34-memory">
            <span id="r34HistoryUnit" class="r34-history-unit">bar</span>
            <div id="r34HistoryLabels" class="r34-history-labels" aria-hidden="true"></div>
            <canvas id="r34History" width="101" height="109" aria-label="Last 30 seconds of received boost telemetry"></canvas>
            <div class="r34-axis-label" aria-hidden="true"><span>30</span><span>20</span><span>10</span><span>0</span></div><span class="r34-history-seconds">sec</span>
          </div><div id="r34SingleDial" class="r34-dial"></div>
        </div>
        <div class="r34-page" data-mode="twin" hidden><div id="r34TwinBoost" class="r34-dial"></div><div id="r34TwinRpm" class="r34-dial"></div></div>
        <div class="r34-page r34-multi" data-mode="multi" hidden id="r34Multi"></div>
        <div class="r34-page r34-g-page" data-mode="g" hidden><canvas id="r34G" width="256" height="126" aria-label="Rectangular lateral and longitudinal acceleration grid"></canvas><div class="r34-g-values"><span id="r34Lateral">LAT — g</span><span id="r34Longitudinal">LONG — g</span></div></div>
        <div class="r34-page r34-lap-page" data-mode="lap" hidden><div class="r34-lap-readings"><label>LAP <span id="r34LapNumber">—</span></label><strong id="r34CurrentLap">—'——.———</strong><label>BEST</label><strong id="r34BestLap">—'——.———</strong><label>LAST</label><strong id="r34LastLap">—'——.———</strong></div><div class="r34-lap-history"><div>LAP <span>TIME</span></div><ol id="r34LapList"></ol></div></div>
      </div>
      <span id="r34ModeNote" class="r34-a11y">30 s trace · session peak</span>
    </section>
    <section id="r34Cluster" class="r34-cluster" aria-label="R34 core dials with boost and tire temperature">
      <div id="r34TachModule" class="r34-gauge"></div><div id="r34SpeedModule" class="r34-gauge"></div>
      <div id="r34BoostModule" class="r34-gauge"></div><div id="r34TempModule" class="r34-gauge"></div>
    </section>
    <span id="r34Status" class="r34-a11y">WAITING</span>
    <div id="r34ClusterNote" class="r34-scale-note"></div>
    <div id="r34StreamStatus" class="r34-stream-status" aria-live="polite">WAITING FOR TELEMETRY</div>
  </div></div>
  <script src="../shared/hud-core.js"></script><script src="model.js"></script><script src="canvas-geometry.js"></script>
  <script src="layout.js"></script><script src="artwork.js"></script><script src="cluster-art.js"></script>
  <script src="instruments.js"></script><script src="renderer.js"></script><script src="controller.js"></script>
</body>
</html>
