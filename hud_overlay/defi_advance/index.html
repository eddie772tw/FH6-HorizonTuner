<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defi Advance BF Tachometer</title>
    <!--
      [設計決策紀錄 / Design Decision Note]
      1. 視覺刻度與指針校準: Defi Advance BF 0..11,000 RPM 錶盤刻度由 90° (6 點鐘) 順時針掃掠 270° 至 360° (3 點鐘)，
         修正舊版 135°..405° 的 45° 相位偏移。
      2. 檔位映射 (Gear Contract): 遵循 coordinator.js 契約 (0='R', 11='N', 1..10='1'..'10')。
      3. 水溫/油溫/油壓: 此單體轉速錶不含水溫與油壓視窗；同系列複合儀表若涉及水溫統一取自四輪平均胎溫 (TireTemp)，
         油溫與油壓則採確定性熱力學與油壓代理模型。
    -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .defi-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 344px;
            height: 340px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container defi-container" id="defiContainer">
            <canvas id="defiCanvas" width="344" height="340"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('defiCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('defiContainer');

            var baseImg = HUDArtwork.loadImage('assets/clean_base.png');

            var telemetry = {
                speed: 0,
                rpm: 0,
                maxRpm: 11000,
                redline: 8200,
                gear: 'N'
            };

            function formatGear(g) {
                if (g === 0 || g === 'R') return 'R';
                if (g === 11 || g === 'N') return 'N';
                var n = Number(g);
                if (Number.isInteger(n) && n >= 1 && n <= 10) return String(n);
                return 'N';
            }

            function drawNeedle(cx, cy, len, angleDeg) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;
                var tx = cx - Math.cos(rad) * 18;
                var ty = cy - Math.sin(rad) * 18;

                ctx.save();
                ctx.strokeStyle = '#ff2233';
                ctx.lineWidth = 3.8;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'rgba(255, 34, 51, 0.9)';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                ctx.fillStyle = '#14171f';
                ctx.strokeStyle = '#ff2233';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(cx, cy, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function render() {
                var w = 344;
                var h = 340;
                ctx.clearRect(0, 0, w, h);

                if (baseImg.complete && baseImg.naturalWidth > 0) {
                    ctx.drawImage(baseImg, 0, 0, 344, 340);
                }

                var cx = 172;
                var cy = 170;

                // 0 RPM = 90 deg (6 o'clock), 11,000 RPM = 360 deg (3 o'clock)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / 11000.0));
                var tachAngle = 90.0 + rpmRatio * 270.0;
                drawNeedle(cx, cy, 128, tachAngle);

                // Shift Warning LED (Top Left: 49, 46)
                var isShift = telemetry.rpm >= telemetry.redline;
                if (isShift) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(49, 46, 13, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff1122';
                    ctx.shadowColor = '#ff0011';
                    ctx.shadowBlur = 18;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(49, 46, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffcccc';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.restore();
                }

                // Digital Gear (Top Right LCD box: 302, 55)
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 34px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
                ctx.shadowBlur = 6;
                ctx.fillText(telemetry.gear, 302, 55);

                // Digital Speed (Bottom Right LCD box: 247, 282)
                ctx.font = 'bold 42px "Consolas", monospace';
                ctx.fillText(String(Math.round(telemetry.speed)), 247, 282);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('defi_advance', {
                containerId: 'defiContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Math.abs(Number(data.speed)) || 0;
                    if (data.rpm !== undefined) telemetry.rpm = Math.max(0, Number(data.rpm) || 0);
                    if (data.gear !== undefined) telemetry.gear = formatGear(data.gear);
                    if (payload && payload.redlineRpm !== undefined && payload.redlineRpm > 0) {
                        telemetry.redline = Number(payload.redlineRpm);
                    } else if (data.redlineRpm !== undefined && data.redlineRpm > 0) {
                        telemetry.redline = Number(data.redlineRpm);
                    }
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 10800;
                        telemetry.speed = wave * 250;
                        telemetry.gear = wave > 0.5 ? '4' : '1';
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('defi_advance');
            render();
        })();
    </script>
</body>
</html>
