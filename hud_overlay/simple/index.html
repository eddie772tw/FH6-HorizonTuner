<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple HUD</title>
    <!-- Include Shared Base HUD Styles -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        :root {
            --simple-primary-color: #00f0ff;
            --simple-primary-rgba: rgba(0, 240, 255, 0.9);
            --simple-primary-dim: rgba(0, 240, 255, 0.4);
            --simple-hot-color: #ff0088;
            --simple-hot-rgba: rgba(255, 0, 136, 0.9);
            --simple-hot-dim: rgba(255, 0, 136, 0.8);
        }

        /* ── Text Overlays (NFSU2 Style) ─────────────────────────────────────── */
        .speed-text {
            position: absolute;
            bottom: 90px; right: 40px;
            font-size: 130px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700;
            font-family: 'ForzaGear', Arial, sans-serif;
            letter-spacing: 0.05em;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8), 3px 3px 5px var(--simple-primary-dim);
            pointer-events: none;
        }
        .speed-text span { display: inline-block; width: 1ch; text-align: center; }

        .speed-unit {
            position: absolute;
            bottom: 50px; right: 45px;
            font-size: 42px;
            color: var(--simple-primary-rgba);
            font-family: 'ForzaGear', Arial, sans-serif;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .gear-text {
            position: absolute;
            top: 310px; right: 180px;
            font-size: 95px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 900;
            font-family: 'ForzaGear', Arial, sans-serif;
            letter-spacing: 0.05em;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .gear-indicator {
            position: absolute;
            top: 275px; right: 195px;
            width: 0; height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 35px solid var(--simple-hot-rgba);
            opacity: 0;
            transition: opacity 0.1s, transform 0.1s;
            filter: drop-shadow(0 0 8px var(--simple-hot-dim));
            pointer-events: none;
        }
        .gear-indicator.active { opacity: 1; transform: scale(1.15); }

        .lc-badge {
            position: absolute;
            top: 280px; left: 160px;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 0, 136, 0.25);
            border: 1px solid rgba(255, 0, 136, 0.7);
            color: #ff0088;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 0, 136, 0.4);
        }
        .lc-badge.active { opacity: 1; }

        .lock-badge {
            position: absolute;
            top: 325px; left: 160px;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(255, 50, 50, 0.25);
            border: 1px solid rgba(255, 50, 50, 0.7);
            color: #ff5555;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.4);
        }
        .lock-badge.active { opacity: 1; }
    </style>
</head>

<body>
    <div class="hud-root-wrapper" id="simpleWrapper">
        <!-- Main Simple HUD Gauge Container -->
        <div class="hud-gauge-container" id="simpleContainer" style="width: 750px; height: 750px;">
            <img src="./Tachometer.png" id="tachBgImg"
                 style="position:absolute; top:65px; left:65px; width:621px; height:621px; pointer-events:none; opacity:0.9;" />
            <canvas id="simpleCanvas" width="750" height="750"></canvas>
            
            <div class="lc-badge" id="lcBadge">LC</div>
            <div class="lock-badge" id="lockBadge">LOCK</div>
            <div class="gear-indicator" id="gearIndicator"></div>
            <div class="gear-text" id="gearText">1</div>
            <div class="speed-text" id="speedText">0</div>
            <div class="speed-unit" id="speedUnit">KM/H</div>
        </div>
    </div>

    <!-- Include Shared Modules -->
    <script src="../shared/hud-core.js"></script>

    <script>
        var canvas = document.getElementById('simpleCanvas');
        var ctx = canvas ? canvas.getContext('2d') : null;
        var _simpleValidGear = 1;
        window.simpleSweepActive = false;

        // Optimization: Cache DOM lookups used in 60Hz high-frequency render loops.
        // Calling document.getElementById repeatedly causes unnecessary CPU overhead.
        var domCache = {
            simpleCanvas: canvas,
            speedText: document.getElementById('speedText'),
            simpleContainer: document.getElementById('simpleContainer'),
            speedUnit: document.getElementById('speedUnit'),
            tachBgImg: document.getElementById('tachBgImg'),
            gearText: document.getElementById('gearText'),
            gearIndicator: document.getElementById('gearIndicator'),
            lockBadge: document.getElementById('lockBadge'),
            lcBadge: document.getElementById('lcBadge')
        };

        var defaultColorPrimary = '#00f0ff';
        var defaultColorPrimaryRgba = 'rgba(0, 240, 255, 0.9)';
        var defaultColorPrimaryDim = 'rgba(0, 240, 255, 0.4)';
        var defaultColorHot = '#ff0088';
        var defaultColorHotRgba = 'rgba(255, 0, 136, 0.9)';

        var CURRENT_PRIMARY = defaultColorPrimary;
        var CURRENT_PRIMARY_RGBA = defaultColorPrimaryRgba;
        var CURRENT_HOT = defaultColorHot;
        var CURRENT_HOT_RGBA = defaultColorHotRgba;

        function hexToRgba(hex, alpha) {
            var c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c = hex.substring(1).split('');
                if(c.length === 3){
                    c= [c[0], c[0], c[1], c[1], c[2], c[2]];
                }
                c = '0x' + c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
            }
            return 'rgba(255,255,255,'+alpha+')';
        }

        var _lastAppliedPrimary = null;

        function updateDynamicColors() {
            var customColor = window._currentCustomColor;
            var useDefault = window._currentUseDefaultColors !== false;
            var targetColor = (!useDefault && customColor) ? customColor : defaultColorPrimary;

            if (targetColor !== _lastAppliedPrimary) {
                _lastAppliedPrimary = targetColor;

                if (!useDefault && customColor) {
                    CURRENT_PRIMARY = customColor;
                    CURRENT_PRIMARY_RGBA = hexToRgba(customColor, 0.9);
                    var cDim = hexToRgba(customColor, 0.4);

                    document.documentElement.style.setProperty('--simple-primary-color', customColor);
                    document.documentElement.style.setProperty('--simple-primary-rgba', CURRENT_PRIMARY_RGBA);
                    document.documentElement.style.setProperty('--simple-primary-dim', cDim);
                } else {
                    CURRENT_PRIMARY = defaultColorPrimary;
                    CURRENT_PRIMARY_RGBA = defaultColorPrimaryRgba;

                    document.documentElement.style.setProperty('--simple-primary-color', defaultColorPrimary);
                    document.documentElement.style.setProperty('--simple-primary-rgba', defaultColorPrimaryRgba);
                    document.documentElement.style.setProperty('--simple-primary-dim', defaultColorPrimaryDim);
                }
            }
        }

        var motionState = {
            currentOffsetX: 0,
            currentOffsetY: 0,
            currentBlurPx: 0,
            lastAppliedOffsetX: 0,
            lastAppliedOffsetY: 0,
            lastAppliedBlurPx: 0
        };

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        var _simpleLastSpeedValue = null;

        function setSimpleSpeedDisplay(value) {
            if (_simpleLastSpeedValue === value) return;
            _simpleLastSpeedValue = value;
            var el = domCache.speedText;
            if (!el) return;
            var valStr = value.toString();

            while (el.children.length < valStr.length) {
                var span = document.createElement('span');
                el.appendChild(span);
            }
            while (el.children.length > valStr.length) {
                el.removeChild(el.lastChild);
            }
            for (var i = 0; i < valStr.length; i++) {
                if (el.children[i].textContent !== valStr[i]) {
                    el.children[i].textContent = valStr[i];
                }
            }
        }

        function drawSimpleHUD(data, redlineRpm) {
            if (!ctx) return;
            updateDynamicColors();

            var currentElements = (window._currentHudElements || (window._currentFullConfig && window._currentFullConfig.elements)) || {};
            var showMotion = currentElements.showMotionEffect !== false;
            var simpleContainer = domCache.simpleContainer;
            if (simpleContainer) {
                if (showMotion && data) {
                    var rawAccX = data.accel_x !== undefined ? data.accel_x : (data.AccelerationX || 0);
                    var rawAccY = data.accel_y !== undefined ? data.accel_y : (data.AccelerationY || 0);
                    var gX = clamp(-rawAccX / 9.81, -2.5, 2.5);
                    var gY = clamp(rawAccY / 9.81, -2.5, 2.5);

                    if (Math.abs(gX) < 0.1) gX = 0;
                    if (Math.abs(gY) < 0.1) gY = 0;

                    var targetOffsetX = gX * 12;
                    var targetOffsetY = gY * 12;
                    var gMag = Math.sqrt(gX * gX + gY * gY);
                    var targetBlurPx = gMag > 0.8 ? Math.min(3.5, (gMag - 0.8) * 2.0) : 0;

                    motionState.currentOffsetX += (targetOffsetX - motionState.currentOffsetX) * 0.2;
                    motionState.currentOffsetY += (targetOffsetY - motionState.currentOffsetY) * 0.2;
                    motionState.currentBlurPx += (targetBlurPx - motionState.currentBlurPx) * 0.2;

                    var isTransformChanged = Math.abs(motionState.currentOffsetX - motionState.lastAppliedOffsetX) > 0.05 ||
                                             Math.abs(motionState.currentOffsetY - motionState.lastAppliedOffsetY) > 0.05;
                    var isFilterChanged = Math.abs(motionState.currentBlurPx - motionState.lastAppliedBlurPx) > 0.05;

                    if (isTransformChanged) {
                        simpleContainer.style.transform = 'translate3d(' + motionState.currentOffsetX.toFixed(2) + 'px, ' + motionState.currentOffsetY.toFixed(2) + 'px, 0px)';
                        motionState.lastAppliedOffsetX = motionState.currentOffsetX;
                        motionState.lastAppliedOffsetY = motionState.currentOffsetY;
                    }

                    if (isFilterChanged) {
                        simpleContainer.style.filter = motionState.currentBlurPx > 0.1 ? 'blur(' + motionState.currentBlurPx.toFixed(2) + 'px)' : 'none';
                        motionState.lastAppliedBlurPx = motionState.currentBlurPx;
                    }
                } else {
                    simpleContainer.style.transform = 'none';
                    simpleContainer.style.filter = 'none';
                    motionState.currentOffsetX = 0;
                    motionState.currentOffsetY = 0;
                    motionState.lastAppliedOffsetX = 0;
                    motionState.lastAppliedOffsetY = 0;
                    motionState.currentBlurPx = 0;
                    motionState.lastAppliedBlurPx = 0;
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            var centerX = 375, centerY = 375, radius = 250;
            var rpm = data.rpm || 0;
            var maxRpm = data.maxRpm || 8000;
            var redline = redlineRpm || (maxRpm * 0.92);

            var startAngle = Math.PI * 0.75;
            var endAngle = Math.PI * 2.25;
            var totalSweep = endAngle - startAngle;

            var rpmRatio = Math.max(0, Math.min(1, rpm / maxRpm));
            var currentAngle = startAngle + rpmRatio * totalSweep;
            var redlineRatio = Math.max(0, Math.min(1, redline / maxRpm));
            var redlineAngle = startAngle + redlineRatio * totalSweep;

            // 1. Dial Base Arc (外圈基本灰色半透明軌道)
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.lineWidth = 14;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.stroke();
            ctx.restore();

            // 2. Redline Sector Arc (紅線極限區域底色)
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, redlineAngle, endAngle);
            ctx.lineWidth = 16;
            ctx.strokeStyle = 'rgba(255, 0, 136, 0.8)';
            ctx.stroke();
            ctx.restore();

            // 3. Active Progress Arc (當前動態轉速發光弧條)
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, currentAngle);
            ctx.lineWidth = 16;
            var isOverRedline = rpm >= redline;
            ctx.strokeStyle = isOverRedline ? CURRENT_HOT : CURRENT_PRIMARY;
            ctx.shadowColor = isOverRedline ? CURRENT_HOT_RGBA : CURRENT_PRIMARY_RGBA;
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();

            // 4. Numbers & Tick Marks (外圈刻度與數字 0, 1, 2... 8)
            var maxDigits = Math.ceil(maxRpm / 1000);
            ctx.save();
            ctx.font = 'bold 22px ForzaGear, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (var i = 0; i <= maxDigits; i++) {
                var tickRpm = i * 1000;
                var tickRatio = tickRpm / maxRpm;
                if (tickRatio > 1) break;

                var angle = startAngle + tickRatio * totalSweep;
                var isRed = tickRpm >= redline;

                // Tick mark
                var innerR = radius - 15, outerR = radius + 15;
                ctx.beginPath();
                ctx.moveTo(centerX + innerR * Math.cos(angle), centerY + innerR * Math.sin(angle));
                ctx.lineTo(centerX + outerR * Math.cos(angle), centerY + outerR * Math.sin(angle));
                ctx.lineWidth = 3;
                ctx.strokeStyle = isRed ? CURRENT_HOT : 'rgba(255, 255, 255, 0.7)';
                ctx.stroke();

                // Digit text
                var numR = radius - 40;
                ctx.fillStyle = isRed ? CURRENT_HOT : 'rgba(255, 255, 255, 0.9)';
                ctx.fillText(i.toString(), centerX + numR * Math.cos(angle), centerY + numR * Math.sin(angle));
            }
            ctx.restore();

            // 5. Needle (動態指針)
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(radius - 20, 0);
            ctx.lineWidth = 6;
            ctx.strokeStyle = (rpm >= redline) ? CURRENT_HOT : CURRENT_PRIMARY;
            ctx.shadowColor = (rpm >= redline) ? CURRENT_HOT_RGBA : CURRENT_PRIMARY_RGBA;
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.restore();

            // 6. Center Cap (中心軸蓋)
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, 24, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.strokeStyle = CURRENT_PRIMARY_RGBA;
            ctx.lineWidth = 4;
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function triggerSimpleSweepAnimation() {
            if (window.simpleSweepActive) return;
            window.simpleSweepActive = true;

            var startTime = performance.now();
            
            // Read standard config from host window if available, fallback to 900ms default
            var hostConfig = window.parent && window.parent.HUD_ANIM_CONFIG;
            var duration = hostConfig ? hostConfig.TOTAL_DURATION : 900;
            var maxSweepRpm = 8000;

            function animate(now) {
                var elapsed = now - startTime;
                var progress = Math.min(1.0, elapsed / duration);
                var sweepRpm = 0;

                if (progress < 0.5) {
                    var p = progress / 0.5;
                    sweepRpm = maxSweepRpm * Math.sin(p * Math.PI / 2);
                } else {
                    var p = (progress - 0.5) / 0.5;
                    sweepRpm = maxSweepRpm * (1 - Math.sin(p * Math.PI / 2)) + 1200 * Math.sin(p * Math.PI / 2);
                }

                drawSimpleHUD({ rpm: sweepRpm, maxRpm: maxSweepRpm }, 7200);
                setSimpleSpeedDisplay(Math.round((sweepRpm / maxSweepRpm) * 160));

                if (progress < 1.0) {
                    requestAnimationFrame(animate);
                } else {
                    window.simpleSweepActive = false;
                }
            }

            requestAnimationFrame(animate);
        }

        // ── Register Simple HUD with HUDCore Engine ──
        HUDCore.registerStyle('simple', {
            containerId: 'simpleContainer',
            scaleMultiplier: 0.6,

            onInit: function (payload) {
                if (payload && payload.isMetric !== undefined) {
                    var el = domCache.speedUnit;
                    if (el) el.textContent = payload.isMetric !== false ? 'KM/H' : 'MPH';
                }
            },

            onElementsChange: function (elements) {
                var simpleCanvas = domCache.simpleCanvas;
                var bgImg = domCache.tachBgImg;
                var speedGroup = domCache.speedText;
                var speedUnit = domCache.speedUnit;
                var gearGroup = domCache.gearText;

                if (simpleCanvas) simpleCanvas.style.display = elements.showRPM === false ? 'none' : 'block';
                if (bgImg) bgImg.style.display = elements.showRPM === false ? 'none' : 'block';

                if (speedGroup) speedGroup.style.display = elements.showSpeed === false ? 'none' : 'block';
                if (speedUnit) speedUnit.style.display = elements.showSpeed === false ? 'none' : 'block';
                if (gearGroup) gearGroup.style.display = elements.showGear === false ? 'none' : 'block';
            },

            onFrame: function (data, payload) {
                var redlineRpm = payload.redlineRpm || ((data.maxRpm || 8000) * 0.92);

                if (!window.simpleSweepActive) {
                    drawSimpleHUD(data, redlineRpm);

                    var speed = Math.round(data.speed_kmh ?? data.speed ?? 0);
                    setSimpleSpeedDisplay(speed);

                    var gearEl = domCache.gearText;
                    var gearIndicator = domCache.gearIndicator;
                    if (data.gear !== undefined && data.gear <= 11) _simpleValidGear = data.gear;
                    if (gearEl) gearEl.textContent = _simpleValidGear === 0
                        ? 'R'
                        : (_simpleValidGear === 11 ? 'N' : _simpleValidGear.toString());
                    if (gearIndicator) gearIndicator.classList.toggle('active', (data.rpm / redlineRpm) >= 0.95);

                    var lockBadge = domCache.lockBadge;
                    var lcBadge = domCache.lcBadge;
                    if (lockBadge && payload.lockup) {
                        var isLocked = payload.lockup.fl || payload.lockup.fr || payload.lockup.rl || payload.lockup.rr;
                        lockBadge.classList.toggle('active', !!isLocked);
                    }
                    if (lcBadge) {
                        lcBadge.classList.toggle('active', payload.lcState === 'armed' || payload.lcState === 'launched');
                    }
                }
            },

            onAnimate: function () {
                triggerSimpleSweepAnimation();
            }
        });

        // Activate Simple Style
        HUDCore.init('simple');

        // Initial Standby Render
        setTimeout(function () {
            drawSimpleHUD({ rpm: 0, maxRpm: 8000 }, 7200);
            triggerSimpleSweepAnimation();
        }, 80);
    </script>
</body>
</html>
