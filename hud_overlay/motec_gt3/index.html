<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MoTeC C125 GT3 DDU</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .motec-container {
            width: 800px;
            height: 480px;
            pointer-events: none;
            position: relative;
            box-sizing: border-box;
        }
        #motecCanvas {
            display: block;
            width: 800px;
            height: 480px;
            background: #08090C;
            border: 2px solid #273142;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container motec-container" id="motecContainer">
            <canvas id="motecCanvas" width="800" height="480"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var domCache = {
                container: document.getElementById('motecContainer'),
                canvas: document.getElementById('motecCanvas'),
                ctx: null
            };

            if (domCache.canvas) {
                domCache.ctx = domCache.canvas.getContext('2d');
            }

            var isMetric = true;
            var sweepActive = false;
            var sweepStartTime = 0;
            var sweepDuration = 1200;
            var lastValidGear = 1;
            var lastKnownMaxRpm = 8500;
            var lastKnownRedline = 8000;
            var mediaState = { has_media: false, title: '', artist: '' };

            function getTireColor(temp) {
                if (temp < 75) return '#38BDF8';
                if (temp < 100) return '#10B981';
                if (temp < 112) return '#F59E0B';
                return '#EF4444';
            }

            function toCelsius(temp) {
                if (temp === undefined || temp === null || isNaN(temp)) return 85;
                // If temp > 120, it is in Fahrenheit (Forza UDP canonical unit ~180-230°F)
                if (temp > 120) {
                    return Math.round((temp - 32) * 5 / 9);
                }
                return Math.round(temp);
            }

            function normPedal(val) {
                if (val === undefined || val === null) return 0;
                var n = Number(val);
                if (isNaN(n)) return 0;
                return Math.max(0, Math.min(1, n > 1 ? n / 255 : n));
            }

            function drawMotecDashboard(rpm, maxRpm, redlineRpm, speed, gear, throttle, brake, tireTemps, engineTemp, isAbsActive, isTcsActive, latG, lonG, now) {
                var ctx = domCache.ctx;
                if (!ctx) return;

                ctx.clearRect(0, 0, 800, 480);
                ctx.textBaseline = 'alphabetic';

                // Background
                ctx.fillStyle = '#08090C';
                ctx.fillRect(0, 0, 800, 480);

                var customColor = window._currentCustomColor;
                var useDefault = window._currentUseDefaultColors !== false;
                var accentColor = (!useDefault && customColor) ? customColor : '#38BDF8';

                // 1. Shift Lights (15 LEDs across 800px width with compound batch path drawing)
                var shiftStart = redlineRpm * 0.72;
                var shiftPoint = redlineRpm * 0.96;
                var activeLeds = 0;
                var isFlashing = false;

                if (rpm >= shiftPoint) {
                    activeLeds = 15;
                    isFlashing = Math.floor(now / 55) % 2 === 0;
                } else if (rpm >= shiftStart && shiftPoint > shiftStart) {
                    var ratio = (rpm - shiftStart) / (shiftPoint - shiftStart);
                    activeLeds = Math.min(15, Math.floor(ratio * 15) + 1);
                }

                var ledStartX = 50;
                var ledY = 32;
                var ledSpacing = 50;
                var ledRadius = 11;

                if (rpm >= shiftPoint) {
                    // Strobe flash mode: all 15 LEDs in 1 single path call
                    ctx.beginPath();
                    for (var fi = 0; fi < 15; fi++) {
                        var fcx = ledStartX + fi * ledSpacing;
                        if (ctx.moveTo) ctx.moveTo(fcx + ledRadius, ledY);
                        ctx.arc(fcx, ledY, ledRadius, 0, Math.PI * 2);
                    }
                    if (isFlashing) {
                        ctx.fillStyle = '#00E5FF';
                        ctx.shadowColor = '#00E5FF';
                        ctx.shadowBlur = 14;
                    } else {
                        ctx.fillStyle = '#1B202B';
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    // Batch 1: Inactive background for all 15 LEDs in single path
                    ctx.beginPath();
                    for (var bi = 0; bi < 15; bi++) {
                        var bcx = ledStartX + bi * ledSpacing;
                        if (ctx.moveTo) ctx.moveTo(bcx + ledRadius, ledY);
                        ctx.arc(bcx, ledY, ledRadius, 0, Math.PI * 2);
                    }
                    ctx.fillStyle = '#1B202B';
                    ctx.fill();

                    // Batch 2: Active Green LEDs (1~5)
                    if (activeLeds > 0) {
                        var greenEnd = Math.min(activeLeds, 5);
                        ctx.beginPath();
                        for (var g = 0; g < greenEnd; g++) {
                            var gcx = ledStartX + g * ledSpacing;
                            if (ctx.moveTo) ctx.moveTo(gcx + ledRadius, ledY);
                            ctx.arc(gcx, ledY, ledRadius, 0, Math.PI * 2);
                        }
                        ctx.fillStyle = '#00E676';
                        ctx.shadowColor = '#00E676';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }

                    // Batch 3: Active Yellow LEDs (6~10)
                    if (activeLeds > 5) {
                        var yellowEnd = Math.min(activeLeds, 10);
                        ctx.beginPath();
                        for (var y = 5; y < yellowEnd; y++) {
                            var ycx = ledStartX + y * ledSpacing;
                            if (ctx.moveTo) ctx.moveTo(ycx + ledRadius, ledY);
                            ctx.arc(ycx, ledY, ledRadius, 0, Math.PI * 2);
                        }
                        ctx.fillStyle = '#FFD600';
                        ctx.shadowColor = '#FFD600';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }

                    // Batch 4: Active Red LEDs (11~15)
                    if (activeLeds > 10) {
                        var redEnd = Math.min(activeLeds, 15);
                        ctx.beginPath();
                        for (var r = 10; r < redEnd; r++) {
                            var rcx = ledStartX + r * ledSpacing;
                            if (ctx.moveTo) ctx.moveTo(rcx + ledRadius, ledY);
                            ctx.arc(rcx, ledY, ledRadius, 0, Math.PI * 2);
                        }
                        ctx.fillStyle = '#FF1744';
                        ctx.shadowColor = '#FF1744';
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                // 2. Left Box: Speed & Pedals (Symmetrical Grid: x: 24, w: 236, h: 290)
                ctx.fillStyle = '#131722';
                ctx.fillRect(24, 64, 236, 290);
                ctx.strokeStyle = '#273142';
                ctx.lineWidth = 1;
                ctx.strokeRect(24, 64, 236, 290);

                ctx.fillStyle = '#64748B';
                ctx.font = 'bold 15px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('SPEED (' + (isMetric ? 'KM/H' : 'MPH') + ')', 44, 96);

                ctx.fillStyle = '#F8FAFC';
                ctx.font = 'bold 80px monospace';
                ctx.fillText(String(Math.round(speed)), 44, 175);

                ctx.fillStyle = '#64748B';
                ctx.font = 'bold 13px monospace';
                ctx.fillText('ENGINE RPM', 44, 222);
                ctx.fillStyle = accentColor;
                ctx.font = 'bold 32px monospace';
                ctx.fillText(String(Math.round(rpm)), 44, 258);

                // Pedal Bars (Brake left, Throttle right)
                var pedalY = 296;
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
                ctx.fillRect(44, pedalY, 88, 18);
                if (brake > 0) {
                    ctx.fillStyle = '#EF4444';
                    ctx.fillRect(44, pedalY, 88 * Math.min(1, brake), 18);
                }

                ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
                ctx.fillRect(146, pedalY, 88, 18);
                if (throttle > 0) {
                    ctx.fillStyle = '#22C55E';
                    ctx.fillRect(146, pedalY, 88 * Math.min(1, throttle), 18);
                }

                // 3. Center Box: Gear (Symmetrical Grid: x: 272, w: 256, h: 290)
                ctx.fillStyle = '#131722';
                ctx.fillRect(272, 64, 256, 290);
                ctx.strokeStyle = '#273142';
                ctx.strokeRect(272, 64, 256, 290);

                ctx.fillStyle = '#64748B';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GEAR', 400, 96);

                var gearDisplay = gear <= 0 ? 'R' : (gear === 11 ? 'N' : String(gear));
                ctx.fillStyle = (rpm >= shiftPoint && isFlashing) ? '#FF1744' : '#FFFFFF';
                ctx.font = 'bold 145px monospace';
                ctx.fillText(gearDisplay, 400, 240);

                // 4. Right Box: Tire Thermals & Engine Status (Symmetrical Grid: x: 540, w: 236, h: 290)
                ctx.fillStyle = '#131722';
                ctx.fillRect(540, 64, 236, 290);
                ctx.strokeStyle = '#273142';
                ctx.strokeRect(540, 64, 236, 290);

                ctx.fillStyle = '#64748B';
                ctx.font = 'bold 15px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('TIRES TEMP (°C)', 556, 96);

                var tires = [
                    { name: 'FL', t: Math.round(tireTemps[0]), x: 556, y: 116 },
                    { name: 'FR', t: Math.round(tireTemps[1]), x: 660, y: 116 },
                    { name: 'RL', t: Math.round(tireTemps[2]), x: 556, y: 182 },
                    { name: 'RR', t: Math.round(tireTemps[3]), x: 660, y: 182 }
                ];

                for (var tIdx = 0; tIdx < 4; tIdx++) {
                    var item = tires[tIdx];
                    ctx.fillStyle = '#1E293B';
                    ctx.fillRect(item.x, item.y, 88, 54);
                    ctx.fillStyle = getTireColor(item.t);
                    ctx.font = 'bold 13px monospace';
                    ctx.fillText(item.name, item.x + 8, item.y + 22);
                    ctx.font = 'bold 20px monospace';
                    ctx.fillText(String(item.t), item.x + 8, item.y + 45);
                }

                ctx.fillStyle = '#64748B';
                ctx.font = 'bold 13px monospace';
                ctx.fillText('WATER: ' + Math.round(engineTemp) + '°C', 556, 266);
                var latStr = (latG >= 0 ? '+' : '') + (latG || 0).toFixed(2) + 'G';
                var lonStr = (lonG >= 0 ? '+' : '') + (lonG || 0).toFixed(2) + 'G';
                ctx.fillText('G-FORCE: ' + latStr + ' / ' + lonStr, 556, 290);
                ctx.fillText('BRAKE BIAS: 54:46', 556, 314);

                // 5. Stepped RPM Bar (Symmetrical Grid: x: 24, y: 366, w: 752, h: 48)
                ctx.fillStyle = '#131722';
                ctx.fillRect(24, 366, 752, 48);
                ctx.strokeStyle = '#273142';
                ctx.strokeRect(24, 366, 752, 48);

                var rpmRatio = maxRpm > 0 ? Math.max(0, Math.min(1, rpm / maxRpm)) : 0;
                var barW = Math.round(748 * rpmRatio);
                if (barW > 0) {
                    var grad = ctx.createLinearGradient(26, 0, 772, 0);
                    grad.addColorStop(0, '#10B981');
                    grad.addColorStop(0.7, '#FBBF24');
                    grad.addColorStop(0.92, '#EF4444');
                    ctx.fillStyle = grad;
                    ctx.fillRect(26, 368, barW, 44);
                }

                // Ticks & Numbers
                ctx.fillStyle = '#94A3B8';
                ctx.font = '12px monospace';
                ctx.textAlign = 'center';
                if (maxRpm > 0) {
                    for (var r = 1000; r <= maxRpm; r += 1000) {
                        var tx = 24 + (r / maxRpm) * 752;
                        ctx.fillRect(tx, 366, 2, 8);
                        ctx.fillText(String(Math.round(r / 1000)) + 'k', tx, 422);
                    }
                }

                // 6. Bottom Status Footer (Symmetrical Grid: x: 24, y: 430, w: 752, h: 36)
                ctx.fillStyle = '#0F131C';
                ctx.fillRect(24, 430, 752, 36);
                ctx.strokeStyle = '#202736';
                ctx.strokeRect(24, 430, 752, 36);

                ctx.textAlign = 'left';
                var flags = [
                    { label: 'TC', active: isTcsActive, color: '#10B981', x: 44 },
                    { label: 'ABS', active: isAbsActive, color: accentColor, x: 184 }
                ];
                for (var fIdx = 0; fIdx < flags.length; fIdx++) {
                    var f = flags[fIdx];
                    ctx.fillStyle = f.active ? f.color : '#334155';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillText(f.label, f.x, 453);
                }

                // Radio Team Comms / Media or standard race flags
                if (mediaState.has_media && mediaState.title) {
                    ctx.fillStyle = '#38BDF8';
                    ctx.font = 'bold 13px monospace';
                    var mediaStr = 'RADIO: ' + (mediaState.artist ? (mediaState.artist + ' - ') : '') + mediaState.title;
                    if (mediaStr.length > 44) mediaStr = mediaStr.substring(0, 41) + '...';
                    ctx.fillText(mediaStr, 324, 453);
                } else {
                    var extraFlags = [
                        { label: 'DIFF 50%', active: true, color: '#64748B', x: 324 },
                        { label: 'MAP 1', active: true, color: '#A855F7', x: 484 },
                        { label: 'ENG OK', active: true, color: '#10B981', x: 634 }
                    ];
                    for (var efIdx = 0; efIdx < extraFlags.length; efIdx++) {
                        var ef = extraFlags[efIdx];
                        ctx.fillStyle = ef.active ? ef.color : '#334155';
                        ctx.font = 'bold 14px monospace';
                        ctx.fillText(ef.label, ef.x, 453);
                    }
                }
            }

            function runSweep(timestamp) {
                if (!sweepActive) return;
                var elapsed = timestamp - sweepStartTime;
                var progress = elapsed / sweepDuration;

                if (progress >= 1.0) {
                    sweepActive = false;
                    drawMotecDashboard(0, lastKnownMaxRpm, lastKnownRedline, 0, 1, 0, 0, [85, 85, 85, 85], 90, false, false, 0, 0, timestamp);
                    return;
                }

                var sweepRpm;
                if (progress < 0.5) {
                    sweepRpm = (progress / 0.5) * lastKnownMaxRpm;
                } else {
                    sweepRpm = (1 - (progress - 0.5) / 0.5) * lastKnownMaxRpm;
                }

                var mockSpeed = (sweepRpm / lastKnownMaxRpm) * 220;
                drawMotecDashboard(sweepRpm, lastKnownMaxRpm, lastKnownRedline, mockSpeed, 1, 1.0, 0, [88, 88, 92, 92], 92, false, false, 0.45, -0.22, timestamp);
                requestAnimationFrame(runSweep);
            }

            HUDCore.registerStyle('motec_gt3', {
                containerId: 'motecContainer',
                scaleMultiplier: 0.55,

                onInit: function (payload) {
                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                },

                onElementsChange: function (elements) {
                    if (domCache.container) {
                        domCache.container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function (data, payload) {
                    if (sweepActive) return;

                    var maxRpm = data.max_rpm || data.maxRpm || 8500;
                    var redlineRpm = (payload && payload.redlineRpm) || (data.redlineRpm) || (maxRpm * 0.92);
                    lastKnownMaxRpm = maxRpm;
                    lastKnownRedline = redlineRpm;

                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                    if (data && data.displayUnits && data.displayUnits.speed) {
                        isMetric = data.displayUnits.speed !== 'mph';
                    }

                    var rpm = data.rpm || 0;
                    var rawSpeed = isMetric !== false
                        ? (data.speed_kmh !== undefined ? data.speed_kmh : (data.speed || 0))
                        : (data.speed_mph !== undefined ? data.speed_mph : ((data.speed_kmh || data.speed || 0) * 0.621371));

                    if (data.gear !== undefined && data.gear <= 11) {
                        lastValidGear = data.gear;
                    }

                    var throttle = data.throttle !== undefined ? normPedal(data.throttle) : normPedal(data.accel);
                    var brake = data.brake !== undefined ? normPedal(data.brake) : normPedal(data.brake_input);

                    var rawFL = data.temp_fl !== undefined ? data.temp_fl : (Array.isArray(data.TireTemp) ? data.TireTemp[0] : (data.TireTempFL || data.tire_temp_fl));
                    var rawFR = data.temp_fr !== undefined ? data.temp_fr : (Array.isArray(data.TireTemp) ? data.TireTemp[1] : (data.TireTempFR || data.tire_temp_fr));
                    var rawRL = data.temp_rl !== undefined ? data.temp_rl : (Array.isArray(data.TireTemp) ? data.TireTemp[2] : (data.TireTempRL || data.tire_temp_rl));
                    var rawRR = data.temp_rr !== undefined ? data.temp_rr : (Array.isArray(data.TireTemp) ? data.TireTemp[3] : (data.TireTempRR || data.tire_temp_rr));

                    var tireTemps = [
                        toCelsius(rawFL),
                        toCelsius(rawFR),
                        toCelsius(rawRL),
                        toCelsius(rawRR)
                    ];

                    var engineTemp = data.EngineTemp || data.engine_temp || 90;

                    var isAbsActive = !!(data.abs_active || (payload && payload.lockup && (payload.lockup.fl || payload.lockup.fr || payload.lockup.rl || payload.lockup.rr)));
                    var isTcsActive = !!(data.tcs_active || data.tcs_engaged);

                    // Real-time G-Force extraction
                    var latG = 0;
                    var lonG = 0;
                    if (data.AccelerationX !== undefined && data.AccelerationZ !== undefined) {
                        latG = data.AccelerationX / 9.81;
                        lonG = data.AccelerationZ / 9.81;
                    } else if (data.accel_x !== undefined && data.accel_z !== undefined) {
                        latG = data.accel_x / 9.81;
                        lonG = data.accel_z / 9.81;
                    } else if (payload && payload.g_force) {
                        latG = payload.g_force.lat || 0;
                        lonG = payload.g_force.lon || 0;
                    }

                    drawMotecDashboard(rpm, maxRpm, redlineRpm, rawSpeed, lastValidGear, throttle, brake, tireTemps, engineTemp, isAbsActive, isTcsActive, latG, lonG, performance.now());
                },

                onMedia: function (data) {
                    if (data && data.success && data.has_media && data.title) {
                        mediaState.has_media = true;
                        mediaState.title = data.title;
                        mediaState.artist = data.artist || '';
                    } else {
                        mediaState.has_media = false;
                        mediaState.title = '';
                        mediaState.artist = '';
                    }
                },

                onAnimate: function () {
                    sweepActive = true;
                    sweepStartTime = performance.now();
                    requestAnimationFrame(runSweep);
                }
            });

            HUDCore.init('motec_gt3');

            setTimeout(function () {
                drawMotecDashboard(0, 8500, 7800, 0, 1, 0, 0, [80, 80, 80, 80], 85, false, false, performance.now());
            }, 60);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    drawMotecDashboard(0, 8500, 7800, 0, 1, 0, 0, [80, 80, 80, 80], 85, false, false, performance.now());
                });
            }
        })();
    </script>
</body>
</html>
