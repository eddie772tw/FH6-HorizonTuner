<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford GT 2017 Race Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .fordgt-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 586px;
            height: 220px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container fordgt-container" id="fordGtContainer">
            <canvas id="fordGtCanvas" width="586" height="220"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('fordGtCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('fordGtContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/ford_gt_clean.png';

            var telemetry = {
                speed: 172,
                rpm: 6600,
                maxRpm: 7800,
                gear: 4,
                fuel: 0.75,
                temp: 89,
                oilTemp: 99,
                oilPress: 61,
                boost: 17.4
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean base
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 586, 220);
                }

                // 2. Rising Yellow RPM Track Fill (1..4 rising, 4..8 flat)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                var isRedline = rpmRatio > 0.88;
                var barColor = isRedline ? '#ff2233' : '#ffd152';

                ctx.save();
                ctx.beginPath();
                // Define track path
                ctx.moveTo(30, 168);
                ctx.quadraticCurveTo(110, 100, 175, 55);
                ctx.lineTo(440, 55);

                // Clip to active ratio
                var clipW = 30 + rpmRatio * 410;
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, clipW, 220);
                ctx.clip();

                ctx.strokeStyle = barColor;
                ctx.lineWidth = 4;
                ctx.shadowColor = barColor;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(30, 168);
                ctx.quadraticCurveTo(110, 100, 175, 55);
                ctx.lineTo(440, 55);
                ctx.stroke();

                // Under-glow area
                ctx.lineTo(440, 75);
                ctx.lineTo(175, 75);
                ctx.quadraticCurveTo(110, 115, 30, 175);
                ctx.closePath();
                ctx.fillStyle = isRedline ? 'rgba(255, 34, 51, 0.25)' : 'rgba(255, 209, 82, 0.25)';
                ctx.fill();
                ctx.restore();
                ctx.restore();

                // 3. Digital Gear (Left: 55, 80)
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 72px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.shadowBlur = 10;
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 55, 82);

                // 4. Digital Speed (Center: 290, 142)
                ctx.font = 'bold 84px "Consolas", monospace';
                ctx.fillText(String(Math.round(telemetry.speed)), 290, 145);

                // 5. Numeric RPM (Top right: 520, 62)
                ctx.font = 'bold 26px "Consolas", monospace';
                ctx.fillText(String(Math.round(telemetry.rpm)), 520, 62);

                // 6. Right Telemetry Stack
                ctx.font = 'bold 18px "Consolas", monospace';
                ctx.textAlign = 'right';
                ctx.fillText(String(Math.round(telemetry.temp)), 510, 114);
                ctx.fillText(String(Math.round(telemetry.oilTemp)), 510, 137);
                ctx.fillText(String(Math.round(telemetry.oilPress)), 510, 160);
                ctx.fillText(telemetry.boost.toFixed(1), 510, 183);

                // 7. Fuel Bar Segments (Bottom Left: 90, 182)
                var fRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                var fSegs = 5;
                var activeSegs = Math.round(fRatio * fSegs);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
                for (var s = 0; s < activeSegs; s++) {
                    ctx.fillRect(100 + s * 16, 178, 12, 4);
                }
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('ford_gt', {
                containerId: 'fordGtContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (data.coolant_temp !== undefined) telemetry.temp = Number(data.coolant_temp);
                    if (data.boost !== undefined) telemetry.boost = Number(data.boost) * 14.5038;
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 7600;
                        telemetry.speed = wave * 280;
                        telemetry.boost = wave * 22.0;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('ford_gt');
            render();
        })();
    </script>
</body>
</html>
