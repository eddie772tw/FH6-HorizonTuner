<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford GT 2017 Race Cluster</title>
    <!--
      [設計決策紀錄 / Design Decision Note]
      1. 右側四列改為四輪平均胎溫 °C、增壓 psi、扭力 N·m、馬力 hp，直接使用具單位的遙測欄位。
      2. 舊水溫／油溫／油壓圖示與刻印單位在載入時清除並重新標示，不保留代理油液數值。
      3. 胎溫沿用共用 raw °F -> °C 契約；缺值顯示破折號，不以預設溫度或其他單位的欄位代替。
    -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .fordgt-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 586px;
            height: 220px;
            pointer-events: none;
        }
        .artwork-motion { width: 100%; height: 100%; }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container fordgt-container" id="fordGtContainer">
            <div class="artwork-motion" id="artworkMotion"><canvas id="fordGtCanvas" width="586" height="220"></canvas></div>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script src="../shared/artwork-effects.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('fordGtCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('fordGtContainer');

            var baseImg = HUDArtwork.loadImage('assets/ford_gt_clean.png', 0.25);
            var barsImg = HUDArtwork.loadImage('assets/ford_gt_bars_full.png', 0);
            var basePlate = null;

            var isSweeping = false;
            var sweepRafId = null;

            var telemetry = {
                speed: 0,
                rpm: 0,
                maxRpm: 8000,
                gear: 'N',
                fuelRatio: 0.75,
                tempC: null,
                boostPsi: null,
                torqueNm: null,
                powerHp: null
            };

            // Keep accepted live readings separate from temporary display-check values.
            var liveTelemetry = telemetry;
            var effects = HUDArtworkEffects.create(document.getElementById('artworkMotion'));
            var destroyed = false;

            function destroy() {
                destroyed = true;
                effects.destroy();
                if (sweepRafId !== null) cancelAnimationFrame(sweepRafId);
                sweepRafId = null;
                isSweeping = false;
                window.removeEventListener('message', onLifecycleMessage);
                window.removeEventListener('pagehide', destroy);
            }
            function onLifecycleMessage(event) {
                if (event.data && event.data.type === 'hud:destroy') destroy();
            }
            window.addEventListener('message', onLifecycleMessage);
            window.addEventListener('pagehide', destroy);

            function finiteReading(value) {
                return typeof value === 'number' && Number.isFinite(value) ? value : null;
            }

            function drawReading(label, value, unit, y, decimals) {
                ctx.textAlign = 'left';
                ctx.font = 'bold 9px "Consolas", monospace';
                ctx.fillText(label, 465, y);
                ctx.textAlign = 'right';
                ctx.font = 'bold 19px "Consolas", monospace';
                ctx.fillText(value === null ? '—' : value.toFixed(decimals), 546, y);
                ctx.font = '10px "Consolas", monospace';
                ctx.fillText(unit, 580, y);
            }

            function formatGear(g) {
                if (g === 0 || g === 'R') return 'R';
                if (g === 11 || g === 'N') return 'N';
                var n = Number(g);
                if (Number.isInteger(n) && n >= 1 && n <= 10) return String(n);
                return 'N';
            }

            function render() {
                if (destroyed) return;
                var w = 586;
                var h = 220;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean D3D11 dark-glass binnacle base (0% bars)
                if (basePlate) {
                    ctx.drawImage(basePlate, 0, 0);
                }

                if (barsImg.complete && barsImg.naturalWidth > 0) {
                    // 2. Rising & Horizontal RPM Track Fill (0..8,500 RPM, x = 6..576)
                    var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / 8500.0));
                    if (rpmRatio > 0.002) {
                        var rpmX = Math.round(6 + rpmRatio * 570);
                        ctx.save();
                        ctx.beginPath();
                        // Exclude the fuel box and relabelled auxiliary region from baked artwork.
                        ctx.rect(6, 14, rpmX - 6, 94);
                        ctx.rect(6, 108, Math.min(rpmX - 6, 456), 52);
                        ctx.rect(6, 160, Math.min(rpmX - 6, 48), 45);
                        ctx.clip();
                        ctx.drawImage(barsImg, 0, 0, 586, 220);
                        ctx.restore();

                        // Vertical cursor line at the leading edge of the RPM bar
                        if (rpmX > 120) {
                            ctx.save();
                            var isRed = telemetry.rpm >= 7200;
                            ctx.strokeStyle = isRed ? '#ff2a3a' : effects.accent('#ffe47a');
                            ctx.lineWidth = 1.6;
                            ctx.beginPath();
                            ctx.moveTo(rpmX, 34);
                            ctx.lineTo(rpmX, 118);
                            ctx.stroke();
                            ctx.restore();
                        }
                    }

                    // 3. Fuel Bar Segments (x = 59..151, y = 192..208)
                    var fRatio = Math.min(1.0, Math.max(0.0, telemetry.fuelRatio));
                    if (fRatio > 0.01) {
                        var fuelW = Math.round(fRatio * (151 - 59));
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(59, 192, fuelW, 16);
                        ctx.clip();
                        ctx.drawImage(barsImg, 0, 0, 586, 220);
                        ctx.restore();
                    }
                }

                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.45)';
                ctx.shadowBlur = effects.glow(6);

                ctx.fillStyle = effects.accent('#ffffff');
                // 4. Restore the original D3D11 gear readout above the left RPM ramp.
                // Reference: ForzaHUD/raw_renders/dash_ford_gt_raw.png (gear bounds x=15..49, y=58..98).
                ctx.font = 'bold 64px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(telemetry.gear, 33, 99);

                ctx.fillStyle = '#ffffff';
                // 5. Digital Speed (Center: x=295, y=150)
                ctx.font = 'bold 82px "Consolas", monospace';
                ctx.fillText(String(Math.round(telemetry.speed)), 295, 150);

                // 6. Numeric RPM (Above 'RPM' label at x=529..572, y=77..90)
                ctx.font = 'bold 25px "Consolas", monospace';
                ctx.textAlign = 'right';
                ctx.shadowBlur = effects.glow(3);
                ctx.fillText(String(Math.round(telemetry.rpm)), 572, 71);

                // 7. Explicit labels and fixed units agree with the four real telemetry sources.
                ctx.fillStyle = '#f1f5f9';
                ctx.shadowBlur = effects.glow(0);
                drawReading('TIRE AVG', telemetry.tempC, '°C', 128, 0);
                drawReading('BOOST', telemetry.boostPsi, 'psi', 152, 1);
                drawReading('TORQUE', telemetry.torqueNm, 'N·m', 176, 0);
                drawReading('POWER', telemetry.powerHp, 'hp', 200, 0);
                ctx.restore();
            }

            baseImg.onload = function() {
                if (destroyed) return;
                basePlate = document.createElement('canvas');
                basePlate.width = 586;
                basePlate.height = 220;
                var plate = basePlate.getContext('2d');
                plate.drawImage(baseImg, 0, 0, 586, 220);
                var glass = plate.getImageData(460, 108, 1, 1).data;
                plate.clearRect(462, 108, 121, 99);
                plate.fillStyle = 'rgba(' + glass[0] + ',' + glass[1] + ',' + glass[2] + ',' + glass[3] / 255 + ')';
                plate.fillRect(462, 108, 121, 99);
                render();
            };
            barsImg.onload = render;

            HUDCore.registerStyle('ford_gt', {
                containerId: 'fordGtContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onInit: function() {
                    if (destroyed) return;
                    effects.sync();
                    render();
                },

                onElementsChange: function(elements) {
                    if (destroyed) return;
                    effects.sync(elements);
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data) {
                    if (destroyed) return;
                    effects.update(data);
                    if (data.speed !== undefined) liveTelemetry.speed = Math.abs(Number(data.speed)) || 0;
                    if (data.rpm !== undefined) liveTelemetry.rpm = Math.max(0, Number(data.rpm) || 0);
                    if (data.maxRpm !== undefined && data.maxRpm > 0) liveTelemetry.maxRpm = Number(data.maxRpm);
                    if (data.gear !== undefined) liveTelemetry.gear = formatGear(data.gear);

                    liveTelemetry.tempC = HUDCore.getAverageTireTemperatureC(data);
                    liveTelemetry.boostPsi = finiteReading(data.boost_psi ?? data.Boost);
                    liveTelemetry.torqueNm = finiteReading(data.torque_nm ?? data.TorqueNewtons);
                    var watts = finiteReading(data.PowerWatts);
                    liveTelemetry.powerHp = finiteReading(data.power_hp ?? (watts === null ? null : watts / 745.7));

                    if (data.fuel_ratio !== undefined) {
                        liveTelemetry.fuelRatio = Number(data.fuel_ratio);
                    } else if (data.fuel_level !== undefined) {
                        liveTelemetry.fuelRatio = Number(data.fuel_level);
                    }
                    if (!isSweeping) {
                        telemetry = liveTelemetry;
                        render();
                    }
                },

                onAnimate: function() {
                    if (destroyed) return;
                    if (sweepRafId !== null) cancelAnimationFrame(sweepRafId);
                    isSweeping = true;
                    telemetry = Object.assign({}, liveTelemetry);
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 8200;
                        telemetry.speed = wave * 310;
                        telemetry.boostPsi = wave * 22.0;
                        telemetry.fuelRatio = 0.25 + wave * 0.75;
                        telemetry.tempC = 65 + wave * 35;
                        telemetry.torqueNm = wave * 550;
                        telemetry.powerHp = wave * 600;
                        telemetry.gear = wave > 0.5 ? '4' : '1';
                        if (progress < 1) {
                            render();
                            sweepRafId = requestAnimationFrame(sweep);
                        } else {
                            isSweeping = false;
                            sweepRafId = null;
                            telemetry = liveTelemetry;
                            render();
                        }
                    }
                    sweepRafId = requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('ford_gt');
            render();
        })();
    </script>
</body>
</html>
