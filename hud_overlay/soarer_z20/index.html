<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Soarer Z20 Digital VFD Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .soarer-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 924px;
            height: 182px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container soarer-container" id="soarerContainer">
            <canvas id="soarerCanvas" width="924" height="182"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('soarerCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('soarerContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/soarer_clean_base.png';

            var tachoStrip = new Image();
            tachoStrip.src = 'assets/soarer_tacho_strip.png';

            var fuelStrip = new Image();
            fuelStrip.src = 'assets/soarer_fuel_strip.png';

            var tempStrip = new Image();
            tempStrip.src = 'assets/soarer_temp_strip.png';

            var telemetry = {
                speed: 138,
                rpm: 5800,
                maxRpm: 8000,
                gear: 4,
                fuel: 0.75,
                temp: 85
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Draw static vector scale plates (100% transparent background)
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 924, 182);
                }

                // 2. Dynamic Curved VFD Tachometer Bar
                if (tachoStrip.complete) {
                    var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                    var stripW = 600;
                    var stripH = 34;
                    var stripX = 158;
                    var stripY = 32;

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(stripX, stripY, stripW * rpmRatio, stripH);
                    ctx.clip();
                    ctx.drawImage(tachoStrip, stripX, stripY, stripW, stripH);
                    ctx.restore();
                }

                // 3. Dynamic Fuel Ladder Bar (Left: x=20, y=55)
                if (fuelStrip.complete) {
                    var fuelRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                    var fW = 105;
                    var fH = 22;
                    var fX = 20;
                    var fY = 56;

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(fX, fY, fW * fuelRatio, fH);
                    ctx.clip();
                    ctx.drawImage(fuelStrip, fX, fY, fW, fH);
                    ctx.restore();
                }

                // 4. Dynamic Water Temp Bar (Right: x=800..880, y=55)
                if (tempStrip.complete) {
                    var tempRatio = Math.min(1.0, Math.max(0.0, (telemetry.temp - 40.0) / 80.0));
                    var tX = 800 + tempRatio * 80;
                    ctx.drawImage(tempStrip, tX, 56, 12, 22);
                }

                // 5. Digital Speedometer (Center LCD: 450, 130)
                ctx.save();
                ctx.fillStyle = '#b0f4ff';
                ctx.font = 'bold 52px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(176, 244, 255, 0.85)';
                ctx.shadowBlur = 10;
                ctx.fillText(String(Math.round(telemetry.speed)), 450, 132);

                // 6. Gear Indicator (Shift Box: 265, 142)
                ctx.font = 'bold 32px "Consolas", monospace';
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 265, 142);

                // 7. Clock (Right LCD: 668, 142)
                ctx.font = 'bold 26px "Consolas", monospace';
                ctx.fillStyle = '#b0f4ff';
                ctx.fillText('21:38', 668, 142);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('soarer_z20', {
                containerId: 'soarerContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (data.coolant_temp !== undefined) telemetry.temp = Number(data.coolant_temp);
                    if (data.fuel_level !== undefined) telemetry.fuel = Number(data.fuel_level);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 7500;
                        telemetry.speed = wave * 180;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('soarer_z20');
            render();
        })();
    </script>
</body>
</html>
