<!doctype html>
<html lang="en" data-bs-theme="dark" data-bs-core="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LFA Center Ring · HorizonTuner</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <link rel="stylesheet" href="lfa.css">
    <link rel="stylesheet" href="lfa-side-gauges.css">
</head>
<body>
    <div class="hud-root-wrapper">
        <section id="lfaContainer" class="hud-gauge-container lfa-cluster" aria-label="Center ring driving telemetry">
            <img class="lfa-side-fascia" src="assets/side-crescents.png" alt="" draggable="false">
            <div class="lfa-approved-center-mask"><img class="lfa-housing" src="assets/center-ring.png" alt="" draggable="false"></div>
            <canvas id="lfaScale" width="1120" height="740" aria-hidden="true"></canvas>
            <canvas id="lfaNeedle" width="1120" height="740" aria-hidden="true"></canvas>
            <div class="lfa-readouts">
                <div id="lfaSpeed" class="lfa-speed">—</div>
                <div id="lfaSpeedUnit" class="lfa-speed-unit">km/h</div>
                <div class="lfa-divider"></div>
                <div id="lfaGear" class="lfa-gear">—</div>
                <div class="lfa-gear-label">GEAR</div>
                <div id="lfaStatus" class="lfa-status" role="status">WAITING</div>
            </div>
            <svg class="lfa-side-readings" viewBox="0 0 560 370" aria-label="Auxiliary gauges: fuel level; temperature and pressure unavailable">
                <g class="lfa-side-unavailable" aria-label="Coolant temperature unavailable"><text id="lfaCoolant" x="83" y="139">N/A</text></g>
                <g class="lfa-side-unavailable" aria-label="Oil temperature unavailable"><text id="lfaOilTemperature" x="477" y="139">N/A</text></g>
                <g class="lfa-side-unavailable" aria-label="Oil pressure unavailable"><text id="lfaOilPressure" x="466" y="281">N/A</text></g>
                <g class="lfa-side-middle" aria-label="Ambient temperature unavailable"><text x="63" y="190">— °C</text></g>
                <g class="lfa-side-middle" aria-label="Vehicle clock unavailable"><text x="497" y="190">—:—</text></g>
                <g id="lfaFuelGauge" aria-label="Fuel level unavailable">
                    <path id="lfaFuelFill" class="lfa-fuel-fill" d="M103 314 C71 287 45 252 32 214" pathLength="100"/>
                    <text id="lfaFuel" class="lfa-fuel-value" x="94" y="281">N/A</text>
                </g>
            </svg>
            <div class="lfa-scale-unit">×1000 r/min</div>
            <div id="lfaSelfCheck" class="lfa-self-check" hidden>DISPLAY CHECK</div>
        </section>
    </div>
    <script src="../shared/hud-core.js"></script>
    <script src="lfa-model.js"></script>
    <script src="lfa-renderer.js"></script>
    <script src="lfa-controller.js"></script>
</body>
</html>
