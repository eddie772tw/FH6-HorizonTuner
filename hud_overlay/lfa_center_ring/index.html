<!doctype html>
<html lang="en" data-bs-theme="dark" data-bs-core="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LFA Center Ring · HorizonTuner</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <link rel="stylesheet" href="lfa.css">
    <link rel="stylesheet" href="lfa-side-gauges.css">
    <link rel="stylesheet" href="lfa-expansion.css">
</head>
<body>
    <div class="hud-root-wrapper">
        <section id="lfaContainer" class="hud-gauge-container lfa-cluster" aria-label="Center ring driving telemetry">
            <svg id="lfaExpandedPane" class="lfa-expanded-pane" viewBox="0 0 560 370" aria-label="Expanded session telemetry" aria-hidden="true" style="display:none">
                <image href="assets/expanded-pane.png" width="560" height="370"/>
                <text class="lfa-expanded-heading" x="132" y="70">LAP DATA</text>
                <text class="lfa-expanded-label" x="56" y="109">CURRENT</text>
                <text id="lfaExpandedCurrent" class="lfa-expanded-current" x="188" y="110">—:—</text>
                <text class="lfa-expanded-label" x="45" y="145">LAST</text>
                <text id="lfaExpandedLast" class="lfa-expanded-time" x="188" y="146">—:—</text>
                <text class="lfa-expanded-label" x="36" y="181">BEST</text>
                <text id="lfaExpandedBest" class="lfa-expanded-time" x="188" y="182">—:—</text>
                <text class="lfa-expanded-label" x="36" y="217">TIRE 4W</text>
                <text id="lfaExpandedTire" class="lfa-expanded-value" x="188" y="218">N/A</text>
                <text id="lfaExpandedBoostLabel" class="lfa-expanded-label" x="43" y="253">BOOST</text>
                <text id="lfaExpandedBoost" class="lfa-expanded-boost" x="188" y="254">N/A</text>
                <text class="lfa-expanded-label" x="65" y="280">THR</text><text id="lfaExpandedThrottle" class="lfa-expanded-pedal" x="188" y="281">N/A</text>
                <text class="lfa-expanded-label" x="82" y="308">BRK</text><text id="lfaExpandedBrake" class="lfa-expanded-pedal" x="188" y="309">N/A</text>
            </svg>
            <img id="lfaCollapsedFascia" class="lfa-side-fascia" src="assets/side-crescents.png" alt="" draggable="false">
            <div id="lfaMovingCenter" class="lfa-moving-center">
            <div class="lfa-approved-center-mask"><img class="lfa-housing" src="assets/center-ring.png" alt="" draggable="false"></div>
            <canvas id="lfaScale" width="1120" height="740" aria-hidden="true"></canvas>
            <canvas id="lfaNeedle" width="1120" height="740" aria-hidden="true"></canvas>
            <div class="lfa-readouts">
                <div id="lfaSpeed" class="lfa-speed">—</div>
                <div id="lfaSpeedUnit" class="lfa-speed-unit">km/h</div>
                <div class="lfa-divider"></div>
                <div id="lfaGear" class="lfa-gear">—</div>
                <div class="lfa-gear-label">GEAR</div>
                <div id="lfaStatus" class="lfa-status" role="status">WAITING</div>
            </div>
            <div class="lfa-scale-unit">×1000 r/min</div>
            <div id="lfaSelfCheck" class="lfa-self-check" hidden>DISPLAY CHECK</div>
            </div>
            <svg id="lfaCollapsedReadings" class="lfa-side-readings" viewBox="0 0 560 370" aria-label="Four-wheel average tyre temperature, boost, throttle, brake and current lap">
                <g class="lfa-side-scale" aria-hidden="true">
                    <text id="lfaTireTick0" x="43" y="164">20</text><text id="lfaTireTick1" x="52" y="125">60</text>
                    <text id="lfaTireTick2" x="70" y="85">100</text><text id="lfaTireTick3" x="93" y="52">140°C</text>
                    <g text-anchor="end"><text id="lfaBoostTick0">0</text><text id="lfaBoostTick1">0.5</text><text id="lfaBoostTick2">1</text><text id="lfaBoostTick3">2</text></g>
                    <g class="lfa-boost-marks"><line id="lfaBoostMark0"/><line id="lfaBoostMark1"/><line id="lfaBoostMark2"/><line id="lfaBoostMark3"/></g>
                </g>
                <g id="lfaTireGauge" aria-label="Four-wheel average tyre temperature unavailable">
                    <path id="lfaTireFill" class="lfa-side-fill" d="M31 159 C35 122 51 79 82 48" pathLength="100"/>
                    <text class="lfa-side-caption" x="83" y="139">TIRE 4W</text>
                    <text id="lfaTire" class="lfa-side-middle" x="63" y="190">N/A</text>
                </g>
                <g id="lfaBoostGauge" aria-label="Boost unavailable">
                    <path id="lfaBoostFill" class="lfa-side-fill" d="M529 159 C525 122 509 79 478 48" pathLength="100"/>
                    <text id="lfaBoost" class="lfa-side-value" x="481" y="148">N/A</text>
                    <text id="lfaBoostUnit" class="lfa-side-caption" x="481" y="160">bar</text>
                    <text id="lfaBoostMode" class="lfa-side-caption lfa-vacuum-label" x="481" y="172"></text>
                </g>
                <g aria-label="Current lap elapsed"><text id="lfaLapTime" class="lfa-lap-time" x="497" y="190">—:—</text><text class="lfa-side-caption" x="497" y="204">LAP</text></g>
                <g id="lfaThrottleGauge" aria-label="Throttle unavailable">
                    <path id="lfaThrottleFill" class="lfa-side-fill" d="M103 314 C71 287 45 252 32 214" pathLength="100"/>
                    <text class="lfa-side-caption" x="94" y="259">THR</text><text id="lfaThrottle" class="lfa-side-value" x="94" y="281">N/A</text>
                </g>
                <g id="lfaBrakeGauge" aria-label="Brake unavailable">
                    <path id="lfaBrakeFill" class="lfa-side-fill lfa-brake-fill" d="M457 314 C489 287 515 252 528 214" pathLength="100"/>
                    <text class="lfa-side-caption" x="466" y="259">BRK</text><text id="lfaBrake" class="lfa-side-value" x="466" y="281">N/A</text>
                </g>
            </svg>
        </section>
    </div>
    <script src="../shared/hud-core.js"></script>
    <script src="lfa-auxiliary.js"></script>
    <script src="lfa-session.js"></script>
    <script src="lfa-expansion.js"></script>
    <script src="lfa-model.js"></script>
    <script src="lfa-renderer.js"></script>
    <script src="lfa-controller.js"></script>
</body>
</html>
