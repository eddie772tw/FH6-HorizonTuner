<!doctype html><html lang="en"><meta charset="utf-8"><title>LFA Center Ring visual fixture</title>
<style>html,body{margin:0;background:#10191e;color:#e5edf1;font:14px Arial,sans-serif}header{height:130px;padding:18px 24px;position:sticky;left:0;width:1000px;box-sizing:border-box}h1{font-size:18px;margin:0 0 10px;letter-spacing:1px}button,select{padding:6px 10px;margin-right:6px;background:#25353d;color:#e5edf1;border:1px solid #50656f}#report{display:block;margin-top:10px;font:11px monospace;color:#9fccba}#stage{position:relative;background:linear-gradient(165deg,#73868d 0%,#455d69 39%,#293b46 39.1%,#182830 90%);overflow:hidden}#stage:before{content:'';position:absolute;inset:45% 0 0;background:repeating-linear-gradient(0deg,transparent 0 61px,#b6d1da13 62px 63px)}#stage:after{content:'SYNTHETIC TELEMETRY · CHROMIUM FIXTURE · NOT A GAME CAPTURE';position:absolute;left:28px;top:28px;font:11px Arial;color:#c0d1d7;letter-spacing:2px;pointer-events:none}iframe{position:absolute;inset:0;border:0;width:100%;height:100%}</style>
<header><h1>LFA CENTER RING · VISUAL ACCEPTANCE</h1><label>Viewport <select id="size"><option>1280x720</option><option>1920x1080</option><option>2560x1440</option><option>740x500</option></select></label><label>State <select id="scenario"><option>metric</option><option>imperial</option><option>reverse</option><option>neutral</option><option>redline</option><option>missing</option><option>disconnected</option><option>error</option><option>high-rpm</option></select></label><button id="run">Run behavior checks</button><button id="detail">Detail scale</button><output id="report">Loading…</output></header><div id="stage"><iframe id="hud" title="LFA HUD" src="../../index.html"></iframe></div>
<script>
const params = new URLSearchParams(location.search); const size=document.querySelector('#size'), scenario=document.querySelector('#scenario'), stage=document.querySelector('#stage'), hud=document.querySelector('#hud'), report=document.querySelector('#report');
size.value=params.get('size')||'1280x720';scenario.value=params.get('state')||'metric';
let stamp=1000, timer=null, detail=params.has('detail'), running=false;
const base={rpm:7200,maxRpm:9000,redlineRpm:8000,speed_kmh:180,speed_mph:111.85,gear:4,throttle:.82,brake:0,isRaceOn:1};
const send=(type,data={})=>hud.contentWindow.postMessage({type,...data},location.origin);
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function setSize(){const [w,h]=size.value.split('x').map(Number);stage.style.width=w+'px';stage.style.height=h+'px';}
function tick(){let data={...base,timestamp_ms:++stamp}; switch(scenario.value){case'imperial':data.displayUnits={speed:'mph'};break;case'reverse':data.gear=0;data.rpm=1800;data.speed_kmh=16;break;case'neutral':data.gear=11;data.rpm=900;data.speed_kmh=0;break;case'redline':data.rpm=8400;data.gear=5;data.throttle=1;break;case'missing':data={timestamp_ms:stamp,rpm:3000};break;case'disconnected':data.timestamp_ms=100;break;case'error':data.success=false;break;case'high-rpm':data.rpm=13200;data.maxRpm=16000;data.redlineRpm=15000;break;}send('hud:frame',{data});}
function config(){send('config',{data:{isMetric:scenario.value!=='imperial',scale:detail?1.333333333:1,useDefaultColors:true,elements:{showGauge:true}}});}
function update(){if(running)return;setSize();config();tick();report.textContent='Preview: '+size.value+' · '+scenario.value+' · browser DPR '+devicePixelRatio+' · synthetic fixture';}
const reading=(id)=>hud.contentDocument.querySelector('#lfa'+id)?.textContent;
async function run(){running=true;clearInterval(timer);const results=[];let errors=[];const check=(name,condition)=>{results.push({name,passed:!!condition});if(!condition)errors.push(name);};const frame=async patch=>{send('hud:frame',{data:{...base,timestamp_ms:++stamp,...patch}});await delay(50);};
try{send('config',{data:{isMetric:true,scale:1,useDefaultColors:true,elements:{showGauge:true}}});await frame({});check('metric',reading('Speed')==='180'&&reading('SpeedUnit')==='km/h');
send('config',{data:{isMetric:false,scale:1}});await frame({displayUnits:{speed:'mph'}});check('imperial',reading('Speed')==='112'&&reading('SpeedUnit')==='mph');
await frame({gear:0});check('reverse',reading('Gear')==='R');await frame({gear:11});check('neutral',reading('Gear')==='N');
await frame({rpm:8400});check('redline',reading('Status')==='SHIFT');await frame({rpm:13200,maxRpm:16000,redlineRpm:15000});check('high-rpm',reading('Status')==='LIVE');
send('hud:frame',{data:{timestamp_ms:++stamp,rpm:3000}});await delay(50);check('missing',reading('Speed')==='—'&&reading('Gear')==='—');await frame({success:false});check('error',reading('Status')==='DATA ERROR'&&reading('Speed')==='—');await frame({isRaceOn:0});check('paused',reading('Status')==='PAUSED');
const repeat={...base,timestamp_ms:++stamp};for(let i=0;i<10;i++){send('hud:frame',{data:repeat});await delay(180);}check('stale-repeated-timestamp',reading('Status')==='NO SIGNAL'&&reading('Gear')==='—');await frame({});check('reconnect',reading('Status')==='LIVE');
send('hud:elements',{showGauge:false});await delay(50);check('hidden',getComputedStyle(hud.contentDocument.querySelector('#lfaContainer')).display==='none');send('hud:elements',{showGauge:true});await delay(50);check('shown',getComputedStyle(hud.contentDocument.querySelector('#lfaContainer')).display!=='none');
send('hud:animate');await delay(50);check('display-check',!hud.contentDocument.querySelector('#lfaSelfCheck').hidden);await frame({});check('live-ends-check',hud.contentDocument.querySelector('#lfaSelfCheck').hidden);
for(const value of ['1280x720','1920x1080','2560x1440']){size.value=value;setSize();await delay(50);const c=hud.contentDocument.querySelector('#lfaContainer').getBoundingClientRect();check('fits-'+value,c.x>=0&&c.y>=0&&c.right<=hud.clientWidth&&c.bottom<=hud.clientHeight);}
const c=hud.contentDocument.querySelector('#lfaNeedle');check('dpr-backing-store',c.width===Math.round(560*Math.min(3,Math.max(1,devicePixelRatio))));
check('transparent-outside',getComputedStyle(hud.contentDocument.body).backgroundColor==='rgba(0, 0, 0, 0)');
}catch(e){errors.push(e.message);}
const savedSize=params.get('size')||'1280x720';size.value=savedSize;setSize();scenario.value=params.get('state')||'metric';config();tick();running=false;timer=setInterval(tick,100);const summary={browser:navigator.userAgent,dpr:devicePixelRatio,viewport:size.value,results,errors};report.textContent=JSON.stringify(summary);report.dataset.results=JSON.stringify(summary);}
size.onchange=update;scenario.onchange=update;document.querySelector('#detail').onclick=()=>{detail=!detail;update();};document.querySelector('#run').onclick=run;
hud.onload=()=>{setSize();update();timer=setInterval(tick,100);if(params.has('autorun'))run();};setSize();
</script></html>
