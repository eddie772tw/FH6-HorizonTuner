<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Chaser JZX100 Optitron Digital Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .chaser-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 937px;
            height: 247px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container chaser-container" id="chaserContainer">
            <canvas id="chaserCanvas" width="937" height="247"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('chaserCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('chaserContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/chaser_clean_base.png';

            var tachoStrip = new Image();
            tachoStrip.src = 'assets/chaser_tacho_strip.png';

            var fuelStrip = new Image();
            fuelStrip.src = 'assets/chaser_fuel_strip.png';

            var tempStrip = new Image();
            tempStrip.src = 'assets/chaser_temp_strip.png';

            var telemetry = {
                speed: 150,
                rpm: 6200,
                maxRpm: 8000,
                gear: 4,
                fuel: 0.75,
                temp: 88
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean vector base
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 937, 247);
                }

                // 2. Dynamic Linear Optitron Tachometer Bar (y = 175)
                if (tachoStrip.complete) {
                    var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                    var stripW = 625;
                    var stripH = 20;
                    var stripX = 155;
                    var stripY = 175;

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(stripX, stripY, stripW * rpmRatio, stripH);
                    ctx.clip();
                    ctx.drawImage(tachoStrip, stripX, stripY, stripW, stripH);
                    ctx.restore();
                }

                // 3. Left Fuel Arc Bar
                if (fuelStrip.complete) {
                    var fuelRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                    var fW = 48;
                    var fH = 100;
                    var fX = 40;
                    var fY = 80;

                    ctx.save();
                    ctx.beginPath();
                    // Clip from bottom up
                    var visibleH = fH * fuelRatio;
                    ctx.rect(fX, fY + fH - visibleH, fW, visibleH);
                    ctx.clip();
                    ctx.drawImage(fuelStrip, fX, fY, fW, fH);
                    ctx.restore();
                }

                // 4. Right Coolant Temp Arc Bar
                if (tempStrip.complete) {
                    var tempRatio = Math.min(1.0, Math.max(0.0, (telemetry.temp - 40.0) / 80.0));
                    var tW = 48;
                    var tH = 100;
                    var tX = 850;
                    var tY = 80;

                    ctx.save();
                    ctx.beginPath();
                    var visibleH = tH * tempRatio;
                    ctx.rect(tX, tY + tH - visibleH, tW, visibleH);
                    ctx.clip();
                    ctx.drawImage(tempStrip, tX, tY, tW, tH);
                    ctx.restore();
                }

                // 5. Digital Speedometer (Center: 490, 80)
                ctx.save();
                ctx.fillStyle = '#b0f4ff';
                ctx.font = 'bold 64px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(176, 244, 255, 0.9)';
                ctx.shadowBlur = 12;
                ctx.fillText(String(Math.round(telemetry.speed)), 490, 80);

                // 6. Gear Indicator (Shift Box: 315, 78)
                ctx.font = 'bold 38px "Consolas", monospace';
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 315, 78);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('chaser_jzx100', {
                containerId: 'chaserContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (data.coolant_temp !== undefined) telemetry.temp = Number(data.coolant_temp);
                    if (data.fuel_level !== undefined) telemetry.fuel = Number(data.fuel_level);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 7800;
                        telemetry.speed = wave * 220;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('chaser_jzx100');
            render();
        })();
    </script>
</body>
</html>
