<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FH6 HorizonTuner HUD Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent !important;
            background-color: transparent !important;
            overflow: hidden;
            font-family: 'ForzaFont', Arial, sans-serif;
        }

        /* ── Fonts ─────────────────────────────────────────────────────────── */
        @font-face {
            font-family: 'ForzaFont';
            src: url('./shared/assets/fonts/HelveticaNowDisplay-CnIta.otf') format('opentype');
        }
        @font-face {
            font-family: 'ForzaGear';
            src: url('./shared/assets/fonts/HelveticaNowDisplay-CnMedIt.otf') format('opentype');
        }

        /* ── Central Telemetry Cluster Mount Point ─────────────────────────── */
        #teleCardsMount {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }

        /* ── HUD Mount Point ───────────────────────────────────────────────── */
        #hud-root {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ── Central Telemetry Cluster Mount Point ── -->
    <div id="teleCardsMount"></div>

    <!-- ── HUD Mount Point ── -->
    <div id="hud-root" data-physics="true">
        <iframe id="hud-iframe"
                src=""
                style="position:absolute;inset:0;width:100%;height:100%;border:none;background:transparent;"
                allowtransparency="true">
        </iframe>
    </div>

    <!-- ── HUD Launcher & Event Dispatcher ───────────────────────────────── -->
    <script type="module">
        import { TelemetryCardsManager }                                                        from './shared/telemetry-cards.js';
        import { initCoordinator }                                                              from './shared/coordinator.js';
        import { initWebSocket }                                                                from './shared/ws.js';
        import { createOverlayEventForwarder }                                                  from './shared/overlay-forwarding.js';
        import { initPhysics }                                                                  from './shared/physics.js';
        import { initUtils, isMetric, setSpeedUnit }                                            from './shared/utils.js';

        // Initialize Host-level Central Telemetry Cluster
        if (TelemetryCardsManager) {
            TelemetryCardsManager.init(document.getElementById('teleCardsMount'));
        }

        // ── Dynamic HUD switcher ──────────────────────────────────────────
        let hudStyles = {};
        const LEGACY_S650_STYLE_MAP = {
            s650_normal: 'normal',
            s650_heritage67: 'heritage67',
            s650_foxbody: 'foxbody'
        };
        const S650_HMI_THEMES = new Set([
            'normal', 'heritage67', 'foxbody', 'track'
        ]);
        const isLegacyS650Style = (name) => typeof name === 'string' && name !== 's650_hmi' && name.startsWith('s650_');

        function normalizeHudConfig(config) {
            const normalized = { ...(config || {}) };
            const legacyTheme = LEGACY_S650_STYLE_MAP[normalized.hudStyle];
            if (legacyTheme || isLegacyS650Style(normalized.hudStyle)) {
                normalized.hudStyle = 's650_hmi';
                normalized.s650Theme = legacyTheme || (S650_HMI_THEMES.has(normalized.s650Theme) ? normalized.s650Theme : 'heritage67');
            } else if (normalized.hudStyle === 's650_hmi' && !S650_HMI_THEMES.has(normalized.s650Theme)) {
                normalized.s650Theme = 'heritage67';
            }
            return normalized;
        }

        function applyHudUnit(config) {
            const unit = config?.effectiveUnit || config?.unit || 'kmh';
            setSpeedUnit(unit !== 'mph');
        }

        function normalizeHudStyle(name) {
            return LEGACY_S650_STYLE_MAP[name] || isLegacyS650Style(name) ? 's650_hmi' : name;
        }

        let activeHud = normalizeHudStyle(localStorage.getItem('forza_hud_active') || 'simple');
        const hudIframe = document.getElementById('hud-iframe');

        async function loadHudStyles() {
            const host = window.location.port ? window.location.host : '127.0.0.1:8001';
            try {
                const res = await fetch(`http://${host}/api/hud/styles`);
                if (res.ok) {
                    const data = await res.json();
                    hudStyles = {};
                    (data.styles || []).forEach(s => {
                        // The launcher is itself served from /hud/index.html.
                        // Keep the API prefix absolute to avoid /hud/hud/... paths.
                        hudStyles[s.id] = `${s.urlPrefix}/${s.id}/index.html`;
                    });
                    console.log('[Launcher] Dynamic HUD styles loaded:', Object.keys(hudStyles));
                    return;
                }
            } catch (e) {
                console.warn('[Launcher] Failed to fetch dynamic HUD styles from API:', e);
            }
        }

        // Post a message to the active HUD iframe
        function postToHud(type, detail = {}) {
            hudIframe.contentWindow?.postMessage({ type, ...detail }, '*');
        }

        const overlayEventForwarder = createOverlayEventForwarder(postToHud);

        async function loadHud(name, force = false) {
            if (window.demoActive) window.dispatchEvent(new CustomEvent('demo:stop'));

            name = normalizeHudStyle(name);
            activeHud = name;
            window._activeHud = name;
            localStorage.setItem('forza_hud_active', name);

            const targetUrl = hudStyles[name] || `./${name}/index.html`;
            // S650 HMI calibration lives in its static renderer modules. Always
            // refresh that iframe URL so a Dev WebView cannot keep an older
            // renderer after a source edit; other HUDs retain the old behavior.
            const shouldBustCache = force || name === 's650_hmi';
            const cacheBuster = shouldBustCache
                ? `${targetUrl.includes('?') ? '&' : '?'}t=${Date.now()}`
                : '';
            hudIframe.src = targetUrl + cacheBuster;

            hudIframe.onload = async () => {
                initPhysics();

                // Send initial state the HUD needs on first render
                postToHud('hud:init', {
                    isMetric: window.isMetric?.() ?? true,
                });

                if (window._currentHudConfig) {
                    postToHud('config', { data: window._currentHudConfig });
                }

                if (window._currentHudElements) {
                    postToHud('hud:elements', window._currentHudElements);
                }

                // Send immediate zero standby initial frame for clean load
                postToHud('hud:frame', {
                    data: {
                        rpm: 0,
                        maxRpm: 8000,
                        redlineRpm: 7200,
                        speed_kmh: 0,
                        speed_mph: 0,
                        gear: 0,
                        throttle: 0,
                        brake: 0
                    },
                    lockup: { fl: false, fr: false, rl: false, rr: false }
                });

                setTimeout(() => postToHud('hud:scale'), 30);
                console.log(`[Launcher] Loaded HUD: ${name} (${targetUrl})`);
            };
        }

        // ── Boot ──────────────────────────────────────────────────────────
        const host = window.location.port ? window.location.host : '127.0.0.1:8001';
        await loadHudStyles();
        try {
            const res = await fetch(`http://${host}/api/overlay/config`);
            const config = normalizeHudConfig(await res.json());
            applyHudUnit(config);
            window._currentHudConfig = config;
            if (config.elements) window._currentHudElements = config.elements;
            if (config.hudStyle) activeHud = normalizeHudStyle(config.hudStyle);
        } catch(e) {
            console.warn('[Launcher] Failed to fetch initial config', e);
        }

        await loadHud(activeHud);
        initUtils();
        initWebSocket();
        initCoordinator();

        // Forward events to iframe and TelemetryCardsManager
        const _HUD_FORWARD_EVENTS = [
            'hud:frame',
            'car:changed', 'car:learned',
            'speedunit:changed',
            'lc:state',
            'demo:start', 'demo:stop', 'demo:toggle',
            'tutorial:replay', 'tutorial:locked',
        ];

        _HUD_FORWARD_EVENTS.forEach(type => {
            window.addEventListener(type, (e) => {
                const detail = type === 'hud:frame'
                    ? { ...e.detail ?? {}, isMetric: isMetric() }
                    : e.detail ?? {};

                if (type === 'hud:frame' && window.TelemetryCardsManager) {
                    window.TelemetryCardsManager.update(detail.data || detail, window._currentHudConfig);
                }

                postToHud(type, detail);
            });
        });

        // Track demo active status at the top level
        window.demoActive = false;
        window.addEventListener('demo:start', () => window.demoActive = true);
        window.addEventListener('demo:stop', () => window.demoActive = false);
        window.addEventListener('demo:toggle', () => window.demoActive = !window.demoActive);

        // ── Config listener from Frontend UI ─────────────────────────────

        // ── WebSocket state forwarding ─────────────────────────────
        window.addEventListener('hud:audio', (e) => {
            overlayEventForwarder.onAudio(e.detail);
        });
        window.addEventListener('hud:media', (e) => {
            overlayEventForwarder.onMedia(e.detail);
        });

        window.addEventListener('hud:config', (e) => {
            const config = normalizeHudConfig(e.detail || {});
            applyHudUnit(config);
            window._currentHudConfig = config;
            if (window.TelemetryCardsManager) {
                window.TelemetryCardsManager.update(null, config);
            }
            postToHud('config', { data: config });
            if (config.elements) {
                window._currentHudElements = config.elements;
                postToHud('hud:elements', config.elements);
            }
            const requestedHud = config.hudStyle ? normalizeHudStyle(config.hudStyle) : activeHud;
            if (requestedHud !== activeHud) {
                console.log('[Launcher] Config requested HUD style change to:', requestedHud);
                loadHud(requestedHud);
            }
        });

        // BroadcastChannel listener for launch, animate & reload events
        const launcherBc = new BroadcastChannel('horizon_tuner_hud_channel');
        launcherBc.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'hud:animate') {
                postToHud('hud:animate');
            } else if (ev.data && ev.data.type === 'hud:reload') {
                if (ev.data.hudStyle) {
                    activeHud = normalizeHudStyle(ev.data.hudStyle);
                }
                console.log('[Launcher] Received hud:reload, reloading HUD:', activeHud);
                postToHud('hud:reload');
                loadHud(activeHud, true);
            } else if (ev.data && ev.data.type === 'config') {
                const config = normalizeHudConfig(ev.data.data || {});
                applyHudUnit(config);
                window._currentHudConfig = config;
                if (window.TelemetryCardsManager) {
                    window.TelemetryCardsManager.update(null, config);
                }

                // The control panel sends live edits through BroadcastChannel.  A
                // style change needs a new iframe, rather than only changing the
                // remembered style for a later reload.
                const requestedHud = config.hudStyle ? normalizeHudStyle(config.hudStyle) : activeHud;
                if (requestedHud !== activeHud) {
                    console.log('[Launcher] BroadcastChannel requested HUD style change to:', requestedHud);
                    loadHud(requestedHud);
                    return;
                }

                postToHud('config', { data: config });
                if (config.elements) {
                    window._currentHudElements = config.elements;
                    postToHud('hud:elements', config.elements);
                }
            }
        };

        // ── Message listener — receive requests from active HUD iframe ────────
        window.addEventListener('message', (e) => {
            if (e.source !== hudIframe.contentWindow) return;
            const { type, ...payload } = e.data ?? {};

            if (type === 'notification') {
                window.showNotification?.(payload.message, payload.duration);
            }
        });
    </script>
</body>
</html>
