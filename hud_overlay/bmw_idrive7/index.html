<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Live Cockpit iDrive 7 HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <!--
        [設計決策紀錄 / Design Decision Note]
        1. 水溫與油溫/油壓資料來源：
           水溫 (Water / Coolant Temp) 直接採用遙測輪胎溫度 (Tire Temp FL/FR/RL/RR) 之平均值（若為華氏則自動轉為攝氏，待機時預設 85°C）；
           油溫 (Oil Temp) 與油壓 (Oil Pressure) 因 Forza UDP 封包未提供原生感測器數值，暫依轉速比與節氣門/增壓負載驅動之確定性熱力學與油壓代理模型 (Deterministic Proxy Model) 模擬。
        2. 增壓單位鎖定 (Hardcoded Unit Override)：
           本錶頭盤面視覺元素已固定標記「psi」與「hp」，因此增壓值始終採用 PSI (`boost_psi`)、馬力始終採用 HP (`power_hp`)，忽視外部傳遞之增壓/功率單位設定。
    -->
    <style>
        .bmw-idrive-container {
            width: 446px;
            height: 365px;
            position: relative;
            pointer-events: none;
        }
        #bmwCanvas {
            display: block;
            width: 446px;
            height: 365px;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, calc(var(--hud-glow-intensity, 1.0) * 0.55)));
        }
        .redline-alert {
            filter: drop-shadow(0 0 24px rgba(255, 20, 50, 0.9));
        }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>

    <div class="hud-root-wrapper">
        <div class="hud-gauge-container bmw-idrive-container" id="bmwIdriveContainer">
            <canvas id="bmwCanvas" width="638" height="522"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>

    <script>
        (function() {
            var canvas = document.getElementById('bmwCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('bmwIdriveContainer');

            var baseImg = HUDArtwork.loadImage('assets/bmw_clean_base.png');
            var barsImg = HUDArtwork.loadImage('assets/bmw_bars_full.png', 0);

            var isSweeping = false;
            var sweepRafId = null;
            var isMetric = true;

            var telemetry = {
                speed: 0,
                rpm: 0,
                maxRpm: 8000,
                gear: 1,
                boostPsi: 0,
                powerHp: 0,
                tempC: 85
            };

            function formatGear(g) {
                var gearNum = Number(g);
                if (!Number.isFinite(gearNum) || gearNum < 0 || gearNum === 11) return 'N';
                if (gearNum === 0) return 'R';
                return String(Math.round(gearNum));
            }

            function resolveWaterTempC(data) {
                if (!data) return 85;
                var fl = Number(data.temp_fl !== undefined ? data.temp_fl : (data.tire_temp_fl !== undefined ? data.tire_temp_fl : (data.TireTemp && data.TireTemp[0])));
                var fr = Number(data.temp_fr !== undefined ? data.temp_fr : (data.tire_temp_fr !== undefined ? data.tire_temp_fr : (data.TireTemp && data.TireTemp[1])));
                var rl = Number(data.temp_rl !== undefined ? data.temp_rl : (data.tire_temp_rl !== undefined ? data.tire_temp_rl : (data.TireTemp && data.TireTemp[2])));
                var rr = Number(data.temp_rr !== undefined ? data.temp_rr : (data.tire_temp_rr !== undefined ? data.tire_temp_rr : (data.TireTemp && data.TireTemp[3])));
                var sum = 0, count = 0;
                if (Number.isFinite(fl) && fl > 0) { sum += fl; count++; }
                if (Number.isFinite(fr) && fr > 0) { sum += fr; count++; }
                if (Number.isFinite(rl) && rl > 0) { sum += rl; count++; }
                if (Number.isFinite(rr) && rr > 0) { sum += rr; count++; }
                if (count > 0) {
                    var avg = sum / count;
                    return avg > 125 ? (avg - 32) * 5 / 9 : avg;
                }
                if (Number.isFinite(Number(data.coolant_temp)) && Number(data.coolant_temp) > 0) {
                    return Number(data.coolant_temp);
                }
                return 85;
            }

            function drawClippedBar(polyPts, yTop, yBottom, ratio) {
                var r = Math.min(1.0, Math.max(0.0, ratio));
                if (r <= 0.002 || !barsImg.complete || !barsImg.naturalWidth) return;
                var yCut = yBottom - r * (yBottom - yTop);
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(polyPts[0][0], polyPts[0][1]);
                for (var i = 1; i < polyPts.length; i++) {
                    ctx.lineTo(polyPts[i][0], polyPts[i][1]);
                }
                ctx.closePath();
                ctx.clip();

                ctx.beginPath();
                ctx.rect(0, yCut, 638, yBottom - yCut + 4);
                ctx.clip();

                ctx.drawImage(barsImg, 0, 0, 638, 522);
                ctx.restore();
            }

            // Polygon masks separating the 4 D3D11 bar regions in 638x522 space:
            var POLY_RPM = [
                [85, 20], [425, 20], [425, 495], [168, 495], [112, 335], [85, 335]
            ];
            var POLY_TEMP = [
                [20, 336], [112, 336], [168, 495], [20, 495]
            ];
            var POLY_PSI = [
                [430, 170], [500, 170], [546, 286], [500, 402], [430, 402]
            ];
            var POLY_HP = [
                [500, 170], [625, 170], [625, 402], [500, 402], [546, 286]
            ];

            function render() {
                var w = 638;
                var h = 522;
                ctx.clearRect(0, 0, w, h);

                if (baseImg.complete && baseImg.naturalWidth) {
                    ctx.drawImage(baseImg, 0, 0, w, h);
                }

                var maxRpm = Math.max(4000, telemetry.maxRpm || 8000);
                // The dial face prints 0..8 (8000 RPM scale); map RPM against maxRpm
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / maxRpm));
                var tempRatio = Math.min(1.0, Math.max(0.0, (telemetry.tempC - 50) / 100));
                var psiRatio = Math.min(1.0, Math.max(0.0, telemetry.boostPsi / 29.0));
                var hpRatio = Math.min(1.0, Math.max(0.0, telemetry.powerHp / 750.0));

                // Draw the 4 authentic D3D11 bars
                drawClippedBar(POLY_RPM, 30, 486, rpmRatio);
                drawClippedBar(POLY_TEMP, 343, 482, tempRatio);
                drawClippedBar(POLY_PSI, 179, 393, psiRatio);
                drawClippedBar(POLY_HP, 179, 393, hpRatio);

                var isRedline = rpmRatio > 0.88;

                // Dynamic Center Readouts (Gear & Speed in 638x522 coordinate space)
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'Alphabetic';

                // Gear indicator (left of the 3 shift chevrons at x=335, y=268)
                var gearChar = formatGear(telemetry.gear);
                ctx.fillStyle = isRedline ? '#ff2244' : '#ff9911';
                ctx.font = 'italic 900 76px "Segoe UI", Arial, sans-serif';
                ctx.shadowColor = isRedline ? 'rgba(255, 20, 50, 0.75)' : 'rgba(255, 150, 20, 0.45)';
                ctx.shadowBlur = 12;
                ctx.fillText(gearChar, 330, 272);

                // Speed readout (left of the native 'km/h' label at x=436, y=334)
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'italic 800 66px "Segoe UI", Arial, sans-serif';
                ctx.shadowColor = 'rgba(0, 200, 255, 0.45)';
                ctx.shadowBlur = 10;
                ctx.fillText(String(Math.max(0, Math.round(telemetry.speed))), 408, 352);

                ctx.restore();

                if (isRedline) {
                    container.classList.add('redline-alert');
                } else {
                    container.classList.remove('redline-alert');
                }
            }

            baseImg.onload = render;
            barsImg.onload = render;

            HUDCore.registerStyle('bmw_idrive7', {
                containerId: 'bmwIdriveContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onInit: function(cfg) {
                    if (cfg) {
                        if (cfg.isMetric !== undefined) isMetric = cfg.isMetric !== false;
                        else if (cfg.unit) isMetric = cfg.unit !== 'mph';
                    }
                    render();
                },

                onElementsChange: function(elements) {
                    if (container && elements && elements.showGauge !== undefined) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (!data) return;
                    payload = payload || {};
                    if (payload.isMetric !== undefined) isMetric = payload.isMetric !== false;
                    if (data.displayUnits && data.displayUnits.speed) {
                        isMetric = data.displayUnits.speed !== 'mph';
                    }

                    telemetry.speed = isMetric
                        ? Number(data.speed_kmh !== undefined ? data.speed_kmh : (data.speed || 0))
                        : Number(data.speed_mph !== undefined ? data.speed_mph : ((data.speed_kmh || data.speed || 0) * 0.621371));
                    telemetry.rpm = Number(data.rpm || 0);
                    telemetry.maxRpm = Number(data.max_rpm || data.maxRpm || payload.redlineRpm || 8000);
                    telemetry.gear = data.gear !== undefined ? Number(data.gear) : 1;

                    // Hardcoded PSI on dial face: always use PSI
                    var rawPsi = data.boost_psi !== undefined
                        ? Number(data.boost_psi)
                        : (data.Boost !== undefined ? Number(data.Boost) : Number(data.boost || 0));
                    telemetry.boostPsi = Math.max(0, rawPsi);

                    // Hardcoded HP on dial face: always use HP
                    telemetry.powerHp = Math.max(0, Number(data.power_hp !== undefined ? data.power_hp : (data.power || 0)));

                    // Water / Oil temperature proxy
                    var waterC = resolveWaterTempC(data);
                    var rpmRatio = Math.min(1, Math.max(0, telemetry.rpm / Math.max(1000, telemetry.maxRpm)));
                    telemetry.tempC = telemetry.rpm > 0 ? Math.min(145, Math.max(50, waterC + rpmRatio * 12)) : 50;

                    if (!isSweeping) {
                        render();
                    }
                },

                onAnimate: function() {
                    if (sweepRafId !== null) cancelAnimationFrame(sweepRafId);
                    isSweeping = true;
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 8000;
                        telemetry.maxRpm = 8000;
                        telemetry.speed = wave * 260;
                        telemetry.gear = progress < 0.98 ? Math.max(1, Math.min(8, Math.ceil(wave * 7))) : 1;
                        telemetry.boostPsi = wave * 28;
                        telemetry.powerHp = wave * 720;
                        telemetry.tempC = 50 + wave * 95;
                        render();
                        if (progress < 1) {
                            sweepRafId = requestAnimationFrame(sweep);
                        } else {
                            isSweeping = false;
                            sweepRafId = null;
                            telemetry.rpm = 0;
                            telemetry.speed = 0;
                            telemetry.gear = 1;
                            telemetry.boostPsi = 0;
                            telemetry.powerHp = 0;
                            telemetry.tempC = 50;
                            render();
                        }
                    }
                    sweepRafId = requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('bmw_idrive7');
            render();
        })();
    </script>
</body>
</html>
