<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McLaren 720S Folding Slim Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .mclaren-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 918px;
            height: 120px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container mclaren-container" id="mclarenContainer">
            <canvas id="mclarenCanvas" width="918" height="120"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('mclarenCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('mclarenContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/mclaren_clean_base.png';

            var telemetry = {
                speed: 185,
                rpm: 7400,
                maxRpm: 8500,
                gear: 5
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean base
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 918, 120);
                }

                // 2. Dynamic Red Needle Marker across linear track (x: 180..750, y: 35..65)
                var rpmRatio = Math.min(1.0, Math.max(0.0, (telemetry.rpm - 1000.0) / 7500.0));
                var needleX = 180 + rpmRatio * 570;

                ctx.save();
                // Red sweep trail
                var grad = ctx.createLinearGradient(needleX - 60, 48, needleX, 48);
                grad.addColorStop(0, 'rgba(255, 34, 51, 0.0)');
                grad.addColorStop(1, 'rgba(255, 34, 51, 0.6)');
                ctx.fillStyle = grad;
                ctx.fillRect(needleX - 60, 42, 60, 12);

                // Red needle blade
                ctx.fillStyle = '#ff2233';
                ctx.shadowColor = '#ff2233';
                ctx.shadowBlur = 8;
                ctx.fillRect(needleX - 2, 28, 4, 38);
                ctx.restore();

                // 3. Papaya Orange Gear Indicator (Left: 55, 75)
                ctx.save();
                ctx.fillStyle = '#ff6b00';
                ctx.font = 'bold 64px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 107, 0, 0.8)';
                ctx.shadowBlur = 10;
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 55, 75);

                // 4. Digital Speedometer (Right: 835, 68)
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 58px "Segoe UI", Arial, sans-serif';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowBlur = 8;
                ctx.fillText(String(Math.round(telemetry.speed)), 835, 68);

                ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = '#a0aec0';
                ctx.shadowBlur = 0;
                ctx.fillText('KMH', 835, 96);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('mclaren_720s', {
                containerId: 'mclarenContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 8400;
                        telemetry.speed = wave * 290;
                        telemetry.gear = wave > 0.5 ? 5 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('mclaren_720s');
            render();
        })();
    </script>
</body>
</html>
