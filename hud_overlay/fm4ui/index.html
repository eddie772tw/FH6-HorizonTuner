<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forza Motorsport 4 HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .fm4_re-container {
            width: 270px; height: 270px;
            pointer-events: none;
        }
        canvas { display: block; width: 270px; height: 270px; }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container fm4_re-container" id="fm4_reContainer">
            <canvas id="fm4_reCanvas" width="270" height="270"></canvas>
        </div>
    </div>

    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('fm4_reCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var images = {};
            var loadedCount = 0;
            var totalImages = 0;
            var isReady = false;

            var rpm_bands = [
                { minimum: 17000, face: "rpm_16500", frame_rate: 0.01285 },
                { minimum: 15000, face: "rpm_14200", frame_rate: 0.01485 },
                { minimum: 12000, face: "rpm_12100", frame_rate: 0.01500 },
                { minimum: 11000, face: "rpm_10300", frame_rate: 0.02235 },
                { minimum: 10000, face: "rpm_9400",  frame_rate: 0.02240 },
                { minimum: 9000,  face: "rpm_8800",  frame_rate: 0.02705 },
                { minimum: 8000,  face: "rpm_8000",  frame_rate: 0.02690 },
                { minimum: 7000,  face: "rpm_6400",  frame_rate: 0.03390 },
                { minimum: 6000,  face: "rpm_6200",  frame_rate: 0.03875 },
                { minimum: 5000,  face: "rpm_4600",  frame_rate: 0.039875 },
                { minimum: 3500,  face: "rpm_3300",  frame_rate: 0.05350 }
            ];
            var fallback_gauge = { face: "rpm_8800", frame_rate: 0.02705 };

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function selectGauge(maxRpm) {
                for (var i = 0; i < rpm_bands.length; i++) {
                    if (maxRpm >= rpm_bands[i].minimum) return rpm_bands[i];
                }
                return fallback_gauge;
            }

            function gearAssetKey(label) {
                if (label === 'R') return 'gear_R';
                if (label === 'N') return 'gear_N';
                var g = parseInt(label, 10);
                if (!isNaN(g) && g >= 1 && g <= 9) return 'gear_' + g;
                return null;
            }

            // Preload asset map
            var assetMap = {
                base: "./assets/img/background/background.png"
            };





            var keys = Object.keys(assetMap);
            totalImages = keys.length;

            keys.forEach(function(key) {
                var img = new Image();
                img.onload = function() {
                    images[key] = img;
                    loadedCount++;
                    if (loadedCount >= totalImages) isReady = true;
                };
                img.onerror = function() {
                    loadedCount++;
                    if (loadedCount >= totalImages) isReady = true;
                };
                img.src = assetMap[key];
            });

            var showUnits = true;
            var isMetricUnit = true;

            window.renderFM4RE = function(data) {
                if (!ctx || !isReady) return;
                ctx.clearRect(0, 0, 270, 270);

                var maxRpm = data.maxRpm || data.max_rpm || 8000;
                var rpm = data.rpm || 0;
                var mps = data.SpeedMetersPerSecond || 0;
                var speed = isMetricUnit ? (data.speed_kmh || data.speed || mps * 3.6) : (data.speed_mph || mps * 2.23694);

                var gearVal = data.gear;
                var gearLabel = gearVal === 0 ? 'R' : (gearVal === 11 ? 'N' : (gearVal !== undefined ? String(gearVal) : '1'));

                var gauge = selectGauge(Math.max(0, maxRpm));
                var maxFrames = 269;

                var startAngle = 91.4 * Math.PI / 180;
                var sweepAngle = 228.4 * Math.PI / 180;
                var cx = 135;
                var cy = 135;

                // 2. Draw base frame
                if (images["base"]) ctx.drawImage(images["base"], 0, 0, 270, 270);

                // 1. Draw gauge face (ticks, labels, redline)
                ctx.save();
                ctx.font = 'bold 15px ForzaFont, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 2;

                var maxDrawRpm = 10000; // default for 8000
                if (gauge.face === "rpm_16500") maxDrawRpm = 18000;
                else if (gauge.face === "rpm_14200") maxDrawRpm = 16000;
                else if (gauge.face === "rpm_12100") maxDrawRpm = 14000;
                else if (gauge.face === "rpm_10300") maxDrawRpm = 12000;
                else if (gauge.face === "rpm_9400") maxDrawRpm = 12000;
                else if (gauge.face === "rpm_8800") maxDrawRpm = 10000;
                else if (gauge.face === "rpm_8000") maxDrawRpm = 10000;
                else if (gauge.face === "rpm_6400") maxDrawRpm = 8000;
                else if (gauge.face === "rpm_6200") maxDrawRpm = 7000;
                else if (gauge.face === "rpm_4600") maxDrawRpm = 6000;
                else if (gauge.face === "rpm_3300") maxDrawRpm = 5000;

                for (var r = 0; r <= maxDrawRpm; r += 250) {
                    var frame = Math.round(r * gauge.frame_rate);
                    if (frame > maxFrames) continue;

                    var angle = startAngle + (frame / maxFrames) * sweepAngle;

                    var isMajor = r % 1000 === 0;
                    var isMedium = r % 500 === 0 && !isMajor;
                    var isLabel = r % 2000 === 0;

                    if (gauge.face === "rpm_16500" || gauge.face === "rpm_14200" || gauge.face === "rpm_12100") {
                        isLabel = r % 3000 === 0;
                    }

                    var isRedline = r >= gauge.minimum;

                    ctx.beginPath();
                    var r1 = isMajor ? 111 : (isMedium ? 114 : 117);
                    var r2 = 120;
                    ctx.moveTo(cx + r1 * Math.cos(angle), cy + r1 * Math.sin(angle));
                    ctx.lineTo(cx + r2 * Math.cos(angle), cy + r2 * Math.sin(angle));

                    ctx.strokeStyle = isRedline ? '#c00' : 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = isMajor ? 3 : (isMedium ? 2 : 1.5);
                    ctx.stroke();

                    if (isLabel) {
                        var lr = 95;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText((r / 1000).toString(), cx + lr * Math.cos(angle), cy + lr * Math.sin(angle));
                    }
                }

                var redlineStartF = Math.round(gauge.minimum * gauge.frame_rate);
                var redlineStartA = startAngle + (redlineStartF / maxFrames) * sweepAngle;
                var redlineEndA = startAngle + sweepAngle;

                if (redlineStartF <= maxFrames) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, 115, redlineStartA, redlineEndA);
                    ctx.strokeStyle = '#c00';
                    ctx.lineWidth = 6;
                    ctx.stroke();
                }
                ctx.restore();

                // 3. Draw gear
                ctx.save();
                ctx.font = 'bold 50px ForzaGear, Arial, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(gearLabel, 139.5, 106);
                ctx.restore();

                // 4. Draw RPM rev needle and the sweeping arc
                var rFrame = Math.round(Math.max(0, rpm) * gauge.frame_rate);
                var nAngle = startAngle + (Math.min(rFrame, maxFrames) / maxFrames) * sweepAngle;

                // Draw the sweeping arc that fills up to the needle
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, 115, startAngle, nAngle);
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 8;
                ctx.stroke();
                ctx.restore();

                // Draw the needle head
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(nAngle);
                ctx.beginPath();
                ctx.moveTo(106, -3.5);
                ctx.lineTo(125, -2);
                ctx.lineTo(125, 2);
                ctx.lineTo(106, 3.5);
                ctx.closePath();
                ctx.fillStyle = '#d00';
                ctx.fill();
                ctx.restore();

                // 5. Draw speed
                ctx.save();
                ctx.font = 'bold 42px ForzaFont, Arial, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(Math.floor(Math.max(0, speed)).toString(), 141, 186);
                ctx.restore();

                // 6. Draw unit label
                if (showUnits) {
                    ctx.save();
                    ctx.font = 'bold 11px ForzaGear, Arial, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(isMetricUnit ? 'KM/H' : 'MPH', 135, 213);
                    ctx.restore();
                }
            }

            var sweepActive = false;
            function triggerSweep() {
                if (sweepActive) return;
                sweepActive = true;
                var startTime = performance.now();
                var duration = 1200;
                var maxRpm = 8000;

                function animate(now) {
                    var elapsed = now - startTime;
                    var progress = Math.min(1.0, elapsed / duration);
                    var mockRpm = 0;
                    if (progress < 0.5) {
                        var p = progress / 0.5;
                        mockRpm = maxRpm * Math.sin(p * Math.PI / 2);
                    } else {
                        var p = (progress - 0.5) / 0.5;
                        mockRpm = maxRpm * (1 - Math.sin(p * Math.PI / 2)) + 1000 * Math.sin(p * Math.PI / 2);
                    }

                    renderFM4RE({
                        rpm: mockRpm,
                        maxRpm: maxRpm,
                        speed: (mockRpm / maxRpm) * 180,
                        gear: 3
                    });

                    if (progress < 1.0) {
                        requestAnimationFrame(animate);
                    } else {
                        sweepActive = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            HUDCore.registerStyle('fm4_re', {
                containerId: 'fm4_reContainer',
                scaleMultiplier: 1.4,
                onInit: function(payload) {
                    if (payload) {
                        if (payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    }
                },
                onElementsChange: function(elements) {
                    var c = document.getElementById('fm4_reContainer');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function(data, payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    if (!sweepActive) renderFM4RE(data);
                },
                onAnimate: function() {
                    triggerSweep();
                }
            });

            HUDCore.init('fm4_re');
            setTimeout(triggerSweep, 100);
        })();
    </script>
</body>
</html>
