<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forza Motorsport 4 HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .fm4_re-container {
            width: 270px; height: 270px;
            pointer-events: none;
        }
        canvas { display: block; width: 270px; height: 270px; }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container fm4_re-container" id="fm4_reContainer">
            <canvas id="fm4_reCanvas" width="270" height="270"></canvas>
        </div>
    </div>

    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('fm4_reCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var SIZE = 270, CX = 135, CY = 135, START_A = 91.4 * Math.PI / 180, SWEEP_A = 228.4 * Math.PI / 180;
            var MAX_DRAW = { rpm_16500: 18000, rpm_14200: 16000, rpm_12100: 14000, rpm_10300: 12000, rpm_9400: 12000, rpm_8800: 10000, rpm_8000: 10000, rpm_6400: 8000, rpm_6200: 7000, rpm_4600: 6000, rpm_3300: 5000 };
            var TICK_INNER = [111, 114, 117], TICK_WIDTH = [3, 2, 1.5], pixelRatio = 1, lastPixelSize = SIZE, hudScale = 1, destroyed = false, fontsReady = false;
            var dialCanvas = null, dialCtx = null, cachedFace = '', cachedDialSize = 0, cachedBaseReady = false, cachedFontsReady = false, sweepRafId = null, sweepTimerId = null, liveData = null, lastDisplayData = { rpm: 0, maxRpm: 8000, speed: 0, gear: 11 };

            var rpm_bands = [
                { minimum: 17000, face: "rpm_16500", frame_rate: 0.01285 },
                { minimum: 15000, face: "rpm_14200", frame_rate: 0.01485 },
                { minimum: 12000, face: "rpm_12100", frame_rate: 0.01500 },
                { minimum: 11000, face: "rpm_10300", frame_rate: 0.02235 },
                { minimum: 10000, face: "rpm_9400",  frame_rate: 0.02240 },
                { minimum: 9000,  face: "rpm_8800",  frame_rate: 0.02705 },
                { minimum: 8000,  face: "rpm_8000",  frame_rate: 0.02690 },
                { minimum: 7000,  face: "rpm_6400",  frame_rate: 0.03390 },
                { minimum: 6000,  face: "rpm_6200",  frame_rate: 0.03875 },
                { minimum: 5000,  face: "rpm_4600",  frame_rate: 0.039875 },
                { minimum: 3500,  face: "rpm_3300",  frame_rate: 0.05350 }
            ];
            var fallback_gauge = { face: "rpm_8800", frame_rate: 0.02705 };

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function selectGauge(maxRpm) {
                for (var i = 0; i < rpm_bands.length; i++) {
                    if (maxRpm >= rpm_bands[i].minimum) return rpm_bands[i];
                }
                return fallback_gauge;
            }

            var isMetricUnit = true, baseImg = new Image();
            baseImg.onload = function() { if (!destroyed) renderFM4RE(lastDisplayData); }; baseImg.src = './assets/img/background/background.png';
            function finiteOr(v, fb) { var n = Number(v); return Number.isFinite(n) ? n : fb; }
            function formatGear(g) { if (g === undefined) return '1'; if (g === 0 || g === '0' || g === 'R') return 'R'; if (g === 11 || g === '11' || g === 'N' || g === null) return 'N'; var n = Number(g); return Number.isInteger(n) && n >= 1 && n <= 10 ? String(n) : 'N'; }
            function syncUnit(d, p) { isMetricUnit = d && d.displayUnits && d.displayUnits.speed ? d.displayUnits.speed !== 'mph' : (p && typeof p.isMetric === 'boolean' ? p.isMetric : (p && p.unit ? p.unit !== 'mph' : isMetricUnit)); }
            function resolveGlowRadius(base) { return base > 0 ? base * pixelRatio * clamp(finiteOr(window._currentGlowIntensity, 1), 0, 2) : 0; }
            function resolveSpeed(d) { var mps = finiteOr(d.SpeedMetersPerSecond, 0); return Math.max(0, finiteOr(isMetricUnit ? (d.speed_kmh !== undefined ? d.speed_kmh : (d.speed !== undefined ? d.speed : mps * 3.6)) : (d.speed_mph !== undefined ? d.speed_mph : (d.speed_kmh !== undefined ? Number(d.speed_kmh) * 0.621371 : (d.speed !== undefined ? Number(d.speed) * 0.621371 : mps * 2.23694))), 0)); }
            function syncBackingStore() {
                if (!canvas || !ctx) return;
                var dpr = finiteOr(window.devicePixelRatio, 1), next = Math.max(1, Math.round(SIZE * clamp((dpr > 0 ? dpr : 1) * Math.max(1, finiteOr(hudScale, 1)), 1, 3)));
                if (canvas.width !== next || canvas.height !== next) { canvas.width = next; canvas.height = next; } lastPixelSize = canvas.width || next; pixelRatio = lastPixelSize / SIZE;
            }
            function drawDialFace(target, gauge, baseReady) {
                if (baseReady) target.drawImage(baseImg, 0, 0, SIZE, SIZE);
                target.font = 'bold 15px ForzaFont, Arial, sans-serif'; target.textAlign = 'center'; target.textBaseline = 'middle'; target.shadowColor = 'rgba(0, 0, 0, 0.5)'; target.shadowBlur = 2 * pixelRatio;
                var maxDrawRpm = MAX_DRAW[gauge.face] || 10000, maxFrames = 269, labelStep = (gauge.face === 'rpm_16500' || gauge.face === 'rpm_14200' || gauge.face === 'rpm_12100') ? 3000 : 2000;
                for (var pass = 0; pass < 6; pass++) {
                    var isRedPass = pass >= 3, tier = pass % 3, hasSeg = false; target.beginPath();
                    for (var r = 0; r <= maxDrawRpm; r += 250) {
                        var frame = r * gauge.frame_rate;
                        if (frame > maxFrames || (r % 1000 === 0 ? 0 : (r % 500 === 0 ? 1 : 2)) !== tier || (r >= gauge.minimum) !== isRedPass) continue;
                        var a = START_A + (frame / maxFrames) * SWEEP_A, cos = Math.cos(a), sin = Math.sin(a);
                        target.moveTo(CX + TICK_INNER[tier] * cos, CY + TICK_INNER[tier] * sin); target.lineTo(CX + 120 * cos, CY + 120 * sin); hasSeg = true;
                    }
                    if (hasSeg) { target.strokeStyle = isRedPass ? '#c00' : 'rgba(255, 255, 255, 0.7)'; target.lineWidth = TICK_WIDTH[tier]; target.stroke(); }
                }
                target.fillStyle = '#ffffff';
                for (var lr = 0; lr <= maxDrawRpm; lr += labelStep) { var lf = lr * gauge.frame_rate; if (lf <= maxFrames) target.fillText(String(lr / 1000), CX + 95 * Math.cos(START_A + (lf / maxFrames) * SWEEP_A), CY + 95 * Math.sin(START_A + (lf / maxFrames) * SWEEP_A)); }
                var redStartF = gauge.minimum * gauge.frame_rate;
                if (redStartF <= maxFrames) { target.beginPath(); target.arc(CX, CY, 115, START_A + (redStartF / maxFrames) * SWEEP_A, START_A + SWEEP_A); target.strokeStyle = '#c00'; target.lineWidth = 6; target.stroke(); }
                target.shadowBlur = 0;
            }
            function ensureDialCache(gauge) {
                var baseReady = Boolean(baseImg.complete && baseImg.naturalWidth > 0);
                if (!dialCanvas && typeof document.createElement === 'function') { dialCanvas = document.createElement('canvas'); dialCtx = dialCanvas && dialCanvas.getContext ? dialCanvas.getContext('2d') : null; }
                if (!dialCtx) { drawDialFace(ctx, gauge, baseReady); return false; }
                if (cachedFace !== gauge.face || cachedDialSize !== lastPixelSize || cachedBaseReady !== baseReady || cachedFontsReady !== fontsReady) {
                    if (dialCanvas.width !== lastPixelSize || dialCanvas.height !== lastPixelSize) { dialCanvas.width = lastPixelSize; dialCanvas.height = lastPixelSize; }
                    dialCtx.save(); try { dialCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0); dialCtx.clearRect(0, 0, SIZE, SIZE); drawDialFace(dialCtx, gauge, baseReady); cachedFace = gauge.face; cachedDialSize = lastPixelSize; cachedBaseReady = baseReady; cachedFontsReady = fontsReady; } finally { dialCtx.restore(); }
                } return true;
            }
            function renderFM4RE(data) {
                if (destroyed || !ctx) return;
                lastDisplayData = data || {}; syncBackingStore(); ctx.save();
                try {
                    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    var maxRpm = Math.max(0, finiteOr(lastDisplayData.maxRpm !== undefined ? lastDisplayData.maxRpm : lastDisplayData.max_rpm, 8000)), rpm = Math.max(0, finiteOr(lastDisplayData.rpm, 0)), gauge = selectGauge(maxRpm), maxFrames = 269;
                    ctx.clearRect(0, 0, SIZE, SIZE); if (ensureDialCache(gauge)) ctx.drawImage(dialCanvas, 0, 0, SIZE, SIZE);
                    ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0, 0, 0, 0.8)'; ctx.shadowBlur = 4 * pixelRatio; ctx.font = 'bold 50px ForzaGear, Arial, sans-serif'; ctx.fillText(formatGear(lastDisplayData.gear), 139.5, 106);
                    var rFrame = Math.min(maxFrames, rpm * gauge.frame_rate), nAngle = START_A + (rFrame / maxFrames) * SWEEP_A;
                    if (rFrame > 0) { ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(CX, CY, 115, START_A, nAngle); ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 8; ctx.stroke(); }
                    ctx.save(); ctx.translate(CX, CY); ctx.rotate(nAngle); ctx.shadowColor = 'rgba(221, 0, 0, 0.85)'; ctx.shadowBlur = resolveGlowRadius(rpm >= gauge.minimum ? 8 : 3);
                    ctx.beginPath(); ctx.moveTo(106, -3.5); ctx.lineTo(125, -2); ctx.lineTo(125, 2); ctx.lineTo(106, 3.5); ctx.closePath(); ctx.fillStyle = '#d00'; ctx.fill(); ctx.restore();
                    ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0, 0, 0, 0.8)'; ctx.shadowBlur = 4 * pixelRatio; ctx.font = 'bold 42px ForzaFont, Arial, sans-serif'; ctx.fillText(String(Math.floor(resolveSpeed(lastDisplayData))), 141, 186);
                    ctx.font = 'bold 11px ForzaGear, Arial, sans-serif'; ctx.fillStyle = 'rgba(255, 255, 255, 0.72)'; ctx.fillText(isMetricUnit ? 'KM/H' : 'MPH', 135, 213);
                } finally { ctx.restore(); }
            } window.renderFM4RE = renderFM4RE;

            var sweepActive = false;
            function stopSweep() { if (sweepTimerId !== null) { clearTimeout(sweepTimerId); sweepTimerId = null; } if (sweepRafId !== null) { cancelAnimationFrame(sweepRafId); sweepRafId = null; } sweepActive = false; }
            function triggerSweep() {
                if (destroyed || sweepActive) return;
                stopSweep(); sweepActive = true; var startTime = performance.now(), duration = 1200, maxRpm = 8000;
                function animate(now) {
                    if (destroyed) return;
                    var progress = Math.min(1.0, Math.max(0, now - startTime) / duration);
                    var mockRpm = 0;
                    if (progress < 0.5) {
                        var p = progress / 0.5;
                        mockRpm = maxRpm * Math.sin(p * Math.PI / 2);
                    } else {
                        var p = (progress - 0.5) / 0.5;
                        mockRpm = maxRpm * (1 - Math.sin(p * Math.PI / 2)) + 1000 * Math.sin(p * Math.PI / 2);
                    }

                    renderFM4RE({
                        rpm: mockRpm,
                        maxRpm: maxRpm,
                        speed: (mockRpm / maxRpm) * 180,
                        gear: 3
                    });

                    if (progress < 1.0) sweepRafId = requestAnimationFrame(animate);
                    else { sweepActive = false; sweepRafId = null; if (liveData) renderFM4RE(liveData); }
                }
                sweepRafId = requestAnimationFrame(animate);
            }
            function onResize() { if (!destroyed) renderFM4RE(lastDisplayData); }
            function onPageHide(e) { if (!e || !e.persisted) destroy(); } function onMsg(e) { if (e && e.data && e.data.type === 'hud:destroy') destroy(); }
            function destroy() { if (destroyed) return; destroyed = true; stopSweep(); window.removeEventListener('resize', onResize); window.removeEventListener('pagehide', onPageHide); window.removeEventListener('message', onMsg); }
            window.addEventListener('resize', onResize); window.addEventListener('pagehide', onPageHide); window.addEventListener('message', onMsg);
            if (document.fonts && typeof document.fonts.load === 'function') Promise.all([document.fonts.load('bold 42px ForzaFont'), document.fonts.load('bold 50px ForzaGear')]).then(function() { fontsReady = true; if (!destroyed) renderFM4RE(lastDisplayData); }).catch(function() {});
            HUDCore.registerStyle('fm4_re', {
                containerId: 'fm4_reContainer', scaleMultiplier: 1.4,
                onScale: function(scale) { if (!destroyed) { hudScale = scale; renderFM4RE(lastDisplayData); } },
                onInit: function(payload) { if (!destroyed) syncUnit(null, payload); },
                onElementsChange: function(elements) { var c = !destroyed && document.getElementById('fm4_reContainer'); if (c) c.style.display = elements && elements.showGauge === false ? 'none' : 'block'; },
                onFrame: function(data, payload) { if (destroyed) return; if (sweepTimerId !== null) { clearTimeout(sweepTimerId); sweepTimerId = null; } syncUnit(data, payload); liveData = data || {}; if (!sweepActive) renderFM4RE(liveData); },
                onAnimate: function() { triggerSweep(); }
            });
            HUDCore.init('fm4_re'); renderFM4RE(lastDisplayData); sweepTimerId = setTimeout(function() { sweepTimerId = null; triggerSweep(); }, 100);
        })();
    </script>
</body>
</html>
