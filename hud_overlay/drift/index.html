<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Drift HUD</title>
    <!-- 引入共享 Base 樣式 -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        /* ── Fonts ──────────────────────────────────────────────────────── */
        @font-face {
            font-family: 'ForzaFont';
            src: url('../shared/assets/fonts/HelveticaNowDisplay-CnIta.otf') format('opentype');
        }

        @font-face {
            font-family: 'ForzaGear';
            src: url('../shared/assets/fonts/HelveticaNowDisplay-CnMedIt.otf') format('opentype');
        }

        .hud-root-wrapper {
            position: fixed;
            inset: 0;
            display: block;
            padding: 0;
            overflow: visible;
        }

        /* ── Gauge Container (1680px x 640px) ───────────────── */
        .drift-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            transform-origin: center center;
            pointer-events: none;
            background: transparent;
        }

        canvas#driftCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        /* ── Floating Tech Popups Hero Banner ────────────────────────────── */
        #drift-popup-hero {
            position: fixed;
            top: 18vh;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 0;
            box-shadow: 0 0 16px rgba(85, 223, 255, 0.28);
            padding: 0;
            border-radius: 0;
            font-family: 'ForzaGear', Arial, sans-serif;
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
            z-index: 200;
        }

        #drift-popup-hero.active {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        #drift-popup-hero.hero-event {
            box-shadow: 0 0 20px rgb(255, 0, 102);
            color: #ffffff;
        }

        /* Drift Style MVP: transparent HUD-local information layer, with no
           secondary rectangular dock behind the text. */
        #drift-style-container {
            position: fixed;
            right: 4vw;
            top: 28vh;
            width: min(360px, 21vw);
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            font-family: 'ForzaGear', Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            z-index: 180;
        }

        #drift-style-container.active { opacity: 1; }

        .drift-style-heading {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.72);
        }

        .drift-style-rank {
            font-size: 2rem;
            font-weight: 700;
            color: #55dfff;
            text-shadow: 0 0 9px rgba(85, 223, 255, 0.72);
        }

        .drift-style-meter {
            height: 5px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        .drift-style-meter-fill {
            width: 0;
            height: 100%;
            background: #55dfff;
            box-shadow: 0 0 8px rgba(85, 223, 255, 0.85);
        }

        .drift-style-event {
            display: none;
            justify-content: space-between;
            align-items: baseline;
            min-height: 26px;
            font-size: 1.2rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .drift-style-event .event-source {
            font-size: 0.8rem;
            font-family: Bahnschrift, Arial, sans-serif;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.58);
        }

        .drift-style-event.flow .event-value { color: #55dfff; text-shadow: 0 0 8px rgba(85, 223, 255, 0.65); }
        .drift-style-event.hold .event-value { color: #ffb84a; text-shadow: 0 0 8px rgba(255, 184, 74, 0.62); }
        .drift-style-event.risk .event-value { color: rgb(255, 0, 102); text-shadow: 0 0 8px rgba(255, 0, 102, 0.7); }
    </style>
</head>

<body>
    <!-- 共享中央遙測掛載點 -->
    <div id="teleCardsMount"></div>

    <!-- Viewport-anchored Drift layers stay outside the logical canvas. -->
    <div id="drift-popup-hero">HANDBRAKE ENTRY</div>
    <div id="drift-style-container" aria-hidden="true">
        <div class="drift-style-heading">
            <span id="drift-style-title">STYLE METER</span>
            <span id="drift-style-rank" class="drift-style-rank">D</span>
        </div>
        <div class="drift-style-meter"><div id="drift-style-meter-fill" class="drift-style-meter-fill"></div></div>
        <div id="drift-style-flow" class="drift-style-event flow"><span class="event-source">FLOW</span><span class="event-value"></span></div>
        <div id="drift-style-hold" class="drift-style-event hold"><span class="event-source">HOLD</span><span class="event-value"></span></div>
        <div id="drift-style-risk" class="drift-style-event risk"><span class="event-source">RISK</span><span class="event-value"></span></div>
    </div>

    <!-- 093 LAB 標準自適應視窗根包裝 -->
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container drift-container" id="driftContainer">
            <!-- Floating Event Popup Banner -->
            <!-- 全向量 1680px x 640px 畫布 (動態 maxRpm 萬轉/萬轉以下紅線區 1500/1000rpm 跨度) -->
            <canvas id="driftCanvas" width="1920" height="1080"></canvas>
        </div>
    </div>

    <!-- 腳本引入：Telemetry Cards & HUD Core -->
    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script src="./assets/drift_layout.js?v=drift-layout-20260812"></script>
    <script src="./assets/drift_display_math.js?v=drift-layout-20260811"></script>
    <script src="./assets/drift_style_engine.js?v=drift-style-mvp-20260811"></script>

    <script>
        (function () {
            'use strict';

            var canvas = document.getElementById('driftCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var driftLayout = window.DriftLayout;
            var viewportTransform = driftLayout
                ? driftLayout.getViewportTransform(window.innerWidth, window.innerHeight, 0)
                : { scale: 1, offsetX: 0, offsetY: 0 };
            var canvasDpr = 1;

            // ── Color Palette Standard (093 LAB. Cyber & Street Palette) ──────
            var C_WHITE = '#ffffff';
            var C_WHITE_DIM = 'rgba(255, 255, 255, 0.72)';
            var C_TRACK = 'rgba(255, 255, 255, 0.18)';
            var C_REDLINE = 'rgb(255, 0, 102)';
            var C_REDLINE_DIM = 'rgba(255, 0, 102, 0.40)';
            var C_AMBER = '#FFB84A';
            var C_MINT = '#52FFEB';
            var C_ICE = '#55DFFF';
            var C_FRAME_FILL = 'rgba(8, 16, 28, 0.46)';
            var C_FRAME_EDGE = 'rgba(85, 223, 255, 0.42)';

            var FLOW_LABELS = { 1: 'BUILD', 2: 'NORMAL', 3: 'CHASE', 4: 'SMOOTH', 5: 'LOCKED' };
            var RISK_LABELS = { 1: 'SAFE', 2: 'EDGE', 3: 'RISK', 4: 'MAX' };

            var FLOW_COLOR_MAP = {
                1: C_WHITE_DIM,
                2: C_WHITE,
                3: C_AMBER,
                4: C_ICE,
                5: C_MINT
            };

            var RISK_COLOR_MAP = {
                1: C_WHITE,
                2: C_AMBER,
                3: C_REDLINE,
                4: C_REDLINE
            };

            // ── 全域幾何對稱與 5 區塊對齊變數 (Unified Offset Math) ────────────
            var CANVAS_CX = 840;
            var CANVAS_CY = 320;
            var MAIN_ARC_HALF_WIDTH = 350;
            var SECONDARY_CX = 1430;
            var SECONDARY_CY = 485;
            var FRAME_RX = 412;
            var FRAME_RY = 174;
            var PRIMARY_SOURCE_WIDTH = (FRAME_RX + 18) * 2;
            var PRIMARY_SOURCE_HEIGHT = (FRAME_RY + 16) * 2;
            var PRIMARY_SOURCE_ASPECT = PRIMARY_SOURCE_WIDTH / PRIMARY_SOURCE_HEIGHT;
            // The compact primary occupies the lower-left wing between FH6's
            // map and Drift Zone total. Its scale is calculated on resize.
            var PRIMARY_SLOT_PREFERRED_WIDTH = 260;
            var primaryRenderScale = 0.30;
            var primaryAnchor = null;
            // Advanced effective width is ~544px and VFD is ~630px at their
            // shared default scale. Use the midpoint as Drift's conventional
            // bottom-right secondary box.
            var SECONDARY_BOX_WIDTH = 590;
            var SECONDARY_BOX_HEIGHT = 288;
            var SECONDARY_BOX_PADDING = 30;
            var SECONDARY_SOURCE_WIDTH = 520;
            var SECONDARY_SOURCE_HEIGHT = 252;
            var SECONDARY_HALF_WIDTH = SECONDARY_SOURCE_WIDTH * 0.5;
            var SECONDARY_HALF_HEIGHT = SECONDARY_SOURCE_HEIGHT * 0.5;

            var ANGLE_TICKS = [-60, -45, -30, -15, 0, 15, 30, 45, 60];

            // ── 左區與右區共用字體樣式與大小控制變數 (Shared Typography Controls) ──
            var FONT_SIDE_MIDDLE_VAL = 'italic bold 72px ForzaGear';
            var FONT_SIDE_SUB_LABEL = 'italic bold 38px ForzaGear';
            var FONT_GEAR_VALUE = 'italic bold 190px ForzaGear';
            var FONT_SPEED_VALUE = 'italic bold 90px ForzaGear';
            var PRIMARY_UNIT_FONT = 'bold 42px Bahnschrift';

            // 從字體字串中動態解析像素高度
            function parseFontSize(fontStr) {
                var match = fontStr.match(/(\d+)px/);
                return match ? parseInt(match[1], 10) : 40;
            }

            var SIDE_MID_FONT_SIZE = parseFontSize(FONT_SIDE_MIDDLE_VAL);

            // ── Global State Engine ──────────────────────────────────────────
            var isMetricUnit = true;

            var angle = 0.0;
            var displayAngle = 0.0;
            var holdSeconds = 0.0;
            var speedKmh = 0;
            var displaySpeed = 0;
            var gear = 'N';
            var rpm = 0;
            var maxRpm = 9000; // 預設 9000 RPM，會隨遙測 data.maxRpm 動態更新
            var torqueValue = 0;
            var torqueUnit = 'N·M';

            var accelPct = 0;
            var brakePct = 0;
            var clutchPct = 0;
            var handbrakePct = 0;
            var steerPct = 0;
            var counterPct = 0;
            var counterArcAngle = 0;
            var isCountering = false;

            // Secondary Advanced-style instrument state. Keep the attitude
            // indicator on the same HUDCore frame as the input gauges.
            var travelAngleDeg = 0;
            var slipAnglesDeg = [0, 0, 0, 0];
            var slipRatios = [0, 0, 0, 0];
            var wheelLockup = { fl: false, fr: false, rl: false, rr: false };
            var lcState = 'inactive';

            var flowPct = 0;
            var flowQuality = 1;
            var spinRisk = 0;
            var riskLevel = 1;

            var inputFlashTtl = { H: 0, C: 0, B: 0, T: 0 };
            var prevInputs = { H: 0, C: 0, B: 0, T: 0 };
            var driftSweepActive = false;
            var driftSweepStartedAt = 0;
            var driftSweepFrame = { rpm: 0, angle: 0, speed: 0 };
            var DRIFT_SWEEP_DURATION = 1500;

            // Drift Style is a HUD-local domain module. Keep this snapshot
            // preallocated so the render hot path does not create frame objects.
            var driftStyleEngine = window.DriftStyleEngine ? window.DriftStyleEngine.create() : null;
            var driftDisplayMath = window.DriftDisplayMath || null;
            var driftStyleFrame = { speedKmh: 0, angle: 0, flowQuality: 0, riskLevel: 0 };
            var driftStyleUi = {
                container: document.getElementById('drift-style-container'),
                hero: document.getElementById('drift-popup-hero'),
                title: document.getElementById('drift-style-title'),
                rank: document.getElementById('drift-style-rank'),
                meterFill: document.getElementById('drift-style-meter-fill'),
                flow: document.getElementById('drift-style-flow'),
                hold: document.getElementById('drift-style-hold'),
                risk: document.getElementById('drift-style-risk'),
                nextPaintAt: 0,
                visible: false,
                rowVisible: { flow: false, hold: false, risk: false }
            };

            function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
            function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

            function resizeDriftCanvas() {
                if (!canvas || !ctx || !driftLayout) return;

                var width = Math.max(1, window.innerWidth || 1920);
                var height = Math.max(1, window.innerHeight || 1080);
                canvasDpr = Math.min(2, window.devicePixelRatio || 1);
                viewportTransform = driftLayout.getViewportTransform(width, height, 0);
                primaryAnchor = driftLayout.getFh6PrimaryAnchor(
                    width,
                    height,
                    PRIMARY_SLOT_PREFERRED_WIDTH,
                    PRIMARY_SOURCE_ASPECT
                );
                primaryRenderScale = primaryAnchor.width / (PRIMARY_SOURCE_WIDTH * viewportTransform.scale);
                canvas.width = Math.round(width * canvasDpr);
                canvas.height = Math.round(height * canvasDpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(
                    canvasDpr * viewportTransform.scale,
                    0,
                    0,
                    canvasDpr * viewportTransform.scale,
                    canvasDpr * viewportTransform.offsetX,
                    canvasDpr * viewportTransform.offsetY
                );
            }

            window.addEventListener('resize', resizeDriftCanvas);

            function triggerDriftStyleSpecial(id) {
                if (!driftSweepActive && driftStyleEngine) driftStyleEngine.triggerSpecial(id, performance.now());
            }

            function triggerDriftSweepAnimation() {
                if (driftSweepActive) return;
                driftSweepActive = true;
                driftSweepStartedAt = performance.now();
                if (driftStyleEngine) driftStyleEngine.reset();
            }

            function setDriftStyleText(element, value) {
                if (element && element.textContent !== value) element.textContent = value;
            }

            function setDriftStyleRow(source, value, visible) {
                var row = driftStyleUi[source];
                if (!row) return;
                if (driftStyleUi.rowVisible[source] !== visible) {
                    row.style.display = visible ? 'flex' : 'none';
                    driftStyleUi.rowVisible[source] = visible;
                }
                if (visible) setDriftStyleText(row.lastElementChild, value);
            }

            function renderDriftStyleHero(style) {
                var hero = driftStyleUi.hero;
                if (!hero) return;

                var text = '';
                if (style.summary.active && style.summary.specialLabel) {
                    text = 'BEST SPECIAL · ' + style.summary.specialLabel + ' ×' + style.summary.specialCount;
                } else if (style.special.active) {
                    text = style.special.label + ' +' + style.special.points + (style.special.count > 1 ? ' ×' + style.special.count : '');
                }

                if (text) {
                    setDriftStyleText(hero, text);
                    hero.classList.add('hero-event');
                    hero.classList.add('active');
                } else {
                    hero.classList.remove('active');
                    hero.classList.remove('hero-event');
                }
            }

            // The engine advances at RAF cadence, while the fixed DOM container
            // is refreshed at 12.5 Hz to avoid layout work in the 60 Hz path.
            function renderDriftStyleContainer(now) {
                if (!driftStyleEngine || now < driftStyleUi.nextPaintAt) return;
                driftStyleUi.nextPaintAt = now + 80;

                var style = driftStyleEngine.getState();
                var summary = style.summary;
                var isSummary = summary.active;
                renderDriftStyleHero(style);
                var visible = style.runActive || isSummary;
                if (driftStyleUi.visible !== visible && driftStyleUi.container) {
                    driftStyleUi.container.classList.toggle('active', visible);
                    driftStyleUi.visible = visible;
                }
                if (!visible) return;

                var rankCode = isSummary ? summary.rankCode : style.rankCode;
                var rankLabel = isSummary ? summary.rankLabel : style.rankLabel;
                var meterRatio = isSummary ? summary.meterRatio : style.meterRatio;
                setDriftStyleText(driftStyleUi.title, (isSummary ? 'RUN COMPLETE · ' : 'STYLE · ') + rankLabel);
                setDriftStyleText(driftStyleUi.rank, rankCode);
                if (driftStyleUi.meterFill) driftStyleUi.meterFill.style.width = Math.round(meterRatio * 100) + '%';

                if (isSummary) {
                    setDriftStyleRow('flow', summary.flowLabel ? summary.flowLabel + ' ×' + summary.flowCount : '', !!summary.flowLabel);
                    setDriftStyleRow('hold', summary.holdSeconds > 0 ? 'HOLD ' + summary.holdSeconds.toFixed(1) + 's' : '', summary.holdSeconds > 0);
                    setDriftStyleRow('risk', summary.riskLabel ? summary.riskLabel + ' ×' + summary.riskCount : '', !!summary.riskLabel);
                    return;
                }

                var events = style.events;
                setDriftStyleRow('flow', events.flow.label ? events.flow.label + ' ×' + events.flow.count : '', !!events.flow.label);
                setDriftStyleRow('hold', events.hold.seconds > 0 ? 'HOLD ' + events.hold.seconds.toFixed(1) + 's' : '', events.hold.seconds > 0);
                setDriftStyleRow('risk', events.risk.label ? events.risk.label + ' ×' + events.risk.count : '', !!events.risk.label);
            }

            // One continuous oval surface aligns the visual system with the twin arc gauges.
            function drawModernFrame() {
                if (!ctx) return;

                ctx.save();
                var rx = FRAME_RX + 18;
                var ry = FRAME_RY + 16;
                var frameGradient = ctx.createRadialGradient(CANVAS_CX, CANVAS_CY, 20, CANVAS_CX, CANVAS_CY, 470);
                frameGradient.addColorStop(0, 'rgba(14, 29, 45, 0.62)');
                frameGradient.addColorStop(0.58, C_FRAME_FILL);
                frameGradient.addColorStop(1, 'rgba(5, 12, 22, 0.16)');
                ctx.beginPath();
                ctx.ellipse(CANVAS_CX, CANVAS_CY, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = frameGradient;
                ctx.fill();

                ctx.lineWidth = 1.25;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
                ctx.stroke();

                ctx.globalAlpha = 0.58;
                ctx.strokeStyle = C_FRAME_EDGE;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(CANVAS_CX, CANVAS_CY, FRAME_RX, FRAME_RY, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.globalAlpha = 0.74;
                ctx.strokeStyle = C_ICE;
                ctx.shadowColor = C_ICE;
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(CANVAS_CX, CANVAS_CY, FRAME_RX, FRAME_RY, 0, Math.PI * 1.15, Math.PI * 1.85);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.globalAlpha = 0.4;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(CANVAS_CX, CANVAS_CY, FRAME_RX, FRAME_RY, 0, Math.PI * 0.15, Math.PI * 0.85);
                ctx.strokeStyle = C_ICE;
                ctx.stroke();
                ctx.restore();
            }

            // ── 1. 上弧條：飄移角度 Arc & 角度數字刻度 (-60° ... 0° ... +60°) ──────
            var topArcGeo = { cx: CANVAS_CX, cy: CANVAS_CY, halfWidth: MAIN_ARC_HALF_WIDTH };

            function topCurvePoint(t) {
                return driftLayout.ellipsePoint(t, topArcGeo.cx, topArcGeo.cy, topArcGeo.halfWidth, FRAME_RX, FRAME_RY, 'top');
            }

            function renderTopAngleArc() {
                if (!ctx) return;

                var absAngle = Math.abs(displayAngle);
                var activeT = clamp(absAngle / 60.0, 0.0, 1.0);
                var signedT = displayAngle >= 0 ? activeT : -activeT;

                var segments = 80;
                for (var i = 0; i <= segments; i++) {
                    var t = -1.0 + (2.0 * i) / segments;
                    var p = topCurvePoint(t);
                    var normAbs = Math.abs(t);
                    var isOn = signedT >= 0 ? (t >= 0.0 && t <= signedT) : (t >= signedT && t <= 0.0);

                    ctx.save();
                    var barW = normAbs >= 0.75 ? 6.0 : 4.0;
                    var barH = isOn ? (normAbs >= 0.75 ? 34 : 26) : (normAbs >= 0.75 ? 20 : 15);
                    var rx = p.x - barW * 0.5;
                    var ry = p.y;

                    var col = isOn ? (normAbs >= 0.75 ? C_REDLINE : C_WHITE) : (normAbs >= 0.75 ? C_REDLINE_DIM : C_TRACK);
                    ctx.fillStyle = col;
                    if (isOn) {
                        ctx.shadowColor = col;
                        ctx.shadowBlur = normAbs >= 0.75 ? 16 : 8;
                    }
                    ctx.beginPath();
                    ctx.roundRect(rx, ry, barW, barH, 1.2);
                    ctx.fill();
                    ctx.restore();
                }

                // Center 0° Origin Dot
                var originP = topCurvePoint(0.0);
                ctx.save();
                ctx.beginPath();
                ctx.arc(originP.x, originP.y + 8, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();

                // ── 上弧：飄移角度數字刻度 (-60°, -45°, -30°, -15°, 0°, 15°, 30°, 45°, 60°) ──
                ctx.save();
                var compactPrimary = primaryRenderScale < 0.35;
                ctx.font = compactPrimary ? 'bold 42px Bahnschrift' : 'bold 16px Bahnschrift';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';

                for (var i = 0; i < ANGLE_TICKS.length; i++) {
                    var tickAngle = ANGLE_TICKS[i];
                    if (compactPrimary && tickAngle !== 0 && Math.abs(tickAngle) !== 45) continue;
                    var tVal = tickAngle / 60.0;
                    var tickP = topCurvePoint(tVal);
                    var isCenter = tickAngle === 0;
                    var isExtreme = Math.abs(tickAngle) >= 45;

                    ctx.fillStyle = isCenter ? C_WHITE : (isExtreme ? C_AMBER : C_WHITE_DIM);
                    if (isExtreme) { ctx.shadowColor = C_AMBER; ctx.shadowBlur = 6; }
                    else { ctx.shadowBlur = 0; }

                    var labelStr = tickAngle === 0 ? '0°' : (tickAngle > 0 ? '+' + tickAngle + '°' : tickAngle + '°');
                    ctx.fillText(labelStr, tickP.x, tickP.y + 36);
                }
                ctx.restore();

                // Steering input is normalized onto the ±45° steering range
                // inside the wider ±60° drift-angle scale. It is intentionally
                // a pointer, not a falsely precise wheel-angle number.
                if (Math.abs(steerPct) > 0.5) {
                    var pointerPoint = topCurvePoint(counterArcAngle / 60.0);
                    var pointerColor = isCountering ? C_AMBER : C_ICE;
                    ctx.save();
                    ctx.fillStyle = pointerColor;
                    ctx.shadowColor = pointerColor;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(pointerPoint.x, pointerPoint.y - 15);
                    ctx.lineTo(pointerPoint.x - 7, pointerPoint.y - 3);
                    ctx.lineTo(pointerPoint.x + 7, pointerPoint.y - 3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ── 2. 下弧條：動態 maxRpm & 動態紅線區 (萬轉以上 1500rpm / 萬轉以下 1000rpm 跨度) ─
            var botArcGeo = { cx: CANVAS_CX, cy: CANVAS_CY, halfWidth: MAIN_ARC_HALF_WIDTH };

            function botCurvePoint(t) {
                return driftLayout.ellipsePoint(t, botArcGeo.cx, botArcGeo.cy, botArcGeo.halfWidth, FRAME_RX, FRAME_RY, 'bottom');
            }

            function renderBottomTachoArc() {
                if (!ctx) return;

                // 2A. 動態計算錶盤上限 RPM Limit (向上取整至千轉)
                var safeMaxRpm = Math.max(1000, maxRpm || 9000);
                var rpmLimit = Math.ceil(safeMaxRpm / 1000) * 1000;
                var maxK = Math.floor(rpmLimit / 1000);

                // 2B. 動態計算紅線區起點 Redline Start Threshold
                // 萬轉以上 (maxRpm >= 10000): 跨度 1500 RPM; 萬轉以下: 跨度 1000 RPM
                var redlineSpan = safeMaxRpm >= 10000 ? 1500 : 1000;
                var redlineStartRpm = Math.max(0, safeMaxRpm - redlineSpan);

                var currentRpm = Math.max(0, rpm || 0);
                var rpmRatio = clamp(currentRpm / rpmLimit, 0, 1);
                var segments = 60;

                for (var i = 0; i <= segments; i++) {
                    var segRatio = i / segments;
                    var segRpmVal = segRatio * rpmLimit;
                    var t = -1.0 + 2.0 * segRatio;
                    var p = botCurvePoint(t);

                    var rActive = segRatio <= rpmRatio;
                    var isRedlineSeg = segRpmVal >= redlineStartRpm; // 動態紅線判斷

                    ctx.save();
                    var barW = isRedlineSeg ? 5.8 : 4.0;
                    var barH = rActive ? (isRedlineSeg ? 30 : 24) : (isRedlineSeg ? 16 : 13);
                    var rx = p.x - barW * 0.5;
                    var ry = p.y - barH;

                    if (rActive) {
                        ctx.fillStyle = isRedlineSeg ? C_REDLINE : (segRpmVal > safeMaxRpm * 0.65 ? C_AMBER : C_WHITE);
                        ctx.shadowColor = ctx.fillStyle;
                        ctx.shadowBlur = isRedlineSeg ? 14 : 7;
                    } else {
                        ctx.fillStyle = isRedlineSeg ? C_REDLINE_DIM : C_TRACK;
                        ctx.shadowBlur = 0;
                    }

                    ctx.beginPath();
                    ctx.roundRect(rx, ry, barW, barH, 1.2);
                    ctx.fill();
                    ctx.restore();
                }

                // ── 下弧：動態轉速 x1000 數字刻度 (0 ... maxK x1000) ────────────
                ctx.save();
                var compactPrimary = primaryRenderScale < 0.35;
                ctx.font = compactPrimary ? 'bold 42px Bahnschrift' : 'bold 13px Bahnschrift';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                for (var k = 0; k <= maxK; k++) {
                    if (compactPrimary && k !== 0 && k !== maxK && k !== Math.round(maxK * 0.5)) continue;
                    var tickRpmVal = k * 1000;
                    var kRatio = tickRpmVal / rpmLimit;
                    var tK = -1.0 + 2.0 * kRatio;
                    var tickP = botCurvePoint(tK);
                    var isRedTick = tickRpmVal >= redlineStartRpm;

                    if (isRedTick) {
                        ctx.fillStyle = C_REDLINE;
                        ctx.shadowColor = C_REDLINE;
                        ctx.shadowBlur = 8;
                    } else {
                        ctx.fillStyle = C_WHITE_DIM;
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillText(String(k), tickP.x, tickP.y - 36);
                }
                ctx.restore();
            }

            // ── 3A. 中央左區：(中間文字始終置中，上下文字切齊中間文字上下緣) ─────────────
            function renderLeftAngleCluster() {
                if (!ctx) return;

                var absA = Math.abs(displayAngle);
                var ratingColor = C_WHITE;
                if (absA >= 45) ratingColor = C_REDLINE;
                else if (absA >= 30) ratingColor = C_AMBER;
                else if (absA >= 15) ratingColor = C_MINT;

                var midHalfH = SIDE_MID_FONT_SIZE * 0.42;
                var topEdgeY = CANVAS_CY - midHalfH;
                var botEdgeY = CANVAS_CY + midHalfH;

                ctx.save();
                ctx.textAlign = 'right';

                // 中層：飄移角度大字 (始終垂直置中 CANVAS_CY = 320)
                ctx.textBaseline = 'middle';
                ctx.font = FONT_SIDE_MIDDLE_VAL;
                ctx.fillStyle = ratingColor;
                ctx.shadowColor = ratingColor;
                ctx.shadowBlur = absA >= 15 ? (absA >= 45 ? 16 : 10) : 8;
                ctx.fillText(displayAngle.toFixed(1) + '°', LEFT_CLUSTER_X, CANVAS_CY);

                // 上層：GRIP / HOLD 秒數標籤 (貼齊中間文字上緣 textBaseline = 'bottom')
                ctx.textBaseline = 'bottom';
                ctx.font = FONT_SIDE_SUB_LABEL;
                var holdText = holdSeconds > 0.5 ? 'HOLD: ' + holdSeconds.toFixed(1) + 's' : 'GRIP';
                var holdColor = holdSeconds > 0.5 ? C_AMBER : C_WHITE_DIM;
                ctx.fillStyle = holdColor;
                ctx.shadowColor = holdColor;
                ctx.shadowBlur = holdSeconds > 0.5 ? 8 : 0;
                ctx.fillText(holdText, LEFT_CLUSTER_X, topEdgeY);

                // 下層：方向標籤 (貼齊中間文字下緣 textBaseline = 'top')
                ctx.textBaseline = 'top';
                ctx.font = FONT_SIDE_SUB_LABEL;
                ctx.fillStyle = C_WHITE_DIM;
                ctx.shadowColor = C_WHITE_DIM;
                ctx.shadowBlur = 0;
                var dirStr = displayAngle < -1.0 ? 'LEFT DRIFT' : (displayAngle > 1.0 ? 'RIGHT DRIFT' : 'CENTER');
                ctx.fillText(dirStr, LEFT_CLUSTER_X, botEdgeY);

                ctx.restore();
            }

            // ── 3B. 中央中區：(檔位始終置中，實時速度貼齊檔位下緣) ─────────────────────
            function renderCenterGearCluster() {
                if (!ctx) return;

                ctx.save();
                ctx.textAlign = 'center';

                // 超大型檔位 (120px, 始終垂直置中 CANVAS_CY = 320px)
                ctx.textBaseline = 'middle';

                ctx.fillStyle = C_WHITE;
                ctx.shadowColor = C_WHITE;
                ctx.shadowBlur = 8;
                ctx.fillText(gear, CANVAS_CX, CANVAS_CY);

                // 實時速度 (48px, 貼齊檔位下緣 textBaseline = 'top')
                ctx.textBaseline = 'middle';

                ctx.fillStyle = C_WHITE_DIM;
                ctx.shadowColor = C_WHITE_DIM;
                ctx.shadowBlur = 0;
                ctx.textAlign = 'right';
                ctx.fillText(displaySpeed, CANVAS_CX - 92, CANVAS_CY);
                ctx.textAlign = 'left';
                ctx.fillStyle = C_AMBER;
                ctx.shadowColor = C_AMBER;
                ctx.shadowBlur = 6;
                ctx.fillText(torqueValue, CANVAS_CX + 92, CANVAS_CY);

                ctx.textBaseline = 'top';
                ctx.font = PRIMARY_UNIT_FONT;
                ctx.fillStyle = C_WHITE_DIM;
                ctx.shadowColor = C_WHITE_DIM;
                ctx.shadowBlur = 0;
                ctx.textAlign = 'right';
                ctx.fillText(isMetricUnit ? 'KM/H' : 'MPH', CANVAS_CX - 92, CANVAS_CY + 34);
                ctx.textAlign = 'left';
                ctx.fillText(torqueUnit, CANVAS_CX + 92, CANVAS_CY + 34);

                ctx.restore();
            }

            // ── 3C. 中央右區：(中間文字始終置中，上下文字切齊中間文字上下緣) ─────────────
            function renderRightRatingCluster() {
                if (!ctx) return;

                var midHalfH = SIDE_MID_FONT_SIZE * 0.42;
                var topEdgeY = CANVAS_CY - midHalfH;
                var botEdgeY = CANVAS_CY + midHalfH;

                ctx.save();
                ctx.textAlign = 'left';

                // 2. 中層：COUNTER Steer Angle (始終垂直置中 CANVAS_CY = 320px)
                ctx.textBaseline = 'middle';
                var cCol = C_WHITE;
                if (counterPct > 70) cCol = C_REDLINE;
                else if (counterPct > 20) cCol = C_AMBER;
                ctx.font = FONT_SIDE_MIDDLE_VAL;

                ctx.shadowColor = cCol;
                ctx.shadowBlur = counterPct > 20 ? 12 : 8;

                ctx.textBaseline = 'bottom';

                var flowStr = FLOW_LABELS[flowQuality] || 'BUILD';

                ctx.fillStyle = flowColor;

                ctx.shadowBlur = flowQuality >= 4 ? 14 : 0;
                ctx.fillText('FLOW: ' + flowStr, RIGHT_CLUSTER_X, topEdgeY);

                // 3. 下層：RISK Level (貼齊中間文字下緣 textBaseline = 'top')
                ctx.textBaseline = 'top';
                var riskColor = riskLevel > 1 ? (RISK_COLOR_MAP[riskLevel] || C_WHITE) : C_WHITE_DIM;
                var riskStr = RISK_LABELS[riskLevel] || 'SAFE';
                ctx.font = FONT_SIDE_SUB_LABEL;
                ctx.fillStyle = riskColor;
                ctx.shadowColor = riskColor;
                ctx.shadowBlur = riskLevel >= 3 ? 14 : 0;

            // ── 4. 兩側腳踏柱 (左: H/C 水平置中, 右: B/T 水平置中) ───────────────
            function drawPedal(px, startY, barW, barH, pct, color, key, labelInitial) {
                var fillH = (clamp(pct, 0, 100) / 100.0) * barH;
                var pulse = (inputFlashTtl[key] || 0) / 18.0;

                ctx.fillStyle = C_TRACK;
                ctx.beginPath(); ctx.roundRect(px, startY, barW, barH, 4); ctx.fill();

                if (fillH > 0) {
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 8 + pulse * 10;
                    ctx.beginPath();
                    ctx.roundRect(px, startY + (barH - fillH), barW, fillH, 4);
                    ctx.fill();
                }

                ctx.font = 'bold 13px Bahnschrift';
                ctx.fillStyle = pulse > 0 ? '#ffffff' : C_WHITE_DIM;
                ctx.textAlign = 'center';
                ctx.fillText(labelInitial, px + barW * 0.5, startY - 8);
            }

            function renderSplitPedalPanels() {
                if (!ctx) return;

                ctx.save();

                var barW = 36, barH = 96, startY = 272;

                // 4A. 左翼腳踏組：手煞車 (H) & 離合器 (C) (水平置中於 LEFT_PEDAL_CX)
                var leftStartX = LEFT_PEDAL_CX - 48;
                drawPedal(leftStartX, startY, barW, barH, handbrakePct, C_AMBER, 'H', 'H');
                drawPedal(leftStartX + 48, startY, barW, barH, clutchPct, C_WHITE, 'C', 'C');

                // 4B. 右翼腳踏組：煞車 (B) & 油門 (T) (水平置中於 RIGHT_PEDAL_CX)
                var rightStartX = RIGHT_PEDAL_CX - 48;
                drawPedal(rightStartX, startY, barW, barH, brakePct, C_REDLINE, 'B', 'B');
                drawPedal(rightStartX + 48, startY, barW, barH, accelPct, C_WHITE, 'T', 'T');

                ctx.restore();
            }

            // ── Main Render Loop ─────────────────────────────────────────────
            function drawSecondaryPanelPath(left, top, right, bottom, cut) {
                ctx.beginPath();
                ctx.moveTo(left + cut, top);
                ctx.lineTo(right - cut, top);
                ctx.lineTo(right, top + cut);
                ctx.lineTo(right, bottom - cut);
                ctx.lineTo(right - cut, bottom);
                ctx.lineTo(left + cut, bottom);
                ctx.lineTo(left, bottom - cut);
                ctx.lineTo(left, top + cut);
                ctx.closePath();
            }

            function traceSecondarySuperArc(centerX, centerY, radiusX, radiusY, exponent, start, end) {
                var steps = Math.max(6, Math.ceil(Math.abs(end - start) * 18));
                var power = 2 / exponent;
                ctx.beginPath();
                for (var step = 0; step <= steps; step++) {
                    var t = start + (end - start) * step / steps;
                    var cosT = Math.cos(t);
                    var sinT = Math.sin(t);
                    var x = centerX + radiusX * Math.sign(cosT) * Math.pow(Math.abs(cosT), power);
                    var y = centerY + radiusY * Math.sign(sinT) * Math.pow(Math.abs(sinT), power);
                    if (step === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
            }

            // Legacy renderer retained temporarily for comparison while the
            // new active renderer below is validated against screenshots.
            function drawSecondaryLegacyArcGauge(centerX, centerY, ratio, color, label, value) {
                var start = Math.PI * 1.05;
                var end = Math.PI * 1.95;
                var span = end - start;
                var clampedRatio = clamp(ratio, 0, 1);
                var segments = 10;
                var outerX = 78, outerY = 66;
                var energyX = 68, energyY = 56;
                var exponent = 2.35;

                ctx.save();
                ctx.lineCap = 'butt';
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(235, 243, 243, 0.42)';
                traceSecondarySuperArc(centerX, centerY, outerX, outerY, exponent, start, end);
                ctx.stroke();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
                traceSecondarySuperArc(centerX, centerY, energyX - 14, energyY - 14, exponent, start, end);
                ctx.stroke();

                for (var i = 0; i < segments; i++) {
                    var segmentStart = start + (i / segments) * span + 0.018;
                    var segmentEnd = start + ((i + 1) / segments) * span - 0.018;
                    var active = (i + 1) / segments <= clampedRatio + 0.001;

                    ctx.lineWidth = 13;
                    ctx.strokeStyle = active ? color : C_TRACK;
                    ctx.globalAlpha = active ? 0.30 : 1;
                    ctx.shadowColor = active ? color : 'transparent';
                    ctx.shadowBlur = active ? 10 : 0;
                    traceSecondarySuperArc(centerX, centerY, energyX, energyY, exponent, segmentStart, segmentEnd);
                    ctx.stroke();

                    ctx.globalAlpha = 1;
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = active ? color : 'rgba(255, 255, 255, 0.18)';
                    ctx.shadowBlur = active ? 5 : 0;
                    traceSecondarySuperArc(centerX, centerY, energyX, energyY, exponent, segmentStart, segmentEnd);
                    ctx.stroke();
                }

                var indicatorAngle = start + span * clampedRatio;
                var cosI = Math.cos(indicatorAngle);
                var sinI = Math.sin(indicatorAngle);
                var powerI = 2 / exponent;
                var markerX = centerX + energyX * Math.sign(cosI) * Math.pow(Math.abs(cosI), powerI);
                var markerY = centerY + energyY * Math.sign(sinI) * Math.pow(Math.abs(sinI), powerI);
                ctx.shadowBlur = 0;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(markerX, markerY, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 13px Bahnschrift';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText(label, centerX, centerY - 14);
                ctx.font = 'italic bold 28px ForzaGear';
                ctx.fillStyle = color;
                ctx.fillText(value, centerX, centerY + 14);
                ctx.restore();
            }

            // Advanced-inspired hard-edged panel with Drift's cyan tracking
            // lines and pink risk accents.
            function renderSecondaryLegacyInstrument() {
                if (!ctx) return;

                var left = SECONDARY_CX - SECONDARY_HALF_WIDTH;
                var right = SECONDARY_CX + SECONDARY_HALF_WIDTH;
                var top = SECONDARY_CY - SECONDARY_HALF_HEIGHT;
                var bottom = SECONDARY_CY + SECONDARY_HALF_HEIGHT;
                var cut = 20;
                var absA = Math.abs(displayAngle);
                var angleColor = absA >= 45 ? C_REDLINE : (absA >= 20 ? C_AMBER : C_WHITE);
                var flowColor = flowQuality > 1 ? (FLOW_COLOR_MAP[flowQuality] || C_WHITE) : C_WHITE_DIM;
                var riskColor = riskLevel > 1 ? (RISK_COLOR_MAP[riskLevel] || C_WHITE) : C_WHITE_DIM;
                var direction = displayAngle < -1 ? 'LEFT DRIFT' : (displayAngle > 1 ? 'RIGHT DRIFT' : 'CENTER');

                ctx.save();
                var fill = ctx.createLinearGradient(left, top, right, bottom);
                fill.addColorStop(0, 'rgba(13, 28, 43, 0.88)');
                fill.addColorStop(0.56, 'rgba(7, 15, 27, 0.78)');
                fill.addColorStop(1, 'rgba(7, 14, 24, 0.58)');
                ctx.fillStyle = fill;
                drawSecondaryPanelPath(left, top, right, bottom, cut);
                ctx.fill();

                ctx.strokeStyle = 'rgba(102, 224, 255, 0.52)';
                ctx.lineWidth = 2;
                ctx.shadowColor = C_ICE;
                ctx.shadowBlur = 8;
                drawSecondaryPanelPath(left, top, right, bottom, cut);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.lineWidth = 3;
                ctx.strokeStyle = C_ICE;
                ctx.beginPath();
                ctx.moveTo(left + cut, top + 1.5);
                ctx.lineTo(left + 150, top + 1.5);
                ctx.moveTo(right - 132, top + 1.5);
                ctx.lineTo(right - cut, top + 1.5);
                ctx.stroke();

                ctx.strokeStyle = C_REDLINE;
                ctx.globalAlpha = 0.72;
                ctx.beginPath();
                ctx.moveTo(left + cut, bottom - 1.5);
                ctx.lineTo(left + 104, bottom - 1.5);
                ctx.moveTo(right - 86, bottom - 1.5);
                ctx.lineTo(right - cut, bottom - 1.5);
                ctx.stroke();
                ctx.globalAlpha = 1;

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(SECONDARY_CX, top + 36);
                ctx.lineTo(SECONDARY_CX, bottom - 38);
                ctx.stroke();
                ctx.fillStyle = C_WHITE_DIM;
                ctx.font = 'bold 16px Bahnschrift';
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'left';
                ctx.fillText('DRIFT STATUS', left + 28, top + 26);

                ctx.textAlign = 'right';
                ctx.font = 'bold 13px Bahnschrift';
                ctx.fillStyle = C_ICE;
                ctx.fillText('LIVE', right - 28, top + 26);

                drawSecondaryLegacyArcGauge(left + 112, top + 112, flowPct / 100, flowColor, 'FLOW', FLOW_LABELS[flowQuality] || 'BUILD');
                drawSecondaryLegacyArcGauge(right - 112, top + 112, spinRisk / 100, riskColor, 'RISK', RISK_LABELS[riskLevel] || 'SAFE');

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '900 76px Bahnschrift';
                ctx.fillStyle = angleColor;
                ctx.shadowColor = angleColor;
                ctx.shadowBlur = absA >= 20 ? 12 : 6;
                ctx.fillText(absA.toFixed(1) + '°', SECONDARY_CX, top + 110);

                ctx.font = 'bold 14px Bahnschrift';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.shadowBlur = 0;
                ctx.fillText(direction, SECONDARY_CX, top + 143);
                ctx.fillStyle = isCountering ? C_AMBER : C_WHITE_DIM;
                ctx.fillText('COUNTER ' + counterPct.toFixed(0) + '%', SECONDARY_CX, top + 162);

                ctx.textAlign = 'right';
                ctx.font = 'bold 14px Bahnschrift';
                ctx.fillStyle = holdSeconds > 0.5 ? C_AMBER : C_WHITE_DIM;
                ctx.fillText(holdSeconds > 0.5 ? 'HOLD ' + holdSeconds.toFixed(1) + 's' : 'GRIP', right - 28, top + 162);

                var barW = 26, barH = 48, startY = bottom - 54;
                drawPedal(SECONDARY_CX - 92, startY, barW, barH, handbrakePct, C_AMBER, 'H', 'H');
                drawPedal(SECONDARY_CX - 54, startY, barW, barH, clutchPct, C_WHITE, 'C', 'C');
                drawPedal(SECONDARY_CX + 42, startY, barW, barH, brakePct, C_REDLINE, 'B', 'B');
                drawPedal(SECONDARY_CX + 80, startY, barW, barH, accelPct, C_WHITE, 'T', 'T');
                ctx.restore();
            }

            // Advanced Canvas grammar adapted to the compact Drift secondary:
            // superellipse tracks, inset bands, glow layers, needles and a
            // small state badge. Geometry stays in source space and is scaled
            // only by renderSecondaryInstrumentAtConventionalAnchor().
            function secondarySuperPoint(centerX, centerY, radiusX, radiusY, exponent, t) {
                var power = 2 / exponent;
                var cosT = Math.cos(t);
                var sinT = Math.sin(t);
                return {
                    x: centerX + radiusX * Math.sign(cosT) * Math.pow(Math.abs(cosT), power),
                    y: centerY + radiusY * Math.sign(sinT) * Math.pow(Math.abs(sinT), power)
                };
            }

            function secondarySuperNormal(centerX, centerY, radiusX, radiusY, exponent, t) {
                var dt = 0.0005;
                var p1 = secondarySuperPoint(centerX, centerY, radiusX, radiusY, exponent, t - dt);
                var p2 = secondarySuperPoint(centerX, centerY, radiusX, radiusY, exponent, t + dt);
                var dx = p2.x - p1.x;
                var dy = p2.y - p1.y;
                var length = Math.max(0.0001, Math.sqrt(dx * dx + dy * dy));
                return { x: dy / length, y: -dx / length };
            }

            function traceSecondaryOffsetArc(centerX, centerY, radiusX, radiusY, exponent, start, end, offset) {
                var steps = Math.max(8, Math.ceil(Math.abs(end - start) * 120));
                ctx.beginPath();
                for (var i = 0; i <= steps; i++) {
                    var t = start + (end - start) * i / steps;
                    var point = secondarySuperPoint(centerX, centerY, radiusX, radiusY, exponent, t);
                    var normal = secondarySuperNormal(centerX, centerY, radiusX, radiusY, exponent, t);
                    var x = point.x - normal.x * offset;
                    var y = point.y - normal.y * offset;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
            }

            function secondaryArcPoint(centerX, centerY, radiusX, radiusY, exponent, t, offset) {
                var point = secondarySuperPoint(centerX, centerY, radiusX, radiusY, exponent, t);
                var normal = secondarySuperNormal(centerX, centerY, radiusX, radiusY, exponent, t);
                return { x: point.x - normal.x * offset, y: point.y - normal.y * offset };
            }

            function drawSecondaryAdvancedArcBand(centerX, centerY, radiusX, radiusY, exponent, start, end, offset, ratio, color, segments) {
                var span = end - start;
                var clampedRatio = clamp(ratio, 0, 1);
                var gap = 0.018;

                for (var i = 0; i < segments; i++) {
                    var segmentStart = start + (i / segments) * span + gap;
                    var segmentEnd = start + ((i + 1) / segments) * span - gap;
                    var active = (i + 1) / segments <= clampedRatio + 0.001;
                    ctx.lineCap = 'butt';
                    ctx.lineWidth = 14;
                    ctx.strokeStyle = active ? color : C_TRACK;
                    ctx.globalAlpha = active ? 0.34 : 0.95;
                    ctx.shadowColor = active ? color : 'transparent';
                    ctx.shadowBlur = active ? 10 : 0;
                    traceSecondaryOffsetArc(centerX, centerY, radiusX, radiusY, exponent, segmentStart, segmentEnd, offset);
                    ctx.stroke();

                    ctx.globalAlpha = 1;
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = active ? color : 'rgba(255, 255, 255, 0.18)';
                    ctx.shadowBlur = active ? 5 : 0;
                    traceSecondaryOffsetArc(centerX, centerY, radiusX, radiusY, exponent, segmentStart, segmentEnd, offset);
                    ctx.stroke();
                }
            }

            function drawSecondaryAdvancedNeedle(centerX, centerY, radiusX, radiusY, exponent, start, end, offset, ratio, color) {
                var t = start + (end - start) * clamp(ratio, 0, 1);
                var point = secondaryArcPoint(centerX, centerY, radiusX, radiusY, exponent, t, offset);
                var normal = secondarySuperNormal(centerX, centerY, radiusX, radiusY, exponent, t);
                ctx.strokeStyle = color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(point.x - normal.x * 18, point.y - normal.y * 18);
                ctx.lineTo(point.x + normal.x * 8, point.y + normal.y * 8);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // The former Advanced RPM arc is now a throttle input arc.
            function drawSecondaryAdvancedArcGauge(centerX, centerY, ratio, color, label, value) {
                var start = Math.PI * 0.96;
                var end = Math.PI * 2.04;
                var exponent = 2.35;
                var radiusX = 214;
                var radiusY = 100;

                ctx.save();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(235, 243, 243, 0.38)';
                traceSecondaryOffsetArc(centerX, centerY, radiusX + 7, radiusY + 7, exponent, start, end, 0);
                ctx.stroke();
                drawSecondaryAdvancedArcBand(centerX, centerY, radiusX, radiusY, exponent, start, end, 0, ratio, color, 12);
                drawSecondaryAdvancedNeedle(centerX, centerY, radiusX, radiusY, exponent, start, end, 0, ratio, color);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 11px Bahnschrift';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText(label, centerX, centerY - 51);
                ctx.font = 'bold 18px ForzaGear';
                ctx.fillStyle = color;
                ctx.fillText(value, centerX, centerY - 29);
                ctx.font = 'bold 10px Bahnschrift';
                ctx.fillStyle = C_WHITE_MID;
                ctx.fillText('0', centerX - 204, centerY + 10);
                ctx.fillText('25', centerX - 116, centerY - 77);
                ctx.fillText('50', centerX, centerY - 99);
                ctx.fillText('75', centerX + 116, centerY - 77);
                ctx.fillText('100', centerX + 204, centerY + 10);
                ctx.restore();
            }

            // The former Advanced HP/TQ/Boost inner bands are now
            // brake/clutch/handbrake input gauges.
            function drawSecondaryAdvancedInputArc(centerX, centerY, fractionStart, fractionEnd, ratio, color, label, value) {
                var start = Math.PI * (0.96 + 1.08 * fractionStart);
                var end = Math.PI * (0.96 + 1.08 * fractionEnd);
                var radiusX = 183;
                var radiusY = 84;
                var offset = 31;
                var exponent = 2.35;

                drawSecondaryAdvancedArcBand(centerX, centerY, radiusX, radiusY, exponent, start, end, offset, ratio, color, 5);
                drawSecondaryAdvancedNeedle(centerX, centerY, radiusX, radiusY, exponent, start, end, offset, ratio, color);

                var labelPoint = secondaryArcPoint(centerX, centerY, radiusX, radiusY, exponent, (start + end) * 0.5, offset + 22);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 9px Bahnschrift';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText(label, labelPoint.x, labelPoint.y);
                ctx.font = 'bold 10px ForzaGear';
                ctx.fillStyle = color;
                ctx.fillText(value, labelPoint.x, labelPoint.y + 11);
            }

            function drawSecondaryArrow(x, y, angleDeg, length, color, width) {
                var angleRad = angleDeg * Math.PI / 180;
                var dx = Math.sin(angleRad) * length;
                var dy = -Math.cos(angleRad) * length;
                var endX = x + dx;
                var endY = y + dy;
                var head = Math.max(3, width * 1.7);

                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = width > 2 ? 5 : 3;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - Math.sin(angleRad - 0.7) * head, endY + Math.cos(angleRad - 0.7) * head);
                ctx.lineTo(endX - Math.sin(angleRad + 0.7) * head, endY + Math.cos(angleRad + 0.7) * head);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawSecondaryAttitudeIndicator(centerX, centerY) {
                var wheelPoints = [
                    { x: centerX - 18, y: centerY - 12, angle: slipAnglesDeg[0], ratio: slipRatios[0], lock: wheelLockup.fl },
                    { x: centerX + 18, y: centerY - 12, angle: slipAnglesDeg[1], ratio: slipRatios[1], lock: wheelLockup.fr },
                    { x: centerX - 18, y: centerY + 13, angle: slipAnglesDeg[2], ratio: slipRatios[2], lock: wheelLockup.rl },
                    { x: centerX + 18, y: centerY + 13, angle: slipAnglesDeg[3], ratio: slipRatios[3], lock: wheelLockup.rr }
                ];

                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 30);
                ctx.lineTo(centerX, centerY + 30);
                ctx.moveTo(centerX - 47, centerY);
                ctx.lineTo(centerX + 47, centerY);
                ctx.stroke();

                ctx.fillStyle = 'rgba(11, 25, 39, 0.86)';
                ctx.strokeStyle = C_ICE;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(centerX - 13, centerY - 19, 26, 38, 6);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = C_ICE;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 24);
                ctx.lineTo(centerX - 5, centerY - 16);
                ctx.lineTo(centerX + 5, centerY - 16);
                ctx.closePath();
                ctx.fill();

                // Cyan is vehicle heading; amber is travel direction. The
                // four tire vectors use slip angle for direction and slip
                // ratio for length, so the panel is useful outside countersteer.
                drawSecondaryArrow(centerX, centerY - 19, 0, 24, C_ICE, 2.2);
                drawSecondaryArrow(centerX, centerY + 3, travelAngleDeg, 17, C_AMBER, 2.6);
                for (var i = 0; i < wheelPoints.length; i++) {
                    var wheel = wheelPoints[i];
                    var slipStrength = clamp(Math.abs(wheel.ratio) / 0.5, 0, 1);
                    var arrowLength = 6 + slipStrength * 19;
                    var arrowColor = wheel.lock || slipStrength >= 0.75 ? C_REDLINE : (slipStrength >= 0.35 ? C_AMBER : C_WHITE_DIM);
                    drawSecondaryArrow(wheel.x, wheel.y, wheel.angle, arrowLength, arrowColor, 1.5);
                }

                ctx.font = 'bold 8px Bahnschrift';
                ctx.textAlign = 'left';
                ctx.fillStyle = C_ICE;
                ctx.fillText('HEAD', centerX - 54, centerY - 31);
                ctx.fillStyle = C_AMBER;
                ctx.fillText('TRAVEL', centerX + 28, centerY - 31);
                ctx.textAlign = 'center';
                ctx.fillStyle = C_WHITE_MID;
                ctx.fillText('SLIP VECTOR', centerX, centerY + 38);
                ctx.restore();
            }

            function drawSecondaryGripLights(left, top, ratios) {
                var labels = ['FL', 'FR', 'RL', 'RR'];
                for (var i = 0; i < 4; i++) {
                    var ratio = clamp(Math.abs(ratios[i] || 0) / 0.5, 0, 1);
                    var activeCount = Math.ceil(ratio * 4);
                    var x = left + (i % 2) * 54;
                    var y = top + Math.floor(i / 2) * 14;
                    ctx.font = 'bold 8px Bahnschrift';
                    ctx.textAlign = 'right';
                    ctx.fillStyle = C_WHITE_MID;
                    ctx.fillText(labels[i], x - 4, y + 3);
                    for (var dot = 0; dot < 4; dot++) {
                        var dotActive = dot < activeCount;
                        var lock = i === 0 ? wheelLockup.fl : (i === 1 ? wheelLockup.fr : (i === 2 ? wheelLockup.rl : wheelLockup.rr));
                        ctx.fillStyle = dotActive ? ((ratio >= 0.75 || lock) ? C_REDLINE : C_ICE) : 'rgba(255,255,255,0.17)';
                        ctx.beginPath();
                        ctx.roundRect(x + dot * 7, y - 3, 5, 6, 1.5);
                        ctx.fill();
                    }
                }
            }

            function drawSecondaryLcBadge(top, right) {
                var active = lcState === 'armed' || lcState === 'launched';
                var launched = lcState === 'launched';
                var badgeWidth = 42;
                var badgeLeft = right - badgeWidth - 16;
                var pulse = active ? (0.55 + 0.45 * Math.sin(Date.now() / (launched ? 120 : 250) * Math.PI)) : 0.32;
                ctx.save();
                ctx.globalAlpha = pulse;
                ctx.strokeStyle = active ? C_REDLINE : C_WHITE_DIM;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(badgeLeft, top + 10, badgeWidth, 22, 3);
                ctx.stroke();
                ctx.fillStyle = active ? C_REDLINE : C_WHITE_DIM;
                ctx.font = 'bold 12px ForzaGear';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('LC', badgeLeft + badgeWidth * 0.5, top + 21);
                ctx.restore();
            }

            function renderSecondaryInstrument() {
                if (!ctx) return;

                var left = SECONDARY_CX - SECONDARY_HALF_WIDTH;
                var right = SECONDARY_CX + SECONDARY_HALF_WIDTH;
                var top = SECONDARY_CY - SECONDARY_HALF_HEIGHT;
                var bottom = SECONDARY_CY + SECONDARY_HALF_HEIGHT;
                var centerX = SECONDARY_CX;
                var arcCenterY = top + 143;

                ctx.save();
                var fill = ctx.createLinearGradient(left, top, right, bottom);
                fill.addColorStop(0, 'rgba(13, 28, 43, 0.90)');
                fill.addColorStop(0.56, 'rgba(7, 15, 27, 0.80)');
                fill.addColorStop(1, 'rgba(7, 14, 24, 0.64)');
                ctx.fillStyle = fill;
                drawSecondaryPanelPath(left, top, right, bottom, 18);
                ctx.fill();

                ctx.strokeStyle = 'rgba(102, 224, 255, 0.62)';
                ctx.lineWidth = 2;
                ctx.shadowColor = C_ICE;
                ctx.shadowBlur = 8;
                drawSecondaryPanelPath(left, top, right, bottom, 18);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.font = 'bold 13px Bahnschrift';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText('DRIFT CONTROL', left + 18, top + 21);
                ctx.font = 'bold 15px ForzaGear';
                ctx.fillStyle = C_WHITE;
                ctx.textAlign = 'right';
                ctx.fillText(String(displaySpeed), right - 70, top + 20);
                ctx.font = 'bold 8px Bahnschrift';
                ctx.fillStyle = C_WHITE_MID;
                ctx.fillText(isMetricUnit ? 'KM/H' : 'MPH', right - 70, top + 31);
                ctx.font = 'bold 18px ForzaGear';
                ctx.fillStyle = C_AMBER;
                ctx.fillText(String(gear), right - 43, top + 21);
                drawSecondaryLcBadge(top, right);

                drawSecondaryAdvancedArcGauge(centerX, arcCenterY, accelPct / 100, C_ICE, 'THROTTLE', Math.round(accelPct) + '%');
                drawSecondaryAdvancedInputArc(centerX, arcCenterY, 0.08, 0.31, brakePct / 100, C_REDLINE, 'BRAKE', Math.round(brakePct) + '%');
                drawSecondaryAdvancedInputArc(centerX, arcCenterY, 0.37, 0.61, clutchPct / 100, C_WHITE, 'CLUTCH', Math.round(clutchPct) + '%');
                drawSecondaryAdvancedInputArc(centerX, arcCenterY, 0.67, 0.91, handbrakePct / 100, C_AMBER, 'HANDBRAKE', Math.round(handbrakePct) + '%');

                // The former angle/flow/risk text block is now a compact
                // attitude instrument with heading, travel and slip vectors.
                drawSecondaryAttitudeIndicator(centerX, top + 186);
                drawSecondaryGripLights(left + 22, top + 182, slipRatios);
                ctx.restore();
            }

            function renderSecondaryInstrumentAtConventionalAnchor() {
                if (!ctx || !driftLayout) return;

                var anchor = driftLayout.getBottomRightAnchor(
                    window.innerWidth,
                    window.innerHeight,
                    SECONDARY_BOX_WIDTH,
                    SECONDARY_BOX_HEIGHT,
                    SECONDARY_BOX_PADDING
                );
                var logicalCenterX = (anchor.centerX - viewportTransform.offsetX) / viewportTransform.scale;
                var logicalCenterY = (anchor.centerY - viewportTransform.offsetY) / viewportTransform.scale;
                var scaleX = anchor.width / (SECONDARY_SOURCE_WIDTH * viewportTransform.scale);
                var scaleY = anchor.height / (SECONDARY_SOURCE_HEIGHT * viewportTransform.scale);

                ctx.save();
                ctx.translate(logicalCenterX, logicalCenterY);
                ctx.scale(scaleX, scaleY);
                ctx.translate(-SECONDARY_CX, -SECONDARY_CY);
                renderSecondaryInstrument();
                ctx.restore();
            }

            function renderPrimaryInstrument() {
                if (!ctx || !primaryAnchor) return;

                var logicalCenterX = (primaryAnchor.centerX - viewportTransform.offsetX) / viewportTransform.scale;
                var logicalCenterY = (primaryAnchor.centerY - viewportTransform.offsetY) / viewportTransform.scale;

                // The canvas is viewport-sized so this layer can use screen
                // space while retaining the existing Drift visual scale.
                ctx.save();
                ctx.translate(logicalCenterX, logicalCenterY);
                ctx.scale(primaryRenderScale, primaryRenderScale);
                ctx.translate(-CANVAS_CX, -CANVAS_CY);
                drawModernFrame();
                renderTopAngleArc();
                renderBottomTachoArc();
                renderCenterGearCluster();
                ctx.restore();
            }

            function renderLoop() {
                try {
                    var now = performance.now();
                    var sweepProgress = driftSweepActive
                        ? clamp((now - driftSweepStartedAt) / DRIFT_SWEEP_DURATION, 0, 1)
                        : 0;
                    var liveAngle = displayAngle;
                    var liveRpm = rpm;
                    var liveSpeed = displaySpeed;
                    var liveGear = gear;
                    var liveCounterPct = counterPct;
                    var liveCounterArcAngle = counterArcAngle;
                    var liveCountering = isCountering;

                    if (driftSweepActive) {
                        driftLayout.fillSweepState(sweepProgress, maxRpm, driftSweepFrame);
                        displayAngle = driftSweepFrame.angle;
                        rpm = driftSweepFrame.rpm;
                        displaySpeed = driftSweepFrame.speed;
                        gear = 'N';
                        counterPct = 0;
                        counterArcAngle = 0;
                        isCountering = false;
                    } else if (driftStyleEngine) {
                        driftStyleFrame.speedKmh = speedKmh;
                        driftStyleFrame.angle = displayAngle;
                        driftStyleFrame.flowQuality = flowQuality;
                        driftStyleFrame.riskLevel = riskLevel;
                        driftStyleEngine.update(driftStyleFrame, now);
                    }
                    if (driftStyleEngine) renderDriftStyleContainer(now);
                    if (ctx) {
                        ctx.setTransform(1, 0, 0, 1, 0, 0);
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.setTransform(
                            canvasDpr * viewportTransform.scale,
                            0,
                            0,
                            canvasDpr * viewportTransform.scale,
                            canvasDpr * viewportTransform.offsetX,
                            canvasDpr * viewportTransform.offsetY
                        );
                    }

                    // 1-3. Primary instrument uses its own compact layer scale.
                    renderPrimaryInstrument();

                    // 4. Secondary instrument follows the conventional
                    // bottom-right HUD bounding box used by Advanced/VFD.
                    renderSecondaryInstrumentAtConventionalAnchor();

                    displayAngle = liveAngle;
                    rpm = liveRpm;
                    displaySpeed = liveSpeed;
                    gear = liveGear;
                    counterPct = liveCounterPct;
                    counterArcAngle = liveCounterArcAngle;
                    isCountering = liveCountering;

                    if (driftSweepActive && sweepProgress >= 1) driftSweepActive = false;

                } catch (e) {
                    console.error('[Drift HUD] Render loop exception:', e);
                } finally {
                    requestAnimationFrame(renderLoop);
                }
            }

            // ── Telemetry Packet Parser ──────────────────────────────────────
            function parseTelemetryData(data, payload) {
                if (!data) return;

                if (payload && payload.isMetric !== undefined) {
                    isMetricUnit = payload.isMetric !== false;
                }

                speedKmh = Math.round(data.speed_kmh || data.speed || 0);
                displaySpeed = Math.round(isMetricUnit ? (data.speed_kmh || data.speed || 0) : (data.speed_mph || (speedKmh * 0.621371)));
                rpm = data.rpm || 0;
                maxRpm = data.maxRpm || data.max_rpm || 9000;
                var resolvedTorque = driftDisplayMath ? driftDisplayMath.resolveTorque(data, isMetricUnit) : {
                    value: Math.round(data.torque || 0),
                    unit: isMetricUnit ? 'N·M' : 'LB·FT'
                };
                torqueValue = resolvedTorque.value;
                torqueUnit = resolvedTorque.unit;

                var rawGear = data.gear;
                gear = rawGear === 0 ? 'R' : (rawGear === 11 || rawGear === 10 ? 'N' : (rawGear || 'N'));

                accelPct = (data.throttle || 0) * 100;
                brakePct = (data.brake || 0) * 100;
                clutchPct = (data.clutch || 0) * 100;
                var rawHandbrake = Number(data.hand_brake) || 0;
                handbrakePct = rawHandbrake <= 1 ? rawHandbrake * 100 : rawHandbrake / 2.55;
                steerPct = driftDisplayMath ? driftDisplayMath.normalizeSteerPercent(data.steer) : clamp((data.steer || 0) / 1.27, -100, 100);

                var vx = data.vel_x || 0;
                var vz = data.vel_z || 0;
                var speedPlane = Math.hypot(vx, vz);
                if (speedPlane > 0.5) {
                    angle = (Math.atan2(vx, vz) * 180.0) / Math.PI;
                    angle = clamp(angle, -90, 90);
                } else {
                    angle = 0;
                }

                // The attitude panel uses vehicle yaw as its reference. The
                // existing Drift angle remains unchanged for Style semantics;
                // this relative travel angle is only for the visual vectors.
                var rawYaw = Number(data.Yaw !== undefined ? data.Yaw : data.yaw) || 0;
                var yawDegrees = Math.abs(rawYaw) <= Math.PI * 2.1 ? rawYaw * 180 / Math.PI : rawYaw;
                var worldTravelDegrees = speedPlane > 0.5 ? (Math.atan2(vx, vz) * 180.0) / Math.PI : yawDegrees;
                travelAngleDeg = worldTravelDegrees - yawDegrees;
                while (travelAngleDeg > 180) travelAngleDeg -= 360;
                while (travelAngleDeg < -180) travelAngleDeg += 360;
                travelAngleDeg = clamp(travelAngleDeg, -90, 90);

                var rawSlipRatios = Array.isArray(data.TireSlipRatio) ? data.TireSlipRatio : [];
                var rawSlipAngles = Array.isArray(data.TireSlipAngle) ? data.TireSlipAngle : [];
                slipRatios[0] = Number(data.slip_fl !== undefined ? data.slip_fl : rawSlipRatios[0]) || 0;
                slipRatios[1] = Number(data.slip_fr !== undefined ? data.slip_fr : rawSlipRatios[1]) || 0;
                slipRatios[2] = Number(data.slip_rl !== undefined ? data.slip_rl : rawSlipRatios[2]) || 0;
                slipRatios[3] = Number(data.slip_rr !== undefined ? data.slip_rr : rawSlipRatios[3]) || 0;
                slipAnglesDeg[0] = (Number(data.slip_angle_fl !== undefined ? data.slip_angle_fl : rawSlipAngles[0]) || 0) * 180 / Math.PI;
                slipAnglesDeg[1] = (Number(data.slip_angle_fr !== undefined ? data.slip_angle_fr : rawSlipAngles[1]) || 0) * 180 / Math.PI;
                slipAnglesDeg[2] = (Number(data.slip_angle_rl !== undefined ? data.slip_angle_rl : rawSlipAngles[2]) || 0) * 180 / Math.PI;
                slipAnglesDeg[3] = (Number(data.slip_angle_rr !== undefined ? data.slip_angle_rr : rawSlipAngles[3]) || 0) * 180 / Math.PI;
                for (var slipIndex = 0; slipIndex < 4; slipIndex++) {
                    slipAnglesDeg[slipIndex] = clamp(slipAnglesDeg[slipIndex], -45, 45);
                }
                var lockup = (payload && payload.lockup) || data.lockup || {};
                wheelLockup.fl = !!lockup.fl;
                wheelLockup.fr = !!lockup.fr;
                wheelLockup.rl = !!lockup.rl;
                wheelLockup.rr = !!lockup.rr;
                lcState = (payload && payload.lcState) || data.lcState || 'inactive';

                displayAngle = lerp(displayAngle, angle, 0.25);
                var absA = Math.abs(displayAngle);

                if (speedKmh > 10 && absA >= 10) {
                    holdSeconds += 0.016;
                } else {
                    holdSeconds = 0;
                }

                var fallbackIsCountering = absA >= 8 && displayAngle * steerPct > 0;
                var counterState = driftDisplayMath ? driftDisplayMath.getCounterState(displayAngle, steerPct) : {
                    isCountering: fallbackIsCountering,
                    percent: fallbackIsCountering ? Math.abs(steerPct) * (0.45 + 0.55 * clamp((absA - 8) / 42, 0, 1)) : 0,
                    arcAngle: clamp(steerPct * 0.45, -45, 45)
                };
                isCountering = counterState.isCountering;
                counterPct = counterState.percent;
                counterArcAngle = counterState.arcAngle;

                // Compute Flow & Risk Rating Integer Levels (1~5 & 1~4)
                if (absA >= 30 && speedKmh > 20 && counterPct > 30) {
                    flowQuality = 5; // LOCKED
                } else if (absA >= 20 && speedKmh > 15) {
                    flowQuality = 4; // SMOOTH
                } else if (absA >= 10) {
                    flowQuality = 3; // CHASE
                } else if (speedKmh > 5) {
                    flowQuality = 2; // NORMAL
                } else {
                    flowQuality = 1; // BUILD
                }

                if (absA >= 50 || (absA >= 35 && counterPct < 15)) {
                    riskLevel = 4; // MAX
                } else if (absA >= 35) {
                    riskLevel = 3; // RISK
                } else if (absA >= 22) {
                    riskLevel = 2; // EDGE
                } else {
                    riskLevel = 1; // SAFE
                }

                if (handbrakePct > 40 && prevInputs.H <= 40) { inputFlashTtl.H = 18; triggerDriftStyleSpecial('handbrake'); }
                if (clutchPct > 40 && prevInputs.C <= 40) { inputFlashTtl.C = 18; if (accelPct > 50) triggerDriftStyleSpecial('clutch_kick'); }
                if (brakePct > 40 && prevInputs.B <= 40) inputFlashTtl.B = 18;
                if (accelPct > 40 && prevInputs.T <= 40) inputFlashTtl.T = 18;

                prevInputs.H = handbrakePct;
                prevInputs.C = clutchPct;
                prevInputs.B = brakePct;
                prevInputs.T = accelPct;
            }

            // ── HUDCore Registration ─────────────────────────────────────────
            HUDCore.registerStyle('drift', {
                containerId: 'driftContainer',
                scaleMultiplier: 1.0,
                globalScaleFactor: 1.0,
                onInit: function (payload) {
                    if (payload && payload.isMetric !== undefined) {
                        isMetricUnit = payload.isMetric !== false;
                    }
                },
                onElementsChange: function (elements) {
                    var c = document.getElementById('driftContainer');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function (data, payload) {
                    parseTelemetryData(data, payload);
                },
                onAnimate: function () {
                    // Sweep is the HUD's mechanical zero/calibration action;
                    // reset the Drift Style run together with the instrument.
                    triggerDriftSweepAnimation();
                }
            });

            // Start HUD Engine
            resizeDriftCanvas();
            HUDCore.init('drift');
            requestAnimationFrame(renderLoop);
            setTimeout(triggerDriftSweepAnimation, 80);
        })();
    </script>
</body>

</html>
