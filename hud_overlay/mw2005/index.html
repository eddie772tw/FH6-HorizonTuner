<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NFS Most Wanted 2005 HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        @font-face {
            font-family: 'MW2005Digits';
            src: url('./assets/fonts/Seven_Segment_BOLD.ttf') format('truetype');
        }
        @font-face {
            font-family: 'MW2005Labels';
            src: url('./assets/fonts/StackSansHeadline-SemiBold.ttf') format('truetype');
        }
        .mw-container {
            width: 390px; height: 390px;
            pointer-events: none;
        }
        canvas { display: block; width: 390px; height: 390px; }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container mw-container" id="mw2005Container">
            <canvas id="mw2005Canvas" width="390" height="390"></canvas>
        </div>
    </div>

    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('mw2005Canvas');
            var ctx = canvas ? canvas.getContext('2d') : null;
            var images = {};
            var isReady = false;
            var sweepPending = false;

            var assetMap = {
                boost_gauge: "./assets/img/general/BOOST_LINE_GAUGE.png",
                boost_needle: "./assets/img/general/LINE_BOOST.png",
                nos_time: "./assets/img/general/NOS_TIME.png",
                shift_flash: "./assets/img/general/GEAR_CHANGE.png",
                default_background: "./assets/img/styles/default/BCKGND.png",
                default_gear_speed: "./assets/img/styles/default/GEAR-SPEED.png",
                default_needle: "./assets/img/styles/default/LINE.png",
                default_rpm_line: "./assets/img/styles/default/RPM_LINE.png",
                sonic_background: "./assets/img/styles/sonic/BCKGND.png",
                sonic_gear_speed: "./assets/img/styles/sonic/GEAR-SPEED.png",
                sonic_needle: "./assets/img/styles/sonic/LINE.png",
                sonic_rpm_line: "./assets/img/styles/sonic/RPM_LINE.png"
            };

            for (var r = 2; r <= 9; r++) {
                assetMap["redline_" + r] = "./assets/img/redline/REDLINE_" + r + "k.png";
            }

            var keys = Object.keys(assetMap);
            var loaded = 0;
            keys.forEach(function(k) {
                var img = new Image();
                img.onload = img.onerror = function() {
                    images[k] = img;
                    loaded++;
                    if (loaded >= keys.length) {
                        isReady = true;
                        if (sweepPending) {
                            sweepPending = false;
                            triggerSweep();
                        }
                    }
                };
                img.src = assetMap[k];
            });

            var isMetricUnit = true;

            function drawFullImage(imgKey, rotation) {
                var img = images[imgKey];
                if (!img) return;
                ctx.save();
                if (rotation) {
                    ctx.translate(195, 195);
                    ctx.rotate(rotation * Math.PI / 180);
                    ctx.drawImage(img, -195, -195, 390, 390);
                } else {
                    ctx.drawImage(img, 0, 0, 390, 390);
                }
                ctx.restore();
            }

            function drawReadout(tm, gearLabel) {
                var speed = Math.max(0, Math.min(999, Math.floor(isMetricUnit ? (tm.speed_kmh || tm.speed || 0) : (tm.speed_mph || 0))));
                var gearStr = gearLabel || 'N';

                ctx.save();
                // Seven segment LCD background '8' shadow
                ctx.font = '60px MW2005Digits, monospace, sans-serif';
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.textAlign = 'right';
                ctx.fillText('8', 220, 160);

                // Active Gear text
                ctx.fillStyle = '#000000';
                ctx.fillText(gearStr, 220, 160);

                // Speed 3 digits (Hundreds, Tens, Units)
                var hundreds = speed >= 100 ? String(Math.floor(speed / 100)) : '';
                var tens = speed >= 10 ? String(Math.floor(speed / 10) % 10) : '';
                var units = String(speed % 10);
                var digits = [hundreds, tens, units];
                var anchors = [177, 215, 252];

                ctx.font = '90px MW2005Digits, monospace, sans-serif';
                for (var i = 0; i < 3; i++) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.fillText('8', anchors[i], 270);
                    if (digits[i] !== '') {
                        ctx.fillStyle = '#000000';
                        ctx.fillText(digits[i], anchors[i], 270);
                    }
                }

                // Speed Unit text
                var unitStr = isMetricUnit ? 'km/h' : 'MPH';
                ctx.font = 'bold 18px MW2005Labels, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(unitStr, 215, 310);

                ctx.restore();
            }

            function renderMW2005(data, time) {
                if (!ctx || !isReady) return;
                ctx.clearRect(0, 0, 390, 390);

                var maxRpm = data.maxRpm || data.max_rpm || 8000;
                var rpm = Math.max(0, data.rpm || 0);
                var gearVal = data.gear;
                var gearLabel = gearVal === 0 ? 'R' : (gearVal === 11 ? 'N' : (gearVal !== undefined ? String(gearVal) : '1'));

                var needleAngle = Math.min(rpm / 10000, 1.1) * 225;
                var redline = Math.max(2, Math.min(9, Math.floor(maxRpm / 1000)));

                // 1. Base Background
                drawFullImage('default_background');
                drawFullImage('redline_' + redline);
                drawFullImage('default_gear_speed');
                drawFullImage('default_rpm_line');
                drawFullImage('nos_time');

                // Shift Flash on Redline
                if (rpm > maxRpm * 0.96) {
                    var visible = rpm <= maxRpm * 0.99 || Math.floor((time || performance.now() / 1000) * 20) % 2 === 1;
                    if (visible) drawFullImage('shift_flash');
                }

                // Readout LCD & Unit
                drawReadout(data, gearLabel);

                // Needle rotation
                drawFullImage('default_needle', needleAngle);
            }

            var sweepActive = false;
            function triggerSweep() {
                if (sweepActive) return;
                sweepActive = true;
                var startTime = performance.now();
                var duration = 1200;
                var maxRpm = 8000;

                function animate(now) {
                    var elapsed = now - startTime;
                    var progress = Math.min(1.0, elapsed / duration);
                    var mockRpm = 0;
                    if (progress < 0.5) {
                        var p = progress / 0.5;
                        mockRpm = maxRpm * Math.sin(p * Math.PI / 2);
                    } else {
                        var p = (progress - 0.5) / 0.5;
                        mockRpm = maxRpm * (1 - Math.sin(p * Math.PI / 2)) + 1000 * Math.sin(p * Math.PI / 2);
                    }

                    renderMW2005({
                        rpm: mockRpm,
                        maxRpm: maxRpm,
                        speed: (mockRpm / maxRpm) * 240,
                        gear: 5
                    }, elapsed / 1000);

                    if (progress < 1.0) {
                        requestAnimationFrame(animate);
                    } else {
                        sweepActive = false;
                    }
                }
                requestAnimationFrame(animate);
            }

            HUDCore.registerStyle('mw2005', {
                containerId: 'mw2005Container',
                scaleMultiplier: 0.95,
                onInit: function(payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                },
                onElementsChange: function(elements) {
                    var c = document.getElementById('mw2005Container');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function(data, payload) {
                    if (payload && payload.isMetric !== undefined) isMetricUnit = payload.isMetric !== false;
                    if (!sweepActive) renderMW2005(data);
                },
                onAnimate: function () {
                    if (isReady) {
                        triggerSweep();
                    } else {
                        sweepPending = true;
                    }
                }
            });

            HUDCore.init('mw2005');

        })();
    </script>
</body>
</html>
