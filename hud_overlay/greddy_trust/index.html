<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GReddy TRUST Sirius Tachometer</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .greddy-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 331px;
            height: 331px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container greddy-container" id="greddyContainer">
            <canvas id="greddyCanvas" width="331" height="331"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('greddyCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('greddyContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/clean_base.png';

            var telemetry = {
                speed: 155,
                rpm: 6800,
                maxRpm: 9000,
                gear: 4
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function drawNeedle(cx, cy, len, angleDeg) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;

                ctx.save();
                ctx.strokeStyle = '#ff7700';
                ctx.lineWidth = 3.4;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#ff5500';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                // Center hub
                ctx.fillStyle = '#111318';
                ctx.strokeStyle = '#ff7700';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean base
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 331, 331);
                }

                var cx = 165;
                var cy = 165;

                // 2. Main Needle (0..9000 RPM, 135..405 deg)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                var tachAngle = 135.0 + rpmRatio * 270.0;
                drawNeedle(cx, cy, 125, tachAngle);

                // 3. Digital Gear (Top Left LCD: 35, 42)
                ctx.save();
                ctx.fillStyle = '#ff2233';
                ctx.font = 'bold 26px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 34, 51, 0.9)';
                ctx.shadowBlur = 6;
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 35, 42);

                // 4. Digital Speed (Bottom Center LCD: 155, 276)
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px "Consolas", monospace';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowBlur = 8;
                ctx.fillText(String(Math.round(telemetry.speed)), 155, 276);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('greddy_trust', {
                containerId: 'greddyContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 8800;
                        telemetry.speed = wave * 240;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('greddy_trust');
            render();
        })();
    </script>
</body>
</html>
