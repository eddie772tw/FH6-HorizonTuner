<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GReddy TRUST Sirius Tachometer</title>
    <!--
      [設計決策紀錄 / Design Decision Note]
      1. 視覺刻度與指針校準: GReddy TRUST 0..9,000 RPM 錶盤刻度由 120° (7 點鐘) 順時針掃掠 300° 至 420° (5 點鐘，中點 4,500 RPM 位於正上方 270°)，
         修正舊版 135°..405° 造成的刻度錯位。
      2. 檔位映射 (Gear Contract): 遵循 coordinator.js 契約 (0='R', 11='N', 1..10='1'..'10')。
      3. 水溫/油溫/油壓: 此單體轉速錶不含水溫與油壓視窗；同系列複合儀表若涉及水溫統一取自四輪平均胎溫 (TireTemp)，
         油溫與油壓則採確定性熱力學與油壓代理模型。
    -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .greddy-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 331px;
            height: 331px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container greddy-container" id="greddyContainer">
            <canvas id="greddyCanvas" width="331" height="331"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('greddyCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('greddyContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/clean_base.png';

            var telemetry = {
                speed: 0,
                rpm: 0,
                maxRpm: 9000,
                gear: 'N'
            };

            function formatGear(g) {
                if (g === 0 || g === 'R') return 'R';
                if (g === 11 || g === 'N') return 'N';
                var n = Number(g);
                if (Number.isInteger(n) && n >= 1 && n <= 10) return String(n);
                return 'N';
            }

            function drawNeedle(cx, cy, len, angleDeg) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;
                var tx = cx - Math.cos(rad) * 18;
                var ty = cy - Math.sin(rad) * 18;

                ctx.save();
                ctx.strokeStyle = '#ff6a00';
                ctx.lineWidth = 3.6;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'rgba(255, 106, 0, 0.85)';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                ctx.fillStyle = '#111318';
                ctx.strokeStyle = '#2d323e';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(cx, cy, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            function render() {
                var w = 331;
                var h = 331;
                ctx.clearRect(0, 0, w, h);

                if (baseImg.complete && baseImg.naturalWidth > 0) {
                    ctx.drawImage(baseImg, 0, 0, 331, 331);
                }

                var cx = 165.5;
                var cy = 165.5;

                // 0 RPM = 120 deg (7 o'clock), 4500 RPM = 270 deg (12 o'clock), 9000 RPM = 420 deg (5 o'clock)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / 9000.0));
                var tachAngle = 120.0 + rpmRatio * 300.0;
                drawNeedle(cx, cy, 128, tachAngle);

                // Digital Gear (Top Left LCD window: 38, 48)
                ctx.save();
                ctx.fillStyle = '#ff2838';
                ctx.font = 'bold 30px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 40, 56, 0.8)';
                ctx.shadowBlur = 6;
                ctx.fillText(telemetry.gear, 38, 48);

                // Digital Speed (Bottom Center LCD window: 165.5, 281)
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 38px "Consolas", monospace';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.75)';
                ctx.shadowBlur = 8;
                ctx.fillText(String(Math.round(telemetry.speed)), 165.5, 281);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('greddy_trust', {
                containerId: 'greddyContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data) {
                    if (data.speed !== undefined) telemetry.speed = Math.abs(Number(data.speed)) || 0;
                    if (data.rpm !== undefined) telemetry.rpm = Math.max(0, Number(data.rpm) || 0);
                    if (data.gear !== undefined) telemetry.gear = formatGear(data.gear);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 8900;
                        telemetry.speed = wave * 240;
                        telemetry.gear = wave > 0.5 ? '4' : '1';
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('greddy_trust');
            render();
        })();
    </script>
</body>
</html>
