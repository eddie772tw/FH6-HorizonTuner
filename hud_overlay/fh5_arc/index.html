<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Forza Horizon 5 Arc HUD</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .fh5-arc-container {
            width: 380px;
            height: 380px;
            pointer-events: none;
            position: relative;
            box-sizing: border-box;
        }
        #fh5ArcCanvas {
            display: block;
            width: 380px;
            height: 380px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container fh5-arc-container" id="fh5ArcContainer">
            <canvas id="fh5ArcCanvas" width="380" height="380"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var domCache = {
                container: document.getElementById('fh5ArcContainer'),
                canvas: document.getElementById('fh5ArcCanvas'),
                ctx: null
            };

            if (domCache.canvas) {
                domCache.ctx = domCache.canvas.getContext('2d');
            }

            var cx = 190;
            var cy = 190;
            var radius = 140;
            var startAngle = 0.72 * Math.PI;
            var totalAngle = 1.56 * Math.PI;

            var isMetric = true;
            var sweepActive = false;
            var sweepStartTime = 0;
            var sweepDuration = 1100;
            var lastValidGear = 1;
            var lastMaxRpm = 8500;
            var lastRedline = 7800;
            var mediaState = { has_media: false, title: '', artist: '' };

            function normPedal(val) {
                if (val === undefined || val === null) return 0;
                var n = Number(val);
                if (isNaN(n)) return 0;
                return Math.max(0, Math.min(1, n > 1 ? n / 255 : n));
            }

            var offscreenDial = null;
            var backingRatio = 0;

            function syncBackingStore() {
                var ratio = Math.max(1, Math.min(3, Number(window.devicePixelRatio) || 1));
                if (ratio === backingRatio || !domCache.ctx) return;
                backingRatio = ratio;
                domCache.canvas.width = Math.round(380 * ratio);
                domCache.canvas.height = Math.round(380 * ratio);
                domCache.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                offscreenDial = null;
            }
            var cachedMaxRpm = 0;
            var cachedRedline = 0;
            var showPedals = false;
            var showMedia = false;
            var palette = {
                white: '#ffffff', red: '#f52d36', muted: 'rgba(255,255,255,0.6)',
                outline: 'rgba(0,0,0,0.58)', track: 'rgba(255,255,255,0.32)'
            };

            function buildDial(maxRpm, redlineRpm) {
                offscreenDial = document.createElement('canvas');
                offscreenDial.width = Math.round(380 * backingRatio);
                offscreenDial.height = Math.round(380 * backingRatio);
                var ctx = offscreenDial.getContext('2d');
                if (!ctx) return;
                ctx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);
                cachedMaxRpm = maxRpm;
                cachedRedline = redlineRpm;
                var redRatio = Math.max(0, Math.min(1, redlineRpm / maxRpm));
                ctx.lineCap = 'butt';
                ctx.shadowColor = palette.outline;
                ctx.shadowBlur = 2;

                // Thin ring and a permanently marked red sector, not a filled progress bar.
                ctx.beginPath();
                ctx.arc(cx, cy, radius, startAngle, startAngle + totalAngle);
                ctx.lineWidth = 4;
                ctx.strokeStyle = palette.outline;
                ctx.stroke();
                ctx.lineWidth = 2;
                ctx.strokeStyle = palette.white;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, radius, startAngle + redRatio * totalAngle, startAngle + totalAngle);
                ctx.lineWidth = 5;
                ctx.strokeStyle = palette.red;
                ctx.stroke();

                // Scale follows the actual engine range; 8500 rpm retains labels 0 through 8.
                var majorStep = maxRpm > 14000 ? 2000 : 1000;
                for (var tickRpm = 0; tickRpm <= maxRpm; tickRpm += majorStep / 2) {
                    var major = tickRpm % majorStep === 0;
                    var angle = startAngle + tickRpm / maxRpm * totalAngle;
                    var cos = Math.cos(angle);
                    var sin = Math.sin(angle);
                    ctx.beginPath();
                    ctx.moveTo(cx + cos * (radius - 3), cy + sin * (radius - 3));
                    ctx.lineTo(cx + cos * (radius - (major ? 13 : 8)), cy + sin * (radius - (major ? 13 : 8)));
                    ctx.lineWidth = major ? 4 : 3;
                    ctx.strokeStyle = palette.outline;
                    ctx.stroke();
                    ctx.lineWidth = major ? 2 : 1;
                    ctx.strokeStyle = tickRpm >= redlineRpm ? palette.red : palette.white;
                    ctx.stroke();
                    if (major) {
                        ctx.font = '20px "ForzaFont", Arial, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = tickRpm >= redlineRpm ? palette.red : palette.white;
                        ctx.lineWidth = 2.5;
                        ctx.lineJoin = 'round';
                        ctx.strokeStyle = palette.outline;
                        ctx.strokeText(String(tickRpm / 1000), cx + cos * (radius - 31), cy + sin * (radius - 31));
                        ctx.fillText(String(tickRpm / 1000), cx + cos * (radius - 31), cy + sin * (radius - 31));
                    }
                }
                ctx.shadowBlur = 0;
            }

            function drawFh5ArcHUD(rpm, maxRpm, redlineRpm, speed, gear, throttle, brake, isHandbrake, now) {
                var ctx = domCache.ctx;
                if (!ctx) return;
                syncBackingStore();
                if (!offscreenDial || cachedMaxRpm !== maxRpm || cachedRedline !== redlineRpm) {
                    buildDial(maxRpm, redlineRpm);
                }
                ctx.clearRect(0, 0, 380, 380);
                ctx.drawImage(offscreenDial, 0, 0, 380, 380);
                ctx.textBaseline = 'alphabetic';
                ctx.lineCap = 'butt';
                var rpmRatio = maxRpm > 0 ? Math.max(0, Math.min(1, rpm / maxRpm)) : 0;
                var isRedline = rpm >= redlineRpm;
                var isLimiter = maxRpm > 0 && rpm >= maxRpm * 0.98;
                var accent = window._currentUseDefaultColors === false && window._currentCustomColor
                    ? window._currentCustomColor : palette.white;
                var needleColor = isRedline ? palette.red : accent;
                if (isLimiter && Math.floor(now / 100) % 2 === 0) needleColor = palette.white;

                // A short radial pointer leaves the interior clear for the gear readout.
                var needleAngle = startAngle + rpmRatio * totalAngle;
                var needleCos = Math.cos(needleAngle);
                var needleSin = Math.sin(needleAngle);
                ctx.beginPath();
                ctx.moveTo(cx + needleCos * (radius - 22), cy + needleSin * (radius - 22));
                ctx.lineTo(cx + needleCos * (radius + 8), cy + needleSin * (radius + 8));
                ctx.strokeStyle = needleColor;
                ctx.lineWidth = 4;
                ctx.shadowColor = palette.outline;
                ctx.shadowBlur = 3;
                ctx.stroke();

                // Game-inspired hierarchy: open central gear, speed in the lower opening.
                var gearText = gear <= 0 ? 'R' : (gear === 11 ? 'N' : String(gear));
                ctx.fillStyle = isRedline ? palette.red : palette.white;
                ctx.font = '72px "ForzaGear", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 3;
                ctx.strokeStyle = palette.outline;
                ctx.strokeText(gearText, cx, cy + 15);
                ctx.fillText(gearText, cx, cy + 15);
                ctx.fillStyle = palette.white;
                ctx.font = 'bold 70px "ForzaFont", Arial, sans-serif';
                ctx.strokeText(String(Math.round(speed)), cx, cy + 116);
                ctx.fillText(String(Math.round(speed)), cx, cy + 116);
                ctx.font = '16px "ForzaFont", Arial, sans-serif';
                ctx.textAlign = 'left';
                ctx.lineWidth = 2.5;
                ctx.strokeText(isMetric ? 'KM/H' : 'MPH', cx + 46, cy + 51);
                ctx.fillText(isMetric ? 'KM/H' : 'MPH', cx + 46, cy + 51);
                ctx.shadowBlur = 0;

                // These are optional FH telemetry additions, separate from the reference dial.
                if (showPedals) {
                    ctx.fillStyle = palette.track;
                    ctx.fillRect(115, 327, 65, 3);
                    ctx.fillRect(200, 327, 65, 3);
                    ctx.fillStyle = palette.red;
                    ctx.fillRect(180 - brake * 65, 327, brake * 65, 3);
                    ctx.fillStyle = palette.white;
                    ctx.fillRect(200, 327, throttle * 65, 3);
                }
                ctx.textAlign = 'center';
                ctx.font = '12px "ForzaFont", Arial, sans-serif';
                if (isHandbrake) {
                    ctx.fillStyle = palette.red;
                    ctx.strokeText('(P) HANDBRAKE', cx, 351);
                    ctx.fillText('(P) HANDBRAKE', cx, 351);
                } else if (showMedia && mediaState.has_media && mediaState.title) {
                    var title = mediaState.title;
                    if (title.length > 30) title = title.substring(0, 28) + '…';
                    ctx.fillStyle = palette.muted;
                    ctx.strokeText(title, cx, 351);
                    ctx.fillText(title, cx, 351);
                }
            }
            function runSweep(now) {
                if (!sweepActive) return;
                var elapsed = now - sweepStartTime;
                var progress = elapsed / sweepDuration;

                if (progress >= 1.0) {
                    sweepActive = false;
                    drawFh5ArcHUD(0, lastMaxRpm, lastRedline, 0, 1, 0, 0, false, now);
                    return;
                }

                var currentRpm = progress < 0.5
                    ? (progress / 0.5) * lastMaxRpm
                    : (1 - (progress - 0.5) / 0.5) * lastMaxRpm;

                var mockSpeed = (currentRpm / lastMaxRpm) * 260;
                drawFh5ArcHUD(currentRpm, lastMaxRpm, lastRedline, mockSpeed, 1, 1.0, 0, false, now);
                requestAnimationFrame(runSweep);
            }

            HUDCore.registerStyle('fh5_arc', {
                containerId: 'fh5ArcContainer',
                scaleMultiplier: 1.0,

                onInit: function (payload) {
                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                },

                onElementsChange: function (elements) {
                    if (!elements) return;
                    if (elements.showPedals !== undefined) showPedals = elements.showPedals === true;
                    if (elements.showMedia !== undefined) showMedia = elements.showMedia === true;
                    if (domCache.container) {
                        domCache.container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function (data, payload) {
                    if (sweepActive) return;

                    var maxRpm = data.max_rpm || data.maxRpm || 8500;
                    var redlineRpm = (payload && payload.redlineRpm) || data.redlineRpm || (maxRpm * 0.92);
                    lastMaxRpm = maxRpm;
                    lastRedline = redlineRpm;

                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                    if (data && data.displayUnits && data.displayUnits.speed) {
                        isMetric = data.displayUnits.speed !== 'mph';
                    }

                    var rpm = data.rpm || 0;
                    var rawSpeed = isMetric !== false
                        ? (data.speed_kmh !== undefined ? data.speed_kmh : (data.speed || 0))
                        : (data.speed_mph !== undefined ? data.speed_mph : ((data.speed_kmh || data.speed || 0) * 0.621371));

                    if (data.gear !== undefined && data.gear <= 11) {
                        lastValidGear = data.gear;
                    }

                    var throttle = data.throttle !== undefined ? normPedal(data.throttle) : normPedal(data.accel);
                    var brake = data.brake !== undefined ? normPedal(data.brake) : normPedal(data.brake_input);
                    var isHandbrake = !!(data.handbrake || data.hand_brake || data.Handbrake || data.HandBrake);

                    drawFh5ArcHUD(rpm, maxRpm, redlineRpm, rawSpeed, lastValidGear, throttle, brake, isHandbrake, performance.now());
                },

                onMedia: function (data) {
                    if (data && (data.success || data.has_media) && data.title) {
                        mediaState.has_media = true;
                        mediaState.title = data.title;
                        mediaState.artist = data.artist || '';
                    } else {
                        mediaState.has_media = false;
                        mediaState.title = '';
                        mediaState.artist = '';
                    }
                },

                onAnimate: function () {
                    sweepActive = true;
                    sweepStartTime = performance.now();
                    requestAnimationFrame(runSweep);
                }
            });

            HUDCore.init('fh5_arc');

            setTimeout(function () {
                drawFh5ArcHUD(0, 8500, 7800, 0, 1, 0, 0, false, performance.now());
            }, 60);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    offscreenDial = null;
                    drawFh5ArcHUD(0, 8500, 7800, 0, 1, 0, 0, false, performance.now());
                });
            }
        })();
    </script>
</body>
</html>
