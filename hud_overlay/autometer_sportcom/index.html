<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMeter Sport-Comp Monster 5" Tachometer</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        .autometer-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 300px;
            height: 300px;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container autometer-container" id="autometerContainer">
            <canvas id="autometerCanvas" width="300" height="300"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('autometerCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('autometerContainer');

            var baseImg = new Image();
            baseImg.src = 'assets/clean_base.png';

            var telemetry = {
                speed: 148,
                rpm: 6400,
                maxRpm: 10000,
                redline: 7200,
                gear: 4
            };

            var gears = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];

            function drawNeedle(cx, cy, len, angleDeg, color) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;

                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = 3.2;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 6;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                // Center red hub
                ctx.fillStyle = '#ff2233';
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.arc(cx, cy, 7.0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function render() {
                var w = canvas.width;
                var h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // 1. Clean base plate
                if (baseImg.complete) {
                    ctx.drawImage(baseImg, 0, 0, 300, 300);
                }

                // Center hub of 300x300 dial is (142, 148)
                var cx = 142;
                var cy = 148;

                // 2. Main Needle: 0 RPM = 135 deg to 10k RPM = 45 deg -> 270 deg sweep
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / telemetry.maxRpm));
                var tachAngle = 135.0 + rpmRatio * 270.0;
                drawNeedle(cx, cy, 110, tachAngle, '#ff2233');

                // 3. Super Shift Light (Top Left: 38, 38)
                var isShift = telemetry.rpm >= telemetry.redline;
                if (isShift) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(38, 38, 18, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff9900';
                    ctx.shadowColor = '#ff6600';
                    ctx.shadowBlur = 24;
                    ctx.fill();

                    // Hot center
                    ctx.beginPath();
                    ctx.arc(38, 38, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffcc';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.restore();
                }

                // 4. Digital Speed LCD (Box: 227, 148)
                ctx.save();
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 36px "Consolas", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowBlur = 6;
                ctx.fillText(String(Math.round(telemetry.speed)), 228, 158);

                // 5. Digital Gear LCD (Box: 242, 215)
                ctx.font = 'bold 34px "Consolas", monospace';
                var gIdx = telemetry.gear;
                var gChar = gears[gIdx] || (gIdx === 0 ? 'R' : String(gIdx - 1));
                ctx.fillText(gChar, 242, 230);
                ctx.restore();
            }

            baseImg.onload = render;

            HUDCore.registerStyle('autometer_sportcom', {
                containerId: 'autometerContainer',
                scaleMultiplier: 0.95,

                onElementsChange: function(elements) {
                    if (container) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (data.speed !== undefined) telemetry.speed = Number(data.speed);
                    if (data.rpm !== undefined) telemetry.rpm = Number(data.rpm);
                    if (data.gear !== undefined) telemetry.gear = Number(data.gear);
                    if (payload && payload.redlineRpm !== undefined) telemetry.redline = Number(payload.redlineRpm);
                    render();
                },

                onAnimate: function() {
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 9600;
                        telemetry.speed = wave * 220;
                        telemetry.gear = wave > 0.5 ? 4 : 1;
                        render();
                        if (progress < 1) requestAnimationFrame(sweep);
                    }
                    requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('autometer_sportcom');
            render();
        })();
    </script>
</body>
</html>
