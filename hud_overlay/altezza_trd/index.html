<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Altezza TRD Chronograph Cluster</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <!--
        [設計決策紀錄 / Design Decision Note]
        1. 水溫與油溫/油壓資料來源：
           水溫 (Water / Coolant Temp) 直接採用遙測輪胎溫度 (Tire Temp FL/FR/RL/RR) 之平均值（依 raw °F 契約固定轉 °C；缺資料顯示冷端）；
           油溫 (Oil Temp) 與油壓 (Oil Pressure) 因 Forza UDP 封包未提供原生感測器數值，暫依轉速比與節氣門/增壓負載驅動之確定性熱力學與油壓代理模型 (Deterministic Proxy Model) 模擬。
    -->
    <style>
        .altezza-container {
            width: 545px;
            height: 330px;
            position: relative;
            pointer-events: none;
        }
        #altezzaCanvas {
            display: block;
            width: 545px;
            height: 330px;
            filter: none;
        }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>

    <div class="hud-root-wrapper">
        <div class="hud-gauge-container altezza-container" id="altezzaContainer">
            <canvas id="altezzaCanvas" width="545" height="330"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script>
        (function() {
            var canvas = document.getElementById('altezzaCanvas');
            var ctx = canvas.getContext('2d');
            var container = document.getElementById('altezzaContainer');

            // The plate silhouette is geometry, never the brightness contour of its lettering.
            var baseImg = HUDArtwork.loadImage('assets/altezza_clean_base.png', 0);
            var basePlate = null;
            var lcdGlyphs = null;
            var lcdAtlas = new Image();
            lcdAtlas.onload = function() {
                lcdGlyphs = document.createElement('canvas');
                lcdGlyphs.width = lcdAtlas.naturalWidth;
                lcdGlyphs.height = lcdAtlas.naturalHeight;
                var glyphContext = lcdGlyphs.getContext('2d');
                glyphContext.drawImage(lcdAtlas, 0, 0);
                var glyphPixels = glyphContext.getImageData(0, 0, lcdGlyphs.width, lcdGlyphs.height);
                for (var i = 0; i < glyphPixels.data.length; i += 4) {
                    glyphPixels.data[i + 3] *= glyphPixels.data[i] / 255;
                    glyphPixels.data[i] = 32;
                    glyphPixels.data[i + 1] = 26;
                    glyphPixels.data[i + 2] = 23;
                }
                glyphContext.putImageData(glyphPixels, 0, 0);
                render();
            };
            lcdAtlas.src = 'assets/res_256.png';

            var isSweeping = false;
            var sweepRafId = null;
            var isMetric = true;

            var telemetry = {
                speed: 0,
                rpm: 0,
                maxRpm: 10000,
                gear: 1,
                fuel: 0.75,
                tempC: 70,
                oilTempC: 60,
                oilPressBar: 0
            };

            function formatGear(g) {
                var gearNum = Number(g);
                if (!Number.isFinite(gearNum) || gearNum < 0 || gearNum === 11) return 'N';
                if (gearNum === 0) return 'R';
                return String(Math.round(gearNum));
            }

            function drawNeedle(cx, cy, len, tailLen, angleDeg, color, width, hubR) {
                var rad = angleDeg * (Math.PI / 180.0);
                var nx = cx + Math.cos(rad) * len;
                var ny = cy + Math.sin(rad) * len;
                var tx = cx - Math.cos(rad) * (tailLen || 0);
                var ty = cy - Math.sin(rad) * (tailLen || 0);

                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 5;

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(nx, ny);
                ctx.stroke();

                if (hubR) {
                    ctx.fillStyle = '#18191d';
                    ctx.strokeStyle = '#3a3d45';
                    ctx.lineWidth = 1.2;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }

            function drawLcdText(text, cx, cy, size, advance) {
                if (!lcdGlyphs) return;
                var x = cx - ((text.length - 1) * advance + size) / 2;
                for (var i = 0; i < text.length; i++) {
                    var code = text.charCodeAt(i);
                    ctx.drawImage(lcdGlyphs, (code % 16) * 64, Math.floor(code / 16) * 64,
                        64, 64, x + i * advance, cy - size / 2, size, size);
                }
            }

            function render() {
                ctx.clearRect(0, 0, 545, 330);

                if (basePlate) {
                    ctx.drawImage(basePlate, 0, 0);
                }
                // Keep the original artwork/needle coordinates inside a padded viewport.
                ctx.save();
                ctx.translate(20, 20);

                // 1. Subdial 1: Water Temp (Pivot: 266, 91), left-half scale 70..130 C (125..235 deg)
                var wtRatio = Math.min(1.0, Math.max(0.0, (telemetry.tempC - 55.0) / 75.0));
                var wtAngle = 125.0 + wtRatio * 110.0;
                drawNeedle(266, 91, 24, 4, wtAngle, '#ff6622', 1.8, 4.5);

                // 2. Subdial 2: Oil Temp (Pivot: 325, 149), left-half scale 60..140 C (120..240 deg)
                var otRatio = Math.min(1.0, Math.max(0.0, (telemetry.oilTempC - 55.0) / 90.0));
                var otAngle = 120.0 + otRatio * 120.0;
                drawNeedle(325, 149, 24, 4, otAngle, '#ff6622', 1.8, 4.5);

                // 3. Subdial 3: Oil Press (Pivot: 266, 207), left-half scale 0..8 x100kPa (120..240 deg)
                var opRatio = Math.min(1.0, Math.max(0.0, telemetry.oilPressBar / 9.0));
                var opAngle = 120.0 + opRatio * 120.0;
                drawNeedle(266, 207, 24, 4, opAngle, '#ff6622', 1.8, 4.5);

                // 4. Main Center Tachometer (Pivot: 266, 148), 0..10,000 RPM (126..414 deg, 5 at 270 deg)
                var rpmRatio = Math.min(1.0, Math.max(0.0, telemetry.rpm / 10000.0));
                var tachAngle = 126.0 + rpmRatio * 288.0;
                drawNeedle(266, 148, 92, 16, tachAngle, rpmRatio > 0.85 ? '#ff1e38' : '#ff5511', 3.0, 11);

                // 5. Left Speedometer (Pivot: 105, 149), 0..260 km/h (90..270 deg)
                var spdRatio = Math.min(1.0, Math.max(0.0, telemetry.speed / 260.0));
                var spdAngle = 90.0 + spdRatio * 180.0;
                drawNeedle(105, 149, 64, 12, spdAngle, '#ff5511', 2.5, 9);

                // 6. Right Fuel Level (Pivot: 435, 215), E at 360 deg (3:00), F at 270 deg (12:00)
                var fuelRatio = Math.min(1.0, Math.max(0.0, telemetry.fuel));
                var fuelAngle = 360.0 - fuelRatio * 90.0;
                drawNeedle(435, 215, 38, 6, fuelAngle, '#ff5511', 2.2, 7);

                // 7. Original res_256 LCD glyphs, centered inside the two baked display windows.
                drawLcdText(formatGear(telemetry.gear), 134, 232, 32, 20);

                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                drawLcdText(hh + ':' + mm, 460, 248, 20, 12);
                ctx.restore();
            }

            baseImg.onload = function() {
                basePlate = document.createElement('canvas');
                basePlate.width = 545;
                basePlate.height = 330;
                var plate = basePlate.getContext('2d');
                plate.translate(20, 20);
                var silhouette = new Path2D();
                // Include the outer numerals, tick tips and labels, with breathing room.
                silhouette.arc(105, 149, 108, 0, Math.PI * 2);
                silhouette.moveTo(418, 149);
                silhouette.arc(266, 149, 152, 0, Math.PI * 2);
                silhouette.moveTo(510, 215);
                silhouette.arc(435, 215, 75, 0, Math.PI * 2);
                silhouette.rect(115, 215, 39, 40);
                silhouette.rect(407, 239, 88, 34);
                // One union fill avoids increasing opacity where circles overlap.
                plate.fillStyle = 'rgba(8, 10, 15, 0.5)';
                plate.fill(silhouette);
                plate.drawImage(baseImg, 0, 0, 505, 276);
                render();
            };

            HUDCore.registerStyle('altezza_trd', {
                containerId: 'altezzaContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, render),

                onInit: function(cfg) {
                    if (cfg) {
                        if (cfg.isMetric !== undefined) isMetric = cfg.isMetric !== false;
                        else if (cfg.unit) isMetric = cfg.unit !== 'mph';
                    }
                    render();
                },

                onElementsChange: function(elements) {
                    if (container && elements && elements.showGauge !== undefined) {
                        container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function(data, payload) {
                    if (!data) return;
                    payload = payload || {};
                    if (payload.isMetric !== undefined) isMetric = payload.isMetric !== false;
                    if (data.displayUnits && data.displayUnits.speed) {
                        isMetric = data.displayUnits.speed !== 'mph';
                    }

                    telemetry.speed = isMetric
                        ? Number(data.speed_kmh !== undefined ? data.speed_kmh : (data.speed || 0))
                        : Number(data.speed_mph !== undefined ? data.speed_mph : ((data.speed_kmh || data.speed || 0) * 0.621371));
                    telemetry.rpm = Number(data.rpm || 0);
                    telemetry.maxRpm = Number(data.max_rpm || data.maxRpm || payload.redlineRpm || 10000);
                    telemetry.gear = data.gear !== undefined ? Number(data.gear) : 1;
                    telemetry.fuel = data.fuel_ratio !== undefined && data.fuel_ratio !== null
                        ? Number(data.fuel_ratio)
                        : (data.fuel_level !== undefined ? Number(data.fuel_level) : 0.75);

                    var rpmRatio = Math.min(1, Math.max(0, telemetry.rpm / Math.max(1000, telemetry.maxRpm)));
                    var throttle = Number(data.throttle || 0);
                    telemetry.tempC = HUDCore.getAverageTireTemperatureC(data) ?? 0;
                    if (telemetry.rpm > 0) {
                        telemetry.oilTempC = Math.min(140, Math.max(60, telemetry.tempC + 8 + rpmRatio * 18 + throttle * 6));
                        telemetry.oilPressBar = Math.min(8.5, Math.max(1.2, 1.8 + rpmRatio * 5.2 + throttle * 0.8));
                    } else {
                        telemetry.oilTempC = 55;
                        telemetry.oilPressBar = 0;
                    }

                    if (!isSweeping) {
                        render();
                    }
                },

                onAnimate: function() {
                    if (sweepRafId !== null) cancelAnimationFrame(sweepRafId);
                    isSweeping = true;
                    var start = performance.now();
                    var duration = 1200;
                    function sweep(t) {
                        var progress = Math.min(1, (t - start) / duration);
                        var wave = Math.sin(progress * Math.PI);
                        telemetry.rpm = wave * 10000;
                        telemetry.speed = wave * 260;
                        telemetry.gear = progress < 0.98 ? Math.max(1, Math.min(6, Math.ceil(wave * 6))) : 1;
                        telemetry.fuel = wave;
                        telemetry.tempC = 55 + wave * 75;
                        telemetry.oilTempC = 55 + wave * 85;
                        telemetry.oilPressBar = wave * 8.5;
                        render();
                        if (progress < 1) {
                            sweepRafId = requestAnimationFrame(sweep);
                        } else {
                            isSweeping = false;
                            sweepRafId = null;
                            telemetry.rpm = 0;
                            telemetry.speed = 0;
                            telemetry.gear = 1;
                            telemetry.fuel = 0.75;
                            telemetry.tempC = 55;
                            telemetry.oilTempC = 55;
                            telemetry.oilPressBar = 0;
                            render();
                        }
                    }
                    sweepRafId = requestAnimationFrame(sweep);
                }
            });

            HUDCore.init('altezza_trd');
            render();
        })();
    </script>
</body>
</html>
