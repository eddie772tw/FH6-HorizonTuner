<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Altezza TRD Chronograph</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        #altezzaContainer { position: relative; width: 545px; height: 330px; pointer-events: none; }
        #altezzaPlate, #altezzaCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="teleCardsMount"></div>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container" id="altezzaContainer">
            <img id="altezzaPlate" src="assets/chronograph.svg" alt="">
            <canvas id="altezzaCanvas" width="545" height="330" aria-label="Toyota Altezza chronograph"></canvas>
        </div>
    </div>
    <script src="../shared/hud-core.js"></script>
    <script src="../shared/hud-artwork.js"></script>
    <script>
        (function() {
            const canvas = document.getElementById('altezzaCanvas');
            const ctx = canvas.getContext('2d');
            const plate = document.getElementById('altezzaPlate');
            let speedCenter = false;
            let unit = 'kmh';
            let sweepFrame = null;
            const telemetry = { speed: null, rpm: 0, gear: null, fuel: null, oilTempC: null, voltage: null, coolantTempC: null, ceiling: 9000, redline: 8000 };

            function clamp(value) {
                return Math.max(0, Math.min(1, value));
            }

            // Cache lettering and ticks at the actual backing resolution until a scale input changes.
            const tachPlate = document.createElement('canvas');
            let lastScale = '';
            function drawTachScale(state) {
                const key = [speedCenter, state.ceiling, state.redline, canvas.width, canvas.height].join('/');
                if (key !== lastScale) {
                    lastScale = key;
                    tachPlate.width = canvas.width;
                    tachPlate.height = canvas.height;
                    const g = tachPlate.getContext('2d');
                    g.scale(canvas.width / 545, canvas.height / 330);
                    const x = speedCenter ? 129 : 269, y = speedCenter ? 168 : 165;
                    const radius = speedCenter ? 104 : 128;
                    const start = speedCenter ? 132 : 140, span = speedCenter ? 147 : 234;
                    const angle = rpm => (start + span * rpm / state.ceiling) * Math.PI / 180;
                    g.translate(x, y);
                    g.strokeStyle = '#be3428';
                    g.lineWidth = 6;
                    g.beginPath();
                    g.arc(0, 0, radius - 3, angle(state.redline), angle(state.ceiling));
                    g.stroke();
                    const major = rpmStep(state.ceiling);
                    const minor = major / 10;
                    g.strokeStyle = g.fillStyle = '#f0eadc';
                    g.font = '600 ' + (speedCenter ? 12 : 16) + 'px sans-serif';
                    g.textAlign = 'center';
                    g.textBaseline = 'middle';
                    for (let rpm = 0; rpm <= state.ceiling; rpm += minor) {
                        const prominent = rpm % major === 0;
                        const a = angle(rpm);
                        const c = Math.cos(a), s = Math.sin(a);
                        const inner = radius - (prominent ? 8 : 3);
                        g.lineWidth = prominent ? 1.6 : .85;
                        g.beginPath();
                        g.moveTo(c * radius, s * radius);
                        g.lineTo(c * inner, s * inner);
                        g.stroke();
                        if (prominent) {
                            g.save();
                            g.translate(c * (radius - 17), s * (radius - 17));
                            if (!speedCenter) g.rotate(a + Math.PI / 2 + (a < Math.PI || a > 2 * Math.PI ? Math.PI : 0));
                            g.fillText(String(rpm / 1000), 0, 0);
                            g.restore();
                        }
                    }
                    g.font = '600 9px sans-serif';
                    g.fillText('×1000 r/min', speedCenter ? -18 : 48, speedCenter ? 76 : 101);
                }
                ctx.drawImage(tachPlate, 0, 0, 545, 330);
            }

            function rpmStep(maximum) {
                if (maximum <= 4000) return 500;
                if (maximum <= 10000) return 1000;
                return Math.ceil(maximum / 10000) * 1000;
            }

            function needle(x, y, length, degrees, width, small = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(degrees * Math.PI / 180);
                ctx.fillStyle = small ? '#d5dce3' : '#cf382e';
                ctx.strokeStyle = small ? '#363b40' : '#792a27';
                ctx.lineWidth = .8;
                ctx.beginPath();
                ctx.moveTo(-6, -width / 2);
                ctx.lineTo(length, -.6);
                ctx.lineTo(length, .6);
                ctx.lineTo(-6, width / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = small ? '#272a2f' : '#222328';
                ctx.beginPath();
                ctx.arc(0, 0, small ? 3.5 : 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = small ? '#c2c5c7' : '#ffba99';
                ctx.beginPath();
                ctx.moveTo(-4, -.7);
                ctx.lineTo(length - 1, -.7);
                ctx.stroke();
                ctx.restore();
            }

            // The seven segments occupy a fixed-width cell, so the units never move.
            const segments = [
                [2, 1, 10, 1], [12, 3, 12, 10], [12, 14, 12, 21], [2, 23, 10, 23],
                [0, 14, 0, 21], [0, 3, 0, 10], [2, 12, 10, 12]
            ];
            const digits = ['012345', '12', '01643', '01623', '5612', '05623', '056423', '012', '0123456', '012356'];
            function lcd(value, gear) {
                const readout = value === null ? '---' : String(Math.round(value));
                ctx.save();
                ctx.strokeStyle = ctx.fillStyle = '#fff0a4';
                ctx.lineWidth = 2.7;
                ctx.lineCap = 'round';
                ctx.textAlign = 'right';
                ctx.font = 'bold 16px monospace';
                ctx.fillText(gear, 496, 195);
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText(unit === 'mph' ? 'mph' : 'km/h', 500, 216);
                ctx.translate(474 - readout.length * 18, 211);
                ctx.transform(1, 0, -.07, 1.36, 0, 0);
                for (const char of readout) {
                    for (const index of digits[char] || '6') {
                        const [x1, y1, x2, y2] = segments[index];
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }
                    ctx.translate(18, 0);
                }
                ctx.restore();
            }

            function render(state = telemetry) {
                ctx.clearRect(0, 0, 545, 330);
                const speedRatio = clamp(state.speed / 180);
                const rpmRatio = clamp(state.rpm / state.ceiling);
                drawTachScale(state);
                needle(129, 168, 98, 132 + 147 * (speedCenter ? rpmRatio : speedRatio), 3);
                needle(423, 148, 65, 4 - 106 * clamp(state.fuel), 3);
                needle(269, 110, 25, 115 + 142 * clamp((state.oilTempC - 60) / 90), 2, true);
                needle(322, 165, 25, 115 + 142 * clamp(state.voltage / 18), 2, true);
                needle(269, 220, 25, 115 + 142 * clamp((state.coolantTempC - 55) / 75), 2, true);
                needle(269, 165, 124, 140 + 234 * (speedCenter ? speedRatio : rpmRatio), 4.6);
                const gear = state.gear === null ? '–' : state.gear === 0 ? 'R' : state.gear === 11 ? 'N' : String(state.gear);
                lcd(state.speed === null ? null : state.speed / (unit === 'mph' ? 1.609344 : 1), gear);
            }

            HUDCore.registerStyle('altezza_trd', {
                containerId: 'altezzaContainer',
                scaleBaseline: 2.1,
                scaleMultiplier: 0.95,
                onScale: HUDArtwork.watchCanvas(canvas, () => render()),
                onInit: function(config = {}) {
                    speedCenter = config.altezzaCenterDial === 'speed';
                    plate.src = 'assets/chronograph.svg' + (speedCenter ? '#speed' : '');
                    unit = config.effectiveUnits?.speed || config.unit || 'kmh';
                    render();
                },
                onFrame: function(data) {
                    if (!data) return;
                    const source = data.sourceTelemetry;
                    telemetry.speed = Number.isFinite(data.speed_kmh) && (!source || Number.isFinite(source.SpeedMetersPerSecond))
                        ? Math.max(0, data.speed_kmh) : null;
                    const gear = source ? source.Gear : data.gear;
                    telemetry.gear = Number.isInteger(gear) && gear >= 0 && gear <= 11 ? gear : null;
                    telemetry.rpm = Number.isFinite(data.rpm) ? data.rpm : 0;
                    telemetry.fuel = data.fuel_ratio ?? data.fuel_level ?? null;
                    // Optional measured channels. Unsupported or missing sensors park at the low stop.
                    telemetry.oilTempC = Number.isFinite(data.oil_temp_c) ? data.oil_temp_c : null;
                    telemetry.voltage = Number.isFinite(data.battery_voltage_v) ? data.battery_voltage_v : null;
                    telemetry.coolantTempC = Number.isFinite(data.coolant_temp_c) ? data.coolant_temp_c : null;
                    const maximum = source ? source.EngineMaxRpm : data.max_rpm ?? data.maxRpm;
                    const validMaximum = Number.isFinite(maximum) && maximum >= 1000 && maximum <= 100000;
                    const limit = validMaximum ? maximum : 9000;
                    const step = rpmStep(limit);
                    telemetry.ceiling = Math.ceil(limit / step) * step;
                    telemetry.redline = validMaximum && Number.isFinite(data.redlineRpm) && data.redlineRpm > 0
                        ? Math.min(data.redlineRpm, limit) : Math.max(0, limit - 1000);
                    unit = data.displayUnits?.speed || unit;
                    if (sweepFrame === null) render();
                },
                onAnimate: function() {
                    if (sweepFrame !== null) cancelAnimationFrame(sweepFrame);
                    const start = performance.now();
                    function sweep(now) {
                        const progress = clamp((now - start) / 1200);
                        if (progress === 1) {
                            sweepFrame = null;
                            render();
                            return;
                        }
                        const wave = Math.sin(progress * Math.PI);
                        render({ ...telemetry, speed: 180 * wave, rpm: telemetry.ceiling * wave, fuel: wave, gear: Math.ceil(wave * 6),
                            oilTempC: 60 + wave * 90, voltage: wave * 18, coolantTempC: 55 + wave * 75 });
                        sweepFrame = requestAnimationFrame(sweep);
                    }
                    sweepFrame = requestAnimationFrame(sweep);
                }
            });
            HUDCore.init('altezza_trd');
            render();
        })();
    </script>
</body>
</html>
