<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Initial D AE86 TRD 11,000 RPM Tachometer</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .initial-d-container {
            width: 420px;
            height: 420px;
            pointer-events: none;
            position: relative;
            box-sizing: border-box;
        }
        #initialDCanvas {
            display: block;
            width: 420px;
            height: 420px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container initial-d-container" id="initialDContainer">
            <canvas id="initialDCanvas" width="420" height="420"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var domCache = {
                container: document.getElementById('initialDContainer'),
                canvas: document.getElementById('initialDCanvas'),
                ctx: null
            };

            if (domCache.canvas) {
                domCache.ctx = domCache.canvas.getContext('2d');
            }

            var cx = 205;
            var cy = 220;
            var dialR = 160;

            var isMetric = true;
            var sweepActive = false;
            var sweepStartTime = 0;
            var sweepDuration = 1200;
            var lastValidGear = 1;
            var offscreenDial = null;
            var offscreenCap = null;
            var backingRatio = 0;

            function syncBackingStore() {
                var ratio = Math.max(1, Math.min(3, Number(window.devicePixelRatio) || 1));
                if (ratio === backingRatio || !domCache.ctx) return;
                backingRatio = ratio;
                domCache.canvas.width = Math.round(420 * ratio);
                domCache.canvas.height = Math.round(420 * ratio);
                domCache.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                offscreenDial = null;
                offscreenCap = null;
            }
            // Instrument artwork has a fixed material palette, independent of GUI themes.
            var ink = {
                face: '#10100f', rimDark: '#080808', rimLight: '#777772',
                marking: '#eee9dc', redline: '#d63b2c', needle: '#f25123',
                needleHighlight: '#ffb46a', secondary: '#b8b4a9'
            };

            // Audio Chime State
            var audioCtx = null;
            var lastChimeTime = 0;
            var chimeInterval = 1200;
            var isGaugeVisible = true;
            var showAudioChime = true;

            function initAudioContext() {
                try {
                    if (!audioCtx) {
                        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (AudioContextClass) audioCtx = new AudioContextClass();
                    }
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume().catch(function () {});
                    }
                } catch (e) {}
            }

            if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
                window.addEventListener('pointerdown', initAudioContext, { once: true });
                window.addEventListener('keydown', initAudioContext, { once: true });
            }

            function playSingleDing(startTime, freqStart, freqEnd) {
                if (!audioCtx || audioCtx.state === 'suspended') return;
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqStart, startTime);
                osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + 0.32);
                gain.gain.setValueAtTime(0.18, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.32);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.32);
            }

            function playSpeedChime() {
                try {
                    initAudioContext();
                    if (!audioCtx || audioCtx.state === 'suspended') return;

                    var now = audioCtx.currentTime;
                    // Dual-bell Ding-Ding (High 1020Hz -> 820Hz, followed by echo Ding at +0.35s)
                    playSingleDing(now, 1020, 820);
                    playSingleDing(now + 0.35, 980, 820);
                } catch (e) {
                    // Audio context safety fallback
                }
            }

            // Non-linear angle calculation ($0 \sim 11,000$ RPM)
            function getInitialDAngle(rpm) {
                var r = Math.max(0, Math.min(11000, rpm));
                var startAngle = 140 * (Math.PI / 180);
                var totalSpan = 260 * (Math.PI / 180);

                var ratio;
                if (r <= 3000) {
                    ratio = (r / 3000) * 0.18;
                } else if (r <= 7000) {
                    ratio = 0.18 + ((r - 3000) / 4000) * 0.38;
                } else {
                    ratio = 0.56 + ((r - 7000) / 4000) * 0.44;
                }
                return startAngle + ratio * totalSpan;
            }

            function buildOffscreenDial() {
                syncBackingStore();
                offscreenDial = document.createElement('canvas');
                offscreenDial.width = Math.round(420 * backingRatio);
                offscreenDial.height = Math.round(420 * backingRatio);
                var oCtx = offscreenDial.getContext('2d');
                if (!oCtx) return;
                oCtx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);

                // Painted metal, a rolled lip and recessed matte face. All gradients and
                // deterministic surface grain are built only when this static cache changes.
                var bezel = oCtx.createLinearGradient(cx - dialR, cy - dialR, cx + dialR, cy + dialR);
                bezel.addColorStop(0, ink.rimLight);
                bezel.addColorStop(0.16, '#292927');
                bezel.addColorStop(0.48, ink.rimDark);
                bezel.addColorStop(0.78, '#242422');
                bezel.addColorStop(1, '#555550');
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR, 0, Math.PI * 2);
                oCtx.fillStyle = bezel;
                oCtx.fill();
                oCtx.lineWidth = 2;
                oCtx.strokeStyle = ink.rimDark;
                oCtx.stroke();
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 6, 0, Math.PI * 2);
                oCtx.fillStyle = ink.rimDark;
                oCtx.fill();
                oCtx.lineWidth = 1;
                oCtx.strokeStyle = '#8b8981';
                oCtx.stroke();
                var face = oCtx.createRadialGradient(cx - 35, cy - 50, 10, cx, cy, dialR - 8);
                face.addColorStop(0, '#242420');
                face.addColorStop(0.72, ink.face);
                face.addColorStop(0.96, '#0a0a09');
                face.addColorStop(1, '#020202');
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 8, 0, Math.PI * 2);
                oCtx.fillStyle = face;
                oCtx.fill();
                oCtx.save();
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 11, 0, Math.PI * 2);
                oCtx.clip();
                oCtx.fillStyle = 'rgba(238,233,220,0.035)';
                for (var grainY = cy - dialR; grainY < cy + dialR; grainY += 3) {
                    for (var grainX = cx - dialR; grainX < cx + dialR; grainX += 4) {
                        if ((grainX * 13 + grainY * 7) % 11 < 4) {
                            oCtx.fillRect(grainX, grainY, 0.7, 0.7);
                        }
                    }
                }
                // Fixed, faint upper glass reflection beneath the printed markings.
                var glass = oCtx.createLinearGradient(0, cy - dialR, 0, cy + 15);
                glass.addColorStop(0, 'rgba(255,250,235,0.065)');
                glass.addColorStop(1, 'rgba(255,250,235,0)');
                oCtx.fillStyle = glass;
                oCtx.fillRect(cx - dialR, cy - dialR, dialR * 2, dialR + 15);
                oCtx.restore();

                // 2. Redline Zone Arc (9,500 ~ 11,000 RPM)
                var redlineStartA = getInitialDAngle(9500);
                var redlineEndA = getInitialDAngle(11000);
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 14, redlineStartA, redlineEndA);
                oCtx.lineWidth = 10;
                oCtx.strokeStyle = ink.redline;
                oCtx.stroke();

                // 3. Ticks & Numbers (0 to 11)
                for (var rpmVal = 0; rpmVal <= 11000; rpmVal += 500) {
                    var angle = getInitialDAngle(rpmVal);
                    var isMajor = (rpmVal % 1000 === 0);
                    var isRed = (rpmVal >= 9500);
                    var tickLen = isMajor ? 14 : 7;

                    var x1 = cx + Math.cos(angle) * (dialR - 14);
                    var y1 = cy + Math.sin(angle) * (dialR - 14);
                    var x2 = cx + Math.cos(angle) * (dialR - 14 - tickLen);
                    var y2 = cy + Math.sin(angle) * (dialR - 14 - tickLen);

                    oCtx.beginPath();
                    oCtx.moveTo(x1, y1);
                    oCtx.lineTo(x2, y2);
                    oCtx.lineWidth = isMajor ? 2.5 : 1.2;
                    oCtx.strokeStyle = isRed ? ink.redline : ink.marking;
                    oCtx.stroke();

                    // Numbers for major ticks
                    if (isMajor) {
                        var numStr = String(rpmVal / 1000);
                        var textR = dialR - 34;
                        var tx = cx + Math.cos(angle) * textR;
                        var ty = cy + Math.sin(angle) * textR;

                        oCtx.fillStyle = isRed ? ink.redline : ink.marking;
                        oCtx.font = '700 19px Arial, sans-serif';
                        oCtx.textAlign = 'center';
                        oCtx.textBaseline = 'middle';
                        // Upright condensed print; keep each original tick's center intact.
                        oCtx.save();
                        oCtx.translate(tx, ty);
                        oCtx.scale(0.86, 1);
                        oCtx.fillText(numStr, 0, 0);
                        oCtx.restore();
                    }
                }

                // TRD / Nippondenso reference lettering; an original typographic treatment,
                // not a claim of an exact licensed logo or a different calibrated dial.
                oCtx.fillStyle = ink.marking;
                oCtx.font = 'italic 900 26px Arial, sans-serif';
                oCtx.textAlign = 'center';
                oCtx.fillText('TRD', cx, cy - 69);
                oCtx.font = '700 8px Arial, sans-serif';
                oCtx.fillText('NIPPONDENSO', cx, cy - 50);
                oCtx.fillStyle = ink.secondary;
                oCtx.font = '600 11px Arial, sans-serif';
                oCtx.fillText('×1000 RPM', cx, cy - 32);

                // 5. External Shift Light Pod Base (at top-right ~1 o'clock)
                var podX = 350;
                var podY = 85;
                oCtx.beginPath();
                oCtx.arc(podX, podY, 24, 0, Math.PI * 2);
                oCtx.fillStyle = bezel;
                oCtx.fill();
                oCtx.lineWidth = 3;
                oCtx.strokeStyle = ink.rimDark;
                oCtx.stroke();

                // The cap has a fixed light source and never rotates with the needle.
                offscreenCap = document.createElement('canvas');
                offscreenCap.width = Math.round(36 * backingRatio);
                offscreenCap.height = Math.round(36 * backingRatio);
                var capCtx = offscreenCap.getContext('2d');
                if (!capCtx) return;
                capCtx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);
                var cap = capCtx.createLinearGradient(4, 3, 28, 32);
                cap.addColorStop(0, '#73736b');
                cap.addColorStop(0.25, '#353530');
                cap.addColorStop(0.65, '#11110f');
                cap.addColorStop(1, '#030303');
                capCtx.beginPath();
                capCtx.arc(18, 18, 14, 0, Math.PI * 2);
                capCtx.fillStyle = cap;
                capCtx.fill();
                capCtx.strokeStyle = '#050505';
                capCtx.lineWidth = 1.5;
                capCtx.stroke();
                capCtx.beginPath();
                capCtx.arc(18, 18, 10.5, 0, Math.PI * 2);
                capCtx.strokeStyle = '#44443e';
                capCtx.lineWidth = 0.6;
                capCtx.stroke();
            }

            buildOffscreenDial();

            function drawNeedle(ctx, angle) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Needle Blade
                ctx.shadowColor = 'rgba(0,0,0,0.75)';
                ctx.shadowBlur = 3;
                ctx.beginPath();
                ctx.moveTo(-20, -2.5);
                ctx.lineTo(dialR - 25, -1);
                ctx.lineTo(dialR - 25, 1);
                ctx.lineTo(-20, 2.5);
                ctx.closePath();
                ctx.fillStyle = ink.needle;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-18, -1.3);
                ctx.lineTo(dialR - 26, -0.5);
                ctx.lineWidth = 0.8;
                ctx.strokeStyle = ink.needleHighlight;
                ctx.stroke();
                ctx.restore();
                if (offscreenCap) ctx.drawImage(offscreenCap, cx - 18, cy - 18, 36, 36);
            }

            function renderHUD(rpm, speed, gear, now, isShiftWarning, isOverRev, isDrifting) {
                var ctx = domCache.ctx;
                if (!ctx) return;

                syncBackingStore();
                ctx.textBaseline = 'alphabetic';

                if (!offscreenDial) buildOffscreenDial();
                // Transparent pixels must erase the previous lamp glow and moving needle.
                ctx.clearRect(0, 0, 420, 420);
                ctx.drawImage(offscreenDial, 0, 0, 420, 420);

                var podX = 350;
                var podY = 85;

                // 1. External Shift Light LED
                ctx.beginPath();
                ctx.arc(podX, podY, 15, 0, Math.PI * 2);
                if (isOverRev) {
                    var strobe = Math.floor(now / 66) % 2 === 0;
                    ctx.fillStyle = strobe ? '#FF0033' : '#770014';
                    ctx.shadowColor = '#FF0033';
                    ctx.shadowBlur = strobe ? 24 : 8;
                } else if (isShiftWarning) {
                    ctx.fillStyle = '#FF1744';
                    ctx.shadowColor = '#FF1744';
                    ctx.shadowBlur = 16;
                } else {
                    ctx.fillStyle = '#2A080C';
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
                ctx.shadowBlur = 0;

                // 2. Needle
                var needleAngle = getInitialDAngle(rpm);
                drawNeedle(ctx, needleAngle);

                // Arcade DRIFT Mode Indicator
                if (isDrifting) {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                    ctx.fillRect(cx - 30, cy + 24, 60, 17);
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(cx - 30, cy + 24, 60, 17);

                    ctx.fillStyle = '#FBBF24';
                    ctx.font = 'bold 11px Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#F59E0B';
                    ctx.shadowBlur = 0;
                    ctx.fillText('DRIFT', cx, cy + 36);
                    ctx.shadowBlur = 0;
                }

                // 3. Digital Speed & Gear Display (Lower Center)
                ctx.fillStyle = ink.marking;
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(String(Math.round(speed)), cx, cy + 62);

                ctx.fillStyle = ink.secondary;
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(isMetric ? 'KM/H' : 'MPH', cx, cy + 78);

                var gearStr = (gear <= 0) ? 'R' : (gear === 11 ? 'N' : 'G' + gear);
                ctx.fillStyle = ink.marking;
                ctx.font = 'bold 18px monospace';
                ctx.fillText(gearStr, cx, cy + 104);
            }

            function runSweep(now) {
                if (!sweepActive) return;
                var elapsed = now - sweepStartTime;
                var progress = elapsed / sweepDuration;

                if (progress >= 1.0) {
                    sweepActive = false;
                    renderHUD(0, 0, 1, now, false, false, false);
                    return;
                }

                var currentRpm = progress < 0.5
                    ? (progress / 0.5) * 11000
                    : (1 - (progress - 0.5) / 0.5) * 11000;

                var mockSpeed = (currentRpm / 11000) * 230;
                var mockWarning = currentRpm >= 9800;
                var mockOverRev = currentRpm >= 10500;
                renderHUD(currentRpm, mockSpeed, 1, now, mockWarning, mockOverRev, false);
                requestAnimationFrame(runSweep);
            }

            HUDCore.registerStyle('initial_d', {
                containerId: 'initialDContainer',
                scaleMultiplier: 0.95,

                onInit: function (payload) {
                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                    buildOffscreenDial();
                },

                onElementsChange: function (elements) {
                    if (elements) {
                        if (elements.showGauge !== undefined) {
                            isGaugeVisible = elements.showGauge !== false;
                            if (domCache.container) {
                                domCache.container.style.display = isGaugeVisible ? 'block' : 'none';
                            }
                        }
                        if (elements.showAudioChime !== undefined) {
                            showAudioChime = elements.showAudioChime !== false;
                        }
                    }
                },

                onFrame: function (data, payload) {
                    if (sweepActive) return;

                    var maxRpm = data.max_rpm || data.maxRpm || 11000;
                    var redline = (payload && payload.redlineRpm) || data.redlineRpm || 10000;

                    if (payload) {
                        if (typeof payload.isMetric === 'boolean') {
                            isMetric = payload.isMetric;
                        } else if (payload.unit) {
                            isMetric = payload.unit !== 'mph';
                        }
                    }
                    if (data && data.displayUnits && data.displayUnits.speed) {
                        isMetric = data.displayUnits.speed !== 'mph';
                    }

                    var rpm = data.rpm || 0;
                    var rawSpeed = isMetric !== false
                        ? (data.speed_kmh !== undefined ? data.speed_kmh : (data.speed || 0))
                        : (data.speed_mph !== undefined ? data.speed_mph : ((data.speed_kmh || data.speed || 0) * 0.621371));

                    var speedKmh = data.speed_kmh !== undefined ? data.speed_kmh : (isMetric ? rawSpeed : rawSpeed * 1.60934);

                    if (data.gear !== undefined && data.gear <= 11) {
                        lastValidGear = data.gear;
                    }

                    var now = performance.now();

                    // 80km/h Speed Chime (Ding-Ding) - triggers at Japanese standard 80km/h
                    if (isGaugeVisible && showAudioChime && speedKmh >= 80 && (now - lastChimeTime > 1000)) {
                        lastChimeTime = now;
                        playSpeedChime();
                    }

                    // Shift light pod: adapts to vehicle redline or TRD万轉 threshold
                    var shiftWarningRpm = Math.min(9800, redline * 0.96);
                    var shiftOverRevRpm = Math.min(10500, redline * 0.99);

                    var isShiftWarning = rpm >= shiftWarningRpm;
                    var isOverRev = rpm >= shiftOverRevRpm;

                    // Drift Detection: Yaw rate, lateral G or rear wheel slip difference
                    var yawRate = Math.abs(data.YawRate !== undefined ? data.YawRate : (data.yaw_rate || 0));
                    var rearSlip = ((data.slip_rl || 0) + (data.slip_rr || 0)) / 2;
                    var frontSlip = ((data.slip_fl || 0) + (data.slip_fr || 0)) / 2;
                    var isDrifting = speedKmh > 25 && (yawRate > 0.28 || (rearSlip - frontSlip > 0.22));

                    renderHUD(rpm, rawSpeed, lastValidGear, now, isShiftWarning, isOverRev, isDrifting);
                },

                onAnimate: function () {
                    sweepActive = true;
                    sweepStartTime = performance.now();
                    requestAnimationFrame(runSweep);
                }
            });

            HUDCore.init('initial_d');

            setTimeout(function () {
                renderHUD(0, 0, 1, performance.now(), false);
            }, 60);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    buildOffscreenDial();
                    renderHUD(0, 0, 1, performance.now(), false);
                });
            }
        })();
    </script>
</body>
</html>
