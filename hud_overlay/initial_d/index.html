<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AE86 Fictional TRD 11,000 RPM Tachometer — ULTRA Inspired</title>
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        .initial-d-container {
            width: 420px;
            height: 420px;
            pointer-events: none;
            position: relative;
            box-sizing: border-box;
        }
        #initialDCanvas {
            display: block;
            width: 420px;
            height: 420px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="hud-root-wrapper">
        <div class="hud-gauge-container initial-d-container" id="initialDContainer">
            <canvas id="initialDCanvas" width="420" height="420"></canvas>
        </div>
    </div>

    <script src="../shared/hud-core.js"></script>
    <script src="initial-d-model.js"></script>
    <script>
        (function () {
            var domCache = {
                container: document.getElementById('initialDContainer'),
                canvas: document.getElementById('initialDCanvas'),
                ctx: null
            };

            if (domCache.canvas) {
                domCache.ctx = domCache.canvas.getContext('2d');
            }

            var cx = 205;
            var cy = 220;
            var dialR = 160;


            var sweepActive = false;
            var sweepStartTime = 0;
            var sweepDuration = 1200;
            var sweepFrame = null;

            var offscreenDial = null;
            var offscreenCap = null;
            var backingRatio = 0;

            function syncBackingStore() {
                var ratio = Math.max(1, Math.min(3, Number(window.devicePixelRatio) || 1));
                if (ratio === backingRatio || !domCache.ctx) return;
                backingRatio = ratio;
                domCache.canvas.width = Math.round(420 * ratio);
                domCache.canvas.height = Math.round(420 * ratio);
                domCache.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                offscreenDial = null;
                offscreenCap = null;
            }
            // Instrument artwork has a fixed material palette, independent of GUI themes.
            var ink = {
                face: '#10100f', rimDark: '#080808', rimLight: '#555550',
                marking: '#eee9dc', needle: '#f4f2e8',
                needleHighlight: '#ffffff', secondary: '#b8b4a9'
            };

            // Printed ticks and live needle share the fictional compressed TRD calibration.
            function getInitialDAngle(rpm) {
                return window.InitialDTachModel.getAngle(rpm);
            }

            function buildOffscreenDial() {
                syncBackingStore();
                offscreenDial = document.createElement('canvas');
                offscreenDial.width = Math.round(420 * backingRatio);
                offscreenDial.height = Math.round(420 * backingRatio);
                var oCtx = offscreenDial.getContext('2d');
                if (!oCtx) return;
                oCtx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);

                // Painted metal, a rolled lip and recessed matte face. All gradients and
                // deterministic surface grain are built only when this static cache changes.
                var bezel = oCtx.createLinearGradient(cx - dialR, cy - dialR, cx + dialR, cy + dialR);
                bezel.addColorStop(0, ink.rimLight);
                bezel.addColorStop(0.16, '#292927');
                bezel.addColorStop(0.48, ink.rimDark);
                bezel.addColorStop(0.78, '#242422');
                bezel.addColorStop(1, '#555550');
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR, 0, Math.PI * 2);
                oCtx.fillStyle = bezel;
                oCtx.fill();
                oCtx.lineWidth = 2;
                oCtx.strokeStyle = ink.rimDark;
                oCtx.stroke();
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 6, 0, Math.PI * 2);
                oCtx.fillStyle = ink.rimDark;
                oCtx.fill();
                oCtx.lineWidth = 1;
                oCtx.strokeStyle = '#494942';
                oCtx.stroke();
                var face = oCtx.createRadialGradient(cx - 35, cy - 50, 10, cx, cy, dialR - 8);
                face.addColorStop(0, '#242420');
                face.addColorStop(0.72, ink.face);
                face.addColorStop(0.96, '#0a0a09');
                face.addColorStop(1, '#020202');
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 8, 0, Math.PI * 2);
                oCtx.fillStyle = face;
                oCtx.fill();
                oCtx.save();
                oCtx.beginPath();
                oCtx.arc(cx, cy, dialR - 11, 0, Math.PI * 2);
                oCtx.clip();
                oCtx.fillStyle = 'rgba(238,233,220,0.035)';
                for (var grainY = cy - dialR; grainY < cy + dialR; grainY += 3) {
                    for (var grainX = cx - dialR; grainX < cx + dialR; grainX += 4) {
                        if ((grainX * 13 + grainY * 7) % 11 < 4) {
                            oCtx.fillRect(grainX, grainY, 0.7, 0.7);
                        }
                    }
                }
                // Fixed, faint upper glass reflection beneath the printed markings.
                var glass = oCtx.createLinearGradient(0, cy - dialR, 0, cy + 15);
                glass.addColorStop(0, 'rgba(255,250,235,0.065)');
                glass.addColorStop(1, 'rgba(255,250,235,0)');
                oCtx.fillStyle = glass;
                oCtx.fillRect(cx - dialR, cy - dialR, dialR * 2, dialR + 15);
                oCtx.restore();

                // No painted red sector: the real dial uses separate yellow/red LEDs.
                // Keep the fictional compressed scale readable; do not apply No.1932 spacing.
                for (var rpmVal = 0; rpmVal <= 11000; rpmVal += 500) {
                    var angle = getInitialDAngle(rpmVal);
                    var isMajor = (rpmVal % 1000 === 0);
                    var tickLen = isMajor ? 15 : 10;

                    var x1 = cx + Math.cos(angle) * (dialR - 14);
                    var y1 = cy + Math.sin(angle) * (dialR - 14);
                    var x2 = cx + Math.cos(angle) * (dialR - 14 - tickLen);
                    var y2 = cy + Math.sin(angle) * (dialR - 14 - tickLen);

                    oCtx.beginPath();
                    oCtx.moveTo(x1, y1);
                    oCtx.lineTo(x2, y2);
                    oCtx.lineWidth = isMajor ? 2.2 : 1;
                    oCtx.strokeStyle = ink.marking;
                    oCtx.stroke();

                    // Numbers for major ticks
                    if (isMajor) {
                        var numStr = String(rpmVal / 1000);
                        var textR = dialR - 43;
                        var tx = cx + Math.cos(angle) * textR;
                        var ty = cy + Math.sin(angle) * textR;

                        oCtx.fillStyle = ink.marking;
                        oCtx.font = '500 23px Arial, sans-serif';
                        oCtx.textAlign = 'center';
                        oCtx.textBaseline = 'middle';
                        // Narrow, upright product-style numerals, not Forza italic digits.
                        oCtx.save();
                        oCtx.translate(tx, ty);
                        oCtx.scale(0.78, 1);
                        oCtx.fillText(numStr, 0, 0);
                        oCtx.restore();
                    }
                }

                // Fictional TRD face, with only the housing/needle language from ULTRA.
                oCtx.fillStyle = ink.marking;
                oCtx.font = 'italic 900 26px Arial, sans-serif';
                oCtx.textAlign = 'center';
                oCtx.fillText('TRD', cx, cy - 57);
                oCtx.fillStyle = ink.secondary;
                oCtx.font = '500 10px Arial, sans-serif';
                oCtx.fillText('×1000 RPM', cx, cy - 34);

                // The cap has a fixed light source and never rotates with the needle.
                offscreenCap = document.createElement('canvas');
                offscreenCap.width = Math.round(36 * backingRatio);
                offscreenCap.height = Math.round(36 * backingRatio);
                var capCtx = offscreenCap.getContext('2d');
                if (!capCtx) return;
                capCtx.setTransform(backingRatio, 0, 0, backingRatio, 0, 0);
                var cap = capCtx.createLinearGradient(4, 3, 28, 32);
                cap.addColorStop(0, '#73736b');
                cap.addColorStop(0.25, '#353530');
                cap.addColorStop(0.65, '#11110f');
                cap.addColorStop(1, '#030303');
                capCtx.beginPath();
                capCtx.arc(18, 18, 14, 0, Math.PI * 2);
                capCtx.fillStyle = cap;
                capCtx.fill();
                capCtx.strokeStyle = '#050505';
                capCtx.lineWidth = 1.5;
                capCtx.stroke();
                capCtx.beginPath();
                capCtx.arc(18, 18, 10.5, 0, Math.PI * 2);
                capCtx.strokeStyle = '#44443e';
                capCtx.lineWidth = 0.6;
                capCtx.stroke();
            }

            buildOffscreenDial();

            function drawNeedle(ctx, angle) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Needle Blade
                ctx.shadowColor = 'rgba(0,0,0,0.75)';
                ctx.shadowBlur = 3;
                ctx.beginPath();
                ctx.moveTo(-20, -2.5);
                ctx.lineTo(dialR - 25, -1);
                ctx.lineTo(dialR - 25, 1);
                ctx.lineTo(-20, 2.5);
                ctx.closePath();
                ctx.fillStyle = ink.needle;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-18, -1.3);
                ctx.lineTo(dialR - 26, -0.5);
                ctx.lineWidth = 0.8;
                ctx.strokeStyle = ink.needleHighlight;
                ctx.stroke();
                ctx.restore();
                if (offscreenCap) ctx.drawImage(offscreenCap, cx - 18, cy - 18, 36, 36);
            }

            function renderHUD(rpm, isShiftWarning, isOverRev) {
                var ctx = domCache.ctx;
                if (!ctx) return;

                syncBackingStore();
                ctx.textBaseline = 'alphabetic';

                if (!offscreenDial) buildOffscreenDial();
                // Transparent pixels must erase the previous lamp glow and moving needle.
                ctx.clearRect(0, 0, 420, 420);
                ctx.drawImage(offscreenDial, 0, 0, 420, 420);

                // Two separate warning lenses reflect ULTRA's physical design; their
                // thresholds are FH telemetry adaptation, not a simulated controller.
                ctx.beginPath();
                ctx.arc(cx + 52, cy + 105, 6, 0, Math.PI * 2);
                ctx.fillStyle = isOverRev ? '#ff3030' : '#3e1010';
                ctx.shadowColor = '#f42b22';
                ctx.shadowBlur = isOverRev ? 6 : 0;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + 76, cy + 89, 6, 0, Math.PI * 2);
                ctx.fillStyle = isShiftWarning ? '#ffd748' : '#473916';
                ctx.shadowColor = '#f2bd36';
                ctx.shadowBlur = isShiftWarning ? 5 : 0;
                ctx.fill();
                ctx.shadowBlur = 0;
                // 2. Needle
                var needleAngle = getInitialDAngle(rpm);
                drawNeedle(ctx, needleAngle);

            }

            function runSweep(now) {
                if (!sweepActive) return;
                var elapsed = now - sweepStartTime;
                var progress = elapsed / sweepDuration;

                if (progress >= 1.0) {
                    sweepActive = false;
                    sweepFrame = null;
                    renderHUD(0, false, false);
                    return;
                }

                var currentRpm = progress < 0.5
                    ? (progress / 0.5) * 11000
                    : (1 - (progress - 0.5) / 0.5) * 11000;


                var mockWarning = currentRpm >= 9800;
                var mockOverRev = currentRpm >= 10500;
                renderHUD(currentRpm, mockWarning, mockOverRev);
                sweepFrame = requestAnimationFrame(runSweep);
            }

            HUDCore.registerStyle('initial_d', {
                containerId: 'initialDContainer',
                scaleMultiplier: 0.95,

                onInit: function () {
                    buildOffscreenDial();
                },

                onElementsChange: function (elements) {
                    if (elements && domCache.container && elements.showGauge !== undefined) {
                        domCache.container.style.display = elements.showGauge === false ? 'none' : 'block';
                    }
                },

                onFrame: function (data, payload) {
                    if (sweepActive) return;
                    var rpm = data.rpm || 0;
                    var redline = (payload && payload.redlineRpm) || data.redlineRpm || 10000;
                    var warningLevel = window.InitialDTachModel.getWarningLevel(rpm, redline);
                    renderHUD(rpm, warningLevel >= 1, warningLevel >= 2);
                },
                onAnimate: function () {
                    if (sweepFrame !== null) window.cancelAnimationFrame(sweepFrame);
                    sweepActive = true;
                    sweepStartTime = performance.now();
                    sweepFrame = requestAnimationFrame(runSweep);
                }
            });

            window.addEventListener('pagehide', function () {
                sweepActive = false;
                if (sweepFrame !== null) window.cancelAnimationFrame(sweepFrame);
                sweepFrame = null;
            });

            HUDCore.init('initial_d');

            setTimeout(function () {
                renderHUD(0, false, false);
            }, 60);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    buildOffscreenDial();
                    renderHUD(0, false, false);
                });
            }
        })();
    </script>
</body>
</html>
