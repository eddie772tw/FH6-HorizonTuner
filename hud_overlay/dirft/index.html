<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Drift HUD</title>
    <!-- 引入共享 Base 樣式 -->
    <link rel="stylesheet" href="../shared/hud-base.css">
    <style>
        /* ── Fonts ──────────────────────────────────────────────────────── */
        @font-face {
            font-family: 'ForzaFont';
            src: url('../assets/fonts/HelveticaNowDisplay-CnIta.otf') format('opentype');
        }

        @font-face {
            font-family: 'ForzaGear';
            src: url('../assets/fonts/HelveticaNowDisplay-CnMedIt.otf') format('opentype');
        }

        /* ── Root Wrapper & Centered Bottom Alignment ───────────────────── */
        .drift-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
            padding: 16px;
            overflow: visible;
        }

        /* ── 093 Canvas Container (1120px x 420px) ─────── */
        .drift-container {
            position: relative;
            width: 1120px;
            height: 420px;
            pointer-events: all;
            align-self: center;
            transform-origin: bottom center;
            flex-shrink: 0;
            background: transparent;
        }

        canvas#driftCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1120px;
            height: 420px;
            pointer-events: none;
        }

        /* ── Advanced HUD Style Palette ───────────────────────────────── */
        :root {
            --adv-primary: #ffffff;
            --adv-primary-dim: rgba(255, 255, 255, 0.75);
            --adv-track: rgba(255, 255, 255, 0.20);
            --adv-redline: rgb(255, 0, 102);
            --adv-redline-dim: rgba(255, 0, 102, 0.45);
            --adv-amber: #FFB84A;
            --adv-mint: #52FFEB;
        }

        /* ── Gear & Speed Overlays (Advanced Crisp White Style) ────────── */
        #drift-gear-overlay {
            position: absolute;
            left: 28px;
            top: 275px;
            font-family: 'ForzaGear', Arial, sans-serif;
            font-size: 84px;
            line-height: 0.8;
            color: var(--adv-primary);
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.45);
            pointer-events: none;
            user-select: none;
        }

        #drift-speed-overlay {
            position: absolute;
            left: 122px;
            top: 285px;
            font-family: 'ForzaGear', Arial, sans-serif;
            font-size: 60px;
            line-height: 0.85;
            color: var(--adv-primary);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
            pointer-events: none;
            user-select: none;
        }

        #drift-speed-unit-overlay {
            position: absolute;
            left: 220px;
            top: 323px;
            font-family: 'ForzaFont', Arial, sans-serif;
            font-size: 1.05rem;
            color: var(--adv-primary-dim);
            font-style: italic;
            pointer-events: none;
            user-select: none;
        }

        /* ── Operation & Hero Popup Floating Banners (Advanced Style) ──── */
        #drift-popup-hero {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid var(--adv-primary-dim);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), inset 0 0 10px rgba(255, 255, 255, 0.15);
            padding: 4px 32px;
            border-radius: 20px;
            font-family: 'ForzaGear', Arial, sans-serif;
            font-size: 1.35rem;
            color: var(--adv-primary);
            letter-spacing: 0.16em;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
            z-index: 100;
        }

        #drift-popup-hero.active {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        #drift-popup-hero.hero-event {
            border-color: var(--adv-redline);
            box-shadow: 0 0 24px var(--adv-redline), inset 0 0 12px rgba(255, 0, 102, 0.3);
            color: #ffffff;
        }

        /* ── Status Rating Badge (Advanced Pure White & Redline Accents) ── */
        #drift-rating-badge {
            position: absolute;
            left: 50%;
            top: 86px;
            transform: translateX(-50%);
            font-family: 'ForzaGear', Arial, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            color: var(--adv-primary-dim);
            background: transparent;
            border: none;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            padding: 2px 14px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <!-- 共享中央遙測掛載點 -->
    <div id="teleCardsMount"></div>

    <!-- 根視窗-->
    <div class="drift-wrapper">
        <div class="hud-gauge-container drift-container" id="driftContainer">
            <!-- 093 快閃 Banner -->
            <div id="drift-popup-hero">HANDBRAKE</div>
            <div id="drift-rating-badge">DRIFT RATING: LOW</div>

            <!-- HTML 大數字獨立 Overlays (位於左側 Panel 1，不遮蓋中區 Tacho Bar) -->
            <div id="drift-gear-overlay">N</div>
            <div id="drift-speed-overlay">0</div>
            <div id="drift-speed-unit-overlay">KM/H</div>

            <!-- 全向量 Drift 核心畫布 (1120 x 420) -->
            <canvas id="driftCanvas" width="1120" height="420"></canvas>
        </div>
    </div>

    <!-- 腳本引入：Telemetry Cards & HUD Core -->
    <script type="module" src="../shared/telemetry-cards.js"></script>
    <script src="../shared/hud-core.js"></script>
    <script>
        (function () {
            var canvas = document.getElementById('driftCanvas');
            var ctx = canvas ? canvas.getContext('2d') : null;

            // Global Telemetry State & Dynamics Snapshot
            var isMetricUnit = true;
            var lastFrameTime = Date.now();

            var angle = 0;
            var displayAngle = 0;
            var prevAngleAbs = 0;
            var holdSeconds = 0;
            var speedKmh = 0;
            var gear = 'N';
            var rpm = 0;
            var maxRpm = 9000;

            var accelPct = 0;
            var brakePct = 0;
            var clutchPct = 0;
            var handbrakePct = 0;
            var steerPct = 0;
            var counterPct = 0;

            var flowPct = 0;
            var flowQuality = 1; // 1~5
            var spinRisk = 0;
            var riskLevel = 1; // 1~4

            // Flash TTL & Pulse States
            var inputFlashTtl = { H: 0, C: 0, B: 0, T: 0 };
            var prevInputs = { H: 0, C: 0, B: 0, T: 0 };

            // Popups & Demo
            var popupTimer = null;
            var isSweepActive = false;
            var demoPhase = 0;

            // Advanced HUD Visual Style Palette (Gray-White Track & Redline Hot Red)
            var C_WHITE = '#ffffff';
            var C_WHITE_DIM = 'rgba(255, 255, 255, 0.75)';
            var C_TRACK = 'rgba(255, 255, 255, 0.20)';
            var C_REDLINE = 'rgb(255, 0, 102)';
            var C_REDLINE_DIM = 'rgba(255, 0, 102, 0.40)';
            var C_AMBER = '#FFB84A';
            var C_MINT = '#52FFEB';

            var FLOW_LABELS = { 1: 'BUILD', 2: 'NORMAL', 3: 'CHASE', 4: 'SMOOTH', 5: 'LOCKED' };
            var RISK_LABELS = { 1: 'SAFE', 2: 'EDGE', 3: 'RISK', 4: 'MAX' };

            function clamp(val, min, max) {
                return Math.max(min, Math.min(max, val));
            }

            function triggerPopup(text, durationMs, isHero) {
                var popup = document.getElementById('drift-popup-hero');
                if (!popup) return;
                popup.innerText = text;
                if (isHero) {
                    popup.classList.add('hero-event');
                } else {
                    popup.classList.remove('hero-event');
                }
                popup.classList.add('active');
                if (popupTimer) clearTimeout(popupTimer);
                popupTimer = setTimeout(function () {
                    popup.classList.remove('active');
                }, durationMs || 1200);
            }

            // ── Telemetry Packet Normalizer ─────────────────────────────────────
            function parseTelemetryData(data, payload) {
                if (!data) return;
                lastFrameTime = Date.now();

                if (payload && payload.isMetric !== undefined) {
                    isMetricUnit = payload.isMetric !== false;
                }

                // Speed calculation
                var rawSpeedMs = data.vx && data.vz ? Math.hypot(data.vx, data.vz) : (data.SpeedMetersPerSecond || 0);
                if (data.speed !== undefined) {
                    speedKmh = Math.round(data.speed);
                } else if (rawSpeedMs > 0) {
                    speedKmh = Math.round(isMetricUnit ? rawSpeedMs * 3.6 : rawSpeedMs * 2.23694);
                } else {
                    speedKmh = 0;
                }

                // Engine RPM & Gear
                rpm = data.rpm !== undefined ? data.rpm : (data.CurrentEngineRpm || 0);
                maxRpm = data.rpmMax || (payload && payload.redlineRpm) || data.EngineMaxRpm || 9000;

                var rawGear = data.gear !== undefined ? data.gear : data.Gear;
                if (rawGear !== undefined) {
                    gear = rawGear === 0 ? 'R' : (rawGear === 11 ? 'N' : (rawGear === 10 ? 'N' : rawGear));
                } else {
                    gear = 'N';
                }

                // Inputs
                accelPct = data.accel !== undefined ? data.accel : (data.AccelInput !== undefined ? (data.AccelInput > 1 ? data.AccelInput / 2.55 : data.AccelInput * 100) : 0);
                brakePct = data.brake !== undefined ? data.brake : (data.BrakeInput !== undefined ? (data.BrakeInput > 1 ? data.BrakeInput / 2.55 : data.BrakeInput * 100) : 0);
                clutchPct = data.clutch !== undefined ? data.clutch : (data.ClutchInput !== undefined ? (data.ClutchInput > 1 ? data.ClutchInput / 2.55 : data.ClutchInput * 100) : 0);
                handbrakePct = data.handbrake !== undefined ? data.handbrake : (data.HandBrakeInput !== undefined ? (data.HandBrakeInput > 1 ? data.HandBrakeInput / 2.55 : data.HandBrakeInput * 100) : 0);
                steerPct = data.steer !== undefined ? data.steer : (data.SteerInput !== undefined ? (data.SteerInput > 1 || data.SteerInput < -1 ? data.SteerInput / 1.27 : data.SteerInput * 100) : 0);

                // Detect input hit peaks for flash TTL
                if (handbrakePct > 40 && prevInputs.H <= 40) inputFlashTtl.H = 18;
                if (clutchPct > 40 && prevInputs.C <= 40) inputFlashTtl.C = 18;
                if (brakePct > 40 && prevInputs.B <= 40) inputFlashTtl.B = 18;
                if (accelPct > 40 && prevInputs.T <= 40) inputFlashTtl.T = 18;

                prevInputs.H = handbrakePct;
                prevInputs.C = clutchPct;
                prevInputs.B = brakePct;
                prevInputs.T = accelPct;

                // Velocity Vectors & Drift Angle
                var vx = data.vx !== undefined ? data.vx : (data.VelocityX || 0);
                var vz = data.vz !== undefined ? data.vz : (data.VelocityZ || 0);
                var speedPlane = Math.hypot(vx, vz);

                if (speedPlane > 0.5) {
                    angle = (Math.atan2(vx, vz) * 180.0) / Math.PI;
                    angle = clamp(angle, -90, 90);
                } else {
                    angle = 0;
                }

                // Detect Popups & Events
                if (handbrakePct > 60 && prevInputs.H <= 60) {
                    triggerPopup('HANDBRAKE ENTRY', 1000, false);
                } else if (clutchPct > 70 && accelPct > 50 && prevInputs.C <= 70) {
                    triggerPopup('CLUTCH KICK', 1000, false);
                }
            }

            function updateHTMLOverlays() {
                var gearEl = document.getElementById('drift-gear-overlay');
                if (gearEl) gearEl.innerText = gear;

                var speedEl = document.getElementById('drift-speed-overlay');
                if (speedEl) speedEl.innerText = speedKmh;

                var unitEl = document.getElementById('drift-speed-unit-overlay');
                if (unitEl) unitEl.innerText = isMetricUnit ? 'KM/H' : 'MPH';

                var badgeEl = document.getElementById('drift-rating-badge');
                if (badgeEl) {
                    var absA = Math.abs(displayAngle);
                    var rating = absA >= 45 ? 'MAX' : (absA >= 30 ? 'DEEP' : (absA >= 15 ? 'GOOD' : 'LOW'));
                    var holdText = holdSeconds > 1.0 ? ' | HOLD ' + holdSeconds.toFixed(1) + 's' : '';
                    badgeEl.innerText = 'DRIFT RATING: ' + rating + holdText;
                    badgeEl.style.color = absA >= 45 ? C_REDLINE : (absA >= 30 ? C_AMBER : C_WHITE);
                    badgeEl.style.textShadow = absA >= 45 ? '0 0 14px ' + C_REDLINE : '0 0 10px rgba(255, 255, 255, 0.4)';
                }
            }

            // ── Parabolic Geometry Helper ───────────────────────────────────────
            var layoutGeometry = {
                cx: 560,
                cy: 165,
                halfWidth: 360,
                rise: 52
            };

            function curvePoint(t) {
                var x = layoutGeometry.cx + t * layoutGeometry.halfWidth;
                var y = layoutGeometry.cy + layoutGeometry.rise * (1.0 - t * t);
                return { x: x, y: y };
            }

            function tangentAndNormal(t) {
                var eps = 0.01;
                var p0 = curvePoint(clamp(t - eps, -1.0, 1.0));
                var p1 = curvePoint(clamp(t + eps, -1.0, 1.0));
                var tx = p1.x - p0.x;
                var ty = p1.y - p0.y;
                var len = Math.hypot(tx, ty) || 1.0;
                tx /= len; ty /= len;
                var nx = -ty, ny = tx;
                if (ny < 0) { nx = ty; ny = -tx; }
                return { tangent: { x: tx, y: ty }, normal: { x: nx, y: ny } };
            }

            // ── Advanced HUD Renderer Engine ────────────────────────────────────
            function renderQPainterVectorHUD() {
                if (!ctx) return;
                ctx.clearRect(0, 0, 1120, 420);

                // Helper: Advanced Style Header Title
                function draw093PanelBox(x, y, w, h, titleText) {
                    if (!titleText) return;
                    ctx.save();
                    ctx.font = 'bold 11px ForzaGear, Arial';
                    ctx.fillStyle = C_WHITE_DIM;
                    ctx.textAlign = 'left';
                    ctx.fillText(titleText, x + 14, y + 20);
                    ctx.restore();
                }

                // ── Panel A: Center Drift Angle Arc (x=160, y=10, w=800, h=195) ──────
                draw093PanelBox(160, 10, 800, 195);

                var absAngle = Math.abs(displayAngle);
                var activeT = clamp(absAngle / 60.0, 0.0, 1.0);
                var signedT = displayAngle >= 0 ? activeT : -activeT;
                var angleGain = Math.max(0.0, absAngle - prevAngleAbs);
                var riseEnergy = clamp(angleGain / 2.4, 0.0, 1.0);
                var depthEnergy = clamp(absAngle / 60.0, 0.0, 1.0);

                var baseDim = 0.50 + 0.42 * depthEnergy + 0.28 * riseEnergy;
                var activeEnergy = 0.18 + 0.54 * depthEnergy + 0.28 * riseEnergy;

                // 1. Center Big Angle Display (Advanced White / Redline Limit Accent)
                ctx.save();
                var angleRating = absAngle >= 45 ? 'MAX' : (absAngle >= 30 ? 'DEEP' : (absAngle >= 15 ? 'GOOD' : 'LOW'));
                var angleColor = absAngle >= 45 ? C_REDLINE : (absAngle >= 30 ? C_AMBER : C_WHITE);

                ctx.font = 'italic bold 42px ForzaGear';
                ctx.fillStyle = angleColor;
                ctx.shadowColor = angleColor;
                ctx.shadowBlur = absAngle >= 45 ? 16 : 10;
                ctx.textAlign = 'center';
                ctx.fillText(displayAngle.toFixed(1) + '°', layoutGeometry.cx, 54);
                ctx.restore();

                // 2. 80-Segment Parabolic Arc Gauge (Advanced Track Style: Gray-White Base, Redline Red Extremes)
                var segments = 80;
                function zoneMetrics(normAbs) {
                    if (normAbs >= 0.75) return { baseH: 21.6, baseW: 5.0, activeH: 32.0, activeW: 5.6 };
                    if (normAbs >= 0.50) return { baseH: 18.8, baseW: 4.55, activeH: 28.8, activeW: 5.05 };
                    if (normAbs >= 0.25) return { baseH: 15.4, baseW: 3.9, activeH: 23.6, activeW: 4.45 };
                    return { baseH: 12.4, baseW: 3.25, activeH: 18.8, activeW: 3.9 };
                }

                function drawSegmentBar(cx, baseY, barH, barW, colorStr, active, isRedline) {
                    ctx.save();
                    var rx = cx - barW * 0.5;
                    var ry = baseY - barH;

                    if (active) {
                        ctx.shadowColor = colorStr;
                        ctx.shadowBlur = isRedline ? 16 : 8;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillStyle = colorStr;
                    ctx.beginPath();
                    ctx.roundRect(rx, ry, barW, barH, 1.2);
                    ctx.fill();

                    if (active) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        ctx.beginPath();
                        ctx.roundRect(rx + 0.3, ry + 0.5, Math.max(1.0, barW - 0.6), Math.max(1.4, barH * 0.28), 0.8);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Inactive Arc Track (Gray-White Track, Redline Red Extremes >= 45°)
                for (var i = 0; i <= segments; i++) {
                    var t = -1.0 + (2.0 * i) / segments;
                    var p = curvePoint(t);
                    var normAbs = Math.abs(t);
                    var metrics = zoneMetrics(normAbs);
                    var edgeBoost = 1.0 + Math.max(0.0, normAbs - 0.42) * 0.12;
                    var altScale = (i % 2 === 0) ? 1.0 : (normAbs < 0.42 ? 0.72 : (normAbs < 0.68 ? 0.80 : 0.86));

                    if (Math.abs(t) < 0.012) {
                        drawSegmentBar(p.x, p.y, 27.0, 4.6, 'rgba(255, 255, 255, 0.95)', false, false);
                    } else {
                        // Advanced Track Color Logic: Gray-White base track, Redline dim for >= 45° (normAbs >= 0.75)
                        var baseColor = normAbs >= 0.75 ? C_REDLINE_DIM : C_TRACK;
                        drawSegmentBar(p.x, p.y, metrics.baseH * edgeBoost * altScale, metrics.baseW, baseColor, false, normAbs >= 0.75);
                    }
                }

                // Active Light-Up Arc Portion (Pure White Active, Hot Red Redline >= 45°)
                if (absAngle > 0.08) {
                    var tipWidth = 1.0 / segments;
                    for (var j = 0; j <= segments; j++) {
                        var tj = -1.0 + (2.0 * j) / segments;
                        var pj = curvePoint(tj);
                        var normAbsJ = Math.abs(tj);
                        var metricsJ = zoneMetrics(normAbsJ);
                        var isOn = signedT >= 0 ? (tj >= 0.0 && tj <= signedT + tipWidth) : (tj >= signedT - tipWidth && tj <= 0.0);

                        if (isOn) {
                            var distToTip = Math.abs(tj - signedT);
                            var tipLvl = distToTip <= tipWidth * 0.95 ? 2 : (distToTip <= tipWidth * 2.1 ? 1 : 0);
                            var actH = metricsJ.activeH * ((j % 2 === 0) ? 1.0 : 0.82) * (1.0 + 0.18 * activeEnergy);
                            var actW = metricsJ.activeW + 0.10 * activeEnergy;

                            if (tipLvl === 1) { actH *= 1.08; actW += 0.14; }
                            else if (tipLvl >= 2) { actH *= 1.22; actW += 0.34; }

                            // Advanced Active Bar Colors: Pure White normally, Hot Red in Redline/Limit (>= 45°)
                            var activeCol = normAbsJ >= 0.75 ? C_REDLINE : C_WHITE;

                            drawSegmentBar(pj.x, pj.y, actH, actW, activeCol, true, normAbsJ >= 0.75);
                        }
                    }

                    // 3. Triangle Marker at Tip (Advanced Pure White or Redline Hot Red)
                    var vec = tangentAndNormal(signedT);
                    var tipP = curvePoint(signedT);
                    var centerP = { x: tipP.x + vec.normal.x * 17.0, y: tipP.y + vec.normal.y * 17.0 };
                    var markerCol = Math.abs(signedT) >= 0.75 ? C_REDLINE : C_WHITE;

                    ctx.save();
                    ctx.translate(centerP.x, centerP.y);
                    var angleRad = Math.atan2(vec.normal.y, vec.normal.x);
                    ctx.rotate(angleRad + Math.PI / 2);

                    ctx.beginPath();
                    ctx.moveTo(0, -12);
                    ctx.lineTo(-9, 10);
                    ctx.lineTo(9, 10);
                    ctx.closePath();

                    ctx.fillStyle = markerCol;
                    ctx.shadowColor = markerCol;
                    ctx.shadowBlur = 14;
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.restore();
                }

                // 4. Center 0° Origin Dot
                var centerOrigin = curvePoint(0.0);
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerOrigin.x, centerOrigin.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();

                // 5. Angle Ticks & Labels (Advanced Ticks: Redline for 45° and 60°, Gray-White for others)
                ctx.save();
                ctx.font = 'bold 12px Bahnschrift, Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = C_WHITE_DIM;

                [-60, -45, -30, -15, 0, 15, 30, 45, 60].forEach(function (deg) {
                    var td = deg / 60.0;
                    var pd = curvePoint(td);
                    var isRedlineTick = Math.abs(deg) >= 45;

                    ctx.beginPath();
                    ctx.moveTo(pd.x, pd.y - (deg === 0 ? 16 : 8));
                    ctx.lineTo(pd.x, pd.y);
                    ctx.strokeStyle = isRedlineTick ? C_REDLINE : (deg === 0 ? C_WHITE : C_TRACK);
                    ctx.lineWidth = isRedlineTick || deg === 0 ? 2.5 : 1.2;
                    ctx.stroke();

                    if ([-60, -40, -20, 0, 20, 40, 60].indexOf(deg) !== -1) {
                        ctx.fillStyle = isRedlineTick ? C_REDLINE : C_WHITE_DIM;
                        ctx.fillText(deg + '°', pd.x, pd.y + 24);
                    }
                });
                ctx.restore();

                // ── Panel B1: Telemetry Gear & Speed Box Header (x=20, y=225, w=280, h=155) ──
                draw093PanelBox(20, 225, 280, 155, 'CURRENT TELEMETRY');

                // ── Panel B2: Segment RPM Tacho Bar (x=315, y=225, w=380, h=155) ──
                // Advanced RPM Scale Logic: Gray-White Track, Pure White Active, Hot Red Redline Zone
                draw093PanelBox(315, 225, 380, 155, 'ENGINE TACHO');

                var rpmRatio = clamp(rpm / Math.max(1, maxRpm), 0.0, 1.0);
                var rpmSegCount = 22;
                var rpmSegW = 12;

                ctx.save();
                ctx.font = '11px ForzaGear, Arial';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText('RPM: ' + Math.round(rpm) + ' / ' + Math.round(maxRpm), 331, 268);

                for (var r = 0; r < rpmSegCount; r++) {
                    var rRatio = r / rpmSegCount;
                    var rActive = rRatio <= rpmRatio;
                    var isRedlineSeg = rRatio >= 0.82; // Redline zone >= 82% RPM
                    var rx = 331 + r * (rpmSegW + 3);
                    var ry = 286;

                    if (rActive) {
                        ctx.fillStyle = isRedlineSeg ? C_REDLINE : (rRatio > 0.68 ? C_AMBER : C_WHITE);
                        ctx.shadowColor = ctx.fillStyle;
                        ctx.shadowBlur = isRedlineSeg ? 10 : 5;
                    } else {
                        ctx.fillStyle = isRedlineSeg ? C_REDLINE_DIM : C_TRACK;
                        ctx.shadowBlur = 0;
                    }
                    ctx.beginPath();
                    ctx.roundRect(rx, ry, rpmSegW, 26, 2);
                    ctx.fill();
                }
                ctx.restore();

                // ── Panel B3: Steer & Counter Panel (x=710, y=225, w=390, h=155) ──
                draw093PanelBox(710, 225, 390, 155, 'STEER & COUNTER');

                ctx.save();
                var steerTrackY = 270;
                var steerBarW = 320;
                var steerStartX = 745;

                ctx.font = 'bold 11px Bahnschrift, Arial';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText('WHEEL', 720, 274);
                ctx.fillText('COUNTER', 720, 314);

                // Wheel Track & Active Bar
                ctx.strokeStyle = C_TRACK;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(steerStartX, steerTrackY);
                ctx.lineTo(steerStartX + steerBarW, steerTrackY);
                ctx.stroke();

                var wheelCenterX = steerStartX + steerBarW * 0.5;
                var wheelFillX = wheelCenterX + (steerPct / 100.0) * (steerBarW * 0.5);

                ctx.beginPath();
                ctx.moveTo(wheelCenterX, steerTrackY);
                ctx.lineTo(wheelFillX, steerTrackY);
                ctx.strokeStyle = C_WHITE;
                ctx.lineWidth = 6;
                ctx.shadowColor = C_WHITE;
                ctx.shadowBlur = 8;
                ctx.stroke();

                // Counter-steer Track & Active Bar (Advanced Redline Red for Heavy Countering)
                var counterTrackY = 310;
                ctx.fillStyle = C_TRACK;
                ctx.fillRect(steerStartX, counterTrackY - 4, steerBarW, 8);

                var counterW = (counterPct / 100.0) * steerBarW;
                if (counterW > 0) {
                    var counterCol = counterPct > 70 ? C_REDLINE : C_WHITE;
                    ctx.fillStyle = counterCol;
                    ctx.shadowColor = counterCol;
                    ctx.shadowBlur = counterPct > 70 ? 10 : 6;
                    ctx.fillRect(steerStartX, counterTrackY - 4, counterW, 8);
                }

                // Flow & Risk Labels
                ctx.font = '11px ForzaGear, Arial';
                ctx.fillStyle = C_WHITE_DIM;
                ctx.fillText('FLOW: ' + (FLOW_LABELS[flowQuality] || 'BUILD'), 745, 348);

                var riskColor = riskLevel >= 3 ? C_REDLINE : (riskLevel === 2 ? C_AMBER : C_WHITE);
                ctx.fillStyle = riskColor;
                ctx.fillText('RISK: ' + (RISK_LABELS[riskLevel] || 'SAFE'), 980, 348);
                ctx.restore();

                // ── Pedal Inputs Vertical Bar Group (x=980, y=30, w=120, h=165) ──
                draw093PanelBox(980, 30, 120, 165, 'INPUTS');

                ctx.save();
                var pedalRows = [
                    { key: 'H', label: 'H', pct: handbrakePct, color: C_AMBER },
                    { key: 'C', label: 'C', pct: clutchPct, color: C_WHITE },
                    { key: 'B', label: 'B', pct: brakePct, color: C_REDLINE },
                    { key: 'T', label: 'T', pct: accelPct, color: C_WHITE }
                ];

                var pedalStartX = 994;
                var pedalBarW = 16;
                var pedalBarH = 105;
                var pedalBarY = 72;

                pedalRows.forEach(function (p, idx) {
                    var px = pedalStartX + idx * 26;
                    var fillH = (clamp(p.pct, 0, 100) / 100.0) * pedalBarH;
                    var pulse = (inputFlashTtl[p.key] || 0) / 18.0;

                    // Track Background (Advanced Gray-White Track)
                    ctx.fillStyle = C_TRACK;
                    ctx.beginPath();
                    ctx.roundRect(px, pedalBarY, pedalBarW, pedalBarH, 3);
                    ctx.fill();

                    // Fill Bar
                    if (fillH > 0) {
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 6 + pulse * 8;
                        ctx.beginPath();
                        ctx.roundRect(px, pedalBarY + (pedalBarH - fillH), pedalBarW, fillH, 3);
                        ctx.fill();
                    }

                    // Label
                    ctx.font = 'bold 10px Bahnschrift, Arial';
                    ctx.fillStyle = pulse > 0 ? '#ffffff' : C_WHITE_DIM;
                    ctx.textAlign = 'center';
                    ctx.fillText(p.label, px + pedalBarW * 0.5, pedalBarY - 6);
                });
                ctx.restore();
            }

            // ── 60Hz Render Loop ───────────────────────────────────────────────
            function renderLoop() {
                try {
                    updateHTMLOverlays();
                    renderQPainterVectorHUD();
                } catch (e) {
                    console.error("[Drift HUD] Render loop error:", e);
                } finally {
                    requestAnimationFrame(renderLoop);
                }
            }

            // ── HUDCore Registration ─────────────────────────────────────────
            HUDCore.registerStyle('drift', {
                containerId: 'driftContainer',
                scaleMultiplier: 0.95,
                onInit: function (payload) {
                    if (payload && payload.isMetric !== undefined) {
                        isMetricUnit = payload.isMetric !== false;
                    }
                },
                onElementsChange: function (elements) {
                    var c = document.getElementById('driftContainer');
                    if (c) c.style.display = elements.showGauge === false ? 'none' : 'block';
                },
                onFrame: function (data, payload) {
                    parseTelemetryData(data, payload);
                },
                onAnimate: function () {
                    triggerPopup('DRIFT HUD READY', 1500, false);
                }
            });

            // Activate and start loop
            HUDCore.init('drift');
            requestAnimationFrame(renderLoop);
        })();
    </script>
</body>

</html>
